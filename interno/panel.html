<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del facilitador · Reactor</title>
<style>
 :root{--ink:#16202c;--muted:#5a6a7a;--line:#e3e8ee;--brand:#2563eb}
 *{box-sizing:border-box}
 body{margin:0;background:#fbfcfe;color:var(--ink);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .env{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
 a{color:var(--brand)}
 h1{font-size:26px;margin:0 0 4px}
 .sub{color:var(--muted);margin:0 0 22px}
 h2{font-size:18px;margin:30px 0 6px}
 .meta{color:var(--muted);font-size:14px;margin:0 0 10px}
 table{width:100%;border-collapse:collapse;background:#fff;font-size:14px;margin:8px 0 18px}
 th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
 th{background:#f2f5f9;font-weight:600}
 .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
 .p-completa{background:#ecfdf5;border-color:#a7f3d0}
 .p-en_curso{background:#eff6ff;border-color:#bfdbfe}
 .p-parada{background:#fff7ed;border-color:#fed7aa}
 .num{text-align:right;white-space:nowrap}
 .vacio{color:var(--muted);font-style:italic}
 .aviso{border-left:3px solid var(--brand);background:#fff;padding:12px 16px;border-radius:0 8px 8px 0}
</style>
</head>
<body>
<div class="env">
<p><a href="./memoria.html">&larr; Memoria del Reactor</a> &nbsp;·&nbsp; <a href="./guia.html">Guía de uso</a></p>
<h1>Panel del facilitador</h1>
<p class="sub" id="cabecera">Cargando…</p>
<div id="cuerpo"></div>
</div>
<script>
/* Esta pagina NO lleva claves. Coge la sesion que ya dejo el area interna en
   este mismo origen y pregunta al backend, que agrega por su cuenta: asi no se
   traen al navegador las salidas enteras (135.000 caracteres por cadena). */
const RX_API = 'https://jr-gpt-backend-1.onrender.com';
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = mil => (mil == null ? '—' : (mil/1000).toFixed(2).replace('.', ',') + ' €');
const dur = s => s ? Math.floor(s/60) + ' min ' + (s%60) + ' s' : '—';

function token(){
  for(const k of Object.keys(localStorage)){
    if(/^sb-.*-auth-token$/.test(k)){
      try{
        const v = JSON.parse(localStorage.getItem(k));
        if(v && v.access_token) return v.access_token;
        if(Array.isArray(v) && v[0]) return v[0];
      }catch(e){}
    }
  }
  return '';
}

(async () => {
  const cab = document.getElementById('cabecera'), cue = document.getElementById('cuerpo');
  const t = token();
  if(!t){
    cab.innerHTML = 'Esta página es privada. <a href="./#/admin">Entra en el área interna</a> y vuelve.';
    return;
  }
  let d;
  try{
    const r = await fetch(RX_API + '/api/rx/panel', {headers:{'Authorization':'Bearer ' + t}});
    d = await r.json();
    if(!r.ok) throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
  }catch(e){
    cab.textContent = 'No he podido leer el panel: ' + e.message;
    return;
  }
  if(!d.yo || d.yo.rol !== 'facilitador'){
    cab.textContent = 'Esta página es solo para el facilitador del programa.';
    return;
  }
  cab.textContent = d.yo.organizacion || '';

  let html = '';
  (d.grupos || []).forEach(gr => {
    const suyas = (d.ejecuciones || []).filter(x => x.grupo_id === gr.id);
    const gasto = suyas.reduce((s,x) => s + ((x.resumen||{}).coste_milesimas || 0), 0);
    const porModulo = [1,2,3,4].map(m => 'M' + m + ' ' + suyas.filter(x => x.modulo === m).length
                                       + '/' + gr.cupo_por_modulo).join(' · ');
    html += '<h2>' + esc(gr.nombre) + (gr.edicion ? ' <span class="meta">' + esc(gr.edicion) + '</span>' : '')
          + (gr.activo ? '' : ' <span class="pill">cerrado</span>') + '</h2>'
          + '<p class="meta">' + esc(porModulo) + ' &nbsp;·&nbsp; gasto acumulado ' + eur(gasto)
          + ' (tope del mes ' + eur(gr.tope_milesimas_mes) + ')</p>';
    if(!suyas.length){ html += '<p class="vacio">Todavía no han ejecutado nada.</p>'; return; }
    html += '<table><thead><tr><th>Módulo</th><th>Título</th><th>Estado</th>'
          + '<th>Etapas</th><th class="num">Tiempo</th><th class="num">Coste</th><th>Fecha</th></tr></thead><tbody>';
    suyas.forEach(x => {
      const a = x.resumen || {};
      html += '<tr>'
        + '<td>M' + x.modulo + '</td>'
        + '<td><a href="./memoria.html?ejecucion=' + encodeURIComponent(x.id) + '">'
        + esc((x.titulo || '(sin título)').slice(0,90)) + '</a></td>'
        + '<td><span class="pill p-' + esc(x.estado) + '">' + esc(x.estado) + '</span></td>'
        + '<td>' + (a.hechas||0) + '/7' + (a.en_curso ? ' · en curso' : '')
        + (a.fallidas ? ' · ' + a.fallidas + ' fallida(s)' : '') + '</td>'
        + '<td class="num">' + dur(a.segundos) + '</td>'
        + '<td class="num">' + eur(a.coste_milesimas) + '</td>'
        + '<td>' + new Date(x.creada).toLocaleDateString('es-ES') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
  });
  cue.innerHTML = html || '<p class="vacio">No hay grupos dados de alta todavía.</p>';
})();
</script>
</body>
</html>

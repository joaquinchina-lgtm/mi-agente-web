<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --actual:#5598e7; --deseada:#1c5cab;
  --radius:10px;
  /* Escala divergente de la matriz de robustez. Dos tonos y un gris neutro
     en el centro, porque 1 = perjudicial y 5 = muy valiosa son polos, no
     dos grados de lo mismo: el 3 es el cero de esa escala. */
  --div-neg:#d03b3b; --div-neg-suave:#ec835a; --div-medio:#f0efec;
  --div-pos-suave:#86b6ef; --div-pos:#1c5cab;
  /* Tres tonos categóricos, en orden fijo y nunca reciclados. */
  --cat-1:#1c5cab; --cat-2:#c26a1b; --cat-3:#3f7a52;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark; --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --actual:#6da7ec; --deseada:#256abf;
  --div-neg:#e8695c; --div-neg-suave:#a8543f; --div-medio:#2c2c2a;
  --div-pos-suave:#2f5f96; --div-pos:#6da7ec;
  --cat-1:#4d93e4; --cat-2:#c97f2e; --cat-3:#37a478;}}
:root[data-theme="dark"]{color-scheme:dark; --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --actual:#6da7ec; --deseada:#256abf;
  --div-neg:#e8695c; --div-neg-suave:#a8543f; --div-medio:#2c2c2a;
  --div-pos-suave:#2f5f96; --div-pos:#6da7ec;
  --cat-1:#4d93e4; --cat-2:#c97f2e; --cat-3:#37a478;}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 64px}
.wrap.ancho{max-width:1200px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font-size:13px;color:var(--text-secondary)}
.brand b{color:var(--text-primary);font-weight:600}
.iconbtn{background:none;border:1px solid var(--border);color:var(--text-secondary);
  border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.iconbtn:hover{color:var(--text-primary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;margin-bottom:16px}
h1{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:650}
h2{font-size:17px;margin:0 0 10px;font-weight:650}
h3{font-size:12.5px;margin:22px 0 8px;font-weight:650;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 12px;color:var(--text-secondary)} p.lead{color:var(--text-primary)}
small,.small{font-size:13px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--deseada);
  color:#fff;border:none;border-radius:8px;padding:13px 20px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;min-height:46px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;color:var(--text-secondary);border:1px solid var(--border);font-weight:500}
.btn.ghost:hover{color:var(--text-primary)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.progress{height:3px;background:var(--grid);border-radius:2px;overflow:hidden;margin:0 0 8px}
.progress i{display:block;height:100%;background:var(--deseada);border-radius:2px;transition:width .25s}
.phasetag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted)}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--plane);
  color:var(--text-primary);min-height:44px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* reparto */
.restante{position:sticky;top:0;z-index:4;background:var(--surface-1);border-bottom:1px solid var(--grid);
  padding:12px 0;margin-bottom:4px;display:flex;align-items:baseline;gap:10px}
.restante b{font-size:26px;font-weight:650;line-height:1}
.restante.ok b{color:var(--deseada)}
.opt{padding:16px 0;border-bottom:1px solid var(--grid)}
.opt:last-child{border-bottom:none}
.opt p{margin:0 0 12px;color:var(--text-primary);font-size:15.5px;line-height:1.45}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{font-family:inherit;font-size:14px;font-weight:600;min-width:58px;min-height:46px;
  border:1px solid var(--border);background:var(--plane);color:var(--text-secondary);
  border-radius:8px;cursor:pointer;transition:all .12s}
.stepper button:hover:not(:disabled){border-color:var(--actual);color:var(--text-primary)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{min-width:66px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-1);
  font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.stepper .val.puesto{background:var(--deseada);border-color:var(--deseada);color:#fff}
.barmini{flex:1;align-self:center;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.barmini i{display:block;height:100%;background:var(--actual);border-radius:4px;transition:width .18s}

/* consola */
.codigo{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.14em;
  font-size:30px;color:var(--text-primary)}
.estado{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary)}

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   0 · CONFIGURACIÓN — lo único que hay que rellenar
   Se sacan del panel de Supabase, en Project Settings → API.
   La clave `anon` es pública por diseño: va en el navegador de cada
   participante. Lo que impide que sirva para nada es que las tablas
   están cerradas y solo se entra por funciones que validan la sesión.
   NUNCA pongas aquí la clave `service_role`.
   ═══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  // Proyecto «Cultura» · región eu-central-1 (Fráncfort)
  SUPABASE_URL:  "https://hugtfjbuzltvhysrjlxv.supabase.co",

  // Publishable key: pública por diseño, viaja en el móvil de cada
  // participante. Lo que impide que sirva para nada es que las tablas están
  // cerradas por RLS y solo se entra por funciones que validan la sesión.
  // La que NUNCA debe estar aquí es la Secret key.
  SUPABASE_ANON: "sb_publishable_y_q6WtW5rfR5A_LOE7-Q0g_OXeRjcW0"
};

/* ═══════════════════════════════════════════════════════════════════
   1 · INSTRUMENTO v2.1 — idéntico al validado
   ═══════════════════════════════════════════════════════════════════ */
const VERSION = "2.1";
const VEC = {
  FAM:{nombre:"Organización familiar",              corto:"Familiar"},
  INN:{nombre:"Organización innovadora",            corto:"Innovadora"},
  RES:{nombre:"Organización orientada a resultados",corto:"Resultados"},
  JER:{nombre:"Organización jerárquica",            corto:"Jerárquica"}
};
const ORDEN = ["FAM","INN","RES","JER"];
const ANGULOS = {FAM:135, INN:45, RES:-45, JER:-135};
const SUBS = {CD:"Características dominantes", LO:"Liderazgo organizativo",
  GP:"Gestión de personas", CO:"Cohesión organizativa",
  EE:"Énfasis estratégico", CE:"Criterios de éxito"};
const ORDEN_SUBS = ["CD","LO","GP","CO","EE","CE"];
const TXT = {
  CD:{FAM:"La organización se parece a una familia extendida. Un lugar muy agradable para trabajar, donde la gente se preocupa unas por otras",
      INN:"La organización es dinámica y emprendedora. La gente está dispuesta a asumir riesgos y probar cosas nuevas",
      RES:"La organización está muy orientada a resultados. El principal interés es competir y lograr objetivos ambiciosos",
      JER:"La organización está marcada por la normativa y las características del sector"},
  LO:{FAM:"El estilo de liderazgo es facilitador, de mentor/a, orientado a apoyar y desarrollar a las personas",
      INN:"El liderazgo es emprendedor, innovador, orientado a asumir riesgos y lanzar proyectos nuevos",
      RES:"El liderazgo es duro y exigente, orientado a la competitividad y al logro de resultados",
      JER:"El liderazgo es coordinador, organizador, que mantiene la estabilidad y cuida los procesos"},
  GP:{FAM:"Se enfatiza el trabajo en equipo, la participación y el consenso",
      INN:"Se valora la iniciativa individual, la libertad y la creatividad",
      RES:"Se enfatiza el rendimiento individual, las metas y las recompensas por resultados",
      JER:"Se valora el cumplimiento de normas, la seguridad en el empleo y la previsibilidad"},
  CO:{FAM:"Lo que mantiene unida a la organización es la lealtad y la confianza mutua",
      INN:"La organización se mantiene unida por el compromiso con la innovación y el crecimiento",
      RES:"La cohesión se basa en los objetivos compartidos y la agresividad competitiva",
      JER:"La organización se mantiene unida por las reglas formales y las políticas establecidas"},
  EE:{FAM:"El énfasis se pone en el desarrollo de las personas, la comunicación abierta y el clima interno",
      INN:"El énfasis está en el crecimiento, los nuevos recursos, los productos o servicios innovadores",
      RES:"El énfasis está en ganar cuota de mercado, aumentar la competitividad, lograr objetivos",
      JER:"El énfasis está en la estabilidad, la eficiencia, el control y la planificación"},
  CE:{FAM:"Se considera éxito tener una plantilla comprometida, un clima laboral positivo, personas desarrolladas",
      INN:"Éxito es haber lanzado productos/servicios innovadores y estar a la vanguardia",
      RES:"Éxito es superar a la competencia y cumplir o superar los objetivos financieros",
      JER:"Éxito es tener procesos estables, eficiente uso de recursos, funcionamiento predecible"}
};
const PANTALLAS = [
  {n: 1, pasada:0, sub:"CD", orden:["FAM","INN","RES","JER"]},
  {n: 2, pasada:0, sub:"LO", orden:["JER","RES","FAM","INN"]},
  {n: 3, pasada:0, sub:"GP", orden:["FAM","JER","RES","INN"]},
  {n: 4, pasada:0, sub:"CO", orden:["RES","FAM","JER","INN"]},
  {n: 5, pasada:0, sub:"EE", orden:["INN","RES","JER","FAM"]},
  {n: 6, pasada:0, sub:"CE", orden:["JER","RES","INN","FAM"]},
  {n: 7, pasada:1, sub:"CD", orden:["FAM","INN","RES","JER"]},
  {n: 8, pasada:1, sub:"LO", orden:["INN","FAM","JER","RES"]},
  {n: 9, pasada:1, sub:"GP", orden:["FAM","RES","INN","JER"]},
  {n:10, pasada:1, sub:"CO", orden:["JER","FAM","INN","RES"]},
  {n:11, pasada:1, sub:"EE", orden:["RES","INN","JER","FAM"]},
  {n:12, pasada:1, sub:"CE", orden:["FAM","INN","RES","JER"]}
];
const TOTAL = 100, PASO = 10;
/* Texto del indicador de techo en la consola. Que diga qué pantalla es, no
   solo su número: en una sala no te acuerdas de que la 8 es «LO deseada». */
function etiquetaTecho(n){
  if(n == null) return "sin techo · cada cual a su ritmo";
  if(n === 0)   return "nadie puede empezar todavía";
  const p = PANTALLAS[n-1];
  return p ? `abierto hasta ${p.pasada ? "DESEADA" : "ACTUAL"} · ${SUBS[p.sub]}` : "";
}
const VISTAS_PROY = [{k:"espera", t:"Espera / código"}]
  .concat(PANTALLAS.map(p=>({k:"p"+p.n, t:`${p.n}. ${p.pasada?"DES":"ACT"} ${SUBS[p.sub]}`})))
  .concat([{k:"resultados", t:"Perfil general"},{k:"subcategorias", t:"Por subcategoría"}]);

/* ═══════════════════════════════════════════════════════════════════
   2 · BACKEND — Supabase si está configurado; si no, memoria local
   El modo demostración deja probar el circuito completo antes de
   conectar nada. No persiste: al cerrar la pestaña desaparece.
   ═══════════════════════════════════════════════════════════════════ */
const CONFIGURADO = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON);
let sb = null;
if(CONFIGURADO && window.supabase)
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON);

/* Backend de mentira para el modo demostración. Vive en sessionStorage para
   que la consola, el cuestionario y la pantalla de proyección se vean entre sí
   aunque estén en ventanas distintas de este mismo navegador. Son datos de
   juguete y se borran con el botón de la consola. En modo real no se usa. */
const MEM = {
  usuario:null, orgs:[], sesiones:[], envios:[], respuestas:[],
  id(){ return "id-" + Math.random().toString(36).slice(2,10); },
  guardar(){ try{ localStorage.setItem("demo-cultura", JSON.stringify(
    {usuario:this.usuario, orgs:this.orgs, sesiones:this.sesiones,
     envios:this.envios, respuestas:this.respuestas})); }catch(e){} },
  cargar(){ try{ const d = JSON.parse(localStorage.getItem("demo-cultura")||"null");
    if(d) Object.assign(this, d); }catch(e){} }
};
MEM.cargar();
window.borrarDemo = () => { localStorage.removeItem("demo-cultura"); location.href = location.pathname; };

const API = {
  demo(){ return !sb; },

  // Enlace por correo. Es el respaldo, no la vía principal: el servicio de correo
  // tiene un tope de envíos por hora y no queremos que tu acceso dependa de eso.
  async login(email){
    if(this.demo()){ MEM.usuario = {id:"demo-user", email}; MEM.guardar(); return {demo:true}; }
    const { error } = await sb.auth.signInWithOtp({ email,
      options:{ emailRedirectTo: location.origin + location.pathname + "#/admin",
                shouldCreateUser:false }});
    if(error) throw error; return {enviado:true};
  },
  // Contraseña. No viaja por correo, no tiene límite de intentos por hora y no
  // aparece en ninguna parte de este archivo: la guarda cifrada Supabase.
  async loginClave(email, clave){
    if(this.demo()){ MEM.usuario = {id:"demo-user", email}; MEM.guardar(); return {demo:true}; }
    const { error } = await sb.auth.signInWithPassword({ email, password:clave });
    if(error) throw error; return {dentro:true};
  },
  async fijarClave(clave){
    if(this.demo()) return {demo:true};
    const { error } = await sb.auth.updateUser({ password:clave });
    if(error) throw error; return {ok:true};
  },
  async usuario(){
    if(this.demo()){ MEM.cargar(); return MEM.usuario; }
    const { data } = await sb.auth.getUser(); return data.user || null;
  },
  async salir(){ if(this.demo()){ MEM.usuario=null; MEM.guardar(); return; } await sb.auth.signOut(); },

  async sectores(){
    if(this.demo()) return [["universidad","Universidad"],["centro_investigacion","Centro de investigación"],
      ["admon_publica","Administración pública"],["industria","Industria"],
      ["servicios","Servicios"],["tercer_sector","Tercer sector"],["otro","Otro"]]
      .map(([clave,nombre])=>({clave,nombre}));
    const { data, error } = await sb.from("sector").select("*").order("nombre");
    if(error) throw error; return data;
  },
  async orgs(){
    if(this.demo()){ MEM.cargar(); return MEM.orgs; }
    const { data, error } = await sb.from("organizacion").select("*").order("nombre");
    if(error) throw error; return data;
  },
  async crearOrg(o){
    if(this.demo()){ const r = {...o, id:MEM.id()}; MEM.orgs.push(r); MEM.guardar(); return r; }
    const u = await this.usuario();
    const { data, error } = await sb.from("organizacion")
      .insert({...o, propietario:u.id}).select().single();
    if(error) throw error; return data;
  },
  async sesiones(){
    if(this.demo()){ MEM.cargar(); return MEM.sesiones.slice().reverse(); }
    const { data, error } = await sb.from("sesion").select("*, organizacion(nombre)")
      .order("creado_en",{ascending:false});
    if(error) throw error; return data;
  },
  async crearSesion(s){
    if(this.demo()){ const r = {...s, id:MEM.id(), estado:"borrador", vista_activa:"espera",
      resultados_publicos:false, creado_en:new Date().toISOString(),
      organizacion:{nombre:(MEM.orgs.find(o=>o.id===s.organizacion_id)||{}).nombre}};
      MEM.sesiones.push(r); MEM.guardar(); return r; }
    const u = await this.usuario();
    const { data, error } = await sb.from("sesion")
      .insert({...s, propietario:u.id, instrumento_version:VERSION}).select().single();
    if(error) throw error; return data;
  },
  async actualizarSesion(id, cambios){
    if(this.demo()){ const s = MEM.sesiones.find(x=>x.id===id); Object.assign(s, cambios); MEM.guardar(); return s; }
    const { data, error } = await sb.from("sesion").update(cambios).eq("id",id).select().single();
    if(error) throw error; return data;
  },
  // Qué puede enseñar el proyector de una pantalla concreta. El recuento va
  // siempre; el reparto medio solo cuando esa pantalla ya está cerrada.
  async pantallaPublica(codigo, n){
    if(this.demo()){
      MEM.cargar();
      const s = MEM.sesiones.find(x=>x.codigo.toUpperCase()===codigo.toUpperCase());
      if(!s) return {existe:false};
      const envios = MEM.envios.filter(e=>e.sesion_id===s.id).map(e=>e.id);
      const rs = MEM.respuestas.filter(r=>envios.includes(r.envio_id) && r.pantalla===n);
      const resp = new Set(rs.map(r=>r.envio_id)).size;
      const cerrada = s.estado!=="abierta"
        || (s.modo==="directo" && s.pantalla_max != null && s.pantalla_max > n);
      let datos = null;
      if(cerrada && resp >= 3){
        const acc = {};
        rs.forEach(r=>{ (acc[r.vector] = acc[r.vector] || []).push(r.puntos); });
        datos = Object.keys(acc).sort().map(v=>({vector:v,
          media: Math.round(acc[v].reduce((a,b)=>a+b,0)/acc[v].length*10)/10}));
      }
      return {existe:true, pantalla:n, respondidos:resp, cerrada, minimo:3, datos};
    }
    const { data, error } = await sb.rpc("pantalla_publica", {p_codigo:codigo, p_pantalla:n});
    if(error) throw error; return data;

const $ = s => document.querySelector(s);
const app = () => document.getElementById("app");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const media = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const vacio = () => ({FAM:0,INN:0,RES:0,JER:0});
const suma = r => ORDEN.reduce((a,v)=>a+(r[v]||0),0);
const params = () => new URLSearchParams(location.search);

/* Corrección de errores M: aguanta que el proyector desenfoque o que alguien
   escanee de lado desde el fondo de la sala. */
function pintarQR(id, url, celda){
  const cont = document.getElementById(id); if(!cont) return;
  try{
    const q = qrcode(0, "M"); q.addData(url); q.make();
    cont.innerHTML = q.createSvgTag({cellSize:celda, margin:2, scalable:false});
  }catch(e){
    cont.innerHTML = `<div style="padding:10px;color:#0b0b0b;font-size:13px;max-width:220px">
      No se ha podido generar el código QR. Dicta el enlace:<br><b>${esc(url)}</b></div>`;
  }
}

/* La cabecera dice dos cosas distintas según quién mira.
   En tu lado dice de quién es la casa. En la sala —móvil del participante y
   proyector— dice qué está respondiendo la gente, y ese nombre NO puede estar
   escrito a mano: sale de la propia sesión (`instrumento`), porque el día que
   pases liderazgo o escenarios la cabecera tiene que cambiar sola. */
function enLaSala(){
  const p = params();
  return !!(p.get("s") || p.get("proy"));
}
let _instrumento = null;          // {clave, version} de la sesión que se mira
function recordarInstrumento(s){
  if(s && s.existe !== false && s.instrumento){
    _instrumento = {clave:s.instrumento, version:s.version || null};
    document.title = nombreInstrumento(_instrumento.clave);
    const el = document.querySelector(".brand");
    if(el && enLaSala()) el.innerHTML = marcaSala();
  }
}
function nombreInstrumento(clave){
  if(!clave) return "Diagnóstico";
  // La base de datos guarda variantes con sufijo —«cultura-cvf» es la del
  // marco de valores en competencia—, así que se compara también por la
  // raíz. Sin esto, la sala veía «Diagnóstico» a secas.
  const raiz = String(clave).split("-")[0];
  const m = (typeof MODULOS !== "undefined")
    ? MODULOS.find(x => x.k === clave) || MODULOS.find(x => x.k === raiz) : null;
  // `publico` es el nombre que ve la sala; `nombre` el de tu consola.
  return m ? (m.publico || m.nombre) : "Diagnóstico";
}
function marcaSala(){
  if(!_instrumento) return `<b>Diagnóstico</b>`;
  return `<b>${esc(nombreInstrumento(_instrumento.clave))}</b>`
       + (_instrumento.version ? ` · v${esc(_instrumento.version)}` : "");
}
function cabecera(extra){
  const marca = enLaSala() ? marcaSala()
                           : `<b>Consola de proyectos</b> de joaquinromero.com`;
  return `<header class="top">
    <div class="brand">${marca}${
      API.demo() ? ' · <span style="color:#d03b3b">modo demostración</span>' : ''}</div>
    <div style="display:flex;gap:8px">${extra||""}
      <button class="iconbtn" onclick="alternarTema()">Tema</button></div></header>`;
}
window.alternarTema = () => {
  const a = document.documentElement.getAttribute("data-theme");
  const o = a ? a==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", o ? "light":"dark");
  if(window._repinta) window._repinta();
};

function calcular(mapa){   // mapa[pantalla][vector] = puntos
  const out = {sub:{}, gen:{}};
  ORDEN_SUBS.forEach(s=>{
    out.sub[s] = {};
    const pa = PANTALLAS.find(p=>p.sub===s && p.pasada===0);
    const pb = PANTALLAS.find(p=>p.sub===s && p.pasada===1);
    ORDEN.forEach(v=>{
      const a = (mapa[pa.n]||{})[v]||0, d = (mapa[pb.n]||{})[v]||0;
      out.sub[s][v] = {actual:a, deseada:d, tension:d-a};
    });
  });
  ORDEN.forEach(v=>{
    const a = media(ORDEN_SUBS.map(s=>out.sub[s][v].actual));
    const d = media(ORDEN_SUBS.map(s=>out.sub[s][v].deseada));
    out.gen[v] = {actual:a, deseada:d, tension:d-a};
  });
  out.dominanteA = ORDEN.reduce((a,b)=> out.gen[a].actual>=out.gen[b].actual?a:b);
  out.dominanteD = ORDEN.reduce((a,b)=> out.gen[a].deseada>=out.gen[b].deseada?a:b);
  out.desplazamiento = ORDEN.reduce((a,v)=>a+Math.abs(out.gen[v].tension),0)/2;
  return out;
}
function escalaMax(d){
  let m=0; ORDEN.forEach(v=>{m=Math.max(m,d.gen[v].actual,d.gen[v].deseada);});
  ORDEN_SUBS.forEach(s=>ORDEN.forEach(v=>{m=Math.max(m,d.sub[s][v].actual,d.sub[s][v].deseada);}));
  return Math.max(40, Math.ceil(m/10)*10);
}
function radarSVG(svg, box, vals, max, compacto){
  if(!svg || !box) return;
  const W = Math.max(compacto?200:272, Math.round(box.clientWidth || (compacto?204:660)));
  const estrecho = W < 470;
  const H = compacto ? W : Math.min(estrecho ? W+70 : 440, 470);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cx=W/2, cy=H/2+(compacto?0:6);
  const R = Math.min(W/2,H/2) - (compacto?30:(estrecho?70:78));
  const cs = getComputedStyle(document.documentElement);
  const cA = cs.getPropertyValue("--actual").trim();
  const cD = cs.getPropertyValue("--deseada").trim();
  const cS = cs.getPropertyValue("--surface-1").trim();
  const rad = a=>a*Math.PI/180;
  const pt = (ang,val)=>[cx+(val/max)*R*Math.cos(rad(ang)), cy-(val/max)*R*Math.sin(rad(ang))];
  const poly = f => ORDEN.map(v=>pt(ANGULOS[v], f(v)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const anillos = compacto ? 2 : Math.min(5, Math.max(2, Math.round(max/10)));
  let s = "";
  for(let i=1;i<=anillos;i++)
    s += `<polygon points="${poly(()=>max*i/anillos)}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  ORDEN.forEach(v=>{ const [x,y]=pt(ANGULOS[v],max);
    s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`; });
  if(!compacto){
    for(let i=1;i<=anillos;i++){ const val=max*i/anillos, [x,y]=pt(0,val);
      s += `<text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" fill="var(--text-muted)" font-size="10.5"
              text-anchor="middle" style="font-variant-numeric:tabular-nums">${Math.round(val)}</text>`; }
    [[cx,cy-R-(estrecho?42:52),"middle","FLEXIBILIDAD"],[cx,cy+R+(estrecho?54:62),"middle","CONTROL"],
     [2,cy+4,"start","INTERNO"],[W-2,cy+4,"end","EXTERNO"]].forEach(([x,y,anc,t])=>{
      s += `<text x="${Math.round(x)}" y="${Math.round(y)}" fill="var(--text-muted)" font-size="10.5"
              text-anchor="${anc}" letter-spacing="0.08em">${t}</text>`; });
  }
  s += `<polygon points="${poly(v=>vals[v].actual)}" fill="${cA}" fill-opacity="0.22" stroke="${cA}" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<polygon points="${poly(v=>vals[v].deseada)}" fill="none" stroke="${cD}" stroke-width="2" stroke-linejoin="round"/>`;
  ORDEN.forEach(v=>{
    const [xa,ya]=pt(ANGULOS[v],vals[v].actual), [xd,yd]=pt(ANGULOS[v],vals[v].deseada);
    const r = compacto?4:5.5;
    s += `<circle cx="${xa.toFixed(1)}" cy="${ya.toFixed(1)}" r="${r}" fill="${cA}" stroke="${cS}" stroke-width="2"/>`;
    s += `<circle cx="${xd.toFixed(1)}" cy="${yd.toFixed(1)}" r="${r}" fill="${cD}" stroke="${cS}" stroke-width="2"/>`;
  });
  ORDEN.forEach(v=>{
    const [x,y]=pt(ANGULOS[v],max);
    const dx=Math.cos(rad(ANGULOS[v])), dy=-Math.sin(rad(ANGULOS[v]));
    const lx = Math.max(2, Math.min(W-2, x+dx*(compacto?12:(estrecho?14:22))));
    const ly = y+dy*(compacto?10:(estrecho?14:22));
    const anc = dx<0 ? "end":"start";
    if(compacto)
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?0:10)).toFixed(0)}" fill="var(--text-secondary)"
              font-size="10.5" font-weight="600" text-anchor="${anc}">${v}</text>`;
    else {
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?-2:12)).toFixed(0)}" fill="var(--text-primary)"
              font-size="${estrecho?11.5:13}" font-weight="600" text-anchor="${anc}">${VEC[v].corto}</text>`;
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?-2:12)+15).toFixed(0)}" fill="var(--text-secondary)"
              font-size="${estrecho?11:12}" text-anchor="${anc}" style="font-variant-numeric:tabular-nums">${
              vals[v].actual.toFixed(1)} → ${vals[v].deseada.toFixed(1)}</text>`;
    }
  });
  svg.innerHTML = s;
}
function bloqueResultados(d, prefijo){

}
function pintarRadaresDe(d, prefijo){
  const max = escalaMax(d);
  radarSVG(document.getElementById(prefijo+"svg"), document.getElementById(prefijo+"box"), d.gen, max, false);
}
function bloqueSub(d, prefijo){

  return `<div class="multi">${ORDEN_SUBS.map(s=>`
    <div class="mini"><h4>${SUBS[s]}</h4><div class="small">escala común 0–${max}</div>
      <div class="chartbox" id="${prefijo}b-${s}"><svg id="${prefijo}s-${s}" role="img"
        aria-label="Radar de ${SUBS[s]}"></svg></div></div>`).join("")}</div>`;
}
function pintarSub(d, prefijo){
  const max = escalaMax(d);
  ORDEN_SUBS.forEach(s => radarSVG(document.getElementById(prefijo+"s-"+s),
                                   document.getElementById(prefijo+"b-"+s), d.sub[s], max, true));
}
function datosAMapa(datos){
  const m = {};
  (datos||[]).forEach(r=>{ (m[r.pantalla] = m[r.pantalla]||{})[r.vector] = Number(r.media); });
  return m;
}

/* ¿Venimos de pulsar el enlace del correo? Supabase devuelve la sesión en el
   fragmento (#access_token=...) o, en flujo PKCE, en la query (?code=...).
   Sin esto, el enlace del correo te dejaba en la portada pública y parecía
   que no habías entrado. */
function vueltaDeCorreo(){
  return /access_token=|refresh_token=|[#&]type=(magiclink|recovery|invite|signup)|error_code=/.test(location.hash)
      || /[?&]code=/.test(location.search);
}
function ruta(){
  const p = params();
  if(p.get("proy")) return {vista:"proyeccion", codigo:p.get("proy")};
  if(p.get("s"))    return {vista:"participante", codigo:p.get("s")};
  if(location.hash.startsWith("#/admin")) return {vista:"admin"};
  if(vueltaDeCorreo())                    return {vista:"admin"};
  return {vista:"portada"};
}
async function render(){
  const r = ruta();
  window._repinta = null;
  try{
    if(r.vista === "participante")   await vistaParticipante(r.codigo);
    else if(r.vista === "proyeccion") await vistaProyeccion(r.codigo);
    else if(r.vista === "admin")      await vistaAdmin();
    else vistaPortada();
  }catch(e){
    app().innerHTML = `<div class="wrap">${cabecera()}
      <div class="card"><h2>Algo ha fallado</h2><p>${esc(e.message||e)}</p>
      <div class="btnrow"><button class="btn ghost" onclick="location.reload()">Reintentar</button></div></div></div>`;
  }
}
window.addEventListener("hashchange", render);

async function vistaParticipante(codigo){

  if(!s || !s.existe){
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h2>No encontramos esa sesión</h2><p>Revisa el código <code>${esc(codigo)}</code> o vuelve a escanear el QR.</p>
      <div class="btnrow"><a class="btn ghost" href="?">Volver</a></div></div></div>`;
    return;
  }
  if(!s.admite_respuestas){
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h2>${esc(s.titulo)}</h2>
      <p class="lead">${s.estado==="cerrada" ? "Esta sesión ya está cerrada." :
        s.modo==="survey" ? "El cuestionario aún no está abierto o su plazo ha terminado."

        if(t !== estado.techo){ estado.techo = t; pintar(); return; }
      }catch(e){ /* la sala tiene mal wifi; se reintenta */ }
      relojTecho = setTimeout(mirar, 3000);
    };
    relojTecho = setTimeout(mirar, ahora ? 0 : 3000);

  window.addEventListener("beforeunload", () => clearTimeout(relojTecho));

    if(estado.paso === "segmentos"){

          <option value="">Prefiero no indicarlo</option><option>Dirección o gobierno</option>
          <option>Gestión y administración</option>

      const d = document.createElement("div"); d.className="opt";
      const t = document.createElement("p"); t.textContent = TXT[p.sub][v];
      const st = document.createElement("div"); st.className="stepper";
      st.setAttribute("role","group"); st.setAttribute("aria-label", TXT[p.sub][v]);
      const menos = document.createElement("button"); menos.type="button"; menos.textContent="−"+PASO;
      menos.setAttribute("aria-label","Quitar "+PASO+" puntos");
      const val = document.createElement("div"); val.className="val"; val.setAttribute("aria-live","polite");
      const mas = document.createElement("button"); mas.type="button"; mas.textContent="+"+PASO;
      mas.setAttribute("aria-label","Añadir "+PASO+" puntos");
      const barra = document.createElement("div"); barra.className="barmini";
      const rel = document.createElement("i"); barra.appendChild(rel);
      d._ref = () => { val.textContent = r[v]; val.classList.toggle("puesto", r[v]>0);
        rel.style.width = (r[v]/TOTAL*100)+"%"; menos.disabled = r[v]<=0; mas.disabled = suma(r)>=TOTAL; };
      menos.onclick = () => { r[v]=Math.max(0,r[v]-PASO); act(); };
      mas.onclick   = () => { r[v]=Math.min(r[v]+PASO, r[v]+(TOTAL-suma(r))); act(); };
      st.append(menos,val,mas,barra); d.append(t,st); cont.appendChild(d);
    });
    const act = () => {
      const q = TOTAL - suma(r);
      $("#restN").textContent = q;
      $("#restT").textContent = q===0 ? "puntos repartidos · ya puedes continuar"
                              : q===1 ? "punto por repartir" : "puntos por repartir";
      $("#rest").classList.toggle("ok", q===0);
      $("#sig").disabled = q!==0;
      [...cont.children].forEach(d=>d._ref());
    };
    act();
    $("#sig").textContent = estado.idx===11 ? "Terminar" : estado.idx===5 ? "Ir a la cultura deseada" : "Siguiente";
    $("#reset").onclick = () => { estado.resp[p.n]=vacio(); pintar(); };
    $("#atras").onclick = () => { if(estado.idx>0){ estado.idx--; pintar(); } };
    $("#sig").onclick = async () => {
      $("#sig").disabled = true;
      // Se guarda pantalla a pantalla: si alguien abandona a la mitad,
      // lo respondido no se pierde y su envío simplemente no cuenta.
      const filas = p.orden.map((v,i)=>({pantalla:p.n, sub:p.sub, vector:v,
        pasada:p.pasada, posicion:i+1, puntos:r[v]}));
      try{ await API.guardar(estado.envio, filas); }
      catch(e){ alert("No hemos podido guardar: "+(e.message||e)); $("#sig").disabled=false; return; }
      if(estado.idx===11){ await API.cerrarEnvio(estado.envio); estado.paso="fin"; pintar(); return; }
      if(estado.idx===5){ estado.idx=6; estado.paso="switch"; pintar(); return; }
      estado.idx++; pintar(); window.scrollTo({top:0});
    };
    window.scrollTo({top:0});
  };
  pintar();
}

/* ═══════════════════════════════════════════════════════════════════
   5 bis · PARTICIPANTE DEL MOTOR

   Una pregunta cada vez, la que el facilitador tenga abierta. Cuando has
   respondido todo lo abierto, esperas: es el mismo «ritmo libre con
   techo» de cultura, generalizado. Cada respuesta se guarda al pasar de
   pregunta, no al final: si alguien se queda sin batería a mitad, lo
   respondido no se pierde.
   ═══════════════════════════════════════════════════════════════════ */
async function participanteMotor(codigo, s){
  const estado = {paso:"segmentos", envio:null, hechas:{}, actual:null,
                  abiertas:[], proyectada:null, forzada:null};
  let reloj = null, vigia = null;
  const parar = () => { clearTimeout(reloj); clearInterval(vigia); vigia = null; };
  window.addEventListener("beforeunload", parar);

  // Una de tarjetas se ve dos veces: para escribir y, más tarde, para votar.
  // Por eso la marca de «hecha» lleva la fase pegada.
  const clave = p => p.id + (p.tipo === "tarjetas" ? ":" + (p.fase || "recogida") : "");
  const hecha = p => !!estado.hechas[clave(p)];
  const respondible = p => {
    if(p.estado !== "abierta") return false;
    if(p.tipo !== "tarjetas") return true;
    const f = p.fase || "recogida";
    return f === "recogida" || f === "votacion";
  };

  // Una sola llamada trae las dos cosas que necesita el móvil: qué preguntas
  // están abiertas y cuál está en el proyector.
  const refrescar = async () => {
    const [todas, ses] = await Promise.all([
      API.preguntasPublicas(codigo).catch(()=>null),
      API.sesionPublica(codigo).catch(()=>null)]);
    if(todas) estado.abiertas = todas.filter(respondible);
    const va = ses && ses.vista_activa;
    estado.proyectada = va && String(va).startsWith("q:") ? String(va).slice(2) : null;
    return ses;
  };

  // Qué pregunta toca. El orden de preferencia importa: manda lo que el
  // facilitador está proyectando. Sin esto, con varias preguntas abiertas a la
  // vez, el móvil enseña la primera de la lista mientras la sala mira otra.
  const siguiente = async () => {
    await refrescar();
    const c = estado.abiertas;
    if(estado.forzada){                        // la ha elegido el participante
      const f = c.find(p => p.id === estado.forzada);
      estado.forzada = null;
      if(f) return f;
    }
    const proy = estado.proyectada && c.find(p => p.id === estado.proyectada && !hecha(p));
    if(proy) return proy;
    return c.find(p => !hecha(p)) || null;
  };

  const pendientes = () => estado.abiertas.filter(p => !hecha(p)).length;

  const esperar = () => { parar(); reloj = setTimeout(async () => {
    const n = await API.sesionPublica(codigo).catch(()=>null);
    if(n && !n.admite_respuestas){          // el facilitador ha cerrado
      try{ await API.cerrarEnvio(estado.envio); }catch(e){}
      estado.paso = "fin"; return pintar();
    }
    const p = await siguiente();
    if(p){ estado.actual = p; estado.paso = "pregunta"; return pintar(); }
    if(estado.paso === "espera") pintarEspera();   // refresca el recuento
    esperar();
  }, 3000); };

  // Vigilante de la pantalla de pregunta. NO repinta: si el facilitador cambia
  // de pantalla mientras alguien está a medio responder, borrarle lo escrito
  // sería peor que el problema que resuelve. Solo enciende un aviso arriba.
  const vigilar = () => {
    clearInterval(vigia);
    vigia = setInterval(async () => {
      const ses = await refrescar();
      const caja = document.getElementById("saltar");
      if(!caja) return;                        // ya no estamos en la pregunta
      const act = estado.actual;
      if(ses && !ses.admite_respuestas){
        caja.innerHTML = `<div class="aviso rojo">La sesión se ha cerrado.
          <button class="btn sm" id="irfin" style="margin-left:8px">Terminar</button></div>`;
        $("#irfin").onclick = async () => {
          try{ await API.cerrarEnvio(estado.envio); }catch(e){}
          estado.paso = "fin"; parar(); pintar(); };
        return;
      }
      if(act && !estado.abiertas.some(p => p.id === act.id)){
        caja.innerHTML = `<div class="aviso rojo">El facilitador ha cerrado esta pregunta:
          ya no admite respuestas.
          <button class="btn sm" id="irsig" style="margin-left:8px">Continuar</button></div>`;
        $("#irsig").onclick = () => avanzar();
        return;
      }
      const pr = estado.proyectada && estado.abiertas.find(
        p => p.id === estado.proyectada && p.id !== (act && act.id) && !hecha(p));
      caja.innerHTML = pr
        ? `<div class="aviso">En la sala se está proyectando otra pregunta.
             <button class="btn sm" id="irproy" style="margin-left:8px">Ir a ella</button></div>`
        : "";
      if(pr) $("#irproy").onclick = () => { estado.forzada = pr.id; avanzar(); };
    }, 3000);
  };

  const avanzar = async () => {
    const sig = await siguiente();
    if(sig){ estado.actual = sig; estado.paso = "pregunta"; }
    else estado.paso = "espera";
    pintar(); window.scrollTo({top:0});
  };

  // La espera se repinta sola cada tres segundos para que el recuento no
  // mienta. Antes decía «has respondido todo lo que está abierto» sin decir
  // cuánto era todo, y parecía que el cuestionario se había atascado.
  const pintarEspera = () => {
    const n = estado.abiertas.length, hs = estado.abiertas.filter(hecha).length;
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h2>${n && hs === n ? "Estás al día" : "Espera un momento"}</h2>
      <p class="lead">${n
        ? `Has respondido las <b>${hs} preguntas</b> que están abiertas ahora mismo.`
        : "Todavía no hay ninguna pregunta abierta."}
        La siguiente aparecerá sola en cuanto el facilitador la abra.</p>
      <p class="small">No cierres esta página ni recargues: lo respondido está guardado.
        Cuando el facilitador cierre la sesión, verás la pantalla de despedida.</p>
      <div class="btnrow">
        ${n ? `<button class="btn ghost" id="rev">Revisar mis respuestas</button>` : ""}
        <button class="btn ghost" id="ahora">Comprobar ahora</button></div>
    </div></div>`;
    if($("#rev")) $("#rev").onclick = () => { estado.paso = "lista"; pintar(); };
    $("#ahora").onclick = () => avanzar();
  };

  const pintar = async () => {
    if(estado.paso === "segmentos"){
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <span class="phasetag">${esc(s.organizacion||"")}</span>
        <h1 style="margin-top:10px">${esc(s.titulo)}</h1>
        <p class="lead">Iremos pregunta a pregunta. Cada una aparece cuando quien conduce la
          sesión la abre; mientras tanto, verás una pantalla de espera.</p>
        <p><b>Es anónimo</b>: no se registra tu nombre, tu correo ni ningún identificador.</p>
        <h3>Tres datos sobre tu posición</h3>
        <div class="field"><label for="f1">Ámbito en el que trabajas</label><select id="f1">
          <option value="">Prefiero no indicarlo</option><option>Dirección o gobierno</option>
          <option>Gestión y administración</option>
          <option>Actividad principal</option><option>Apoyo técnico</option></select></div>
        <div class="field"><label for="f2">Responsabilidad sobre equipos</label><select id="f2">
          <option value="">Prefiero no indicarlo</option><option>Sí, dirijo un equipo</option>
          <option>No dirijo equipo</option></select></div>
        <div class="field"><label for="f3">Antigüedad</label><select id="f3">
          <option value="">Prefiero no indicarlo</option><option>Menos de 3 años</option>
          <option>Entre 3 y 10 años</option><option>Más de 10 años</option></select></div>
        <div class="btnrow"><button class="btn" id="ir">Empezar</button></div></div></div>`;
      $("#ir").onclick = async () => {
        $("#ir").disabled = true; $("#ir").textContent = "Conectando…";
        try{
          estado.envio = await API.abrirEnvio(codigo, {ambito:$("#f1").value||null,
            responsable:$("#f2").value||null, antiguedad:$("#f3").value||null});
          const p = await siguiente();
          if(p){ estado.actual = p; estado.paso = "pregunta"; } else estado.paso = "espera";
          pintar();
        }catch(e){ $("#ir").disabled=false; $("#ir").textContent="Empezar"; alert(e.message||e); }
      };
      return;
    }

    if(estado.paso === "fin"){
      parar();
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>Gracias</h1><p class="lead">Tus respuestas se han guardado de forma anónima.</p>
        <p>Ya puedes dejar el móvil.</p></div></div>`;
      return;
    }

    if(estado.paso === "espera"){ pintarEspera(); esperar(); return; }

    if(estado.paso === "lista"){
      parar();
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h2>Tus preguntas</h2>
        <p class="small">Aquí están las que el facilitador tiene abiertas ahora mismo.
          Puedes volver a cualquiera. Si respondes otra vez, tu respuesta anterior
          se sustituye por la nueva.</p>
        <div class="lista">${estado.abiertas.length ? estado.abiertas.map((p,i)=>`
          <div class="it"><div><b>${i+1}. ${esc(p.titulo)}</b>
            <div class="small">${hecha(p) ? "respondida" : "<b>pendiente</b>"}${
              p.id === estado.proyectada ? " · en la pantalla de la sala" : ""}</div></div>
            <button class="btn ${hecha(p) ? "ghost " : ""}sm" data-ir="${esc(p.id)}">${
              hecha(p) ? "Revisar" : "Responder"}</button></div>`).join("")
          : `<div class="it"><div class="small">Ahora mismo no hay ninguna abierta.</div></div>`}</div>
        <div class="btnrow"><button class="btn ghost" id="volver">Volver</button></div>
      </div></div>`;
      app().querySelectorAll("[data-ir]").forEach(b => b.onclick = () => {
        estado.forzada = b.dataset.ir; avanzar(); });
      $("#volver").onclick = () => avanzar();
      window.scrollTo({top:0});
      return;
    }

    parar();
    const p = estado.actual, cfg = p.config || {};

    // ── Tarjetas: escribir o votar, según la fase ──────────────────
    if(p.tipo === "tarjetas"){
      const fase = p.fase || "recogida";
      if(fase === "recogida"){
        const maxA = cfg.maximo_aportaciones || 5, lim = cfg.maximo_caracteres || 200;
        app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
          <div id="saltar"></div>
          <span class="phasetag">${esc(p.codigo||"")} · escribir</span>
          <h2 style="margin-top:8px">${esc(p.titulo)}</h2>
          ${p.ayuda ? `<p class="small">${esc(p.ayuda)}</p>` : ""}
          <p class="small">Una idea por casilla, hasta ${maxA}. No hace falta rellenarlas todas.</p>
          <div id="cs">${Array.from({length:maxA},(_,i)=>`
            <div class="field"><input id="tj${i}" maxlength="${lim}"
              placeholder="${i===0?"Escribe aquí":"Otra idea (opcional)"}" autocomplete="off"></div>`).join("")}</div>
          <div id="aviso"></div>
          <div class="btnrow"><button class="btn" id="env">Enviar</button></div>
        </div></div>`;
        $("#env").onclick = async () => {
          const txt = Array.from({length:maxA},(_,i)=>$("#tj"+i).value.trim()).filter(Boolean);
          if(!txt.length){ $("#aviso").innerHTML =
            `<div class="aviso rojo">Escribe al menos una idea.</div>`; return; }
          $("#env").disabled = true; $("#env").textContent = "Guardando…";
          try{ await API.guardarTarjetas(estado.envio, p.id, txt); }
          catch(e){ $("#env").disabled=false; $("#env").textContent="Enviar";
            $("#aviso").innerHTML = `<div class="aviso rojo">${esc(e.message||e)}</div>`; return; }
          estado.hechas[p.id + ":recogida"] = true;
          avanzar();
        };
        vigilar(); window.scrollTo({top:0});
        return;
      }
      // votación
      let g = {grupos:[], votos:3};
      try{ g = await API.gruposParaVotar(codigo, p.id) || g; }catch(e){}
      const maxV = g.votos || 3, sel = new Set();
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <div id="saltar"></div>
        <span class="phasetag">${esc(p.codigo||"")} · votar</span>
        <h2 style="margin-top:8px">${esc(p.titulo)}</h2>
        <p class="small">Elige hasta ${maxV} de los temas en que se han agrupado las respuestas.</p>
        <div id="gs">${(g.grupos||[]).map(x=>
          `<button type="button" class="btn ghost" data-g="${esc(x.id)}"
             style="display:block;width:100%;text-align:left;margin:6px 0">${esc(x.etiqueta)}</button>`).join("")}</div>
        <div id="aviso"></div>
        <div class="btnrow"><button class="btn" id="env">Enviar votos</button></div>
      </div></div>`;
      app().querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
        const id = b.dataset.g;
        if(sel.has(id)) sel.delete(id); else if(sel.size < maxV) sel.add(id);
        app().querySelectorAll("[data-g]").forEach(x =>
          x.classList.toggle("ghost", !sel.has(x.dataset.g)));
      });
      $("#env").onclick = async () => {
        if(!sel.size){ $("#aviso").innerHTML =
          `<div class="aviso rojo">Elige al menos uno.</div>`; return; }
        $("#env").disabled = true; $("#env").textContent = "Guardando…";
        try{ await API.guardarVotos(estado.envio, p.id, [...sel]); }
        catch(e){ $("#env").disabled=false; $("#env").textContent="Enviar votos";
          $("#aviso").innerHTML = `<div class="aviso rojo">${esc(e.message||e)}</div>`; return; }
        estado.hechas[p.id + ":votacion"] = true;
        avanzar();
      };
      vigilar(); window.scrollTo({top:0});
      return;
    }

    const ix = estado.abiertas.findIndex(x => x.id === p.id);
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <div id="saltar"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <span class="phasetag">${esc(p.codigo||"")}${
          ix >= 0 ? " · " + (ix+1) + " de " + estado.abiertas.length + " abiertas" : ""}</span>
        <button class="btn ghost sm" id="todas">Ver todas</button></div>
      <h2 style="margin-top:8px">${esc(p.titulo)}</h2>
      ${p.ayuda ? `<p class="small">${esc(p.ayuda)}</p>` : ""}
      ${hecha(p) ? `<div class="aviso">Ya respondiste a esta. Si vuelves a enviar,
        tu respuesta anterior se sustituye.</div>` : ""}
      <div id="campo"></div>
      <div id="aviso"></div>
      <div class="btnrow"><button class="btn" id="env">Enviar respuesta</button></div>
    </div></div>`;
    $("#todas").onclick = () => { estado.paso = "lista"; pintar(); };
    vigilar();

    const campo = $("#campo");
    let leer = () => null;              // devuelve el valor jsonb o null si falta algo

    if(p.tipo === "unica" || p.tipo === "multiple"){
      const ops = cfg.opciones || [];
      const max = p.tipo === "multiple" ? (cfg.maximo || ops.length) : 1;
      const sel = new Set();
      campo.innerHTML = ops.map((o,i)=>
        `<button type="button" class="btn ghost" data-o="${i}"
           style="display:block;width:100%;text-align:left;margin:6px 0">${esc(o)}</button>`).join("")
        + (p.tipo==="multiple" ? `<p class="small">Puedes elegir hasta ${max}.</p>` : "");
      campo.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        const i = +b.dataset.o;
        if(p.tipo === "unica"){ sel.clear(); sel.add(i); }
        else if(sel.has(i)) sel.delete(i);
        else if(sel.size < max) sel.add(i);
        campo.querySelectorAll("[data-o]").forEach(x =>
          x.classList.toggle("ghost", !sel.has(+x.dataset.o)));
      });
      leer = () => !sel.size ? null : (p.tipo === "unica"
        ? {opcion: ops[[...sel][0]]}
        : {opciones: [...sel].sort((a,b)=>a-b).map(i=>ops[i])});

    } else if(p.tipo === "escala"){
      const min = cfg.min ?? 1, max = cfg.max ?? 7; let v = null;
      campo.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0">${
        Array.from({length:max-min+1},(_,k)=>min+k).map(n=>
          `<button type="button" class="btn ghost" data-n="${n}"
             style="flex:1;min-width:44px">${n}</button>`).join("")}</div>
        <div style="display:flex;justify-content:space-between;gap:10px">
          <span class="small">${esc(cfg.ancla_min||"")}</span>
          <span class="small" style="text-align:right">${esc(cfg.ancla_max||"")}</span></div>`;
      campo.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { v = +b.dataset.n;
        campo.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("ghost", +x.dataset.n !== v)); });
      leer = () => v == null ? null : {n: v};

    } else if(p.tipo === "matriz_escala"){
      const min = cfg.min ?? 1, max = cfg.max ?? 7, items = cfg.items || {}, val = {};
      const lista = Array.isArray(items) ? items : Object.keys(items);
      campo.innerHTML = lista.map((it,ix)=>`<div style="margin:16px 0">
        <div style="margin-bottom:6px">${esc(it)}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap" data-fila="${ix}">${
          Array.from({length:max-min+1},(_,k)=>min+k).map(n=>
            `<button type="button" class="btn ghost" data-n="${n}"
               style="flex:1;min-width:40px;padding:9px 0">${n}</button>`).join("")}</div></div>`).join("")
        + `<div style="display:flex;justify-content:space-between;gap:10px">
             <span class="small">${esc(cfg.ancla_min||"")}</span>
             <span class="small" style="text-align:right">${esc(cfg.ancla_max||"")}</span></div>`;
      campo.querySelectorAll("[data-fila]").forEach(f => f.onclick = ev => {
        const b = ev.target.closest("[data-n]"); if(!b) return;
        val[lista[+f.dataset.fila]] = +b.dataset.n;
        f.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("ghost", x !== b));
      });
      leer = () => Object.keys(val).length === lista.length ? {items: val} : null;

    } else if(p.tipo === "abierta"){
      const lim = cfg.maximo_caracteres || 300;
      campo.innerHTML = `<div class="field"><textarea id="tx" rows="4" maxlength="${lim}"
        placeholder="Escribe aquí"></textarea><p class="small" id="cnt">${lim} caracteres</p></div>`;
      $("#tx").oninput = () => $("#cnt").textContent = (lim - $("#tx").value.length) + " caracteres";
      leer = () => $("#tx").value.trim() ? {texto: $("#tx").value.trim()} : null;

    } else if(p.tipo === "abierta_campos"){
      const cs = cfg.campos || [];
      campo.innerHTML = cs.map((c,i)=>`<div class="field">
        <label for="c${i}">${esc(c.etiqueta)}</label>
        <input id="c${i}" maxlength="200" autocomplete="off"></div>`).join("");
      leer = () => { const o = {}; let algo = false;
        cs.forEach((c,i)=>{ const v = $("#c"+i).value.trim(); if(v){ o[c.clave]=v; algo=true; } });
        return algo ? {campos:o} : null; };

    } else if(p.tipo === "puntos100"){
      const ops = cfg.opciones || [], total = cfg.total || 100, paso = cfg.paso || 5;
      const r = {}; ops.forEach(o=>r[o]=0);
      const suma = () => ops.reduce((a,o)=>a+r[o],0);
      campo.innerHTML = `<div class="restante" id="rest"><b id="restN">${total}</b>
          <span>puntos por repartir</span></div><div id="ops"></div>`;
      const cont = $("#ops");
      ops.forEach(o=>{
        const d = document.createElement("div"); d.className="opt";
        const t = document.createElement("p"); t.textContent = o;
        const st = document.createElement("div"); st.className="stepper";
        const menos = document.createElement("button"); menos.type="button"; menos.textContent="−"+paso;
        const val = document.createElement("div"); val.className="val";
        const mas = document.createElement("button"); mas.type="button"; mas.textContent="+"+paso;
        const barra = document.createElement("div"); barra.className="barmini";
        const rel = document.createElement("i"); barra.appendChild(rel);
        d._ref = () => { val.textContent = r[o]; val.classList.toggle("puesto", r[o]>0);
          rel.style.width = (r[o]/total*100)+"%"; menos.disabled = r[o]<=0; mas.disabled = suma()>=total; };
        menos.onclick = () => { r[o]=Math.max(0,r[o]-paso); act(); };
        mas.onclick   = () => { r[o]=Math.min(r[o]+paso, r[o]+(total-suma())); act(); };
        st.append(menos,val,mas,barra); d.append(t,st); cont.appendChild(d);
      });
      const act = () => { const q = total - suma();
        $("#restN").textContent = q; $("#rest").classList.toggle("ok", q===0);
        [...cont.children].forEach(d=>d._ref()); };
      act();
      leer = () => suma() === total ? {reparto: r} : null;

    } else if(p.tipo === "nube"){
      // Varias casillas cortas y no un campo libre: lo que se agrega es el
      // término, y un término por casilla evita tener que trocear frases.
      const max = cfg.maximo || 3, lim = cfg.maximo_caracteres || 30;
      campo.innerHTML = `<p class="small">Una palabra o expresión corta por casilla,
          hasta ${max}. No hace falta rellenarlas todas.</p>${
        Array.from({length:max},(_,i)=>`<div class="field"><input id="nb${i}"
          maxlength="${lim}" autocomplete="off" placeholder="${
            i===0?"Escribe aquí":"Otra (opcional)"}"></div>`).join("")}`;
      leer = () => { const t = Array.from({length:max},(_,i)=>$("#nb"+i).value.trim())
          .filter(Boolean); return t.length ? {terminos:t} : null; };

    } else if(p.tipo === "ranking" || p.tipo === "secuencia"){
      // Subir y bajar, no arrastrar. Arrastrar en un móvil, de pie, con
      // diez elementos y el dedo gordo, falla más de lo que funciona.
      // Se baraja para cada persona. Si todos vieran la misma lista de
      // partida, la posición media mediría el orden en que yo escribí los
      // elementos tanto como la prioridad del grupo.
      const orden = barajar((cfg.elementos || cfg.opciones || []).slice());
      const cuantos = cfg.maximo_posiciones || orden.length;
      const dibuja = () => {
        campo.innerHTML = `<p class="small">${p.tipo==="ranking"
            ? "Coloca arriba lo más prioritario."
            : "Coloca arriba lo que sucedería antes en el tiempo."}${
            cuantos < orden.length ? " Solo cuentan los "+cuantos+" primeros." : ""}</p>
          <div>${orden.map((o,i)=>`
            <div class="fila-orden${cuantos<orden.length && i>=cuantos ? " ".trim() : ""}"
                 style="${cuantos<orden.length && i>=cuantos ? "opacity:.45" : ""}">
              <div class="pos">${i+1}</div><div class="txt">${esc(o)}</div>
              <div class="mueve">
                <button type="button" data-sb="${i}" ${i===0?"disabled":""}
                  aria-label="Subir">▲</button>
                <button type="button" data-bj="${i}" ${i===orden.length-1?"disabled":""}
                  aria-label="Bajar">▼</button></div></div>`).join("")}</div>`;
        campo.querySelectorAll("[data-sb]").forEach(b => b.onclick = () => {
          const i = +b.dataset.sb; [orden[i-1], orden[i]] = [orden[i], orden[i-1]]; dibuja(); });
        campo.querySelectorAll("[data-bj]").forEach(b => b.onclick = () => {
          const i = +b.dataset.bj; [orden[i+1], orden[i]] = [orden[i], orden[i+1]]; dibuja(); });
      };
      dibuja();
      leer = () => orden.length ? {orden} : null;

    } else if(p.tipo === "dos_ejes"){
      const els = cfg.elementos || cfg.opciones || [];
      const pos = {}; let foco = 0;
      const [exMin, exMax] = partirEje(cfg.eje_x);
      const [eyMin, eyMax] = partirEje(cfg.eje_y);
      campo.innerHTML = `<p class="small">Toca el cuadro para colocar el elemento
          seleccionado. Puedes volver a tocarlo para moverlo.</p>
        <div class="chips" id="chips"></div>
        <div class="ejes-y"><span class="small">↑ ${esc(eyMax)}</span></div>
        <div class="tablero" id="tab"><div class="cruz h"></div><div class="cruz v"></div></div>
        <div class="ejes-x"><span class="small">← ${esc(exMin)}</span>
          <span class="small" style="text-align:right">${esc(exMax)} →</span></div>
        <div class="ejes-y" style="margin-top:4px"><span class="small">↓ ${esc(eyMin)}</span></div>`;
      const tab = $("#tab"), chips = $("#chips");
      const dibuja = () => {
        chips.innerHTML = els.map((e,i)=>`<button type="button" data-e="${i}"
          class="${i===foco?"foco":(pos[e]?"puesto":"")}">${pos[e]?"● ":""}${esc(e)}</button>`).join("");
        chips.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { foco = +b.dataset.e; dibuja(); });
        tab.querySelectorAll(".punto,.marca").forEach(x=>x.remove());
        els.forEach((e,i)=>{ const q = pos[e]; if(!q) return;
          const d = document.createElement("div");
          d.className = "punto" + (i===foco ? "" : " otro");
          d.style.left = q.x + "%"; d.style.top = (100-q.y) + "%"; tab.appendChild(d);
          const m = document.createElement("div"); m.className = "marca"; m.textContent = e;
          m.style.left = Math.min(Math.max(q.x, 12), 88) + "%";
          m.style.top = Math.min(Math.max(100-q.y, 6), 94) + "%";
          m.style.marginTop = "-16px"; tab.appendChild(m); });
      };
      tab.onclick = ev => {
        const r = tab.getBoundingClientRect();
        const x = Math.round(Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1) * 100);
        const y = Math.round((1 - Math.min(Math.max((ev.clientY - r.top) / r.height, 0), 1)) * 100);
        pos[els[foco]] = {x, y};
        const sig = els.findIndex(e => !pos[e]);
        if(sig >= 0) foco = sig;
        dibuja();
      };
      dibuja();
      leer = () => els.length && els.every(e=>pos[e]) ? {pos} : null;

    } else if(p.tipo === "clasificar"){
      const els = cfg.elementos || cfg.opciones || [], cats = cfg.categorias || [];
      const asig = {};
      campo.innerHTML = els.map((e,i)=>`<div class="cel-fila"><b>${esc(e)}</b>
        <div class="chips" data-f="${i}">${cats.map((c,j)=>
          `<button type="button" data-c="${j}">${esc(c)}</button>`).join("")}</div></div>`).join("");
      campo.querySelectorAll("[data-f]").forEach(f => f.onclick = ev => {
        const b = ev.target.closest("[data-c]"); if(!b) return;
        asig[els[+f.dataset.f]] = cats[+b.dataset.c];
        f.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("foco", x === b));
      });
      leer = () => els.length && Object.keys(asig).length === els.length ? {asignacion:asig} : null;

    } else if(p.tipo === "matriz_valoracion"){
      const filas = cfg.filas || cfg.elementos || [], cols = cfg.columnas || [];
      const min = cfg.min ?? 1, max = cfg.max ?? 5;
      const celdas = {};
      campo.innerHTML = (p.ayuda ? "" : `<p class="small">${min} = perjudicial ·
          ${Math.round((min+max)/2)} = neutra · ${max} = muy valiosa</p>`)
        + filas.map((f,i)=>`<div class="cel-fila"><b>${esc(f)}</b>${cols.map((c,j)=>
          `<div class="cel-col"><span class="small">${esc(c)}</span>
             <div class="nums" data-f="${i}" data-c="${j}">${
               Array.from({length:max-min+1},(_,k)=>min+k).map(n=>
                 `<button type="button" data-n="${n}">${n}</button>`).join("")}</div></div>`).join("")}</div>`).join("");
      campo.querySelectorAll("[data-f][data-c]").forEach(g => g.onclick = ev => {
        const b = ev.target.closest("[data-n]"); if(!b) return;
        const f = filas[+g.dataset.f], c = cols[+g.dataset.c];
        (celdas[f] = celdas[f] || {})[c] = +b.dataset.n;
        g.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("on", x === b));
      });
      leer = () => filas.length && cols.length
        && filas.every(f => celdas[f] && cols.every(c => celdas[f][c] != null))
        ? {celdas} : null;
    }

    $("#env").onclick = async () => {
      const valor = leer();
      if(!valor){ $("#aviso").innerHTML =
        `<div class="aviso rojo">${
            p.tipo==="puntos100" ? "Tienes que repartir los "+(cfg.total||100)+" puntos."
          : p.tipo==="matriz_escala" ? "Falta valorar alguna fila."
          : p.tipo==="dos_ejes" ? "Falta colocar algún elemento en el cuadro."
          : p.tipo==="clasificar" ? "Falta clasificar algún elemento."
          : p.tipo==="matriz_valoracion" ? "Falta valorar alguna casilla."
          : p.tipo==="nube" ? "Escribe al menos una palabra."
          : "Responde antes de enviar."}</div>`; return; }
      $("#env").disabled = true; $("#env").textContent = "Guardando…";
      try{ await API.guardarItem(estado.envio, p.id, valor); }
      catch(e){ $("#env").disabled=false; $("#env").textContent="Enviar respuesta";
        $("#aviso").innerHTML = `<div class="aviso rojo">${esc(e.message||e)}</div>`; return; }
      estado.hechas[p.id] = true;
      avanzar();
    };
    window.scrollTo({top:0});
  };
  pintar();
}

/* ═══════════════════════════════════════════════════════════════════
   6 · PROYECCIÓN — obedece a vista_activa
   ═══════════════════════════════════════════════════════════════════ */
async function vistaProyeccion(codigo){
  let sub = null, timer = null;
  // Antes del primer pintado, para que el proyector no arranque con el nombre
  // equivocado delante de la sala.
  const s0 = await API.sesionPublica(codigo);
  if(s0 && String(s0.instrumento||"").split("-")[0] !== "cultura")
    return proyeccionMotor(codigo, s0);
  const url = location.origin + location.pathname + "?s=" + encodeURIComponent(codigo);
  const pinta = async () => {
    const prog = await API.progreso(codigo);
    if(!prog){ app().innerHTML = `<div class="proy"><h1>Sesión no encontrada</h1></div>`; return; }
    const vista = prog.vista_activa || "espera";
    let cuerpo = "";
    if(vista === "espera" || vista === "resultados" || vista === "subcategorias"){
      if(vista === "espera"){
        cuerpo = `<h1>Entra desde tu móvil</h1>
          <div style="display:flex;gap:40px;flex-wrap:wrap;align-items:center">
            <div><div class="small">Código</div><div class="codigo">${esc(codigo.toUpperCase())}</div>
              <p style="margin-top:14px;font-size:18px">${esc(location.host + location.pathname)}</p></div>
            <div class="qr" id="qr"></div></div>
          <div class="contador" style="margin-top:26px"><b>${prog.completos}</b>
            <span style="font-size:20px">${prog.n_convocados ? "de "+prog.n_convocados+" han terminado"
                                                             : "personas han terminado"}</span></div>
          <div class="barra"><i style="width:${prog.pct||0}%"></i></div>
          <p class="small" style="margin-top:20px">Tus respuestas son anónimas. No se registra tu nombre
            ni tu correo, y ningún resultado se desglosa en grupos de menos de cinco personas.</p>`;
      } else {
        const res = await API.resultados(codigo);
        if(res.error){
          cuerpo = `<h1>Resultados</h1><p style="font-size:20px">${
            res.error==="muestra_insuficiente"
              ? `Todavía no hay respuestas suficientes (${res.n} de ${res.minimo} mínimas).`
              : "El facilitador aún no ha publicado los resultados."}</p>`;
        } else {
          const d = calcular(datosAMapa(res.datos));
          cuerpo = vista==="resultados"
            ? `<h1>Perfil de cultura</h1>${bloqueResultados(d,"pr")}`
            : `<h1>Por subcategoría</h1>${bloqueSub(d,"pr")}`;
          window._d = d; window._vista = vista;
        }
      }
    } else {
      const n = parseInt(vista.slice(1),10);
      const p = PANTALLAS.find(x=>x.n===n);
      if(p){
        let pp = {respondidos:0, cerrada:false, datos:null, minimo:3};
        try{ pp = await API.pantallaPublica(codigo, n) || pp; }catch(e){}
        const cab = `<div class="small">${p.pasada===0?"CULTURA ACTUAL":"CULTURA DESEADA"} ·
            pantalla ${p.pasada===0?p.n:p.n-6} de 6</div>
          <h1>${p.pasada===0?"ACTUAL: ":"DESEADA: "}${SUBS[p.sub]}</h1>`;
        if(pp.datos && pp.datos.length){
          // Pantalla ya cerrada: se puede enseñar el reparto sin anclar a nadie.
          const max = Math.max(...pp.datos.map(x=>x.media), 1);
          const orden = p.orden.filter(v => pp.datos.some(x=>x.vector===v));
          cuerpo = cab + `<div style="margin-top:22px">${orden.map(v=>{
            const m = pp.datos.find(x=>x.vector===v).media;
            return `<div style="margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
                <span class="enun" style="margin:0;border:0;padding:0">${esc(TXT[p.sub][v])}</span>
                <b style="font-size:30px;white-space:nowrap">${m.toFixed(1)}</b></div>
              <div class="barra" style="height:14px"><i style="width:${m/max*100}%"></i></div>
            </div>`; }).join("")}</div>
            <p class="small" style="margin-top:18px">Media de ${pp.respondidos} respuestas ·
              reparto de 100 puntos</p>`;
        } else {
          // Pantalla abierta: los enunciados y cuánta gente la ha contestado.
          // El reparto NO se enseña todavía a propósito: ver la media del
          // grupo antes de contestar arrima a quien queda por contestar.
          cuerpo = cab + p.orden.map(v=>`<div class="enun">${esc(TXT[p.sub][v])}</div>`).join("")
            + `<div class="contador" style="margin-top:24px"><b>${pp.respondidos}</b>
                <span style="font-size:20px">${pp.respondidos===1 ? "persona ha respondido esta pantalla"
                                                                  : "personas han respondido esta pantalla"}</span></div>`
            + (pp.cerrada && pp.respondidos < pp.minimo
                ? `<p class="small" style="margin-top:14px">Con menos de ${pp.minimo} respuestas no se
                     muestra el reparto: sería la respuesta de una persona concreta.</p>` : "");
        }
      }
    }
    app().innerHTML = `<div class="proy">${cuerpo}</div>`;
    if(vista === "espera") pintarQR("qr", url, 8);
    if(window._d && (vista==="resultados")) pintarRadaresDe(window._d,"pr");
    if(window._d && (vista==="subcategorias")) pintarSub(window._d,"pr");
  };
  window._repinta = () => pinta();
  await pinta();

  /* Mando por teclado desde la propia proyección.
     Deliberadamente sin botones en pantalla: si pintara flechas, la sala
     vería tus controles, que es justo lo que evitamos al separar consola y
     proyección. Las teclas no se ven.
       →  o  Espacio   abrir la siguiente pantalla
       ←               cerrar una
       Inicio / Fin    volver a la espera / ir al perfil general
     Solo funciona si estás identificado: para cualquier otro, la base de
     datos rechaza el cambio por RLS. La sala no puede tocar nada. */
  const mandar = async cambios => {
    try{
      const ses = await API.sesiones();
      const s2 = ses.find(x => x.codigo.toUpperCase() === codigo.toUpperCase());
      if(!s2) return;
      await API.actualizarSesion(s2.id, typeof cambios === "function" ? cambios(s2) : cambios);
      pinta();
    }catch(e){ /* sin sesión iniciada no se puede: es lo correcto */ }
  };
  window.addEventListener("keydown", ev => {
    if(ev.key === "ArrowRight" || ev.key === " "){ ev.preventDefault();
      mandar(s2 => { const n = Math.min(12, (s2.pantalla_max ?? 0) + 1);
                     return {pantalla_max:n, vista_activa:"p"+n}; }); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault();
      mandar(s2 => { const n = Math.max(0, (s2.pantalla_max ?? 1) - 1);
                     return {pantalla_max:n, vista_activa: n ? "p"+n : "espera"}; }); }
    else if(ev.key === "Home"){ mandar({vista_activa:"espera"}); }
    else if(ev.key === "End"){  mandar({vista_activa:"resultados"}); }
  });

  // Tiempo real para el cambio de vista; sondeo para contadores y resultados.
  // Si el tiempo real se cae, el sondeo sigue: la sesión no se detiene.
  const s = await API.sesionPublica(codigo);
  timer = setInterval(pinta, 3000);
  window.addEventListener("beforeunload", ()=>{ clearInterval(timer); if(sub) sub.unsubscribe(); });
}

/* ═══════════════════════════════════════════════════════════════════
   6 quater · MESA DE AGRUPACIÓN

   La pantalla más delicada del sistema. Cuarenta tarjetas de texto libre
   y tú fusionando equivalentes con la sala esperando. Está pensada para
   eso: leer rápido, crear temas de un golpe y asignar con un clic.

   Deliberadamente sin agrupación automática. Decidir que «se nos jubila
   la plantilla» y «falta de relevo generacional» son lo mismo exige
   criterio, y ese criterio es parte de lo que cobras.
   ═══════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   6 ter · EDITOR DE LISTAS

   La mitad del banco de escenarios es «derivada»: la pregunta existe
   antes de la sesión, pero su contenido no. Las incertidumbres que hay
   que colocar en el mapa salen de lo que el grupo acaba de escribir, y
   eso pasa con la sala mirando. Aquí se teclean, o se traen de una
   pregunta anterior ya terminada.
   ═══════════════════════════════════════════════════════════════════ */
async function editorListas(s, pregunta, preguntas, volver){
  const slots = LISTAS_TIPO[pregunta.tipo] || [];
  const ejes  = EJES_TIPO[pregunta.tipo] || [];
  const cfg   = JSON.parse(JSON.stringify(pregunta.config || {}));

  // Todas las que podrían dar una lista de etiquetas, y no solo las que ya
  // están listas: si aquí solo aparecen las terminadas, la lista sale corta y
  // parece que la aplicación se ha dejado preguntas. Las que aún no valen
  // salen igualmente, en gris y con el motivo escrito.
  const DAN_LISTA = ["tarjetas","nube","ranking","secuencia","unica","multiple",
                     "puntos100","matriz_escala","clasificar","dos_ejes"];
  const fuentes = preguntas.filter(p => p.id !== pregunta.id && DAN_LISTA.includes(p.tipo));
  const usable = p => p.estado === "terminada";
  const rotulo = (p, i) => `${i+1}. ${p.codigo ? p.codigo + " · " : ""}` +
    `${p.titulo.length > 52 ? p.titulo.slice(0,52) + "…" : p.titulo}` +
    (usable(p) ? "" : `  — ${p.estado}, todavía no se puede traer`);

  const etiquetasDe = async p => {
    if(p.tipo === "tarjetas"){
      const r = await API.resultadosTarjetas(s.codigo, p.id).catch(()=>null);
      if(!r) return [];
      if(r.grupos && r.grupos.length) return r.grupos.map(g=>g.etiqueta);
      return (r.tarjetas || []).map(t=>t.texto);
    }
    const r = await API.resultadosPregunta(s.codigo, p.id).catch(()=>null);
    if(!r || !r.datos) return [];
    return r.datos.map(d=>d.clave).filter(Boolean);
  };

  const pinta = () => {
    app().innerHTML = `<div class="wrap">${cabecera(
      `<button class="iconbtn" id="atras">Volver</button>`)}
      <div class="card">
        <span class="phasetag">${esc(pregunta.codigo||"propia")} · contenido</span>
        <h1 style="margin:6px 0 0">${esc(pregunta.titulo)}</h1>
        <p class="small" style="margin-top:8px">${esc(TIPOS_NOMBRE[pregunta.tipo]||pregunta.tipo)}
          · una línea por elemento · el orden que pongas aquí es el que verá la sala
          ${pregunta.tipo==="ranking"||pregunta.tipo==="secuencia"
            ? " (salvo en el móvil, donde se baraja para cada persona)" : ""}.</p>
        ${ejes.map(e=>`<div class="field"><label for="ej-${e.k}">${e.t}</label>
          <input id="ej-${e.k}" value="${esc(cfg[e.k]||"")}"
            placeholder="Poco de esto → mucho de esto"></div>`).join("")}
        ${slots.map(sl=>`<div class="field"><label for="ls-${sl.k}">${sl.t}
            <span class="small">(${(cfg[sl.k]||[]).length})</span></label>
          <textarea id="ls-${sl.k}" rows="7">${esc((cfg[sl.k]||[]).join("\n"))}</textarea></div>`).join("")}
        ${fuentes.length ? `<h3>Traer de una pregunta anterior</h3>
          <p class="small">Solo se puede traer de una pregunta <b>terminada</b>: de una que
            sigue abierta traerías un resultado a medias sin enterarte. Las demás salen
            en la lista para que veas dónde están, pero no se pueden elegir.</p>
          <div class="grid2">
            <div class="field"><label for="fu">Pregunta (${fuentes.filter(usable).length}
              de ${fuentes.length} disponibles)</label><select id="fu">${
              fuentes.map((p,i)=>`<option value="${esc(p.id)}"${usable(p)?"":" disabled"}${
                p === fuentes.find(usable) ? " selected" : ""}>${
                esc(rotulo(p,i))}</option>`).join("")}</select></div>
            <div class="field"><label for="cu">Cuántas, de más a menos votada</label>
              <select id="cu">${[3,4,5,6,8,10,99].map(n=>
                `<option value="${n}"${n===6?" selected":""}>${n===99?"todas":n}</option>`).join("")}</select></div>
          </div>
          <div class="field"><label for="de">Dónde ponerlas</label><select id="de">${
            slots.map(sl=>`<option value="${sl.k}">${sl.t}</option>`).join("")}</select></div>
          <div class="btnrow" style="margin-top:0">
            <button class="btn ghost" id="traer">Traer</button></div>`
          : `<p class="note">Todavía no hay ninguna pregunta terminada de la que traer
              elementos. Se pueden escribir a mano igualmente.</p>`}
        <div id="aviso"></div>
        <div class="btnrow"><button class="btn" id="guardar">Guardar</button>
          <button class="btn ghost" id="cancelar">Cancelar</button></div>
      </div></div>`;

    $("#atras").onclick = $("#cancelar").onclick = volver;

    if($("#traer") && !fuentes.some(usable)){
      $("#traer").disabled = true;
      $("#aviso").innerHTML = `<div class="aviso">Ninguna de las preguntas anteriores está
        terminada todavía, así que no hay de dónde traer. Escríbelo a mano, o termina antes
        la pregunta que produce este material.</div>`;
    }
    if($("#traer")) $("#traer").onclick = async () => {
      const p = fuentes.find(x=>x.id === $("#fu").value);
      if(!p || !usable(p)){ $("#aviso").innerHTML =
        `<div class="aviso rojo">Esa pregunta no está terminada.</div>`; return; }
      const cuantas = +$("#cu").value, destino = $("#de").value;
      $("#traer").disabled = true; $("#traer").textContent = "Trayendo…";
      const lista = (await etiquetasDe(p)).slice(0, cuantas);
      $("#traer").disabled = false; $("#traer").textContent = "Traer";
      if(!lista.length){ $("#aviso").innerHTML = `<div class="aviso rojo">Esa pregunta
        no devuelve elementos: puede que aún no llegue al mínimo de tres respuestas.</div>`; return; }
      // Se añade a lo que ya haya escrito, sin duplicar: normalmente traes
      // seis temas y añades a mano el que la sala ha reclamado a voces.
      const ya = $("#ls-"+destino).value.split("\n").map(x=>x.trim()).filter(Boolean);
      const set = new Set(ya.map(x=>x.toLowerCase()));
      lista.forEach(x => { if(!set.has(String(x).toLowerCase())){ ya.push(x); set.add(String(x).toLowerCase()); } });
      $("#ls-"+destino).value = ya.join("\n");
      $("#aviso").innerHTML = `<div class="aviso">Traídos ${lista.length}. Revísalos antes de guardar.</div>`;
    };

    $("#guardar").onclick = async () => {
      const nuevo = Object.assign({}, cfg);
      slots.forEach(sl => nuevo[sl.k] = $("#ls-"+sl.k).value.split("\n")
        .map(x=>x.trim()).filter(Boolean));
      ejes.forEach(e => nuevo[e.k] = $("#ej-"+e.k).value.trim());
      $("#guardar").disabled = true; $("#guardar").textContent = "Guardando…";
      try{ await API.actualizarPregunta(pregunta.id, {config: nuevo}); }
      catch(e){ $("#guardar").disabled = false; $("#guardar").textContent = "Guardar";
        $("#aviso").innerHTML = `<div class="aviso rojo">${esc(e.message||e)}</div>`; return; }
      volver();
    };
  };
  pinta();
}

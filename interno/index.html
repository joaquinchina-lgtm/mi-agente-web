      <div class="multi" style="align-items:start">
        <div class="card" style="margin:0">
          <h2>Sin agrupar <span class="estado">${sinGrupo.length}</span></h2>
          ${sinGrupo.length ? `<div class="lista">${sinGrupo.map(t=>`
            <div class="it">
              <div style="flex:1">${esc(t.texto)}</div>
              <div class="btnrow" style="margin:0">
                <button class="btn sm" data-mete="${t.id}" ${activo?"":"disabled"}>Al tema</button>
                <button class="btn ghost sm" data-oculta="${t.id}">Descartar</button>
              </div></div>`).join("")}</div>`
            : `<p class="small">Todas agrupadas o descartadas.</p>`}
          ${ocultas.length ? `<details style="margin-top:14px"><summary class="small">
            Descartadas (${ocultas.length})</summary><div class="lista">${ocultas.map(t=>`
            <div class="it"><div style="flex:1;opacity:.6">${esc(t.texto)}</div>
              <button class="btn ghost sm" data-recupera="${t.id}">Recuperar</button></div>`).join("")}
            </div></details>` : ""}
        </div>

        <div class="card" style="margin:0">
          <h2>Temas</h2>
          <form id="fg"><div class="grid2">
            <div class="field"><input id="et" placeholder="Nombre del tema" autocomplete="off"></div>
            <div class="field" style="align-self:end"><button class="btn" type="submit">Crear tema</button></div>
          </div></form>
          ${grupos.length ? `<div class="lista">${grupos.map(g=>{
            const dentro = tarjetas.filter(t=>t.grupo_id===g.id && !t.oculta);
            return `<div class="it" style="${g.id===activo?"outline:2px solid var(--actual)":""}">
              <div style="flex:1">
                <b>${esc(g.etiqueta)}</b> <span class="estado">${dentro.length}</span>
                ${dentro.length ? `<div class="small" style="margin-top:6px">${
                  dentro.map(t=>`<span style="display:inline-block;margin:2px 6px 2px 0">${esc(t.texto)}
                    <button class="btn ghost sm" data-saca="${t.id}"
                      style="padding:2px 6px;margin-left:2px">×</button></span>`).join("")}</div>` : ""}
              </div>
              <div class="btnrow" style="margin:0">
                <button class="btn ghost sm" data-activa="${g.id}">${g.id===activo?"activo":"elegir"}</button>
                <button class="btn ghost sm" data-borra="${g.id}">Borrar</button>
              </div></div>`;}).join("")}</div>`
            : `<p class="small">Todavía no hay temas. Crea el primero leyendo las tarjetas.</p>`}
        </div>
      </div></div>`;

    $("#atras").onclick = volver;
    $("#fg").onsubmit = async ev => { ev.preventDefault();
      const e = $("#et").value.trim(); if(!e) return;
      const g = await API.crearGrupo(pregunta.id, e, grupos.length + 1);
      activo = g.id; await cargar(); pinta(); };
    const rec = async fn => { await fn(); await cargar(); pinta(); };
    app().querySelectorAll("[data-activa]").forEach(b => b.onclick = () => {
      activo = b.dataset.activa; pinta(); });
    app().querySelectorAll("[data-mete]").forEach(b => b.onclick = () =>
      rec(() => API.tocarTarjeta(b.dataset.mete, {grupo_id: activo})));
    app().querySelectorAll("[data-saca]").forEach(b => b.onclick = () =>
      rec(() => API.tocarTarjeta(b.dataset.saca, {grupo_id: null})));
    app().querySelectorAll("[data-oculta]").forEach(b => b.onclick = () =>
      rec(() => API.tocarTarjeta(b.dataset.oculta, {oculta: true})));
    app().querySelectorAll("[data-recupera]").forEach(b => b.onclick = () =>
      rec(() => API.tocarTarjeta(b.dataset.recupera, {oculta: false})));
    app().querySelectorAll("[data-borra]").forEach(b => b.onclick = () =>
      rec(() => API.borrarGrupo(b.dataset.borra)));
  };

  await cargar();
  await pinta();
}

/* ═══════════════════════════════════════════════════════════════════
   6 ter · PROYECCIÓN DEL MOTOR

   Mientras la pregunta está abierta se proyecta el enunciado y cuánta
   gente la ha contestado. El reparto solo aparece cuando la pregunta
   está terminada: enseñar la media a quien todavía no ha respondido lo
   arrima al grupo. Es la misma regla que en cultura.
   ═══════════════════════════════════════════════════════════════════ */
async function proyeccionMotor(codigo, s){
  let timer = null;
  const url = location.origin + location.pathname + "?s=" + encodeURIComponent(codigo);

  const barras = (datos, etiqueta, valor) => {
    const max = Math.max(...datos.map(valor), 1);
    return `<div style="margin-top:22px">${datos.map(d=>`
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
          <span class="enun" style="margin:0;border:0;padding:0">${esc(etiqueta(d))}</span>
          <b style="font-size:30px;white-space:nowrap">${valor(d)}</b></div>
        <div class="barra" style="height:14px"><i style="width:${valor(d)/max*100}%"></i></div>
      </div>`).join("")}</div>`;
  };

  // Barra cuyo largo y cuyo número no son la misma cifra. En un ranking, el
  // número honesto es la posición media (1,4) y la barra tiene que ser más
  // larga cuanto MENOR es esa cifra; dibujar la posición tal cual daría la
  // barra más larga a lo último de la lista.
  const barrasV = (datos, etiqueta, largo, texto) => {
    const max = Math.max(...datos.map(largo), 0.0001);
    return `<div style="margin-top:22px">${datos.map(d=>`
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
          <span class="enun" style="margin:0;border:0;padding:0">${esc(etiqueta(d))}</span>
          <b style="font-size:30px;white-space:nowrap">${esc(texto(d))}</b></div>
        <div class="barra" style="height:14px"><i style="width:${largo(d)/max*100}%"></i></div>
      </div>`).join("")}</div>`;
  };

  // Decimales fijos y coma decimal. «4» junto a «4,6» en la misma matriz
  // se lee como si fueran cifras de distinta precisión.
  const num = (v, d = 1) => Number(v).toFixed(d).replace(".", ",");

  // Mapa de dos ejes. Un solo tono para todos los puntos y el nombre pegado
  // a cada uno: colorear por elemento gastaría ocho tonos categóricos en
  // una identidad que la etiqueta ya da mejor.
  const mapaEjes = (datos, cfg) => {
    const L = 130, R = 60, T = 34, B = 66, W = 1000, H = 520;
    const px = x => L + (x/100) * (W - L - R);
    const py = y => T + (1 - y/100) * (H - T - B);
    const [exMin, exMax] = partirEje(cfg.eje_x), [eyMin, eyMax] = partirEje(cfg.eje_y);
    // Las manchas van todas debajo de todos los puntos: si cada elemento
    // pinta su mancha justo antes de su punto, la mancha del siguiente
    // tapa el punto del anterior.
    const halos = datos.map(d => `<ellipse class="halo" cx="${px(d.x)}" cy="${py(d.y)}"
        rx="${Math.max((d.dx||0)/100*(W-L-R), 4)}"
        ry="${Math.max((d.dy||0)/100*(H-T-B), 4)}"></ellipse>`).join("");
    const pts = datos.map(d => {
      const x = px(d.x), y = py(d.y);
      // La etiqueta va a la derecha salvo en la banda derecha, donde se saldría.
      const der = d.x <= 72;
      return `<circle class="pt" cx="${x}" cy="${y}" r="10"></circle>
        <text class="rot" x="${x + (der?18:-18)}" y="${y+7}"
              text-anchor="${der?"start":"end"}">${esc(d.clave)}</text>`;
    }).join("");
    return `<svg class="mapa" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="Mapa de posicionamiento en dos ejes">
      <defs><clipPath id="cp-mapa"><rect x="${L}" y="${T}"
        width="${W-L-R}" height="${H-T-B}"></rect></clipPath></defs>
      <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" class="rejilla"></rect>
      <line class="eje" x1="${px(50)}" y1="${T}" x2="${px(50)}" y2="${H-B}"></line>
      <line class="eje" x1="${L}" y1="${py(50)}" x2="${W-R}" y2="${py(50)}"></line>
      <g clip-path="url(#cp-mapa)">${halos}</g>
      ${pts}
      <text class="ejetxt" x="${L}" y="${H-26}">← ${esc(exMin)}</text>
      <text class="ejetxt" x="${W-R}" y="${H-26}" text-anchor="end">${esc(exMax)} →</text>
      <text class="ejetxt" x="${L-14}" y="${T+14}" text-anchor="end"
            transform="rotate(-90 ${L-14} ${T+14})">${esc(eyMax)} ↑</text>
      <text class="ejetxt" x="${L-14}" y="${H-B}" text-anchor="start"
            transform="rotate(-90 ${L-14} ${H-B})">↓ ${esc(eyMin)}</text>
    </svg>`;
  };

  // Matriz de robustez. Escala divergente, no secuencial: 1 perjudica,
  // 3 es neutro y 5 es valioso, así que hay dos polos y un cero, y el
  // número va escrito en cada casilla para no depender del color.
  const matrizRobustez = (datos, cfg) => {
    const min = cfg.min ?? 1, max = cfg.max ?? 5, medio = (min + max) / 2;
    const filas = cfg.filas && cfg.filas.length ? cfg.filas
      : [...new Set(datos.map(d=>d.fila))];
    const cols = cfg.columnas && cfg.columnas.length ? cfg.columnas
      : [...new Set(datos.map(d=>d.columna))];
    const mapa = {}; datos.forEach(d => mapa[d.fila + "\u0000" + d.columna] = d);
    const paso = v => { const d = (v - medio) / ((max - min) / 2 || 1);
      return d <= -0.6 ? "c-nn" : d <= -0.2 ? "c-n" : d < 0.2 ? "c-0" : d < 0.6 ? "c-p" : "c-pp"; };
    return `<table class="matriz"><thead><tr><th></th>${cols.map(c=>
        `<th style="text-align:center">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${filas.map(f=>`<tr><td class="et">${esc(f)}</td>${cols.map(c=>{
        const d = mapa[f + "\u0000" + c];
        return d ? `<td class="${paso(d.media)}">${esc(num(d.media))}</td>`
                 : `<td class="c-0">·</td>`;
      }).join("")}</tr>`).join("")}</tbody></table>
      <div class="leyenda"><span><i class="c-nn"></i>${min} perjudicial</span>
        <span><i class="c-0"></i>${Math.round(medio)} neutra</span>
        <span><i class="c-pp"></i>${max} muy valiosa</span></div>`;
  };

  // Nube: el tamaño lleva el recuento, pero el recuento va también escrito.
  // Una nube sin cifras es un adorno; con ellas, al menos, se puede leer.
  const nubePalabras = datos => {
    const max = Math.max(...datos.map(d=>d.n), 1);
    return `<div class="nube">${datos.slice(0,28).map(d=>{
      const t = 24 + Math.round(Math.sqrt(d.n/max) * 46);
      return `<span style="font-size:${t}px;font-weight:${d.n/max>.55?650:500}">${
        esc(d.clave)}<i>${d.n}</i></span>`;}).join("")}</div>`;
  };

  // Clasificación: una barra por elemento, partida en las categorías, con
  // 2px de hueco entre tramos para que se distingan sin depender del tono.
  const barrasClasif = (datos, cfg) => {
    const cats = cfg.categorias && cfg.categorias.length ? cfg.categorias
      : [...new Set(datos.map(d=>d.categoria))];
    const tono = i => ["var(--cat-1)","var(--cat-2)","var(--cat-3)"][i % 3];
    const els = cfg.elementos && cfg.elementos.length ? cfg.elementos
      : [...new Set(datos.map(d=>d.clave))];
    const de = {}; datos.forEach(d => (de[d.clave] = de[d.clave] || {})[d.categoria] = d.n);
    return `<div style="margin-top:20px">${els.map(e=>{
      const fila = de[e] || {}, tot = Object.values(fila).reduce((a,b)=>a+b,0) || 1;
      return `<div style="margin-bottom:15px">
        <div class="enun" style="margin:0;border:0;padding:0 0 6px">${esc(e)}</div>
        <div style="display:flex;gap:2px;height:26px">${cats.map((c,i)=>{
          const n = fila[c] || 0; if(!n) return "";
          return `<div title="${esc(c)}" style="width:${n/tot*100}%;background:${tono(i)};
            border-radius:3px;color:#fff;font-size:14px;font-weight:600;
            display:flex;align-items:center;justify-content:center">${
              n/tot > .12 ? n : ""}</div>`;}).join("")}</div></div>`;}).join("")}
      <div class="leyenda">${cats.map((c,i)=>
        `<span><i style="background:${tono(i)}"></i>${esc(c)}</span>`).join("")}</div>`;
  };

  const pinta = async () => {
    const n = await API.sesionPublica(codigo).catch(()=>null);
    if(!n){ app().innerHTML = `<div class="proy"><h1>Sesión no encontrada</h1></div>`; return; }
    const va = n.vista_activa || "espera";
    let cuerpo = "";

    if(!va.startsWith("q:")){
      const prog = await API.progreso(codigo).catch(()=>null);
      cuerpo = `<h1>Entra desde tu móvil</h1>
        <div style="display:flex;gap:40px;flex-wrap:wrap;align-items:center">
          <div><div class="small">Código</div><div class="codigo">${esc(codigo.toUpperCase())}</div>
            <p style="margin-top:14px;font-size:18px">${esc(location.host + location.pathname)}</p></div>
          <div class="qr" id="qr"></div></div>
        ${prog ? `<div class="contador" style="margin-top:26px"><b>${prog.completos}</b>
          <span style="font-size:20px">han terminado</span></div>` : ""}
        <p class="small" style="margin-top:20px">Tus respuestas son anónimas. No se registra tu nombre
          ni tu correo.</p>`;
    } else {
      const id = va.slice(2);
      const ps = await API.preguntasPublicas(codigo).catch(()=>[]);
      const p = (ps || []).find(x => x.id === id);
      if(p && p.tipo === "tarjetas"){
        const rt = await API.resultadosTarjetas(codigo, id).catch(()=>null);
        const cab = `<div class="small">${esc(p.codigo||"")}</div><h1>${esc(p.titulo)}</h1>`;
        if(!rt || rt.existe === false) cuerpo = `<h1>Preparando…</h1>`;
        else if(rt.grupos && rt.grupos.length)
          cuerpo = cab + barras(rt.grupos, d=>d.etiqueta + " ("+d.tarjetas+")", d=>d.votos)
            + `<p class="small" style="margin-top:18px">Votos de ${rt.n_votantes} personas ·
                 entre paréntesis, cuántas aportaciones agrupa cada tema</p>`;
        else if(rt.tarjetas && rt.tarjetas.length)
          // Las tarjetas sueltas sí se proyectan: son material de
          // conversación, no una media que ancle a nadie.
          cuerpo = cab + `<div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:10px">${
            rt.tarjetas.slice(0,40).map(t=>
              `<div class="enun" style="flex:1 1 300px;margin:0">${esc(t.texto)}</div>`).join("")}</div>
            <p class="small" style="margin-top:18px">${rt.n_tarjetas} aportaciones</p>`;
        else
          cuerpo = cab + `<div class="contador" style="margin-top:30px"><b>${rt.n_tarjetas}</b>
            <span style="font-size:20px">${rt.n_tarjetas===1?"aportación recibida":"aportaciones recibidas"}</span></div>
            <p class="small" style="margin-top:18px">Escribe en tu móvil. Lo aportado se mostrará
              cuando cerremos la recogida.</p>`;
        app().innerHTML = `<div class="proy">${cuerpo}</div>`;
        return;
      }
      const r = await API.resultadosPregunta(codigo, id).catch(()=>null);
      if(!p || !r || r.existe === false){
        cuerpo = `<h1>Preparando…</h1>`;
      } else {
        const cfg = p.config || {};
        const cab = `<div class="small">${esc(p.codigo||"")}</div><h1>${esc(p.titulo)}</h1>`;
        if(r.datos){
          if(p.tipo === "unica" || p.tipo === "multiple")
            cuerpo = cab + barras(r.datos, d=>d.clave, d=>d.n)
              + `<p class="small" style="margin-top:18px">Número de respuestas por opción · ${r.respondidos} personas</p>`;
          else if(p.tipo === "escala")
            cuerpo = cab + `<div class="contador" style="margin-top:30px"><b>${r.datos.media}</b>
              <span style="font-size:20px">de media · mediana ${r.datos.mediana}</span></div>
              <div style="display:flex;justify-content:space-between;gap:10px;margin-top:16px">
                <span class="small">${esc(cfg.ancla_min||"")}</span>
                <span class="small" style="text-align:right">${esc(cfg.ancla_max||"")}</span></div>
              <p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
          else if(p.tipo === "matriz_escala" || p.tipo === "puntos100")
            cuerpo = cab + barras(r.datos, d=>d.clave, d=>d.media)
              + `<p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
          else if(p.tipo === "nube")
            cuerpo = cab + nubePalabras(r.datos)
              + `<p class="small" style="margin-top:22px">${r.respondidos} personas ·
                   junto a cada término, cuántas lo han escrito</p>`;
          else if(p.tipo === "ranking"){
            const n = r.datos.length;
            cuerpo = cab + barrasV(r.datos, d=>d.clave,
                d => n + 1 - d.posicion, d => num(d.posicion, 2))
              + `<p class="small" style="margin-top:18px">Posición media de ${r.respondidos}
                   ordenaciones · 1 es lo más prioritario · la lista se presentó
                   barajada a cada persona</p>`;
          }
          else if(p.tipo === "secuencia")
            cuerpo = cab + `<div style="margin-top:22px">${r.datos.map((d,i)=>`
              <div class="enun" style="display:flex;gap:18px;align-items:baseline">
                <b style="font-size:30px;min-width:44px">${i+1}</b>
                <span style="flex:1">${esc(d.clave)}</span>
                <span class="small">posición media ${esc(num(d.posicion, 2))}</span></div>`).join("")}</div>
              <p class="small" style="margin-top:18px">${r.respondidos} secuencias</p>`;
          else if(p.tipo === "dos_ejes")
            cuerpo = cab + mapaEjes(r.datos, cfg)
              + `<p class="small" style="margin-top:10px">${r.respondidos} personas ·
                   el punto es la posición media y la mancha, lo que discrepan:
                   cuanto más grande, menos acuerdo sobre dónde va</p>`;
          else if(p.tipo === "matriz_valoracion")
            cuerpo = cab + matrizRobustez(r.datos, cfg)
              + `<p class="small" style="margin-top:16px">Valoración media de
                   ${r.respondidos} personas</p>`;
          else if(p.tipo === "clasificar")
            cuerpo = cab + barrasClasif(r.datos, cfg)
              + `<p class="small" style="margin-top:16px">${r.respondidos} respuestas</p>`;
          else
            cuerpo = cab + `<div style="margin-top:22px">${(r.datos||[]).slice(0,12).map(v=>
              `<div class="enun">${esc(v.texto || Object.values(v.campos||{}).join(" · "))}</div>`).join("")}</div>
              <p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
        } else {
          // Abierta: enunciado, opciones si las tiene, y cuánta gente lleva.
          const ops = cfg.opciones || cfg.elementos || cfg.filas
            || (Array.isArray(cfg.items) ? cfg.items : null);
          cuerpo = cab
            + (ops ? `<div style="margin-top:20px">${ops.map(o=>
                `<div class="enun">${esc(o)}</div>`).join("")}</div>` : "")
            + `<div class="contador" style="margin-top:24px"><b>${r.respondidos}</b>
                <span style="font-size:20px">${r.respondidos===1 ? "persona ha respondido"
                                                                 : "personas han respondido"}</span></div>`
            + (r.estado === "terminada" && r.respondidos < r.minimo
                ? `<p class="small" style="margin-top:14px">Con menos de ${r.minimo} respuestas no se
                     muestra el resultado: sería la respuesta de una persona concreta.</p>` : "");
        }
      }
    }
    app().innerHTML = `<div class="proy">${cuerpo}</div>`;
    if(!va.startsWith("q:")) pintarQR("qr", url, 8);
  };

  await pinta();
  // Mismo mando invisible que en cultura: la sala no ve tus controles.
  //   →  terminar la abierta y abrir la siguiente     ←  volver a la anterior
  //   Inicio  proyectar el código y el QR
  const mandar = async fn => {
    try{
      const ses = await API.sesiones();
      const s2 = ses.find(x => x.codigo.toUpperCase() === codigo.toUpperCase());
      if(!s2) return;
      const ps = await API.preguntas(s2.id);
      await fn(s2, ps);
      pinta();
    }catch(e){ /* sin sesión iniciada no se puede: es lo correcto */ }
  };
  window.addEventListener("keydown", ev => {
    if(ev.key === "ArrowRight" || ev.key === " "){ ev.preventDefault(); mandar(async (s2, ps) => {
      const ab = ps.find(p=>p.estado === "abierta");
      if(ab) await API.actualizarPregunta(ab.id, {estado:"terminada"});
      const i = ab ? ps.findIndex(p=>p.id===ab.id) : -1;
      const sig = ps.slice(i+1).find(p=>p.estado === "cerrada");
      if(sig) await API.actualizarPregunta(sig.id, {estado:"abierta"});
      const foco = sig || ab;
      if(foco) await API.actualizarSesion(s2.id, {vista_activa:"q:"+foco.id});
    }); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault(); mandar(async (s2, ps) => {
      const act = (s2.vista_activa||"").startsWith("q:") ? s2.vista_activa.slice(2) : null;
      const i = ps.findIndex(p=>p.id===act);
      const ant = i > 0 ? ps[i-1] : null;
      if(ant) await API.actualizarSesion(s2.id, {vista_activa:"q:"+ant.id});
    }); }
    else if(ev.key === "Home"){ mandar(async s2 =>
      await API.actualizarSesion(s2.id, {vista_activa:"espera"})); }
  });

  timer = setInterval(pinta, 3000);
  window.addEventListener("beforeunload", ()=>clearInterval(timer));
}

/* ═══════════════════════════════════════════════════════════════════
   6 bis · CONSTRUCTOR DE SESIÓN (motor de preguntas)

   Aquí compones la sesión: resuelves las variables del banco y eliges
   qué preguntas entran. Las 60 del banco se pueden añadir. La mitad son
   «derivadas»: entran con las listas vacías y se rellenan en directo con
   lo que produzca el grupo, y hasta entonces la consola las marca en rojo.
   ═══════════════════════════════════════════════════════════════════ */
/* Agregación en modo demostración. En modo real la hace `resultados_pregunta`
   dentro de la base de datos, que es donde debe estar. Esto solo existe para
   poder recorrer el circuito entero sin conexión. */
function agregarDemo(p, items){
  const cuenta = arr => { const m = {}; arr.forEach(k=>m[k]=(m[k]||0)+1);
    return Object.keys(m).map(k=>({clave:k, n:m[k]})).sort((a,b)=>b.n-a.n); };
  const medias = clave => { const acc = {};
    items.forEach(i => Object.entries(i.valor[clave]||{}).forEach(([k,v])=>{
      (acc[k] = acc[k] || []).push(Number(v)); }));
    return Object.keys(acc).map(k=>({clave:k,
      media: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*10)/10})); };
  if(p.tipo === "unica")    return cuenta(items.map(i=>i.valor.opcion));
  if(p.tipo === "multiple") return cuenta(items.flatMap(i=>i.valor.opciones||[]));
  if(p.tipo === "escala"){
    const ns = items.map(i=>Number(i.valor.n)).sort((a,b)=>a-b);
    return {media: Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*100)/100,
            mediana: ns[Math.floor(ns.length/2)],
            reparto: cuenta(ns.map(String)).reduce((o,x)=>(o[x.clave]=x.n,o),{})};
  }
  if(p.tipo === "matriz_escala") return medias("items").sort((a,b)=>a.clave.localeCompare(b.clave));
  if(p.tipo === "puntos100")     return medias("reparto").sort((a,b)=>b.media-a.media);
  if(p.tipo === "nube")
    return cuenta(items.flatMap(i=>(i.valor.terminos||[]).map(t=>String(t).trim().toLowerCase())));
  if(p.tipo === "ranking" || p.tipo === "secuencia"){
    const acc = {};
    items.forEach(i => (i.valor.orden||[]).forEach((k,ix)=>{ (acc[k]=acc[k]||[]).push(ix+1); }));
    return Object.keys(acc).map(k=>({clave:k, n:acc[k].length,
      posicion: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*100)/100}))
      .sort((a,b)=>a.posicion-b.posicion);
  }
  if(p.tipo === "dos_ejes"){
    const acc = {};
    items.forEach(i => Object.entries(i.valor.pos||{}).forEach(([k,v])=>{
      (acc[k]=acc[k]||[]).push(v); }));
    const med = a => a.reduce((x,y)=>x+y,0)/a.length;
    const desv = a => a.length<2 ? 0 : Math.sqrt(a.reduce((s,v)=>s+(v-med(a))**2,0)/(a.length-1));
    return Object.keys(acc).sort().map(k=>{
      const xs = acc[k].map(v=>Number(v.x)), ys = acc[k].map(v=>Number(v.y));
      const r3 = v => Math.round(v*1000)/1000;
      return {clave:k, x:r3(med(xs)), y:r3(med(ys)), dx:r3(desv(xs)), dy:r3(desv(ys)), n:acc[k].length};
    });
  }
  if(p.tipo === "matriz_valoracion"){
    const acc = {};
    items.forEach(i => Object.entries(i.valor.celdas||{}).forEach(([f,cols])=>
      Object.entries(cols||{}).forEach(([c,v])=>{ (acc[f+"\u0000"+c]=acc[f+"\u0000"+c]||[]).push(Number(v)); })));
    return Object.keys(acc).sort().map(k=>{ const [f,c] = k.split("\u0000");
      return {fila:f, columna:c, n:acc[k].length,
        media: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*100)/100}; });
  }
  if(p.tipo === "clasificar"){
    const acc = {};
    items.forEach(i => Object.entries(i.valor.asignacion||{}).forEach(([k,c])=>{
      acc[k+"\u0000"+c] = (acc[k+"\u0000"+c]||0)+1; }));
    return Object.keys(acc).sort().map(k=>{ const [clave,categoria] = k.split("\u0000");
      return {clave, categoria, n:acc[k]}; });
  }
  return items.map(i=>i.valor);
}

// «TEMA FOCAL» lleva un espacio, y un id con espacio rompe querySelector.

const idVar = clave => "v-" + String(clave).replace(/[^A-Za-z0-9]/g, "_");

// Fisher-Yates. Se usa para que cada móvil reciba las listas ordenables en
// un orden distinto.
function barajar(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// «Baja incertidumbre → alta incertidumbre» son dos anclas escritas en una
// sola línea. Se parten por la flecha, o por el guion, o no se parten.
function partirEje(txt){
  const t = String(txt || "").trim();
  if(!t) return ["", ""];
  const p = t.split(/\s*(?:→|->|–|—|\|)\s*/);
  return p.length >= 2 ? [p[0], p.slice(1).join(" ")] : ["", t];
}

    });
    app().querySelectorAll("[data-proy]").forEach(b => b.onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+b.dataset.proy})); pinta(); });

    // El gesto de conducir: cierro la que está abierta y abro la siguiente.
    if(bt("avanzar")) bt("avanzar").onclick = async () => {
      const abierta = preguntas.find(p=>p.estado === "abierta");
      if(abierta) await API.actualizarPregunta(abierta.id, {estado:"terminada"});
      const i = abierta ? preguntas.findIndex(p=>p.id===abierta.id) : -1;
      const sig = preguntas.slice(i+1).find(p=>p.estado === "cerrada");
      if(sig) await API.actualizarPregunta(sig.id, {estado:"abierta"});
      const foco = sig || abierta;
      if(foco) Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+foco.id}));
      preguntas = await API.preguntas(s.id); pinta();
    };

    $("#gv").onclick = async () => {
      const nv = {}; VARIABLES_ESC.forEach(v=>{
        const el = $("#" + idVar(v.clave)); const x = el ? el.value.trim() : "";
        if(x) nv[v.clave] = x; });
      Object.assign(s, await API.actualizarSesion(s.id, {variables:nv}));
      Object.keys(vars).forEach(k=>delete vars[k]); Object.assign(vars, nv);
      pinta();
    };
    $("#nucleo").onclick = () => añadir(BANCO_ESC.filter(p=>p.nuc && TIPOS_LISTOS.includes(p.t)));
    $("#bench").onclick  = () => añadir(BANCO_ESC.filter(p=>p.bench));
    app().querySelectorAll("[data-add]").forEach(b => b.onclick = () =>
      añadir([BANCO_ESC.find(p=>p.c===b.dataset.add)]));
    app().querySelectorAll("[data-quita]").forEach(b => b.onclick = async () => {
      await API.borrarPregunta(b.dataset.quita);
      preguntas = await API.preguntas(s.id); pinta(); });
    const mover = async (id, delta) => {
      const i = preguntas.findIndex(p=>p.id===id), j = i + delta;
      if(j < 0 || j >= preguntas.length) return;
      // Los dos valores se capturan ANTES de tocar nada. Leerlos del array
      // entre las dos escrituras deja las dos filas con el mismo orden si el
      // backend devuelve el mismo objeto que ya tenías.
      const [idA, ordA] = [preguntas[i].id, preguntas[i].orden];
      const [idB, ordB] = [preguntas[j].id, preguntas[j].orden];
      await API.actualizarPregunta(idA, {orden: ordB});
      await API.actualizarPregunta(idB, {orden: ordA});
      preguntas = await API.preguntas(s.id); pinta();
    };
    app().querySelectorAll("[data-sube]").forEach(b => b.onclick = () => mover(b.dataset.sube, -1));
    app().querySelectorAll("[data-baja]").forEach(b => b.onclick = () => mover(b.dataset.baja, +1));
  };

  // Resuelve las variables también dentro de la configuración: los ítems de
  // una matriz de escalas llevan [ORGANIZACION] igual que el enunciado.
  const resolverCfg = cfg => JSON.parse(resolverTexto(JSON.stringify(cfg||{}), vars));

  const añadir = async lista => {
    const ya = new Set(preguntas.map(p=>p.codigo));
    const nuevas = lista.filter(p => p && !ya.has(p.c) && TIPOS_LISTOS.includes(p.t));
    if(!nuevas.length) return;
    let orden = preguntas.length ? Math.max(...preguntas.map(p=>p.orden)) : 0;
    await API.crearPreguntas(nuevas.map(p => ({
      sesion_id: s.id, orden: ++orden, codigo: p.c, tipo: p.t,
      titulo: resolverTexto(p.q, vars),
      ayuda: p.ayuda ? resolverTexto(p.ayuda, vars) : null,
      config: resolverCfg(p.cfg), estado: "cerrada"
    })));
    preguntas = await API.preguntas(s.id);
    pinta();
  };

  await pinta();
}

/* ═══════════════════════════════════════════════════════════════════
   7 · ADMINISTRADOR
   ═══════════════════════════════════════════════════════════════════ */
async function vistaAdmin(){
  // Si venimos del enlace del correo, Supabase tarda unas décimas en canjear el
  // token de la URL. Sin esta espera, la primera comprobación decía «no hay
  // usuario» y te devolvía a la pantalla de acceso justo después de haber entrado.
  if(vueltaDeCorreo() && !API.demo()){
    const fallo = (location.hash.match(/error_description=([^&]*)/) || [])[1];
    if(fallo){
      history.replaceState(null, "", location.pathname + "#/admin");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>Ese enlace ya no vale</h1>
        <p>${esc(decodeURIComponent(fallo.replace(/\+/g," ")))}</p>
        <p class="small">Los enlaces caducan y son de un solo uso. Pide otro, o entra con tu contraseña.</p>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h1>Entrando…</h1><p>Un momento, estamos canjeando el enlace.</p></div></div>`;
    const urlOriginal = location.hash + location.search;
    let dentro = null;
    for(let i = 0; i < 30 && !dentro; i++){
      dentro = await API.usuario();
      if(!dentro) await new Promise(r => setTimeout(r, 200));
    }
    history.replaceState(null, "", location.pathname + "#/admin");
    if(!dentro){
      // No callarse. Si el canje falla, decir por qué en vez de devolver al
      // formulario como si el usuario hubiera hecho algo mal.
      let detalle = "";
      try{
        const { data, error } = await sb.auth.getSession();
        detalle = error ? error.message : (data && data.session ? "hay sesión pero sin usuario" : "el navegador no ha guardado ninguna sesión");
      }catch(e){ detalle = String(e && e.message || e); }
      const traza = urlOriginal.replace(/(access_token|refresh_token|code)=[^&]*/g, "$1=…");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>El enlace no ha llegado a abrir sesión</h1>
        <p>El enlace era válido, pero el navegador no ha conseguido canjearlo.</p>
        <div class="aviso rojo"><b>Motivo:</b> ${esc(detalle)}</div>
        <p class="small">Causas habituales: has abierto el enlace en un navegador
          <b>distinto</b> del que lo pidió, o en una ventana de incógnito, o el
          filtro antivirus de tu correo abrió el enlace antes que tú y lo gastó
          (son de un solo uso).</p>
        <p class="small">Ábrelo en el mismo navegador donde lo pediste. Si se repite,
          usa la contraseña.</p>
        <details><summary class="small">Detalle técnico</summary>
          <p class="small"><code>${esc(traza.slice(0,300))}</code></p></details>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
  }
  const u = await API.usuario();
  if(!u) return vistaLogin();
  const m = location.hash.match(/^#\/admin\/sesion\/(.+)$/);
  if(m) return consolaSesion(m[1]);
  if(location.hash.startsWith("#/admin/sesiones"))  return panelAdmin(u);
  if(location.hash.startsWith("#/admin/proyectos")) return panelProyectos(u);
  return hubPrivado(u);
}

// mira en la consola antes de abrir: una derivada sin rellenar llega al
// móvil como una pantalla en blanco con un botón de enviar.
function faltaContenido(p){
  const cfg = p.config || {};
  const vacias = (LISTAS_TIPO[p.tipo] || [])
    .filter(sl => !Array.isArray(cfg[sl.k]) || !cfg[sl.k].length)
    .map(sl => sl.t.toLowerCase());
  return vacias.join(" y ");
}

function resolverTexto(txt, vars){
  return String(txt||"").replace(/\[([A-ZÑ ]+)\]/g, (m, k) =>
    (vars && vars[k]) ? vars[k] : m);
}

/* Traduce los errores de Supabase, que vienen en inglés y en jerga.
   Delante de un cliente, «Invalid login credentials» no ayuda a nadie. */
function mensajeAuth(e){
  const t = String((e && (e.message || e.error_description)) || e || "");
  if(/invalid login credentials/i.test(t))
    return "Correo o contraseña incorrectos.";
  if(/email.*rate limit|over_email_send_rate_limit|too many requests/i.test(t))
    return "Has agotado los envíos de correo de esta hora. Entra con la contraseña; "
         + "si aún no la has fijado, tendrás que esperar.";
  if(/signups not allowed|signup.*disabled|user not found/i.test(t))
    return "Ese correo no tiene cuenta aquí. El registro está cerrado a propósito.";
  if(/password should be at least|weak.?password/i.test(t))
    return "Contraseña demasiado corta o demasiado débil.";
  if(/same.*password|different from the old/i.test(t))
    return "Esa es la contraseña que ya tenías.";
  if(/email not confirmed/i.test(t))
    return "Ese correo aún no está confirmado.";
  return t || "No se ha podido completar la operación.";
}

      <div class="btnrow"><button class="btn" type="submit">Entrar</button>
        ${API.demo() ? "" : `<button class="btn ghost" type="button" id="enlace">Enviarme un enlace</button>`}

    <div id="msg"></div></div></div>`;

  const aviso = (html, rojo) =>
    $("#msg").innerHTML = `<div class="aviso${rojo?" rojo":""}">${html}</div>`;

  $("#lf").onsubmit = async ev => {
    ev.preventDefault();
    const email = $("#em").value.trim();

      if(!localStorage.getItem("clave-fijada"))

          + "ninguna funcionará: usa <b>Enviarme un enlace</b>.");
      await API.loginClave(email, clave);

    }catch(e){ aviso(esc(mensajeAuth(e)), true); }
  };
}

function generarCodigo(titulo){
  const base = (titulo||"CULT").normalize("NFD").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,4) || "CULT";
  return base.padEnd(4,"X") + "-" + String(Math.floor(1000+Math.random()*9000));
}

  const ids = [...SEL];

      colectivo:f.colectivo, n:f.n_envios, vals:{}}).vals[f.vector] =

    <p class="small">Los radares comparten escala 0–${max}, así que se pueden comparar entre sí.</p>
    <div class="multi">${claves.map((k,i)=>`
      <div class="mini"><h4>${esc(porSesion[k].etiqueta)}</h4>

  claves.forEach((k,i)=>{
    const vals = {}; ORDEN.forEach(v=> vals[v] = porSesion[k].vals[v] || {actual:0,deseada:0});
    radarSVG(document.getElementById("cs-"+i), document.getElementById("cb-"+i), vals, max, true);

/* ═══════════════════════════════════════════════════════════════════
   COPIA Y BORRADO DE UNA SESIÓN

   Borrar es la única operación de este sistema que no se puede deshacer
   desde ningún sitio: se lleva por delante los envíos, las respuestas,
   las preguntas y las tarjetas. Por eso el botón no está en la lista sin
   más, sino detrás de una pantalla que obliga a bajarse los datos antes.
   ═══════════════════════════════════════════════════════════════════ */
const aCSV = filas => {
  const cols = [...new Set(filas.flatMap(f => Object.keys(f)))];
  return [cols.join(","), ...filas.map(r => cols.map(c => {
    const v = r[c] == null ? "" : (typeof r[c] === "object" ? JSON.stringify(r[c]) : String(r[c]));
    return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(","))].join("\n");
};

const bajarArchivo = (nombre, texto) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+texto], {type:"text/csv;charset=utf-8"}));
  a.download = nombre; a.click(); URL.revokeObjectURL(a.href);
};

// La marca de «ya me lo he descargado» vive en este navegador. Es una
// barandilla contra el descuido, no una cerradura: desde el panel de
// Supabase se puede borrar sin pasar por aquí.
const claveCopia = id => "copia-sesion:" + id;
const copiaHecha = id => localStorage.getItem(claveCopia(id));

// Los datos de una sesión, sea del instrumento que sea. Devuelve los tres
// bloques por separado porque son tres tablas distintas y mezclarlas en un
// solo CSV daría un archivo que no se puede leer con nada.
async function datosDeSesion(s){
  const esCultura = String(s.instrumento||"").split("-")[0] === "cultura";
  // Si una de las consultas falla, NO se puede decir «no hay datos»: un
  // error de red o una vista que falta darían cero filas, y el borrado se
  // abriría de par en par sobre datos que sí existen. Se devuelve el fallo
  // y la pantalla se bloquea.
  try{
    const [detalle, items, tarjetas] = await Promise.all([
      esCultura ? API.detalleSesiones([s.id]) : Promise.resolve([]),
      esCultura ? Promise.resolve([]) : API.detalleItems([s.id]),
      esCultura ? Promise.resolve([]) : API.detalleTarjetas([s.id])
    ]);
    return {detalle, items, tarjetas, fallo:null,
            total: detalle.length + items.length + tarjetas.length};
  }catch(e){
    return {detalle:[], items:[], tarjetas:[], total:0,
            fallo: String(e && e.message || e)};
  }
}

function descargarSesionCompleta(s, d){
  const base = (s.codigo || "sesion") + "-" + (new Date().toISOString().slice(0,10));
  if(d.detalle.length) bajarArchivo(base + "-respuestas.csv", aCSV(d.detalle));
  if(d.items.length)   bajarArchivo(base + "-respuestas.csv", aCSV(d.items));
  if(d.tarjetas.length)bajarArchivo(base + "-tarjetas.csv",   aCSV(d.tarjetas));
  localStorage.setItem(claveCopia(s.id), new Date().toISOString());
}

async function pantallaBorrado(s, volver){
  const d = await datosDeSesion(s);
  const envios = new Set([...d.detalle, ...d.items].map(r=>r.envio_id).filter(Boolean)).size;

  const pinta = () => {
    const copia = copiaHecha(s.id);
    const puede = !d.fallo && (d.total === 0 || !!copia);
    app().innerHTML = `<div class="wrap">${cabecera(
      `<button class="iconbtn" id="atras">Volver</button>`)}
      <div class="card">
        <span class="phasetag">Eliminar sesión</span>
        <h1 style="margin:6px 0 0">${esc(s.titulo)}</h1>
        <p class="small"><code>${esc(s.codigo)}</code> ·
          ${esc((s.organizacion||{}).nombre||"")} · ${esc(s.estado)}</p>

        <h3>Qué se va a borrar</h3>
        ${d.fallo ? `<div class="aviso rojo"><b>No se ha podido leer lo que hay dentro
            de esta sesión</b>, así que no se puede borrar: cero filas leídas no significa
            cero datos guardados.<br><code>${esc(d.fallo)}</code><br>
            Si el mensaje habla de una vista que no existe, falta por ejecutar el guion
            <code>esquema-app-v8.sql</code> en Supabase.</div>`
          : d.total === 0
          ? `<p class="lead">Esta sesión <b>no tiene ninguna respuesta</b>. Solo se borra
               ella y sus preguntas: no hay datos que perder.</p>`
          : `<div class="lista"><div class="it"><div><b>${envios}</b>
                <div class="small">personas han contestado algo</div></div></div>
              ${d.detalle.length ? `<div class="it"><div><b>${d.detalle.length}</b>
                <div class="small">filas de respuesta</div></div></div>` : ""}
              ${d.items.length ? `<div class="it"><div><b>${d.items.length}</b>
                <div class="small">respuestas a preguntas del motor</div></div></div>` : ""}
              ${d.tarjetas.length ? `<div class="it"><div><b>${d.tarjetas.length}</b>
                <div class="small">tarjetas escritas por el grupo</div></div></div>` : ""}
             </div>
             <p class="note">Se borran también las preguntas de la sesión, los grupos y los
               votos. <b>No hay papelera</b>: ni en la aplicación ni en la base de datos.
               Lo único que quedará de esta sesión es el CSV que te bajes ahora.</p>`}

        ${d.total && !d.fallo ? `<h3>Primero, la copia</h3>
          <div class="btnrow" style="margin-top:0">
            <button class="btn ${copia?"ghost":""}" id="baja">${
              copia ? "Volver a descargar" : "Descargar CSV"}</button></div>
          ${copia ? `<div class="aviso">Copia descargada el ${
              new Date(copia).toLocaleString("es-ES")}. Ábrela y compruébala antes de
              seguir: una vez borres, es lo único que queda.</div>`
            : `<div class="aviso rojo">Hasta que no descargues la copia, el botón de
                eliminar no se activa.</div>`}` : ""}

        <h3>Confirmar</h3>
        <div class="field"><label for="cod">Escribe el código de la sesión
          (<code>${esc(s.codigo)}</code>) para confirmar</label>
          <input id="cod" autocomplete="off" placeholder="${esc(s.codigo)}"></div>
        <div id="aviso"></div>
        <div class="btnrow">
          <button class="btn" id="borrar" disabled style="background:#d03b3b">
            Eliminar definitivamente</button>
          <button class="btn ghost" id="cancelar">Cancelar</button></div>
        ${puede || d.fallo ? "" : `<p class="small">Descarga la copia para poder continuar.</p>`}
      </div></div>`;

    $("#atras").onclick = $("#cancelar").onclick = volver;
    if($("#baja")) $("#baja").onclick = () => { descargarSesionCompleta(s, d); pinta(); };

    const revisar = () => { $("#borrar").disabled =
      !(puede && $("#cod").value.trim().toUpperCase() === String(s.codigo).toUpperCase()); };
    $("#cod").oninput = revisar; revisar();

    $("#borrar").onclick = async () => {
      $("#borrar").disabled = true; $("#borrar").textContent = "Eliminando…";
      try{ await API.borrarSesion(s.id); }
      catch(e){ $("#aviso").innerHTML = `<div class="aviso rojo">${esc(e.message||e)}</div>`;
        $("#borrar").textContent = "Eliminar definitivamente"; revisar(); return; }
      localStorage.removeItem(claveCopia(s.id));
      volver();
    };
  };
  pinta();
}

async function descargarSeleccion(tipo){
  const ids = [...SEL];
  const filas = tipo === "detalle" ? await API.detalleSesiones(ids) : await API.resumenSesiones(ids);
  if(!filas.length){ alert("Las sesiones seleccionadas no tienen datos todavía."); return; }
  const cols = Object.keys(filas[0]).filter(c=>c!=="sesion_id" && c!=="organizacion_id");
  const csv = [cols.join(","), ...filas.map(r=>cols.map(c=>{
    const v = r[c]==null ? "" : String(r[c]);
    return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = `cultura-${tipo}-${ids.length}sesiones.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* Solo en modo demostración: rellena la sesión con un perfil sintético de
   organización pública consolidada —mucha Jerárquica, poca Innovadora— para
   poder ver funcionando la consola, la proyección y los radares. */
/* ═══════════════════════════════════════════════════════════════════
   RESPUESTAS DE ENSAYO DEL MOTOR

   Lo mismo que hace cultura con sus 24 envíos simulados, pero para los
   catorce tipos. Sirve para una cosa muy concreta: ver cómo queda cada
   proyección con datos dentro, antes de tenerlos delante de un cliente.

   En todo lo que es texto libre se escriben números en letra —uno, dos,
   tres…— y no frases inventadas. Un texto reconocible de un vistazo hace
   evidente qué es ensayo y qué no, y en la nube de palabras produce
   tamaños distintos, que es justo lo que hay que mirar.
   ═══════════════════════════════════════════════════════════════════ */
const NUMEROS = ["uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
  "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve",
  "veinte","veintiuno","veintidós","veintitrés","veinticuatro"];

async function respuestasEnsayoMotor(s, preguntas, n, avisar){
  let sem = 20260817;
  const rnd = () => (sem = (sem*1664525 + 1013904223) % 4294967296) / 4294967296;
  const entre = (a,b) => a + Math.floor(rnd()*(b-a+1));
  const elige = a => a[Math.floor(rnd()*a.length)];
  const revolver = a => { const c = a.slice();
    for(let i=c.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; }
    return c; };
  const lista = p => { const c = p.config||{};
    return c.elementos && c.elementos.length ? c.elementos
         : c.opciones  && c.opciones.length  ? c.opciones
         : Array.isArray(c.items) ? c.items : []; };

  // Un valor plausible para cada tipo. Devuelve null si a la pregunta le
  // falta el contenido: no se inventa lo que el grupo tendría que producir.
  const valorDe = (p, i) => {
    const c = p.config||{}, els = lista(p);
    const min = c.min ?? 1, max = c.max ?? (p.tipo === "matriz_valoracion" ? 5 : 7);
    switch(p.tipo){
      case "unica":    return els.length ? {opcion: els[Math.min(els.length-1,
                          Math.floor(Math.abs(rnd()+rnd()-1) * els.length))]} : null;
      case "multiple": return els.length ? {opciones: revolver(els)
                          .slice(0, Math.min(c.maximo || 2, els.length))} : null;
      case "escala":   return {n: Math.max(min, Math.min(max,
                          Math.round((min+max)/2 + (rnd()+rnd()-1)*2)))};
      case "matriz_escala": {
        if(!els.length) return null; const o = {};
        els.forEach((it,k) => o[it] = Math.max(min, Math.min(max,
          Math.round(min + ((k+1)/(els.length+1))*(max-min) + (rnd()-0.5)*2))));
        return {items:o};
      }
      case "puntos100": {
        if(!els.length) return null;
        const total = c.total || 100, paso = c.paso || 5, cuantos = Math.round(total/paso);
        const r = {}; els.forEach(o => r[o] = 0);
        for(let k=0;k<cuantos;k++) r[els[Math.min(els.length-1,
          Math.floor(Math.abs(rnd()+rnd()-1)*els.length))]] += paso;
        return {reparto:r};
      }
      case "abierta":  return {texto: "Respuesta de ensayo " + NUMEROS[i % NUMEROS.length]};
      case "abierta_campos": {
        const cs = c.campos || []; if(!cs.length) return null;
        const o = {}; cs.forEach((f,k) => o[f.clave] =
          "Ensayo " + NUMEROS[(i+k) % NUMEROS.length]);
        return {campos:o};
      }
      // La nube se carga con pocos términos y muy repetidos: así se ve la
      // diferencia de tamaño, que es lo que hay que comprobar.
      case "nube": {
        const pozo = NUMEROS.slice(0, 8), cuantos = Math.min(c.maximo || 3, 3), t = [];
        while(t.length < cuantos){
          const w = pozo[Math.min(pozo.length-1, Math.floor(Math.abs(rnd()+rnd()-1)*pozo.length))];
          if(!t.includes(w)) t.push(w);
        }
        return {terminos:t};
      }
      case "ranking": case "secuencia": {
        if(!els.length) return null;
        // Se parte del orden del banco y se intercambian vecinos: así la
        // posición media sale ordenada pero no idéntica en todos.
        const o = els.slice();
        for(let k=0;k<o.length-1;k++) if(rnd() < 0.35) [o[k],o[k+1]] = [o[k+1],o[k]];
        return {orden:o};
      }
      case "dos_ejes": {
        if(!els.length) return null; const pos = {};
        els.forEach((e,k) => {
          const cx = 18 + ((k*37) % 65), cy = 22 + ((k*53) % 60);
          const disp = k === 0 ? 18 : 7;          // uno con mucha discrepancia
          pos[e] = {x: Math.max(0, Math.min(100, Math.round(cx + (rnd()+rnd()-1)*disp))),
                    y: Math.max(0, Math.min(100, Math.round(cy + (rnd()+rnd()-1)*disp)))};
        });
        return {pos};
      }
      case "clasificar": {
        const cats = c.categorias || []; if(!els.length || !cats.length) return null;
        const a = {}; els.forEach((e,k) => a[e] = cats[Math.min(cats.length-1,
          Math.floor(Math.abs((k/els.length) + (rnd()-0.5)*0.6) * cats.length))]);
        return {asignacion:a};
      }
      case "matriz_valoracion": {
        const filas = (c.filas||[]).length ? c.filas : els, cols = c.columnas||[];
        if(!filas.length || !cols.length) return null;
        const celdas = {};
        filas.forEach((f,a) => { celdas[f] = {};
          // Las medias recorren toda la escala para que la matriz enseñe
          // sus cinco pasos: el rojo, el gris del medio y el azul.
          cols.forEach((co,bq) => celdas[f][co] = Math.max(min, Math.min(max,
            Math.round(min + ((a+bq) % (max-min+1)) + (rnd()-0.5)*1.4))));
        });
        return {celdas};
      }
      default: return null;
    }
  };

  const AMB = ["Dirección o gobierno","Gestión y administración","Actividad principal","Apoyo técnico"];
  const RES = ["Sí, dirijo un equipo","No dirijo equipo"];
  const ANT = ["Menos de 3 años","Entre 3 y 10 años","Más de 10 años"];

  const tarjeteras = preguntas.filter(p => p.tipo === "tarjetas");
  const normales   = preguntas.filter(p => p.tipo !== "tarjetas" && valorDe(p,0) !== null);
  const saltadas   = preguntas.filter(p => p.tipo !== "tarjetas" && valorDe(p,0) === null);

  // Para escribir hay que abrirlas. Se guarda el estado de cada una y al
  // final se dejan terminadas, que es como se proyectan los resultados.
  for(const p of [...normales, ...tarjeteras])
    await API.actualizarPregunta(p.id, p.tipo === "tarjetas"
      ? {estado:"abierta", fase:"recogida"} : {estado:"abierta"});

  const envios = [];
  for(let i=0;i<n;i++){
    avisar(`Participante ${i+1} de ${n}…`);
    const envio = await API.abrirEnvio(s.codigo,
      {ambito:elige(AMB), responsable:elige(RES), antiguedad:elige(ANT)});
    envios.push(envio);
    for(const p of normales){
      const v = valorDe(p, i);
      if(v) try{ await API.guardarItem(envio, p.id, v); }catch(e){}
    }
    for(const p of tarjeteras){
      const textos = [0,1].map(k => "Tema " + NUMEROS[(i+k*7) % 10]);
      try{ await API.guardarTarjetas(envio, p.id, textos); }catch(e){}
    }
  }

  // El ciclo entero de las tarjetas: agrupar y votar. Sin esto, la
  // proyección de una pregunta de tarjetas se queda en el recuento.
  for(const p of tarjeteras){
    avisar("Agrupando tarjetas…");
    await API.actualizarPregunta(p.id, {fase:"agrupando"});
    const tarjetas = await API.tarjetasAdmin(p.id);
    const nombres = [...new Set(tarjetas.map(t=>t.texto))].slice(0,4);
    const grupos = [];
    for(const [k, etiqueta] of nombres.entries())
      grupos.push(await API.crearGrupo(p.id, etiqueta, k+1));
    for(const t of tarjetas){
      const g = grupos.find(x => x.etiqueta === t.texto) || grupos[0];
      if(g) try{ await API.tocarTarjeta(t.id, {grupo_id:g.id}); }catch(e){}
    }
    await API.actualizarPregunta(p.id, {fase:"votacion"});
    for(const envio of envios){
      const cuantos = Math.min(grupos.length, entre(1, 3));
      const elegidos = revolver(grupos).slice(0, cuantos).map(g=>g.id);
      try{ await API.guardarVotos(envio, p.id, elegidos); }catch(e){}
    }
  }

  avisar("Cerrando…");
  for(const envio of envios) try{ await API.cerrarEnvio(envio); }catch(e){}
  for(const p of normales)   await API.actualizarPregunta(p.id, {estado:"terminada"});
  for(const p of tarjeteras) await API.actualizarPregunta(p.id,
    {estado:"terminada", fase:"resultados"});

  return {hechas: normales.length + tarjeteras.length, saltadas: saltadas.map(p=>p.codigo||p.titulo)};
}

async function respuestasDeEjemplo(codigo, n){
  const base = {CD:{FAM:28,INN:12,RES:20,JER:40}, LO:{FAM:24,INN:10,RES:22,JER:44},
                GP:{FAM:30,INN:14,RES:18,JER:38}, CO:{FAM:32,INN:12,RES:18,JER:38},
                EE:{FAM:22,INN:14,RES:22,JER:42}, CE:{FAM:26,INN:12,RES:24,JER:38}};
  const obj  = {CD:{FAM:26,INN:32,RES:24,JER:18}, LO:{FAM:30,INN:28,RES:22,JER:20},
                GP:{FAM:32,INN:28,RES:22,JER:18}, CO:{FAM:30,INN:28,RES:22,JER:20},
                EE:{FAM:22,INN:34,RES:26,JER:18}, CE:{FAM:28,INN:28,RES:24,JER:20}};
  let s = 20260815;
  const rnd = () => (s = (s*1664525 + 1013904223) % 4294967296) / 4294967296;
  for(let i=0;i<n;i++){
    const envio = await API.abrirEnvio(codigo, {});
    for(const p of PANTALLAS){
      const ref = (p.pasada===0?base:obj)[p.sub];
      const bruto = ORDEN.map(v=>Math.max(0, ref[v] + (rnd()+rnd()-1)*16));
      const t = bruto.reduce((a,b)=>a+b,0);
      let c = bruto.map(x=>Math.round(x/t*10));
      let dif = 10 - c.reduce((a,b)=>a+b,0);
      while(dif !== 0){ const k = Math.floor(rnd()*4);
        if(dif>0){ c[k]++; dif--; } else if(c[k]>0){ c[k]--; dif++; } }
      const puntos = {}; ORDEN.forEach((v,k)=>puntos[v]=c[k]*10);
      await API.guardar(envio, p.orden.map((v,k)=>({pantalla:p.n, sub:p.sub, vector:v,
        pasada:p.pasada, posicion:k+1, puntos:puntos[v]})));
    }
    await API.cerrarEnvio(envio);
  }
}

function descargarCSV(s, res){
  if(!res || !res.datos){ alert("No hay resultados que descargar todavía."); return; }
  const cols = ["organizacion","sesion","codigo","modo","instrumento_version","n_envios",
                "pantalla","subcategoria","vector","pasada","media_puntos"];
  const filas = res.datos.map(r=>[ (s.organizacion||{}).nombre||"", s.titulo, s.codigo, s.modo,
    VERSION, res.n, r.pantalla, SUBS[r.sub], VEC[r.vector].nombre,
    r.pasada===0?"actual":"deseada", Number(r.media).toFixed(2) ]);
  const csv = [cols.join(","), ...filas.map(f=>f.map(v=>{
    const x = String(v==null?"":v); return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x;
  }).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "cultura-" + s.codigo + ".csv"; a.click(); URL.revokeObjectURL(a.href);
}

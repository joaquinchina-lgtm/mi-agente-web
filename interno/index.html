<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --actual:#5598e7; --deseada:#1c5cab;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark; --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --actual:#6da7ec; --deseada:#256abf;}}
:root[data-theme="dark"]{color-scheme:dark; --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --actual:#6da7ec; --deseada:#256abf;}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 64px}
.wrap.ancho{max-width:1200px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font-size:13px;color:var(--text-secondary)}
.brand b{color:var(--text-primary);font-weight:600}
.iconbtn{background:none;border:1px solid var(--border);color:var(--text-secondary);
  border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.iconbtn:hover{color:var(--text-primary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;margin-bottom:16px}
h1{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:650}
h2{font-size:17px;margin:0 0 10px;font-weight:650}
h3{font-size:12.5px;margin:22px 0 8px;font-weight:650;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 12px;color:var(--text-secondary)} p.lead{color:var(--text-primary)}
small,.small{font-size:13px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--deseada);
  color:#fff;border:none;border-radius:8px;padding:13px 20px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;min-height:46px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;color:var(--text-secondary);border:1px solid var(--border);font-weight:500}
.btn.ghost:hover{color:var(--text-primary)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.progress{height:3px;background:var(--grid);border-radius:2px;overflow:hidden;margin:0 0 8px}
.progress i{display:block;height:100%;background:var(--deseada);border-radius:2px;transition:width .25s}
.phasetag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted)}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--plane);
  color:var(--text-primary);min-height:44px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* reparto */
.restante{position:sticky;top:0;z-index:4;background:var(--surface-1);border-bottom:1px solid var(--grid);
  padding:12px 0;margin-bottom:4px;display:flex;align-items:baseline;gap:10px}
.restante b{font-size:26px;font-weight:650;line-height:1}
.restante.ok b{color:var(--deseada)}
.opt{padding:16px 0;border-bottom:1px solid var(--grid)}
.opt:last-child{border-bottom:none}
.opt p{margin:0 0 12px;color:var(--text-primary);font-size:15.5px;line-height:1.45}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{font-family:inherit;font-size:14px;font-weight:600;min-width:58px;min-height:46px;
  border:1px solid var(--border);background:var(--plane);color:var(--text-secondary);
  border-radius:8px;cursor:pointer;transition:all .12s}
.stepper button:hover:not(:disabled){border-color:var(--actual);color:var(--text-primary)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{min-width:66px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-1);
  font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.stepper .val.puesto{background:var(--deseada);border-color:var(--deseada);color:#fff}
.barmini{flex:1;align-self:center;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.barmini i{display:block;height:100%;background:var(--actual);border-radius:4px;transition:width .18s}

/* consola */
.codigo{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.14em;
  font-size:30px;color:var(--text-primary)}
.estado{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary)}
.estado.viva{color:#fff;background:var(--deseada);border-color:var(--deseada)}
.contador{display:flex;align-items:baseline;gap:9px;margin:4px 0 10px}
.contador b{font-size:40px;font-weight:650;line-height:1}
.barra{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--deseada);border-radius:4px;transition:width .4s}
.vistas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vistas button{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--plane);color:var(--text-secondary);
  border-radius:8px;padding:8px 11px;min-height:38px}
.vistas button:hover{color:var(--text-primary)}
.vistas button.on{background:var(--deseada);border-color:var(--deseada);color:#fff}
.qr{background:#fff;padding:12px;border-radius:10px;display:inline-block;line-height:0}
.qr img,.qr canvas{display:block}
.lista{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lista .it{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:13px 15px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.lista .it:last-child{border-bottom:none}
.lista .it b{font-weight:600}
.aviso{background:var(--plane);border:1px solid var(--border);border-left:3px solid var(--deseada);
  border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--text-secondary);margin-top:14px}
.aviso.rojo{border-left-color:#d03b3b}

/* resultados */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--plane);border:1px solid var(--border);border-radius:var(--radius);padding:15px;min-width:0}
.tile .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:5px}
.tile .val{font-size:28px;font-weight:650;line-height:1.1;overflow-wrap:anywhere}
.tile .val.word{font-size:19px}
.tile .sub{font-size:12.5px;color:var(--text-secondary);margin-top:4px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-secondary)}
.swatch{width:11px;height:11px;border-radius:50%;display:inline-block}
.swatch.linea{width:16px;height:3px;border-radius:2px}
.chartbox{position:relative} svg{display:block;width:100%;height:auto;font-family:inherit}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:16px;margin-top:6px}
.mini{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--plane)}
.mini h4{margin:0 0 2px;font-size:13.5px;font-weight:650;color:var(--text-primary)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:650}
td.ten{font-weight:650;color:var(--text-primary);white-space:nowrap}
td.ten i{font-style:normal;color:var(--text-muted);margin-left:6px;font-weight:500}
@media (max-width:560px){th,td{padding:9px 4px;font-size:13.5px} th{font-size:10px;letter-spacing:0}
  td.ten i u{display:none}}
.note{border-left:2px solid var(--axis);padding:2px 0 2px 14px;margin:18px 0 0;
  font-size:13.5px;color:var(--text-secondary)}
.hide{display:none} .vecname{font-weight:600;color:var(--text-primary)}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--plane);
  padding:1px 5px;border-radius:4px;border:1px solid var(--border)}

/* proyección */
.proy{max-width:1200px;margin:0 auto;padding:34px 30px}
.proy h1{font-size:40px;margin-bottom:18px}
.proy .codigo{font-size:64px}
.proy .contador b{font-size:64px}
.proy .enun{font-size:23px;line-height:1.45;color:var(--text-primary);
  padding:16px 0;border-bottom:1px solid var(--grid)}
.proy .enun:last-child{border-bottom:none}

<body>
<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   0 · CONFIGURACIÓN — lo único que hay que rellenar
   Se sacan del panel de Supabase, en Project Settings → API.
   La clave `anon` es pública por diseño: va en el navegador de cada
   participante. Lo que impide que sirva para nada es que las tablas
   están cerradas y solo se entra por funciones que validan la sesión.
   NUNCA pongas aquí la clave `service_role`.
   ═══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  // Proyecto «Cultura» · región eu-central-1 (Fráncfort)
  SUPABASE_URL:  "https://hugtfjbuzltvhysrjlxv.supabase.co",

  // Publishable key: pública por diseño, viaja en el móvil de cada
  // participante. Lo que impide que sirva para nada es que las tablas están
  // cerradas por RLS y solo se entra por funciones que validan la sesión.
  // La que NUNCA debe estar aquí es la Secret key.
  SUPABASE_ANON: "sb_publishable_y_q6WtW5rfR5A_LOE7-Q0g_OXeRjcW0"
};

/* ═══════════════════════════════════════════════════════════════════
   1 · INSTRUMENTO v2.1 — idéntico al validado
   ═══════════════════════════════════════════════════════════════════ */
const VERSION = "2.1";
const VEC = {
  FAM:{nombre:"Organización familiar",              corto:"Familiar"},
  INN:{nombre:"Organización innovadora",            corto:"Innovadora"},
  RES:{nombre:"Organización orientada a resultados",corto:"Resultados"},
  JER:{nombre:"Organización jerárquica",            corto:"Jerárquica"}
};
const ORDEN = ["FAM","INN","RES","JER"];
const ANGULOS = {FAM:135, INN:45, RES:-45, JER:-135};
const SUBS = {CD:"Características dominantes", LO:"Liderazgo organizativo",
  GP:"Gestión de personas", CO:"Cohesión organizativa",
  EE:"Énfasis estratégico", CE:"Criterios de éxito"};
const ORDEN_SUBS = ["CD","LO","GP","CO","EE","CE"];
const TXT = {
  CD:{FAM:"La organización se parece a una familia extendida. Un lugar muy agradable para trabajar, donde la gente se preocupa unas por otras",
      INN:"La organización es dinámica y emprendedora. La gente está dispuesta a asumir riesgos y probar cosas nuevas",
      RES:"La organización está muy orientada a resultados. El principal interés es competir y lograr objetivos ambiciosos",
      JER:"La organización está marcada por la normativa y las características del sector"},
  LO:{FAM:"El estilo de liderazgo es facilitador, de mentor/a, orientado a apoyar y desarrollar a las personas",
      INN:"El liderazgo es emprendedor, innovador, orientado a asumir riesgos y lanzar proyectos nuevos",
      RES:"El liderazgo es duro y exigente, orientado a la competitividad y al logro de resultados",
      JER:"El liderazgo es coordinador, organizador, que mantiene la estabilidad y cuida los procesos"},
  GP:{FAM:"Se enfatiza el trabajo en equipo, la participación y el consenso",
      INN:"Se valora la iniciativa individual, la libertad y la creatividad",
      RES:"Se enfatiza el rendimiento individual, las metas y las recompensas por resultados",
      JER:"Se valora el cumplimiento de normas, la seguridad en el empleo y la previsibilidad"},
  CO:{FAM:"Lo que mantiene unida a la organización es la lealtad y la confianza mutua",
      INN:"La organización se mantiene unida por el compromiso con la innovación y el crecimiento",
      RES:"La cohesión se basa en los objetivos compartidos y la agresividad competitiva",
      JER:"La organización se mantiene unida por las reglas formales y las políticas establecidas"},
  EE:{FAM:"El énfasis se pone en el desarrollo de las personas, la comunicación abierta y el clima interno",
      INN:"El énfasis está en el crecimiento, los nuevos recursos, los productos o servicios innovadores",
      RES:"El énfasis está en ganar cuota de mercado, aumentar la competitividad, lograr objetivos",
      JER:"El énfasis está en la estabilidad, la eficiencia, el control y la planificación"},
  CE:{FAM:"Se considera éxito tener una plantilla comprometida, un clima laboral positivo, personas desarrolladas",
      INN:"Éxito es haber lanzado productos/servicios innovadores y estar a la vanguardia",
      RES:"Éxito es superar a la competencia y cumplir o superar los objetivos financieros",
      JER:"Éxito es tener procesos estables, eficiente uso de recursos, funcionamiento predecible"}
};
const PANTALLAS = [
  {n: 1, pasada:0, sub:"CD", orden:["FAM","INN","RES","JER"]},
  {n: 2, pasada:0, sub:"LO", orden:["JER","RES","FAM","INN"]},
  {n: 3, pasada:0, sub:"GP", orden:["FAM","JER","RES","INN"]},
  {n: 4, pasada:0, sub:"CO", orden:["RES","FAM","JER","INN"]},
  {n: 5, pasada:0, sub:"EE", orden:["INN","RES","JER","FAM"]},
  {n: 6, pasada:0, sub:"CE", orden:["JER","RES","INN","FAM"]},
  {n: 7, pasada:1, sub:"CD", orden:["FAM","INN","RES","JER"]},
  {n: 8, pasada:1, sub:"LO", orden:["INN","FAM","JER","RES"]},
  {n: 9, pasada:1, sub:"GP", orden:["FAM","RES","INN","JER"]},
  {n:10, pasada:1, sub:"CO", orden:["JER","FAM","INN","RES"]},
  {n:11, pasada:1, sub:"EE", orden:["RES","INN","JER","FAM"]},
  {n:12, pasada:1, sub:"CE", orden:["FAM","INN","RES","JER"]}
];
const TOTAL = 100, PASO = 10;
const VISTAS_PROY = [{k:"espera", t:"Espera / código"}]
  .concat(PANTALLAS.map(p=>({k:"p"+p.n, t:`${p.n}. ${p.pasada?"DES":"ACT"} ${SUBS[p.sub]}`})))
  .concat([{k:"resultados", t:"Perfil general"},{k:"subcategorias", t:"Por subcategoría"}]);

/* ═══════════════════════════════════════════════════════════════════
   2 · BACKEND — Supabase si está configurado; si no, memoria local
   El modo demostración deja probar el circuito completo antes de
   conectar nada. No persiste: al cerrar la pestaña desaparece.
   ═══════════════════════════════════════════════════════════════════ */
const CONFIGURADO = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON);
let sb = null;
if(CONFIGURADO && window.supabase)
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON);

/* Backend de mentira para el modo demostración. Vive en sessionStorage para
   que la consola, el cuestionario y la pantalla de proyección se vean entre sí
   aunque estén en ventanas distintas de este mismo navegador. Son datos de
   juguete y se borran con el botón de la consola. En modo real no se usa. */
const MEM = {
  usuario:null, orgs:[], sesiones:[], envios:[], respuestas:[],
  id(){ return "id-" + Math.random().toString(36).slice(2,10); },
  guardar(){ try{ localStorage.setItem("demo-cultura", JSON.stringify(
    {usuario:this.usuario, orgs:this.orgs, sesiones:this.sesiones,
     envios:this.envios, respuestas:this.respuestas})); }catch(e){} },
  cargar(){ try{ const d = JSON.parse(localStorage.getItem("demo-cultura")||"null");
    if(d) Object.assign(this, d); }catch(e){} }
};
MEM.cargar();
window.borrarDemo = () => { localStorage.removeItem("demo-cultura"); location.href = location.pathname; };

const API = {
  demo(){ return !sb; },

  // Enlace por correo. Es el respaldo, no la vía principal: el servicio de correo
  // tiene un tope de envíos por hora y no queremos que tu acceso dependa de eso.
  async login(email){
    if(this.demo()){ MEM.usuario = {id:"demo-user", email}; MEM.guardar(); return {demo:true}; }
    const { error } = await sb.auth.signInWithOtp({ email,
      options:{ emailRedirectTo: location.origin + location.pathname + "#/admin",
                shouldCreateUser:false }});
    if(error) throw error; return {enviado:true};
  },
  // Contraseña. No viaja por correo, no tiene límite de intentos por hora y no
  // aparece en ninguna parte de este archivo: la guarda cifrada Supabase.
  async loginClave(email, clave){
    if(this.demo()){ MEM.usuario = {id:"demo-user", email}; MEM.guardar(); return {demo:true}; }
    const { error } = await sb.auth.signInWithPassword({ email, password:clave });
    if(error) throw error; return {dentro:true};
  },
  async fijarClave(clave){
    if(this.demo()) return {demo:true};
    const { error } = await sb.auth.updateUser({ password:clave });
    if(error) throw error; return {ok:true};
  },
  async usuario(){
    if(this.demo()){ MEM.cargar(); return MEM.usuario; }
    const { data } = await sb.auth.getUser(); return data.user || null;
  },
  async salir(){ if(this.demo()){ MEM.usuario=null; MEM.guardar(); return; } await sb.auth.signOut(); },

  async sectores(){
    if(this.demo()) return [["universidad","Universidad"],["centro_investigacion","Centro de investigación"],
      ["admon_publica","Administración pública"],["industria","Industria"],
      ["servicios","Servicios"],["tercer_sector","Tercer sector"],["otro","Otro"]]
      .map(([clave,nombre])=>({clave,nombre}));
    const { data, error } = await sb.from("sector").select("*").order("nombre");
    if(error) throw error; return data;
  },
  async orgs(){
    if(this.demo()){ MEM.cargar(); return MEM.orgs; }
    const { data, error } = await sb.from("organizacion").select("*").order("nombre");
    if(error) throw error; return data;
  },
  async crearOrg(o){
    if(this.demo()){ const r = {...o, id:MEM.id()}; MEM.orgs.push(r); MEM.guardar(); return r; }
    const u = await this.usuario();
    const { data, error } = await sb.from("organizacion")
      .insert({...o, propietario:u.id}).select().single();
    if(error) throw error; return data;
  },
  async sesiones(){
    if(this.demo()){ MEM.cargar(); return MEM.sesiones.slice().reverse(); }
    const { data, error } = await sb.from("sesion").select("*, organizacion(nombre)")
      .order("creado_en",{ascending:false});
    if(error) throw error; return data;
  },
  async crearSesion(s){
    if(this.demo()){ const r = {...s, id:MEM.id(), estado:"borrador", vista_activa:"espera",
      resultados_publicos:false, creado_en:new Date().toISOString(),
      organizacion:{nombre:(MEM.orgs.find(o=>o.id===s.organizacion_id)||{}).nombre}};
      MEM.sesiones.push(r); MEM.guardar(); return r; }
    const u = await this.usuario();
    const { data, error } = await sb.from("sesion")
      .insert({...s, propietario:u.id, instrumento_version:VERSION}).select().single();
    if(error) throw error; return data;
  },
  async actualizarSesion(id, cambios){
    if(this.demo()){ const s = MEM.sesiones.find(x=>x.id===id); Object.assign(s, cambios); MEM.guardar(); return s; }
    const { data, error } = await sb.from("sesion").update(cambios).eq("id",id).select().single();
    if(error) throw error; return data;
  },
  async sesionPublica(codigo){
    if(this.demo()){
      MEM.cargar();
      const s = MEM.sesiones.find(x=>x.codigo.toUpperCase()===codigo.toUpperCase());
      if(!s) return null;
      const d = {existe:true, titulo:s.titulo, organizacion:(s.organizacion||{}).nombre,
        modo:s.modo, estado:s.estado, vista_activa:s.vista_activa,
        instrumento:s.instrumento || "cultura", version:s.instrumento_version || VERSION,
        resultados_publicos:s.resultados_publicos, admite_respuestas:s.estado==="abierta"};
      recordarInstrumento(d); return d;
    }
    const { data, error } = await sb.rpc("sesion_publica", {p_codigo:codigo});
    if(error) throw error; recordarInstrumento(data); return data;
  },
  async abrirEnvio(codigo, segmentos){
    if(this.demo()){
      const s = MEM.sesiones.find(x=>x.codigo.toUpperCase()===codigo.toUpperCase());
      if(!s || s.estado!=="abierta") throw new Error("La sesión no admite respuestas");
      const e = {id:MEM.id(), sesion_id:s.id, segmentos, completo:false};
      MEM.envios.push(e); MEM.guardar(); return e.id;
    }
    const { data, error } = await sb.rpc("abrir_envio", {p_codigo:codigo, p_segmentos:segmentos||{}});
    if(error) throw error; return data;
  },
  async guardar(envio, filas){
    if(this.demo()){
      filas.forEach(f=>{
        const i = MEM.respuestas.findIndex(r=>r.envio_id===envio && r.pantalla===f.pantalla && r.vector===f.vector);
        const fila = {...f, envio_id:envio};
        if(i>=0) MEM.respuestas[i]=fila; else MEM.respuestas.push(fila);
      }); MEM.guardar(); return;
    }
    const { error } = await sb.rpc("guardar_respuestas", {p_envio:envio, p_filas:filas});
    if(error) throw error;
  },
  async cerrarEnvio(envio){
    if(this.demo()){ const e = MEM.envios.find(x=>x.id===envio); if(e) e.completo=true; MEM.guardar(); return; }
    const { error } = await sb.rpc("cerrar_envio", {p_envio:envio});
    if(error) throw error;
  },
  async progreso(codigo){
    if(this.demo()){
      MEM.cargar();
      const s = MEM.sesiones.find(x=>x.codigo.toUpperCase()===codigo.toUpperCase());
      if(!s) return null;
      const es = MEM.envios.filter(e=>e.sesion_id===s.id);
      const c = es.filter(e=>e.completo).length;
      return {estado:s.estado, vista_activa:s.vista_activa, resultados_publicos:s.resultados_publicos,
        n_convocados:s.n_convocados, completos:c, en_curso:es.length-c,
        pct: s.n_convocados ? Math.round(100*c/s.n_convocados) : null,
        listo_para_cerrar: !!s.n_convocados && c >= Math.ceil(s.n_convocados*0.85)};
    }
    const { data, error } = await sb.rpc("progreso_sesion", {p_codigo:codigo});
    if(error) throw error; return data;
  },
  async resultados(codigo){
    if(this.demo()){
      MEM.cargar();
      const s = MEM.sesiones.find(x=>x.codigo.toUpperCase()===codigo.toUpperCase());
      if(!s) return {error:"sesion_no_encontrada"};
      const ids = MEM.envios.filter(e=>e.sesion_id===s.id && e.completo).map(e=>e.id);
      if(!s.resultados_publicos && !MEM.usuario) return {error:"resultados_no_publicados", n:ids.length};
      if(ids.length < 3) return {error:"muestra_insuficiente", n:ids.length, minimo:3};
      const acc = {};
      MEM.respuestas.filter(r=>ids.includes(r.envio_id)).forEach(r=>{
        const k = r.pantalla+"|"+r.vector;
        (acc[k] = acc[k] || {pantalla:r.pantalla, sub:r.sub, vector:r.vector, pasada:r.pasada, v:[]}).v.push(r.puntos);
      });
      return {n:ids.length, datos:Object.values(acc).map(x=>({pantalla:x.pantalla, sub:x.sub,
        vector:x.vector, pasada:x.pasada, media: x.v.reduce((a,b)=>a+b,0)/x.v.length}))};
    }
    const { data, error } = await sb.rpc("resultados_sesion", {p_codigo:codigo});
    if(error) throw error; return data;
  },
  async inventario(){
    if(this.demo()){
      MEM.cargar();
      return MEM.sesiones.slice().reverse().map(x=>{
        const es = MEM.envios.filter(e=>e.sesion_id===x.id);
        const o = MEM.orgs.find(o=>o.id===x.organizacion_id) || {};
        return {sesion_id:x.id, codigo:x.codigo, sesion:x.titulo, colectivo:x.colectivo,
          modo:x.modo, estado:x.estado, fecha:(x.creado_en||"").slice(0,10),
          organizacion:o.nombre, organizacion_id:o.id, sector:o.sector_clave,
          territorio:o.territorio, tamano_tramo:o.tamano_tramo,
          consentimiento_agregado:!!o.consentimiento_agregado,
          instrumento_version:VERSION,
          envios_completos:es.filter(e=>e.completo).length,
          envios_en_curso:es.filter(e=>!e.completo).length};
      });
    }
    const { data, error } = await sb.from("v_inventario_sesiones").select("*")
      .order("creado_en",{ascending:false});
    if(error) throw error; return data;
  },
  async resumenSesiones(ids){
    if(!ids.length) return [];
    if(this.demo()){
      MEM.cargar();
      const out = [];
      ids.forEach(id=>{
        const ses = MEM.sesiones.find(x=>x.id===id); if(!ses) return;
        const o = MEM.orgs.find(o=>o.id===ses.organizacion_id) || {};
        const env = MEM.envios.filter(e=>e.sesion_id===id && e.completo).map(e=>e.id);
        const rs = MEM.respuestas.filter(r=>env.includes(r.envio_id));
        ORDEN.forEach(v=>{
          const a = rs.filter(r=>r.vector===v && r.pasada===0).map(r=>r.puntos);
          const d = rs.filter(r=>r.vector===v && r.pasada===1).map(r=>r.puntos);
          if(!a.length && !d.length) return;
          out.push({sesion_id:id, codigo:ses.codigo, sesion:ses.titulo, colectivo:ses.colectivo,
            organizacion:o.nombre, sector:o.sector_clave, n_envios:env.length, vector:v,
            actual:+media(a).toFixed(2), deseada:+media(d).toFixed(2),
            tension:+(media(d)-media(a)).toFixed(2)});
        });
      });
      return out;
    }
    const { data, error } = await sb.from("v_resumen_sesion").select("*").in("sesion_id", ids);
    if(error) throw error; return data;
  },
  async detalleSesiones(ids){
    if(!ids.length) return [];
    if(this.demo()){
      MEM.cargar();
      const out = [];
      ids.forEach(id=>{
        const ses = MEM.sesiones.find(x=>x.id===id); if(!ses) return;
        const o = MEM.orgs.find(o=>o.id===ses.organizacion_id) || {};
        MEM.envios.filter(e=>e.sesion_id===id && e.completo).forEach(e=>{
          MEM.respuestas.filter(r=>r.envio_id===e.id).forEach(r=>{
            out.push({organizacion:o.nombre, sector:o.sector_clave, territorio:o.territorio,
              tamano_tramo:o.tamano_tramo, codigo:ses.codigo, sesion:ses.titulo,
              colectivo:ses.colectivo, modo:ses.modo, estado:ses.estado,
              instrumento_version:VERSION, fecha:(ses.creado_en||"").slice(0,10),
              envio_id:e.id, ambito:(e.segmentos||{}).ambito||null,
              responsable:(e.segmentos||{}).responsable||null,
              antiguedad:(e.segmentos||{}).antiguedad||null,
              pantalla:r.pantalla, sub:r.sub, vector:r.vector, pasada:r.pasada,
              posicion:r.posicion, puntos:r.puntos});
          });
        });
      });
      return out;
    }
    const { data, error } = await sb.from("v_detalle").select("*").in("sesion_id", ids);
    if(error) throw error; return data;
  },
  suscribir(sesionId, cb){
    if(this.demo()) return { unsubscribe(){} };
    const ch = sb.channel("sesion-"+sesionId)
      .on("postgres_changes", {event:"UPDATE", schema:"public", table:"sesion",
           filter:"id=eq."+sesionId}, p => cb(p.new)).subscribe();
    return { unsubscribe(){ sb.removeChannel(ch); } };
  }
};

/* ═══════════════════════════════════════════════════════════════════

const app = () => document.getElementById("app");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const media = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const vacio = () => ({FAM:0,INN:0,RES:0,JER:0});
const suma = r => ORDEN.reduce((a,v)=>a+(r[v]||0),0);
const params = () => new URLSearchParams(location.search);

/* Corrección de errores M: aguanta que el proyector desenfoque o que alguien
   escanee de lado desde el fondo de la sala. */
function pintarQR(id, url, celda){
  const cont = document.getElementById(id); if(!cont) return;
  try{
    const q = qrcode(0, "M"); q.addData(url); q.make();
    cont.innerHTML = q.createSvgTag({cellSize:celda, margin:2, scalable:false});
  }catch(e){
    cont.innerHTML = `<div style="padding:10px;color:#0b0b0b;font-size:13px;max-width:220px">
      No se ha podido generar el código QR. Dicta el enlace:<br><b>${esc(url)}</b></div>`;
  }
}

/* La cabecera dice dos cosas distintas según quién mira.
   En tu lado dice de quién es la casa. En la sala —móvil del participante y
   proyector— dice qué está respondiendo la gente, y ese nombre NO puede estar
   escrito a mano: sale de la propia sesión (`instrumento`), porque el día que
   pases liderazgo o escenarios la cabecera tiene que cambiar sola. */
function enLaSala(){
  const p = params();
  return !!(p.get("s") || p.get("proy"));
}
let _instrumento = null;          // {clave, version} de la sesión que se mira
function recordarInstrumento(s){
  if(s && s.existe !== false && s.instrumento){
    _instrumento = {clave:s.instrumento, version:s.version || null};
    document.title = nombreInstrumento(_instrumento.clave);
    const el = document.querySelector(".brand");
    if(el && enLaSala()) el.innerHTML = marcaSala();
  }
}
function nombreInstrumento(clave){
  const m = (typeof MODULOS !== "undefined") ? MODULOS.find(x => x.k === clave) : null;
  // `publico` es el nombre que ve la sala; `nombre` el de tu consola.
  return m ? (m.publico || m.nombre) : "Diagnóstico";
}
function marcaSala(){
  if(!_instrumento) return `<b>Diagnóstico</b>`;
  return `<b>${esc(nombreInstrumento(_instrumento.clave))}</b>`
       + (_instrumento.version ? ` · v${esc(_instrumento.version)}` : "");
}
function cabecera(extra){
  const marca = enLaSala() ? marcaSala()
                           : `<b>Consola de proyectos</b> de joaquinromero.com`;
  return `<header class="top">
    <div class="brand">${marca}${
      API.demo() ? ' · <span style="color:#d03b3b">modo demostración</span>' : ''}</div>
    <div style="display:flex;gap:8px">${extra||""}
      <button class="iconbtn" onclick="alternarTema()">Tema</button></div></header>`;
}
window.alternarTema = () => {
  const a = document.documentElement.getAttribute("data-theme");
  const o = a ? a==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", o ? "light":"dark");
  if(window._repinta) window._repinta();
};

function calcular(mapa){   // mapa[pantalla][vector] = puntos
  const out = {sub:{}, gen:{}};
  ORDEN_SUBS.forEach(s=>{
    out.sub[s] = {};
    const pa = PANTALLAS.find(p=>p.sub===s && p.pasada===0);
    const pb = PANTALLAS.find(p=>p.sub===s && p.pasada===1);
    ORDEN.forEach(v=>{
      const a = (mapa[pa.n]||{})[v]||0, d = (mapa[pb.n]||{})[v]||0;
      out.sub[s][v] = {actual:a, deseada:d, tension:d-a};
    });
  });
  ORDEN.forEach(v=>{
    const a = media(ORDEN_SUBS.map(s=>out.sub[s][v].actual));
    const d = media(ORDEN_SUBS.map(s=>out.sub[s][v].deseada));
    out.gen[v] = {actual:a, deseada:d, tension:d-a};
  });
  out.dominanteA = ORDEN.reduce((a,b)=> out.gen[a].actual>=out.gen[b].actual?a:b);
  out.dominanteD = ORDEN.reduce((a,b)=> out.gen[a].deseada>=out.gen[b].deseada?a:b);
  out.desplazamiento = ORDEN.reduce((a,v)=>a+Math.abs(out.gen[v].tension),0)/2;
  return out;
}
function escalaMax(d){
  let m=0; ORDEN.forEach(v=>{m=Math.max(m,d.gen[v].actual,d.gen[v].deseada);});
  ORDEN_SUBS.forEach(s=>ORDEN.forEach(v=>{m=Math.max(m,d.sub[s][v].actual,d.sub[s][v].deseada);}));
  return Math.max(40, Math.ceil(m/10)*10);
}
function radarSVG(svg, box, vals, max, compacto){
  if(!svg || !box) return;
  const W = Math.max(compacto?200:272, Math.round(box.clientWidth || (compacto?204:660)));
  const estrecho = W < 470;
  const H = compacto ? W : Math.min(estrecho ? W+70 : 440, 470);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cx=W/2, cy=H/2+(compacto?0:6);
  const R = Math.min(W/2,H/2) - (compacto?30:(estrecho?70:78));
  const cs = getComputedStyle(document.documentElement);
  const cA = cs.getPropertyValue("--actual").trim();
  const cD = cs.getPropertyValue("--deseada").trim();
  const cS = cs.getPropertyValue("--surface-1").trim();
  const rad = a=>a*Math.PI/180;
  const pt = (ang,val)=>[cx+(val/max)*R*Math.cos(rad(ang)), cy-(val/max)*R*Math.sin(rad(ang))];
  const poly = f => ORDEN.map(v=>pt(ANGULOS[v], f(v)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const anillos = compacto ? 2 : Math.min(5, Math.max(2, Math.round(max/10)));
  let s = "";
  for(let i=1;i<=anillos;i++)
    s += `<polygon points="${poly(()=>max*i/anillos)}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  ORDEN.forEach(v=>{ const [x,y]=pt(ANGULOS[v],max);
    s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`; });
  if(!compacto){
    for(let i=1;i<=anillos;i++){ const val=max*i/anillos, [x,y]=pt(0,val);
      s += `<text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" fill="var(--text-muted)" font-size="10.5"
              text-anchor="middle" style="font-variant-numeric:tabular-nums">${Math.round(val)}</text>`; }
    [[cx,cy-R-(estrecho?42:52),"middle","FLEXIBILIDAD"],[cx,cy+R+(estrecho?54:62),"middle","CONTROL"],
     [2,cy+4,"start","INTERNO"],[W-2,cy+4,"end","EXTERNO"]].forEach(([x,y,anc,t])=>{
      s += `<text x="${Math.round(x)}" y="${Math.round(y)}" fill="var(--text-muted)" font-size="10.5"
              text-anchor="${anc}" letter-spacing="0.08em">${t}</text>`; });
  }
  s += `<polygon points="${poly(v=>vals[v].actual)}" fill="${cA}" fill-opacity="0.22" stroke="${cA}" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<polygon points="${poly(v=>vals[v].deseada)}" fill="none" stroke="${cD}" stroke-width="2" stroke-linejoin="round"/>`;
  ORDEN.forEach(v=>{
    const [xa,ya]=pt(ANGULOS[v],vals[v].actual), [xd,yd]=pt(ANGULOS[v],vals[v].deseada);
    const r = compacto?4:5.5;
    s += `<circle cx="${xa.toFixed(1)}" cy="${ya.toFixed(1)}" r="${r}" fill="${cA}" stroke="${cS}" stroke-width="2"/>`;
    s += `<circle cx="${xd.toFixed(1)}" cy="${yd.toFixed(1)}" r="${r}" fill="${cD}" stroke="${cS}" stroke-width="2"/>`;
  });
  ORDEN.forEach(v=>{
    const [x,y]=pt(ANGULOS[v],max);
    const dx=Math.cos(rad(ANGULOS[v])), dy=-Math.sin(rad(ANGULOS[v]));
    const lx = Math.max(2, Math.min(W-2, x+dx*(compacto?12:(estrecho?14:22))));
    const ly = y+dy*(compacto?10:(estrecho?14:22));
    const anc = dx<0 ? "end":"start";
    if(compacto)
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?0:10)).toFixed(0)}" fill="var(--text-secondary)"
              font-size="10.5" font-weight="600" text-anchor="${anc}">${v}</text>`;
    else {
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?-2:12)).toFixed(0)}" fill="var(--text-primary)"
              font-size="${estrecho?11.5:13}" font-weight="600" text-anchor="${anc}">${VEC[v].corto}</text>`;
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?-2:12)+15).toFixed(0)}" fill="var(--text-secondary)"
              font-size="${estrecho?11:12}" text-anchor="${anc}" style="font-variant-numeric:tabular-nums">${
              vals[v].actual.toFixed(1)} → ${vals[v].deseada.toFixed(1)}</text>`;
    }
  });
  svg.innerHTML = s;
}
function bloqueResultados(d, prefijo){

  return `<div class="kpirow" style="margin-bottom:18px">
      <div class="tile"><div class="lab">Cultura dominante hoy</div>
        <div class="val word">${VEC[d.dominanteA].corto}</div>

      <div class="tile"><div class="lab">Cultura dominante deseada</div>

    <tbody>${ORDEN.map(v=>{const g=d.gen[v], t=g.tension;

}
function pintarRadaresDe(d, prefijo){
  const max = escalaMax(d);
  radarSVG(document.getElementById(prefijo+"svg"), document.getElementById(prefijo+"box"), d.gen, max, false);
}
function bloqueSub(d, prefijo){
  const max = escalaMax(d);
  return `<div class="multi">${ORDEN_SUBS.map(s=>`
    <div class="mini"><h4>${SUBS[s]}</h4><div class="small">escala común 0–${max}</div>

        aria-label="Radar de ${SUBS[s]}"></svg></div></div>`).join("")}</div>`;
}
function pintarSub(d, prefijo){
  const max = escalaMax(d);
  ORDEN_SUBS.forEach(s => radarSVG(document.getElementById(prefijo+"s-"+s),
                                   document.getElementById(prefijo+"b-"+s), d.sub[s], max, true));
}
function datosAMapa(datos){
  const m = {};
  (datos||[]).forEach(r=>{ (m[r.pantalla] = m[r.pantalla]||{})[r.vector] = Number(r.media); });
  return m;
}

/* ¿Venimos de pulsar el enlace del correo? Supabase devuelve la sesión en el
   fragmento (#access_token=...) o, en flujo PKCE, en la query (?code=...).
   Sin esto, el enlace del correo te dejaba en la portada pública y parecía
   que no habías entrado. */
function vueltaDeCorreo(){
  return /access_token=|refresh_token=|[#&]type=(magiclink|recovery|invite|signup)|error_code=/.test(location.hash)
      || /[?&]code=/.test(location.search);
}
function ruta(){
  const p = params();
  if(p.get("proy")) return {vista:"proyeccion", codigo:p.get("proy")};
  if(p.get("s"))    return {vista:"participante", codigo:p.get("s")};
  if(location.hash.startsWith("#/admin")) return {vista:"admin"};
  if(vueltaDeCorreo())                    return {vista:"admin"};
  return {vista:"portada"};
}
async function render(){
  const r = ruta();
  window._repinta = null;
  try{
    if(r.vista === "participante")   await vistaParticipante(r.codigo);
    else if(r.vista === "proyeccion") await vistaProyeccion(r.codigo);
    else if(r.vista === "admin")      await vistaAdmin();
    else vistaPortada();
  }catch(e){
    app().innerHTML = `<div class="wrap">${cabecera()}
      <div class="card"><h2>Algo ha fallado</h2><p>${esc(e.message||e)}</p>
      <div class="btnrow"><button class="btn ghost" onclick="location.reload()">Reintentar</button></div></div></div>`;
  }
}
window.addEventListener("hashchange", render);

        datos—, pero sí puedes recorrer el circuito entero desde una sola ventana: crear la sesión,
        cargar respuestas de ejemplo, proyectar y ver los resultados. Para usarlo de verdad, rellena
        <code>CONFIG</code> arriba del archivo.</div>` : ""}
      <div class="btnrow">
        <button class="btn" onclick="location.hash='#/admin'">Entrar como administrador</button>
      </div>
      <h3>Para participar</h3>
      <p>Escanea el código QR que se proyecta en la sala, o abre el enlace que te hayan enviado.</p>

        <div class="grid2"><div class="field"><label for="cod">Código de sesión</label>

      $("#restT").textContent = q===0 ? "puntos repartidos · ya puedes continuar"
                              : q===1 ? "punto por repartir" : "puntos por repartir";
      $("#rest").classList.toggle("ok", q===0);
      $("#sig").disabled = q!==0;
      [...cont.children].forEach(d=>d._ref());
    };
    act();
    $("#sig").textContent = estado.idx===11 ? "Terminar" : estado.idx===5 ? "Ir a la cultura deseada" : "Siguiente";
    $("#reset").onclick = () => { estado.resp[p.n]=vacio(); pintar(); };
    $("#atras").onclick = () => { if(estado.idx>0){ estado.idx--; pintar(); } };
    $("#sig").onclick = async () => {
      $("#sig").disabled = true;
      // Se guarda pantalla a pantalla: si alguien abandona a la mitad,
      // lo respondido no se pierde y su envío simplemente no cuenta.
      const filas = p.orden.map((v,i)=>({pantalla:p.n, sub:p.sub, vector:v,
        pasada:p.pasada, posicion:i+1, puntos:r[v]}));
      try{ await API.guardar(estado.envio, filas); }
      catch(e){ alert("No hemos podido guardar: "+(e.message||e)); $("#sig").disabled=false; return; }
      if(estado.idx===11){ await API.cerrarEnvio(estado.envio); estado.paso="fin"; pintar(); return; }
      if(estado.idx===5){ estado.idx=6; estado.paso="switch"; pintar(); return; }
      estado.idx++; pintar(); window.scrollTo({top:0});
    };
    window.scrollTo({top:0});
  };
  pintar();
}

async function vistaProyeccion(codigo){

            ni tu correo, y ningún resultado se desglosa en grupos de menos de cinco personas.</p>`;
      } else {
        const res = await API.resultados(codigo);
        if(res.error){
          cuerpo = `<h1>Resultados</h1><p style="font-size:20px">${
            res.error==="muestra_insuficiente"
              ? `Todavía no hay respuestas suficientes (${res.n} de ${res.minimo} mínimas).`
              : "El facilitador aún no ha publicado los resultados."}</p>`;
        } else {
          const d = calcular(datosAMapa(res.datos));
          cuerpo = vista==="resultados"
            ? `<h1>Perfil de cultura</h1>${bloqueResultados(d,"pr")}`
            : `<h1>Por subcategoría</h1>${bloqueSub(d,"pr")}`;
          window._d = d; window._vista = vista;
        }
      }
    } else {
      const n = parseInt(vista.slice(1),10);
      const p = PANTALLAS.find(x=>x.n===n);
      if(p){
        cuerpo = `<div class="small">${p.pasada===0?"CULTURA ACTUAL":"CULTURA DESEADA"} ·
            pantalla ${p.pasada===0?p.n:p.n-6} de 6</div>

          <div class="contador" style="margin-top:24px"><b>${prog.completos}</b>
            <span style="font-size:20px">han terminado el cuestionario completo</span></div>`;

    if(vista === "espera") pintarQR("qr", url, 8);

    if(window._d && (vista==="subcategorias")) pintarSub(window._d,"pr");

  const s = await API.sesionPublica(codigo);

async function vistaAdmin(){
  // Si venimos del enlace del correo, Supabase tarda unas décimas en canjear el
  // token de la URL. Sin esta espera, la primera comprobación decía «no hay
  // usuario» y te devolvía a la pantalla de acceso justo después de haber entrado.
  if(vueltaDeCorreo() && !API.demo()){
    const fallo = (location.hash.match(/error_description=([^&]*)/) || [])[1];
    if(fallo){
      history.replaceState(null, "", location.pathname + "#/admin");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>Ese enlace ya no vale</h1>
        <p>${esc(decodeURIComponent(fallo.replace(/\+/g," ")))}</p>
        <p class="small">Los enlaces caducan y son de un solo uso. Pide otro, o entra con tu contraseña.</p>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h1>Entrando…</h1><p>Un momento, estamos canjeando el enlace.</p></div></div>`;
    const urlOriginal = location.hash + location.search;
    let dentro = null;
    for(let i = 0; i < 30 && !dentro; i++){
      dentro = await API.usuario();
      if(!dentro) await new Promise(r => setTimeout(r, 200));
    }
    history.replaceState(null, "", location.pathname + "#/admin");
    if(!dentro){
      // No callarse. Si el canje falla, decir por qué en vez de devolver al
      // formulario como si el usuario hubiera hecho algo mal.
      let detalle = "";
      try{
        const { data, error } = await sb.auth.getSession();
        detalle = error ? error.message : (data && data.session ? "hay sesión pero sin usuario" : "el navegador no ha guardado ninguna sesión");
      }catch(e){ detalle = String(e && e.message || e); }
      const traza = urlOriginal.replace(/(access_token|refresh_token|code)=[^&]*/g, "$1=…");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>El enlace no ha llegado a abrir sesión</h1>
        <p>El enlace era válido, pero el navegador no ha conseguido canjearlo.</p>
        <div class="aviso rojo"><b>Motivo:</b> ${esc(detalle)}</div>
        <p class="small">Causas habituales: has abierto el enlace en un navegador
          <b>distinto</b> del que lo pidió, o en una ventana de incógnito, o el
          filtro antivirus de tu correo abrió el enlace antes que tú y lo gastó
          (son de un solo uso).</p>
        <p class="small">Ábrelo en el mismo navegador donde lo pediste. Si se repite,
          usa la contraseña.</p>
        <details><summary class="small">Detalle técnico</summary>
          <p class="small"><code>${esc(traza.slice(0,300))}</code></p></details>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
  }
  const u = await API.usuario();
  if(!u) return vistaLogin();
  const m = location.hash.match(/^#\/admin\/sesion\/(.+)$/);
  if(m) return consolaSesion(m[1]);
  if(location.hash.startsWith("#/admin/sesiones"))  return panelAdmin(u);
  if(location.hash.startsWith("#/admin/proyectos")) return panelProyectos(u);
  return hubPrivado(u);
}

/* Traduce los errores de Supabase, que vienen en inglés y en jerga.
   Delante de un cliente, «Invalid login credentials» no ayuda a nadie. */
function mensajeAuth(e){
  const t = String((e && (e.message || e.error_description)) || e || "");
  if(/invalid login credentials/i.test(t))
    return "Correo o contraseña incorrectos.";
  if(/email.*rate limit|over_email_send_rate_limit|too many requests/i.test(t))
    return "Has agotado los envíos de correo de esta hora. Entra con la contraseña; "
         + "si aún no la has fijado, tendrás que esperar.";
  if(/signups not allowed|signup.*disabled|user not found/i.test(t))
    return "Ese correo no tiene cuenta aquí. El registro está cerrado a propósito.";
  if(/password should be at least|weak.?password/i.test(t))
    return "Contraseña demasiado corta o demasiado débil.";
  if(/same.*password|different from the old/i.test(t))
    return "Esa es la contraseña que ya tenías.";
  if(/email not confirmed/i.test(t))
    return "Ese correo aún no está confirmado.";
  return t || "No se ha podido completar la operación.";
}

function generarCodigo(titulo){
  const base = (titulo||"CULT").normalize("NFD").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,4) || "CULT";
  return base.padEnd(4,"X") + "-" + String(Math.floor(1000+Math.random()*9000));
}

  let prog = await API.progreso(s.codigo) || {completos:0, en_curso:0};

        </div>
        <div style="display:flex;gap:30px;flex-wrap:wrap;margin-top:20px;align-items:flex-start">

            <div class="btnrow" style="margin-top:8px">

              <a class="btn ghost sm" href="?proy=${encodeURIComponent(s.codigo)}" target="_blank">Abrir proyección</a>
            </div></div>
          <div class="qr" id="qr"></div>
        </div>
      </div>

      <div class="card">
        <h2>Progreso</h2>
        <div class="contador"><b id="cn">${prog.completos}</b>
          <span>${s.n_convocados ? "de "+s.n_convocados+" convocados han terminado"
                                 : "personas han terminado"}</span></div>
        <div class="barra"><i id="cb" style="width:${prog.pct||0}%"></i></div>

        ${umbral ? `<div class="aviso" id="cav">${prog.completos>=umbral

        <div class="aviso">Puedes ver cuántos faltan, nunca quiénes. El contador cuenta envíos anónimos,
          no personas: si un cliente te pide la lista de quien no ha respondido, el sistema no puede saberlo.</div>
        <div class="btnrow">
          ${s.estado!=="abierta" ? `<button class="btn" id="abrir">Abrir sesión</button>` : ""}
          ${s.estado==="abierta" ? `<button class="btn ghost" id="cerrar">Cerrar sesión</button>` : ""}
          <button class="btn ghost" id="pub">${s.resultados_publicos?"Ocultar resultados":"Publicar resultados"}</button>
          ${API.demo() ? `<button class="btn ghost" id="ejemplo">Cargar 24 respuestas de ejemplo</button>
          <button class="btn ghost" onclick="borrarDemo()">Borrar datos de demostración</button>` : ""}
        </div>
      </div>

      ${s.modo==="directo" ? `<div class="card">
        <h2>Qué se proyecta</h2>
        <p class="small">Lo que marques aquí aparece en la pantalla de proyección. Los participantes

        <div class="vistas" id="vistas">${VISTAS_PROY.map(v=>
          `<button data-k="${v.k}" class="${s.vista_activa===v.k?"on":""}">${esc(v.t)}</button>`).join("")}</div>
      </div>` : ""}

      <div class="card">
        <h2>Resultados</h2>
        <div id="res"><p class="small">Cargando…</p></div>

          <button class="btn ghost" id="csv">Descargar CSV</button></div>
      </div></div>`;

    pintarQR("qr", urlPart, 5);
    const btn = id => document.getElementById(id);
    if(btn("abrir")) btn("abrir").onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {estado:"abierta", abierta_en:new Date().toISOString()}));

    const res = await API.resultados(s.codigo);

    if(res.error){

      datos = null; return;

    datos = res;
    const d = calcular(datosAMapa(res.datos));
    cont.innerHTML = `<p class="small">${res.n} envíos completos</p>

}
window.copiar = t => { navigator.clipboard && navigator.clipboard.writeText(t); };

/* ═══════════════════════════════════════════════════════════════════
   8 · PROYECTOS Y CONSULTAS — la vista que cruza sesiones

   donde se compara entre colectivos, entre encargos y entre sectores.
   ═══════════════════════════════════════════════════════════════════ */
let INV = [], SEL = new Set();

    ${navPrivada("#/admin/proyectos")}
    <div class="card">
      <h1>Proyectos y consultas</h1>

      <div class="grid2">
        <div class="field"><label for="f-org">Organización</label>
          <select id="f-org"><option value="">Todas</option>${

        <div class="field"><label for="f-sec">Sector</label>

        <button class="btn ghost" id="csvRes" disabled>CSV resumen</button>

      </div>

function filtradas(){
  const o=$("#f-org").value, se=$("#f-sec").value, e=$("#f-est").value, m=$("#f-modo").value;
  return INV.filter(x => (!o||x.organizacion===o) && (!se||x.sector===se)
                      && (!e||x.estado===e) && (!m||x.modo===m));
}
function pintarTabla(){
  const fs = filtradas();
  $("#tabla").innerHTML = fs.length ? `<table>
    <thead><tr><th style="width:34px"></th><th>Organización</th><th>Sesión</th>
      <th>Fecha</th><th>Modo</th><th>Estado</th><th>Envíos</th></tr></thead>
    <tbody>${fs.map(x=>`<tr>
      <td><input type="checkbox" data-id="${x.sesion_id}" ${SEL.has(x.sesion_id)?"checked":""}
        style="width:auto;min-height:0" aria-label="Seleccionar ${esc(x.sesion)}"></td>
      <td><span class="vecname">${esc(x.organizacion||"—")}</span>
        <div class="small">${esc(x.sector||"")}${x.consentimiento_agregado?"":" · sin cesión firmada"}</div></td>
      <td>${esc(x.sesion)}<div class="small"><code>${esc(x.codigo)}</code>${
        x.colectivo?" · "+esc(x.colectivo):""}</div></td>

function botones(){
  const n = SEL.size;
  ["comparar","csvDet","csvRes"].forEach(id=>{ const b=$("#"+id); if(b) b.disabled = n===0; });
  const c = $("#comparar"); if(c) c.textContent = n>1 ? `Comparar ${n} sesiones`
                                    : n===1 ? "Ver esta sesión" : "Comparar seleccionadas";
}

async function compararSeleccion(){
  const ids = [...SEL];
  $("#comp").innerHTML = `<div class="card"><p class="small">Calculando…</p></div>`;
  const filas = await API.resumenSesiones(ids);
  if(!filas.length){
    $("#comp").innerHTML = `<div class="card"><p class="small">Las sesiones seleccionadas
      todavía no tienen envíos completos.</p></div>`; return;
  }
  const porSesion = {};
  filas.forEach(f=>{
    const k = f.sesion_id;
    (porSesion[k] = porSesion[k] || {etiqueta:`${f.organizacion||""} · ${f.sesion||f.codigo}`,
      colectivo:f.colectivo, n:f.n_envios, vals:{}}).vals[f.vector] =
        {actual:Number(f.actual)||0, deseada:Number(f.deseada)||0,
         tension:Number(f.tension)||0};
  });
  const claves = Object.keys(porSesion);
  // escala común entre todas las sesiones: sin ella los radares engañan
  let max = 40;
  claves.forEach(k=>ORDEN.forEach(v=>{ const c=porSesion[k].vals[v]||{};
    max = Math.max(max, c.actual||0, c.deseada||0); }));
  max = Math.ceil(max/10)*10;

  $("#comp").innerHTML = `<div class="card">
    <h2>Comparación de ${claves.length} ${claves.length===1?"sesión":"sesiones"}</h2>
    <div class="legend">
      <span><i class="swatch" style="background:var(--actual)"></i>Cultura actual</span>
      <span><i class="swatch linea" style="background:var(--deseada)"></i>Cultura deseada</span></div>
    <p class="small">Los radares comparten escala 0–${max}, así que se pueden comparar entre sí.</p>
    <div class="multi">${claves.map((k,i)=>`
      <div class="mini"><h4>${esc(porSesion[k].etiqueta)}</h4>
        <div class="small">${porSesion[k].n} envíos${
          porSesion[k].colectivo?" · "+esc(porSesion[k].colectivo):""}</div>
        <div class="chartbox" id="cb-${i}"><svg id="cs-${i}" role="img"
          aria-label="Radar de ${esc(porSesion[k].etiqueta)}"></svg></div></div>`).join("")}</div>
    <h3>Tabla comparada</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Sesión</th><th>Envíos</th>${ORDEN.map(v=>
        `<th>${VEC[v].corto}</th>`).join("")}</tr></thead>
      <tbody>${claves.map(k=>`<tr><td>${esc(porSesion[k].etiqueta)}</td>
        <td>${porSesion[k].n}</td>${ORDEN.map(v=>{const c=porSesion[k].vals[v]||{};
          return `<td>${(c.actual||0).toFixed(0)} → ${(c.deseada||0).toFixed(0)}</td>`;}).join("")}
        </tr>`).join("")}</tbody></table></div>
  </div>`;
  claves.forEach((k,i)=>{
    const vals = {}; ORDEN.forEach(v=> vals[v] = porSesion[k].vals[v] || {actual:0,deseada:0});
    radarSVG(document.getElementById("cs-"+i), document.getElementById("cb-"+i), vals, max, true);
  });
  window._repinta = () => claves.forEach((k,i)=>{
    const vals = {}; ORDEN.forEach(v=> vals[v] = porSesion[k].vals[v] || {actual:0,deseada:0});
    radarSVG(document.getElementById("cs-"+i), document.getElementById("cb-"+i), vals, max, true);
  });
  document.getElementById("comp").scrollIntoView({behavior:"smooth", block:"start"});
}

async function descargarSeleccion(tipo){
  const ids = [...SEL];
  const filas = tipo === "detalle" ? await API.detalleSesiones(ids) : await API.resumenSesiones(ids);
  if(!filas.length){ alert("Las sesiones seleccionadas no tienen datos todavía."); return; }
  const cols = Object.keys(filas[0]).filter(c=>c!=="sesion_id" && c!=="organizacion_id");
  const csv = [cols.join(","), ...filas.map(r=>cols.map(c=>{
    const v = r[c]==null ? "" : String(r[c]);
    return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = `cultura-${tipo}-${ids.length}sesiones.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* Solo en modo demostración: rellena la sesión con un perfil sintético de
   organización pública consolidada —mucha Jerárquica, poca Innovadora— para
   poder ver funcionando la consola, la proyección y los radares. */
async function respuestasDeEjemplo(codigo, n){
  const base = {CD:{FAM:28,INN:12,RES:20,JER:40}, LO:{FAM:24,INN:10,RES:22,JER:44},
                GP:{FAM:30,INN:14,RES:18,JER:38}, CO:{FAM:32,INN:12,RES:18,JER:38},
                EE:{FAM:22,INN:14,RES:22,JER:42}, CE:{FAM:26,INN:12,RES:24,JER:38}};
  const obj  = {CD:{FAM:26,INN:32,RES:24,JER:18}, LO:{FAM:30,INN:28,RES:22,JER:20},
                GP:{FAM:32,INN:28,RES:22,JER:18}, CO:{FAM:30,INN:28,RES:22,JER:20},
                EE:{FAM:22,INN:34,RES:26,JER:18}, CE:{FAM:28,INN:28,RES:24,JER:20}};
  let s = 20260815;
  const rnd = () => (s = (s*1664525 + 1013904223) % 4294967296) / 4294967296;
  for(let i=0;i<n;i++){
    const envio = await API.abrirEnvio(codigo, {});
    for(const p of PANTALLAS){
      const ref = (p.pasada===0?base:obj)[p.sub];
      const bruto = ORDEN.map(v=>Math.max(0, ref[v] + (rnd()+rnd()-1)*16));
      const t = bruto.reduce((a,b)=>a+b,0);
      let c = bruto.map(x=>Math.round(x/t*10));
      let dif = 10 - c.reduce((a,b)=>a+b,0);
      while(dif !== 0){ const k = Math.floor(rnd()*4);
        if(dif>0){ c[k]++; dif--; } else if(c[k]>0){ c[k]--; dif++; } }
      const puntos = {}; ORDEN.forEach((v,k)=>puntos[v]=c[k]*10);
      await API.guardar(envio, p.orden.map((v,k)=>({pantalla:p.n, sub:p.sub, vector:v,
        pasada:p.pasada, posicion:k+1, puntos:puntos[v]})));
    }
    await API.cerrarEnvio(envio);
  }
}

function descargarCSV(s, res){
  if(!res || !res.datos){ alert("No hay resultados que descargar todavía."); return; }
  const cols = ["organizacion","sesion","codigo","modo","instrumento_version","n_envios",
                "pantalla","subcategoria","vector","pasada","media_puntos"];
  const filas = res.datos.map(r=>[ (s.organizacion||{}).nombre||"", s.titulo, s.codigo, s.modo,
    VERSION, res.n, r.pantalla, SUBS[r.sub], VEC[r.vector].nombre,
    r.pasada===0?"actual":"deseada", Number(r.media).toFixed(2) ]);
  const csv = [cols.join(","), ...filas.map(f=>f.map(v=>{
    const x = String(v==null?"":v); return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x;
  }).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "cultura-" + s.codigo + ".csv"; a.click(); URL.revokeObjectURL(a.href);
}

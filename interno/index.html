<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --actual:#5598e7; --deseada:#1c5cab;
  --radius:10px;
  /* Escala divergente de la matriz de robustez. Dos tonos y un gris neutro
     en el centro, porque 1 = perjudicial y 5 = muy valiosa son polos, no
     dos grados de lo mismo: el 3 es el cero de esa escala. */
  --div-neg:#d03b3b; --div-neg-suave:#ec835a; --div-medio:#f0efec;
  --div-pos-suave:#86b6ef; --div-pos:#1c5cab;
  /* Ocho tonos categóricos, en orden fijo. El orden no es decorativo: está
     elegido para que dos tonos consecutivos se distingan también con
     daltonismo. Ver la nota junto a `tonoDe()` en el código. */
  --tono-1:#1c5cab; --tono-2:#c26a1b; --tono-3:#2e8f6b; --tono-4:#b23a8c;
  --tono-5:#94861a; --tono-6:#7b52c8; --tono-7:#c0392b; --tono-8:#0d8ba6;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark; --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --actual:#6da7ec; --deseada:#256abf;
  --div-neg:#e8695c; --div-neg-suave:#a8543f; --div-medio:#2c2c2a;
  --div-pos-suave:#2f5f96; --div-pos:#6da7ec;
  --tono-1:#4d93e4; --tono-2:#c97f2e; --tono-3:#37a478; --tono-4:#c258a0;
  --tono-5:#95891f; --tono-6:#8f72d4; --tono-7:#d05740; --tono-8:#1a97b2;}}
:root[data-theme="dark"]{color-scheme:dark; --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --actual:#6da7ec; --deseada:#256abf;
  --div-neg:#e8695c; --div-neg-suave:#a8543f; --div-medio:#2c2c2a;
  --div-pos-suave:#2f5f96; --div-pos:#6da7ec;
  --tono-1:#4d93e4; --tono-2:#c97f2e; --tono-3:#37a478; --tono-4:#c258a0;
  --tono-5:#95891f; --tono-6:#8f72d4; --tono-7:#d05740; --tono-8:#1a97b2;}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 64px}
.wrap.ancho{max-width:1200px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font-size:13px;color:var(--text-secondary)}
.brand b{color:var(--text-primary);font-weight:600}
.iconbtn{background:none;border:1px solid var(--border);color:var(--text-secondary);
  border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.iconbtn:hover{color:var(--text-primary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;margin-bottom:16px}
h1{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:650}
h2{font-size:17px;margin:0 0 10px;font-weight:650}
h3{font-size:12.5px;margin:22px 0 8px;font-weight:650;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 12px;color:var(--text-secondary)} p.lead{color:var(--text-primary)}
small,.small{font-size:13px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--deseada);
  color:#fff;border:none;border-radius:8px;padding:13px 20px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;min-height:46px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;color:var(--text-secondary);border:1px solid var(--border);font-weight:500}
.btn.ghost:hover{color:var(--text-primary)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.progress{height:3px;background:var(--grid);border-radius:2px;overflow:hidden;margin:0 0 8px}
.progress i{display:block;height:100%;background:var(--deseada);border-radius:2px;transition:width .25s}
.phasetag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted)}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--plane);
  color:var(--text-primary);min-height:44px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hub{display:grid;gap:12px;margin:18px 0 0}
@media(min-width:720px){.hub{grid-template-columns:1fr 1fr}}
.hub a{display:block;text-decoration:none;color:inherit;background:var(--surface-1);
  border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 18px;transition:border-color .18s}
.hub a:hover{border-color:var(--deseada)}
.hub .et{display:block;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-secondary);margin:0 0 9px}
.hub b{display:block;font-size:17px;font-weight:650;line-height:1.2;margin:0 0 7px;color:var(--text-primary)}
.hub span.d{display:block;font-size:14px;line-height:1.45;color:var(--text-secondary)}
.hub .ir{display:block;margin-top:12px;font-size:13px;font-weight:600;color:var(--deseada)}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* reparto */
.restante{position:sticky;top:0;z-index:4;background:var(--surface-1);border-bottom:1px solid var(--grid);
  padding:12px 0;margin-bottom:4px;display:flex;align-items:baseline;gap:10px}
.restante b{font-size:26px;font-weight:650;line-height:1}
.restante.ok b{color:var(--deseada)}
.opt{padding:16px 0;border-bottom:1px solid var(--grid)}
.opt:last-child{border-bottom:none}
.opt p{margin:0 0 12px;color:var(--text-primary);font-size:15.5px;line-height:1.45}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{font-family:inherit;font-size:14px;font-weight:600;min-width:58px;min-height:46px;
  border:1px solid var(--border);background:var(--plane);color:var(--text-secondary);
  border-radius:8px;cursor:pointer;transition:all .12s}
.stepper button:hover:not(:disabled){border-color:var(--actual);color:var(--text-primary)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{min-width:66px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-1);
  font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.stepper .val.puesto{background:var(--deseada);border-color:var(--deseada);color:#fff}
.barmini{flex:1;align-self:center;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.barmini i{display:block;height:100%;background:var(--actual);border-radius:4px;transition:width .18s}

/* consola */
.codigo{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.14em;
  font-size:30px;color:var(--text-primary)}
.estado{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary)}
.estado.viva{color:#fff;background:var(--deseada);border-color:var(--deseada)}
.contador{display:flex;align-items:baseline;gap:9px;margin:4px 0 10px}
.contador b{font-size:40px;font-weight:650;line-height:1}
.barra{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--deseada);border-radius:4px;transition:width .4s}
.vistas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vistas button{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--plane);color:var(--text-secondary);
  border-radius:8px;padding:8px 11px;min-height:38px}
.vistas button:hover{color:var(--text-primary)}
.vistas button.on{background:var(--deseada);border-color:var(--deseada);color:#fff}
.qr{background:#fff;padding:12px;border-radius:10px;display:inline-block;line-height:0}
.qr img,.qr canvas{display:block}
.lista{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lista .it{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:13px 15px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.lista .it:last-child{border-bottom:none}
.lista .it b{font-weight:600}
.aviso{background:var(--plane);border:1px solid var(--border);border-left:3px solid var(--deseada);
  border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--text-secondary);margin-top:14px}
.aviso.rojo{border-left-color:#d03b3b}

/* resultados */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--plane);border:1px solid var(--border);border-radius:var(--radius);padding:15px;min-width:0}
.tile .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:5px}
.tile .val{font-size:28px;font-weight:650;line-height:1.1;overflow-wrap:anywhere}
.tile .val.word{font-size:19px}
.tile .sub{font-size:12.5px;color:var(--text-secondary);margin-top:4px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-secondary)}
.swatch{width:11px;height:11px;border-radius:50%;display:inline-block}
.swatch.linea{width:16px;height:3px;border-radius:2px}
.chartbox{position:relative} svg{display:block;width:100%;height:auto;font-family:inherit}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:16px;margin-top:6px}
.mini{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--plane)}
.mini h4{margin:0 0 2px;font-size:13.5px;font-weight:650;color:var(--text-primary)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:650}
td.ten{font-weight:650;color:var(--text-primary);white-space:nowrap}
td.ten i{font-style:normal;color:var(--text-muted);margin-left:6px;font-weight:500}
@media (max-width:560px){th,td{padding:9px 4px;font-size:13.5px} th{font-size:10px;letter-spacing:0}
  td.ten i u{display:none}}
.note{border-left:2px solid var(--axis);padding:2px 0 2px 14px;margin:18px 0 0;
  font-size:13.5px;color:var(--text-secondary)}
.hide{display:none} .vecname{font-weight:600;color:var(--text-primary)}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--plane);
  padding:1px 5px;border-radius:4px;border:1px solid var(--border)}

/* ── widgets del móvil: orden, ejes, matriz ─────────────────────── */
.fila-orden{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--grid)}
.fila-orden:last-child{border-bottom:none}
.fila-orden .pos{min-width:30px;height:30px;border-radius:15px;background:var(--plane);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-weight:650;font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.fila-orden .txt{flex:1;font-size:15px;line-height:1.35;color:var(--text-primary)}
.fila-orden .mueve{display:flex;gap:6px;flex:0 0 auto}
.fila-orden .mueve button{width:44px;height:44px;border:1px solid var(--border);
  border-radius:8px;background:var(--plane);color:var(--text-secondary);
  font-size:17px;cursor:pointer;font-family:inherit}
.fila-orden .mueve button:disabled{opacity:.3;cursor:not-allowed}

.tablero{position:relative;width:100%;aspect-ratio:1;background:var(--surface-1);
  border:1px solid var(--axis);border-radius:var(--radius);margin:10px 0;
  touch-action:manipulation;overflow:hidden}
.tablero .cruz{position:absolute;background:var(--grid)}
.tablero .cruz.h{left:0;right:0;top:50%;height:1px}
.tablero .cruz.v{top:0;bottom:0;left:50%;width:1px}
.tablero .punto{position:absolute;width:16px;height:16px;border-radius:8px;
  background:var(--deseada);box-shadow:0 0 0 2px var(--surface-1);
  transform:translate(-50%,-50%);pointer-events:none}
.tablero .punto.otro{background:var(--axis);width:11px;height:11px;border-radius:6px}
.tablero .marca{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  font-size:12px;font-weight:600;color:var(--text-primary);
  background:var(--surface-1);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.ejes-x{display:flex;justify-content:space-between;gap:10px}
.ejes-y{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chips button{font-family:inherit;font-size:13.5px;padding:9px 12px;min-height:40px;
  border:1px solid var(--border);border-radius:8px;background:var(--plane);
  color:var(--text-secondary);cursor:pointer}
.chips button.foco{background:var(--deseada);border-color:var(--deseada);color:#fff;font-weight:600}
.chips button.puesto{color:var(--text-primary);border-color:var(--axis)}

.cel-fila{padding:14px 0;border-bottom:1px solid var(--grid)}
.cel-fila:last-child{border-bottom:none}
.cel-fila > b{display:block;font-size:15.5px;margin-bottom:8px;color:var(--text-primary)}
.cel-col{margin:9px 0}
.cel-col .small{margin-bottom:4px;display:block}
.cel-col .nums{display:flex;gap:5px}
.cel-col .nums button{flex:1;min-height:44px;font-family:inherit;font-size:14px;
  border:1px solid var(--border);border-radius:8px;background:var(--plane);
  color:var(--text-secondary);cursor:pointer}
.cel-col .nums button.on{background:var(--deseada);border-color:var(--deseada);
  color:#fff;font-weight:650}

/* opciones con definición */
.opcion{margin:7px 0}
.opcion details{margin:4px 0 0 2px}
.opcion details summary{font-size:13px;color:var(--text-muted);cursor:pointer;
  padding:5px 2px;list-style:none}
.opcion details summary::-webkit-details-marker{display:none}
.opcion details summary::before{content:"▸ ";font-size:11px}
.opcion details[open] summary::before{content:"▾ "}
.opcion details p{margin:2px 0 8px;padding-left:12px;border-left:2px solid var(--grid)}

/* taller proyectado */
.taller2{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
@media (max-width:900px){.taller2{grid-template-columns:1fr}}
.taller2 h3{font-size:15px;margin:0 0 14px}
.fila-taller{display:flex;align-items:baseline;gap:14px;padding:11px 0;
  border-bottom:1px solid var(--grid)}
.fila-taller i{width:13px;height:13px;border-radius:7px;flex:0 0 auto;align-self:center}
.fila-taller span{flex:1;font-size:21px;line-height:1.3;color:var(--text-primary)}
.fila-taller b{font-size:26px;font-variant-numeric:tabular-nums}
.funciones{display:grid;grid-template-columns:1fr 1fr;gap:22px 40px;margin-top:24px}
@media (max-width:1000px){.funciones{grid-template-columns:1fr}}
.fun{display:flex;gap:16px;align-items:baseline}
.fun > b{font-size:38px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.fun h3{font-size:23px;margin:0 0 4px;color:var(--text-primary);text-transform:none;
  letter-spacing:0}
.fun p{font-size:17px;margin:0;line-height:1.4}

/* ── INFORME Y ACTA · maquetación de entregable ──────────────────────
   Lo que se imprime no es la pantalla. En pantalla mandan las tarjetas,
   el contraste alto y el ancho cómodo; en papel mandan la jerarquía
   tipográfica, el blanco y el filete fino. Por eso el bloque de impresión
   de abajo no ajusta cuatro márgenes: rehace la página.

   La serif es de sistema y no de Google Fonts a propósito. Un enlace a un
   servidor de tipografías es una dependencia de red en una sala con mal
   wifi, y el día que falle el informe sale en Times sin que nadie lo haya
   decidido. Esta pila da Iowan o Palatino en un Mac, Georgia en Windows y
   Linux: tres serif de texto correctas, y ninguna sorpresa. */
.doc{--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

.doc .informe-cab{padding:34px 30px}
.doc .filete{height:2px;width:54px;background:var(--text-primary);margin-bottom:22px}
.doc .informe-cab .org{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-secondary);font-weight:650;margin:0 0 12px}
.doc .informe-cab h1{font-family:var(--serif);font-size:38px;line-height:1.12;
  font-weight:600;letter-spacing:-.012em;margin:0;max-width:17em}
.doc .informe-cab .sub{font-family:var(--serif);font-size:19px;font-style:italic;
  color:var(--text-secondary);margin:12px 0 0}
.doc .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:16px 28px;margin:28px 0 0;padding-top:20px;border-top:1px solid var(--border)}
.doc .meta dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);margin:0 0 5px}
.doc .meta dd{margin:0;font-size:16px;color:var(--text-primary);
  font-variant-numeric:tabular-nums}
.doc .contenido{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--border)}
.doc .contenido h3{margin:0 0 10px}
.doc .contenido ol{list-style:none;margin:0;padding:0;columns:2;column-gap:34px}
.doc .contenido li{display:flex;gap:10px;font-size:14px;padding:5px 0;
  color:var(--text-secondary);break-inside:avoid}
.doc .contenido li b{color:var(--text-muted);font-weight:500;
  font-variant-numeric:tabular-nums}

.doc .informe-bloque{padding:30px}
.doc .informe-bloque .num{font-family:var(--serif);font-size:13px;letter-spacing:.14em;
  color:var(--text-muted);display:block;margin-bottom:6px}
.doc .informe-bloque h2{font-family:var(--serif);font-size:27px;font-weight:600;
  line-height:1.22;letter-spacing:-.006em;max-width:25em}
.doc .informe-bloque > p, .doc .informe-bloque .aviso{max-width:40em}
.informe-bloque .enun{font-size:18px;padding:11px 0}
.informe-bloque .barra{height:12px}
.informe-bloque .mapa{max-height:none}

/* Las respuestas escritas, agrupadas por lo que se preguntó. */
/* El mapa de los cuatro escenarios. La rejilla es 2×2 y el orden del DOM
   es arriba-izquierda, arriba-derecha, abajo-izquierda, abajo-derecha. */
.mapa-esc{margin-top:20px}
.mapa-esc .eje{font-size:13.5px;color:var(--text-secondary);text-align:center;
  padding:8px 0}
.mapa-esc .eje b{color:var(--text-primary)}
.mapa-esc .cuadros{display:grid;grid-template-columns:1fr;gap:2px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden}
@media (min-width:720px){ .mapa-esc .cuadros{grid-template-columns:1fr 1fr} }
.cuad{background:var(--surface-1);padding:20px 18px;min-height:120px}
.cuad.vacio{min-height:60px}
.cuad-k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);font-weight:650}
.cuad h3{font-size:21px;margin:6px 0 0;color:var(--text-primary);
  text-transform:none;letter-spacing:0;font-weight:650}
.cuad .lema{font-size:16px;font-style:italic;color:var(--text-secondary);margin:6px 0 0}
.cuad .tramo{margin-top:14px}
.cuad .tramo b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:3px}
.cuad .tramo p{margin:0;font-size:15px;color:var(--text-primary);line-height:1.45}

/* Las pantallas del taller de escenarios: seis preguntas y sus huecos. A
   partir de tablet van a dos columnas; en un móvil, apiladas. */
.dos-col{display:grid;grid-template-columns:1fr;gap:0 26px}
@media (min-width:760px){ .dos-col{grid-template-columns:1fr 1fr} }
.dos-col .field{margin-bottom:18px}
.dos-col textarea{min-height:96px}

.grupo-txt{margin-top:26px;break-inside:auto}
.grupo-txt h4{display:flex;align-items:baseline;gap:9px;margin:0 0 8px;
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;
  color:var(--text-secondary)}
.grupo-txt h4 span{font-size:11px;font-weight:500;letter-spacing:0;
  color:var(--text-muted);font-variant-numeric:tabular-nums}
.grupo-txt ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.grupo-txt li{position:relative;max-width:46em;padding:9px 0 9px 18px;
  border-bottom:1px solid var(--border);font-size:16.5px;line-height:1.45;
  color:var(--text-primary);break-inside:avoid}
.grupo-txt li::before{content:"";position:absolute;left:2px;top:.92em;
  width:5px;height:5px;border-radius:50%;background:var(--axis)}

/* Un colofón al final y no un pie corrido en cada página. Un pie que se
   repita exige cajas de margen de @page, que Chrome no implementa; los
   elementos fijos salen una sola vez y en el sitio equivocado. Antes que un
   pie que aparece a media página, ninguno. Los números de página los pone
   el propio navegador si se marca «Encabezados y pies de página». */
.pie-doc{display:none}


/* proyección */
.proy{max-width:1200px;margin:0 auto;padding:34px 30px}
.proy .leyenda{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:18px}
.proy .leyenda span{display:inline-flex;align-items:center;gap:7px;font-size:16px;
  color:var(--text-secondary)}
.proy .leyenda i{width:14px;height:14px;border-radius:3px;display:inline-block}
.mapa{width:100%;height:auto;max-height:64vh;display:block;margin:14px auto 0}
.mapa .rejilla{stroke:var(--grid);stroke-width:1}
.mapa .eje{stroke:var(--axis);stroke-width:1.5}
.mapa .halo{fill:var(--actual);opacity:.16}
.mapa .pt{fill:var(--deseada);stroke:var(--surface-1);stroke-width:2}
.mapa .rot{font-size:21px;fill:var(--text-primary);font-weight:600}
.mapa .ejetxt{font-size:18px;fill:var(--text-muted)}
/* Índice del entregable: tres enlaces en una fila, discreto. No es una
   navegación por pestañas a propósito: en un documento que se va a imprimir,
   esconder dos tercios detrás de un clic es exactamente lo contrario de lo
   que hace falta. Aquí solo lleva el ojo al sitio. */
.indice{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px}
.indice a{font-size:13.5px;text-decoration:none;color:var(--text-secondary);
  border:1px solid var(--border);border-radius:999px;padding:6px 14px}
.indice a:hover{color:var(--text-primary);border-color:var(--text-secondary)}
/* Un taller dentro de la lista de preguntas. Se distingue con un borde a
   la izquierda, no con un color de fondo: en una lista de veinte filas, un
   bloque de color pesa más que la información que lleva dentro. */
.taller-fila{border-left:3px solid var(--tono-6);padding-left:14px}
/* Tabla de pares: el alcance del modelo de liderazgo, y cualquier otra
   cosa que sean dos columnas de texto y un mando de filas al final. */
/* La fila de ordenar, cuando su elemento trae definición desplegable. */
.fila-orden .txt details{margin-top:6px}
.fila-orden .txt details p{margin:6px 0 0}
.fila-orden{align-items:flex-start}
.fila-orden .pos,.fila-orden .mueve{flex:0 0 auto}
.pares{width:100%;border-collapse:collapse;margin-top:14px}
.pares th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-secondary);text-align:left;padding:0 8px 8px 0;font-weight:600}
.pares td{padding:0 8px 8px 0;vertical-align:top;text-align:left}
/* Solo en la tabla EDITABLE: la última columna es el mando de filas y no
   debe partirse. En la de lectura, esa misma última columna es una frase
   de veinte palabras, y `nowrap` la sacaba de la pantalla del móvil. */
.pares:not(.leida) td:last-child{width:1%;white-space:nowrap;padding-right:0}
.pares input{margin:0}
.pares .mueve{display:flex;gap:4px;padding-top:4px}
/* En un móvil dos columnas de texto no caben: cada fila pasa a bloque. */
@media (max-width:640px){
  .pares:not(.leida), .pares:not(.leida) tr, .pares:not(.leida) td{display:block;width:auto}
  .pares thead, .pares th{display:none}
  .pares:not(.leida) tr{border-bottom:1px solid var(--grid);
    padding-bottom:10px;margin-bottom:10px}
  .pares:not(.leida) td:last-child{width:auto}
}
/* La misma tabla, ya sin editar: acta, proyección y encuesta.
   `table-layout:fixed` + `overflow-wrap` porque la segunda columna lleva
   una frase de veinte palabras: sin eso la tabla se ensancha hasta lo que
   mida la frase más larga y en un móvil de 390 px se sale de la pantalla.
   Lo detectó la prueba midiendo el desborde, no el ojo. */
.pares.leida{table-layout:fixed}
.pares.leida td{padding:10px 14px 10px 0;border-bottom:1px solid var(--grid);font-size:17px;
  overflow-wrap:anywhere}
.pares.leida td:first-child{font-weight:650;width:40%}
/* En el móvil, cada par se lee como un bloque: etiqueta arriba, nivel
   debajo. Dos columnas de texto en 390 px no son dos columnas. Todo el
   árbol de la tabla pasa a bloque —table, thead, tbody, tr, td— porque
   dejar uno solo en `display:table*` basta para que el ancho lo siga
   marcando el contenido y la tabla se salga de la pantalla. */
@media (max-width:640px){
  .pares.leida,.pares.leida tbody,.pares.leida tr,.pares.leida td{
    display:block;width:auto;max-width:100%}
  .pares.leida thead{display:none}
  .pares.leida tr{border-bottom:1px solid var(--grid);padding:8px 0}
  .pares.leida td{border-bottom:0;padding:0 0 2px}
  .pares.leida td:last-child{color:var(--text-secondary)}
}
.matriz{width:100%;border-collapse:separate;border-spacing:2px;margin-top:18px}
.matriz th{font-size:16px;font-weight:600;color:var(--text-secondary);text-align:left;
  padding:6px 8px;vertical-align:bottom}
.matriz td{padding:14px 10px;border-radius:6px;font-size:24px;font-weight:650;
  text-align:center;font-variant-numeric:tabular-nums}
.matriz td.et{background:none;font-size:17px;font-weight:600;text-align:left;
  color:var(--text-primary);padding-left:0}
/* Los cinco pasos de la escala divergente llevan su color de texto escrito
   a mano, y no un token: el mismo fondo pide tinta blanca en claro y negra
   en oscuro, porque la rampa se invierte entre los dos modos. */
.c-nn{background:#d03b3b;color:#fff}
.c-n {background:#ec835a;color:#0b0b0b}
.c-0 {background:#f0efec;color:#52514e}
.c-p {background:#86b6ef;color:#0b0b0b}
.c-pp{background:#1c5cab;color:#fff}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])) .c-nn{background:#e8695c;color:#0b0b0b}
  :root:where(:not([data-theme="light"])) .c-n {background:#a8543f;color:#fff}
  :root:where(:not([data-theme="light"])) .c-0 {background:#2c2c2a;color:#c3c2b7}
  :root:where(:not([data-theme="light"])) .c-p {background:#2f5f96;color:#fff}
  :root:where(:not([data-theme="light"])) .c-pp{background:#6da7ec;color:#0b0b0b}}
:root[data-theme="dark"] .c-nn{background:#e8695c;color:#0b0b0b}
:root[data-theme="dark"] .c-n {background:#a8543f;color:#fff}
:root[data-theme="dark"] .c-0 {background:#2c2c2a;color:#c3c2b7}
:root[data-theme="dark"] .c-p {background:#2f5f96;color:#fff}
:root[data-theme="dark"] .c-pp{background:#6da7ec;color:#0b0b0b}
.proy .leyenda i.c-0{border:1px solid var(--axis)}
.nube{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;justify-content:center;
  margin-top:26px;max-width:1000px;margin-left:auto;margin-right:auto}
.nube span{color:var(--text-primary);line-height:1.05;white-space:nowrap}
.nube span.flojo{color:var(--text-secondary)}
.nube span i{font-style:normal;font-size:14px;color:var(--text-muted);margin-left:5px;
  vertical-align:super}

/* nube de puntos: una persona, un punto */
.rejilla-op{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:26px 30px;margin-top:24px}
.op-celda{display:flex;flex-direction:column;justify-content:flex-end;min-height:150px}
.op-puntos{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-end;margin-bottom:12px;
  max-width:210px}
.op-puntos i{display:block;border-radius:50%;background:var(--deseada)}
.op-pie{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--grid);
  padding-top:9px}
.op-pie b{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;min-width:44px}
.op-pie span{font-size:15px;color:var(--text-secondary);line-height:1.25}

/* escalas con dispersión */
/* ═══ Escalas: un solo color y tres densidades ═══════════════════════
   Antes cada fila salía de un color distinto de la paleta de ocho. En
   una pantalla con cuatro enunciados eso son cuatro colores saturados
   que no significan nada —el color no codifica ningún dato, solo
   distingue filas que ya están separadas y rotuladas—, y en un
   instrumento de ocho pantallas seguidas cansa la vista. Ahora todas
   las filas van en el color de la casa; lo que distingue una fila de
   otra es su rótulo y su posición, que es lo que hay que mirar.
   ═══════════════════════════════════════════════════════════════════ */
.esc-fila{margin:0 0 30px}
.esc-fila h4{margin:0 0 4px;font-size:22px;font-weight:600;color:var(--text-primary)}
.esc-caja{position:relative}
.esc-bloque.es-denso .esc-fila{position:relative}
.esc-den{display:block;width:100%;height:70px}
.esc-den path{fill:var(--deseada);opacity:.3}
.esc-hueco{height:70px}

/* Cuatro a seis filas: se recorta el alto de la silueta y el aire entre
   filas, sin bajar del tamaño que se lee desde el fondo de una sala. */
.esc-bloque.es-medio .esc-fila{margin:0 0 18px}
.esc-bloque.es-medio .esc-fila h4{font-size:19px}
.esc-bloque.es-medio .esc-den,
.esc-bloque.es-medio .esc-hueco{height:44px}
.esc-bloque.es-medio .esc-bola{min-width:46px;height:32px;border-radius:16px;font-size:17px}
.esc-bloque.es-medio .esc-anclas{margin-top:10px;padding-bottom:26px}

/* Siete o más: la matriz de importancia del radar y poco más. Aquí ya
   manda que quepan todas juntas, porque compararlas ES la pregunta. */
/* En modo denso el rótulo se mete DENTRO de la caja, encima de la
   silueta, en vez de ocupar su propia línea. Son unos veinte píxeles
   por fila y con ocho filas es la diferencia entre caber en la
   pantalla y no caber. La silueta va al 30 % de opacidad, así que el
   texto encima se lee sin problema; se le limita el ancho para que no
   llegue nunca a la bola de la media. */
.esc-bloque.es-denso .esc-fila{margin:0 0 14px}
.esc-bloque.es-denso .esc-caja{padding-top:2px}
.esc-bloque.es-denso .esc-fila h4{position:absolute;top:0;left:0;z-index:2;
  font-size:16px;line-height:1.2;margin:0;max-width:62%;
  text-shadow:0 1px 3px var(--plane)}
.esc-bloque.es-denso .esc-den,
.esc-bloque.es-denso .esc-hueco{height:30px}
.esc-bloque.es-denso .esc-via{height:10px}
.esc-bloque.es-denso .esc-bola{min-width:42px;height:28px;border-radius:14px;font-size:15px}
.esc-bloque.es-denso .esc-anclas{margin-top:8px;padding-bottom:24px}
.esc-bloque.es-denso .esc-anclas span{font-size:15px}
.esc-via{position:relative;height:12px;border-radius:6px;background:var(--grid)}
.esc-via i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--deseada);
  transition:width .5s}
.esc-bola{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:52px;height:38px;
  border-radius:19px;background:var(--deseada);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 3px var(--plane);transition:left .5s}
.esc-media{position:absolute;top:0;bottom:0;width:1px;background:var(--axis);pointer-events:none}
.esc-anclas{position:relative;display:flex;justify-content:space-between;gap:16px;
  margin-top:14px;padding-bottom:30px}
.esc-anclas .esc-chip{position:absolute;top:32px;transform:translateX(-50%)}
.esc-anclas span{font-size:17px;color:var(--text-muted)}
.esc-chip{display:inline-flex;align-items:center;justify-content:center;padding:3px 11px;
  border-radius:12px;background:var(--surface-1);border:1px solid var(--border);
  font-size:14px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.envivo{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--text-muted)}
.envivo b{width:9px;height:9px;border-radius:5px;background:#2e8f6b;display:inline-block;
  animation:latido 1.6s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){
  .envivo b{animation:none} .esc-via i,.esc-bola{transition:none}}
.proy h1{font-size:40px;margin-bottom:18px}
.proy .codigo{font-size:64px}
.proy .contador b{font-size:64px}
.proy .enun{font-size:23px;line-height:1.45;color:var(--text-primary);
  padding:16px 0;border-bottom:1px solid var(--grid)}
.proy .enun:last-child{border-bottom:none}

/* ── EL CIERRE: ACCIONES Y CUADRO DE VIGILANCIA ─────────────────────
   Tres estados, y NUNCA solo el color. Cada uno lleva su forma y su
   palabra al lado, por dos razones: en la sala hay gente que no
   distingue el verde del rojo, y el proyector de un aula no es la
   pantalla en la que yo elegí el tono. Si el color se cae, el panel
   se sigue leyendo.

   Los tres tonos son propios y no salen de la escala categórica: un
   estado no es una serie más, y reutilizar el tono-3 para «en calma»
   haría que el día que alguien pinte una gráfica de tres series, una
   de ellas parezca un semáforo. */
:root{
  --sem-calma:#3b7d5f; --sem-atencion:#b8760d; --sem-activada:#b0342b;
  --sem-calma-f:#e8f2ec; --sem-atencion-f:#f8efdc; --sem-activada-f:#f8e6e3;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  --sem-calma:#4fa87f; --sem-atencion:#d99a2b; --sem-activada:#e26a5a;
  --sem-calma-f:#1b2c24; --sem-atencion-f:#2e2513; --sem-activada-f:#2e1a17;}}
:root[data-theme="dark"]{
  --sem-calma:#4fa87f; --sem-atencion:#d99a2b; --sem-activada:#e26a5a;
  --sem-calma-f:#1b2c24; --sem-atencion-f:#2e2513; --sem-activada-f:#2e1a17;}

.sem{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px}
.sem i{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.sem.calma   {color:var(--sem-calma);    background:var(--sem-calma-f)}
.sem.calma i {background:var(--sem-calma)}
/* La forma cambia con el estado, no solo el tono: círculo, rombo, cuadrado. */
.sem.atencion   {color:var(--sem-atencion); background:var(--sem-atencion-f)}
.sem.atencion i {background:var(--sem-atencion);border-radius:2px;transform:rotate(45deg)}
.sem.activada   {color:var(--sem-activada); background:var(--sem-activada-f)}
.sem.activada i {background:var(--sem-activada);border-radius:2px}

.tabla-cierre{width:100%;border-collapse:collapse;margin-top:14px}
.tabla-cierre th{text-align:left;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted);font-weight:600;
  padding:0 10px 8px 0;border-bottom:1px solid var(--grid)}
.tabla-cierre td{padding:10px 10px 10px 0;border-bottom:1px solid var(--grid);
  vertical-align:top;font-size:14.5px}
.tabla-cierre td input, .tabla-cierre td select, .tabla-cierre td textarea{
  width:100%;min-width:0;box-sizing:border-box}
.tabla-cierre .col-mini{width:1%}
.candidatos{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.candidatos button{font-size:13px}

/* En la pared. Tamaños de sala, no de escritorio. */
.proy .acciones{margin-top:24px}
.proy .acciones .acc{display:grid;grid-template-columns:auto 1fr;gap:0 22px;
  padding:20px 0;border-bottom:1px solid var(--grid)}
.proy .acciones .acc:last-child{border-bottom:none}
.proy .acciones .acc b.n{font-size:34px;color:var(--text-muted);line-height:1.1}
/* Sin la mayúscula que el `h3` general le pone a todo: aquí un h3 es una
   frase entera, y una frase entera en mayúsculas se lee más despacio, que
   es lo contrario de lo que hace falta desde el fondo de una sala. */
.proy .acciones .acc h3{font-size:30px;margin:0;line-height:1.25;font-weight:600;
  color:var(--text-primary);text-transform:none;letter-spacing:0}
.proy .acciones .acc .pie{margin-top:8px;font-size:20px;color:var(--text-secondary)}
.proy .vigila{margin-top:24px}
.proy .vigila .ind{padding:18px 0;border-bottom:1px solid var(--grid);
  display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:start}
.proy .vigila .ind:last-child{border-bottom:none}
.proy .vigila .ind h3{font-size:26px;margin:0;line-height:1.25;font-weight:600;
  color:var(--text-primary);text-transform:none;letter-spacing:0}
.proy .vigila .ind .pie{margin-top:6px;font-size:18px;color:var(--text-secondary)}
.proy .vigila .sem{font-size:18px;padding:6px 16px 6px 12px}
.proy .vigila .sem i{width:16px;height:16px}
/* En la pared los cuadrantes ocupan alto: un mapa de cuatro futuros
   apretado en el tercio de arriba de una pantalla de tres metros parece
   una nota al pie. */
.proy .mapa-esc .cuad{min-height:27vh;display:flex;flex-direction:column;
  justify-content:center;padding:26px 24px}
.proy .mapa-esc .cuad.vacio{min-height:27vh}
.proy .mapa-esc .cuad h3{font-size:34px}
.proy .mapa-esc .cuad .lema{font-size:23px}
.proy .mapa-esc .cuad .tramo p{font-size:19px}
.proy .mapa-esc .eje{font-size:19px}
.proy .mapa-esc .cuad-k{font-size:13px}

/* El bloque de impresión va el ÚLTIMO del hoja de estilo a propósito.
   Con la misma especificidad gana la regla que se declara después, y estaba
   antes de `.matriz td{font-size:24px}`: los tamaños de pantalla ganaban a
   los de papel y la tabla salía con cifras de tablero en un informe. */
@media print{
  /* Se imprime en claro aunque el navegador esté en oscuro. Sin esto, quien
     tenga el sistema en modo oscuro se llevaba un PDF con el texto blanco
     sobre el papel blanco. */
  :root, :root[data-theme="dark"]{
    --surface-1:#fff; --plane:#fff;
    --text-primary:#0b0b0b; --text-secondary:#3d3c39; --text-muted:#75736d;
    --grid:#e4e3dd; --axis:#bfbeb3; --border:rgba(11,11,11,0.16);
    --actual:#5598e7; --deseada:#1c5cab;
    --div-neg:#d03b3b; --div-neg-suave:#ec835a; --div-medio:#f0efec;
    --div-pos-suave:#86b6ef; --div-pos:#1c5cab;
    --tono-1:#1c5cab; --tono-2:#c26a1b; --tono-3:#2e8f6b; --tono-4:#b23a8c;
    --tono-5:#94861a; --tono-6:#7b52c8; --tono-7:#c0392b; --tono-8:#0d8ba6;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:18mm 16mm 22mm}
  body{background:#fff;font-size:11.5pt;line-height:1.45}
  .no-imprimir, header.top, .vistas{display:none !important}
  .card{border:none;padding:0;margin:0 0 10mm;break-inside:avoid;background:none}
  .wrap{max-width:none;padding:0}
  .esc-den, .mapa{max-height:none}

  /* La portada, una página entera para ella sola. */
  .doc .informe-cab{padding:0;break-after:page;margin:0;
    min-height:246mm;display:flex;flex-direction:column}
  .doc .meta{margin-top:auto}
  .doc .informe-cab h1{font-size:30pt}
  .doc .informe-cab .sub{font-size:13.5pt}
  .doc .contenido ol{columns:1}

  /* Y cada bloque, separado por un filete y no por una caja. */
  .doc .informe-bloque{padding:8mm 0 0;margin:0 0 10mm;
    border-top:1px solid var(--border)}
  .doc .informe-bloque h2{font-size:17pt}
  .doc .informe-bloque .num{font-size:9pt}
  h2, h3, h4{break-after:avoid}
  p, li{orphans:3;widows:3}
  .grupo-txt li{font-size:10.5pt;padding:6px 0 6px 15px}
  /* La escala, en papel, es un dato dentro de una sección y no el titular
     de la pantalla: su rótulo baja a etiqueta y la vía adelgaza. */
  .doc .esc-fila{margin-bottom:7mm}
  .doc .esc-fila h4{font-size:8.5pt;letter-spacing:.1em;text-transform:uppercase;
    font-weight:650;color:var(--text-secondary);margin-bottom:6px}
  .doc .esc-via{height:8px}
  .doc .esc-bola{min-width:38px;height:26px;font-size:10pt}
  .doc .esc-anclas span{font-size:8.5pt}
  .matriz th{font-size:8.5pt;letter-spacing:.06em}
  .matriz td{font-size:13pt;padding:8px 6px}
  .matriz td.et{font-size:10.5pt;width:32%}
  /* Una tabla larga se parte, y la segunda página no puede salir con
     columnas de cifras sin rótulo. El navegador repite la cabecera si es
     un thead de verdad y se le pide explícitamente. */
  .matriz thead{display:table-header-group}
  .matriz tbody tr{break-inside:avoid}
  /* Y el radar entero en una página: partido por la mitad no es un
     gráfico, son dos medias lunas. */
  .informe-bloque svg{break-inside:avoid}

  /* Los sellos del semáforo, en papel. El navegador no imprime fondos por
     omisión —y a una impresora de oficina en blanco y negro le da igual lo
     que yo pida—, así que en papel el estado se dibuja con línea y no con
     relleno: el aro, el rombo y el cuadrado siguen distinguiéndose aunque
     salga todo en gris, y la palabra sigue ahí al lado. */
  /* Con la MISMA especificidad que las reglas de pantalla, no menos. Con
     `.sem{background:none}` a secas, `.sem.activada{background:…}` gana por
     ser más específica aunque esta venga después y esté dentro de @media
     print, y el sello salía con su relleno de color. Ya me pasó con la
     matriz: en CSS, «viene después» solo desempata a igualdad. */
  .sem.calma, .sem.atencion, .sem.activada{
    background:none;border:1px solid currentColor;padding:1px 8px 1px 6px;
    font-size:8.5pt}
  .sem.calma i, .sem.atencion i, .sem.activada i{
    background:none;border:1.5px solid currentColor;width:8px;height:8px}
  .sem.calma i{border-radius:50%}
  .sem.atencion i{border-radius:1px;transform:rotate(45deg)}
  .sem.activada i{border-radius:1px}
  /* Los cuatro cuadrantes, en dos columnas también en papel. La regla de
     pantalla que los pone en 2×2 va condicionada a `min-width:720px`, y una
     A4 con márgenes no llega: se apilaban en una columna. Un mapa de dos
     ejes apilado en vertical ya no es un mapa —la posición de cada cuadro
     ES la mitad de la información— y quien lo leyera en el PDF no tendría
     forma de saber cuál estaba arriba a la derecha. */
  .doc .mapa-esc .cuadros{grid-template-columns:1fr 1fr}
  .doc .mapa-esc .eje{font-size:9pt}
  .doc .mapa-esc .cuad{border:1px solid var(--border);padding:5mm;min-height:0}
  .doc .mapa-esc .cuad h3{font-size:13pt}
  .doc .mapa-esc .cuad .lema{font-size:10.5pt}
  .doc .mapa-esc .cuad .tramo p{font-size:10pt}

  .doc .informe-bloque:last-of-type{margin-bottom:0}
  .pie-doc{display:flex;justify-content:space-between;gap:14px;
    border-top:1px solid var(--border);padding-top:3mm;margin-top:6mm;
    font-size:8.5pt;color:var(--text-muted);break-inside:avoid;break-before:avoid}
}

</style>

   solo su número: en una sala no te acuerdas de que la 8 es «LO deseada». */
function etiquetaTecho(n){

  if(n === 0)   return "nadie puede empezar todavía";

  async abrirEnvio(codigo, segmentos){

/* La cabecera dice dos cosas distintas según quién mira.
   En tu lado dice de quién es la casa. En la sala —móvil del participante y
   proyector— dice qué está respondiendo la gente, y ese nombre NO puede estar
   escrito a mano: sale de la propia sesión (`instrumento`), porque el día que
   pases liderazgo o escenarios la cabecera tiene que cambiar sola. */
function enLaSala(){
  const p = params();
  return !!(p.get("s") || p.get("proy"));
}
let _instrumento = null;          // {clave, version} de la sesión que se mira
function recordarInstrumento(s){
  if(s && s.existe !== false && s.instrumento){
    _instrumento = {clave:s.instrumento, version:s.version || null};
    document.title = nombreInstrumento(_instrumento.clave);
    const el = document.querySelector(".brand");
    if(el && enLaSala()) el.innerHTML = marcaSala();
  }
}
function nombreInstrumento(clave){
  if(!clave) return "Diagnóstico";
  // La base de datos guarda variantes con sufijo —«cultura-cvf» es la del
  // marco de valores en competencia—, así que se compara también por la
  // raíz. Sin esto, la sala veía «Diagnóstico» a secas.
  const raiz = String(clave).split("-")[0];
  const m = (typeof MODULOS !== "undefined")
    ? MODULOS.find(x => x.k === clave) || MODULOS.find(x => x.k === raiz) : null;
  // `publico` es el nombre que ve la sala; `nombre` el de tu consola.
  return m ? (m.publico || m.nombre) : "Diagnóstico";
}
function marcaSala(){
  if(!_instrumento) return `<b>Diagnóstico</b>`;
  return `<b>${esc(nombreInstrumento(_instrumento.clave))}</b>`
       + (_instrumento.version ? ` · v${esc(_instrumento.version)}` : "");
}
function cabecera(extra){

                           : `<b>Consola de proyectos</b> de joaquinromero.com`;
  /* La salida a la web publica va en la cabecera, pero solo fuera de
     sesion: a quien esta participando en una sala no se le pone delante

      API.demo() ? ' · <span style="color:#d03b3b">modo demostración</span>' : ''}</div>
    <div style="display:flex;gap:8px;align-items:center">${extra||""}${salida}

}
window.alternarTema = () => {
  const a = document.documentElement.getAttribute("data-theme");
  const o = a ? a==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", o ? "light":"dark");
  if(window._repinta) window._repinta();
};

function calcular(mapa){   // mapa[pantalla][vector] = puntos
  const out = {sub:{}, gen:{}};
  ORDEN_SUBS.forEach(s=>{
    out.sub[s] = {};
    const pa = PANTALLAS.find(p=>p.sub===s && p.pasada===0);
    const pb = PANTALLAS.find(p=>p.sub===s && p.pasada===1);
    ORDEN.forEach(v=>{
      const a = (mapa[pa.n]||{})[v]||0, d = (mapa[pb.n]||{})[v]||0;
      out.sub[s][v] = {actual:a, deseada:d, tension:d-a};
    });
  });
  ORDEN.forEach(v=>{
    const a = media(ORDEN_SUBS.map(s=>out.sub[s][v].actual));
    const d = media(ORDEN_SUBS.map(s=>out.sub[s][v].deseada));
    out.gen[v] = {actual:a, deseada:d, tension:d-a};
  });
  out.dominanteA = ORDEN.reduce((a,b)=> out.gen[a].actual>=out.gen[b].actual?a:b);
  out.dominanteD = ORDEN.reduce((a,b)=> out.gen[a].deseada>=out.gen[b].deseada?a:b);
  out.desplazamiento = ORDEN.reduce((a,v)=>a+Math.abs(out.gen[v].tension),0)/2;
  return out;
}
function escalaMax(d){
  let m=0; ORDEN.forEach(v=>{m=Math.max(m,d.gen[v].actual,d.gen[v].deseada);});
  ORDEN_SUBS.forEach(s=>ORDEN.forEach(v=>{m=Math.max(m,d.sub[s][v].actual,d.sub[s][v].deseada);}));
  return Math.max(40, Math.ceil(m/10)*10);
}
function radarSVG(svg, box, vals, max, compacto){
  if(!svg || !box) return;
  const W = Math.max(compacto?200:272, Math.round(box.clientWidth || (compacto?204:660)));
  const estrecho = W < 470;
  const H = compacto ? W : Math.min(estrecho ? W+70 : 440, 470);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cx=W/2, cy=H/2+(compacto?0:6);
  const R = Math.min(W/2,H/2) - (compacto?30:(estrecho?70:78));
  const cs = getComputedStyle(document.documentElement);
  const cA = cs.getPropertyValue("--actual").trim();
  const cD = cs.getPropertyValue("--deseada").trim();
  const cS = cs.getPropertyValue("--surface-1").trim();
  const rad = a=>a*Math.PI/180;
  const pt = (ang,val)=>[cx+(val/max)*R*Math.cos(rad(ang)), cy-(val/max)*R*Math.sin(rad(ang))];
  const poly = f => ORDEN.map(v=>pt(ANGULOS[v], f(v)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const anillos = compacto ? 2 : Math.min(5, Math.max(2, Math.round(max/10)));
  let s = "";
  for(let i=1;i<=anillos;i++)
    s += `<polygon points="${poly(()=>max*i/anillos)}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  ORDEN.forEach(v=>{ const [x,y]=pt(ANGULOS[v],max);
    s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`; });
  if(!compacto){
    for(let i=1;i<=anillos;i++){ const val=max*i/anillos, [x,y]=pt(0,val);
      s += `<text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" fill="var(--text-muted)" font-size="10.5"
              text-anchor="middle" style="font-variant-numeric:tabular-nums">${Math.round(val)}</text>`; }
    [[cx,cy-R-(estrecho?42:52),"middle","FLEXIBILIDAD"],[cx,cy+R+(estrecho?54:62),"middle","CONTROL"],
     [2,cy+4,"start","INTERNO"],[W-2,cy+4,"end","EXTERNO"]].forEach(([x,y,anc,t])=>{
      s += `<text x="${Math.round(x)}" y="${Math.round(y)}" fill="var(--text-muted)" font-size="10.5"
              text-anchor="${anc}" letter-spacing="0.08em">${t}</text>`; });
  }
  s += `<polygon points="${poly(v=>vals[v].actual)}" fill="${cA}" fill-opacity="0.22" stroke="${cA}" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<polygon points="${poly(v=>vals[v].deseada)}" fill="none" stroke="${cD}" stroke-width="2" stroke-linejoin="round"/>`;
  ORDEN.forEach(v=>{
    const [xa,ya]=pt(ANGULOS[v],vals[v].actual), [xd,yd]=pt(ANGULOS[v],vals[v].deseada);
    const r = compacto?4:5.5;
    s += `<circle cx="${xa.toFixed(1)}" cy="${ya.toFixed(1)}" r="${r}" fill="${cA}" stroke="${cS}" stroke-width="2"/>`;
    s += `<circle cx="${xd.toFixed(1)}" cy="${yd.toFixed(1)}" r="${r}" fill="${cD}" stroke="${cS}" stroke-width="2"/>`;
  });
  ORDEN.forEach(v=>{
    const [x,y]=pt(ANGULOS[v],max);
    const dx=Math.cos(rad(ANGULOS[v])), dy=-Math.sin(rad(ANGULOS[v]));
    const lx = Math.max(2, Math.min(W-2, x+dx*(compacto?12:(estrecho?14:22))));
    const ly = y+dy*(compacto?10:(estrecho?14:22));
    const anc = dx<0 ? "end":"start";
    if(compacto)
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?0:10)).toFixed(0)}" fill="var(--text-secondary)"
              font-size="10.5" font-weight="600" text-anchor="${anc}">${v}</text>`;
    else {
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?-2:12)).toFixed(0)}" fill="var(--text-primary)"
              font-size="${estrecho?11.5:13}" font-weight="600" text-anchor="${anc}">${VEC[v].corto}</text>`;
      s += `<text x="${lx.toFixed(0)}" y="${(ly+(dy<0?-2:12)+15).toFixed(0)}" fill="var(--text-secondary)"
              font-size="${estrecho?11:12}" text-anchor="${anc}" style="font-variant-numeric:tabular-nums">${
              vals[v].actual.toFixed(1)} → ${vals[v].deseada.toFixed(1)}</text>`;
    }
  });
  svg.innerHTML = s;
}

/* ═══════════════════════════════════════════════════════════════════
   EL RADAR DE MADUREZ — lectura propia del instrumento
   ═══════════════════════════════════════════════════════════════════
   Ocho ámbitos y, para cada uno, dos números en la misma escala 1–5:
   lo desarrollado que está —media de sus cuatro afirmaciones, R11 a
   R18— y lo que importa —R21—.

   El gráfico de radar es el emblema del instrumento y por eso está,
   pero conviene decir qué NO dice, porque casi nadie lo dice. El área
   del polígono crece con el cuadrado de la nota, así que un radar
   siempre exagera la diferencia entre ir bien e ir mal. Y el orden de
   los ejes es una decisión, no un dato: cambiarlo cambia la figura sin
   cambiar un solo número. Aquí el orden es fijo —el de los ámbitos, el
   mismo en el que se preguntaron— para que dos sesiones se puedan
   poner una al lado de la otra.

   Lo que de verdad ordena un plan no es la figura: es la tabla de
   debajo, la distancia entre lo que importa y lo que hay, de mayor a
   menor. El radar es para la pared; la tabla, para el lunes. */

const RAD_MAD = ["R11","R12","R13","R14","R15","R16","R17","R18"];
const RAD_IMP = "R21";

/* Recibe la misma lista de {p, r} que ya arma el informe y devuelve los
   ocho ejes con sus dos valores. Si falta la mitad de las preguntas
   —una sesión a la que se le quitaron ámbitos— devuelve lo que haya:
   un radar de cinco ejes sigue siendo legible, y esconderlo por no
   estar completo sería peor. */
function datosRadar(pares){
  const por = {};
  (pares||[]).forEach(x => { if(x && x.p && x.p.codigo) por[x.p.codigo] = x; });
  const media = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : null;
  const cfgDe = x => (x && x.p && (x.p.config || x.p.cfg)) || {};
  const medias = ds => (Array.isArray(ds) ? ds : [])
    .map(d => Number(d.media)).filter(v => isFinite(v));

  let maxMad = null, minMad = null, nMad = 0, hay = false;
  const ejes = RAD_MAD.map((cod, i) => {
    const x = por[cod];
    const cfg = cfgDe(x);
    if(x){
      hay = true;
      if(cfg.max) maxMad = Math.max(maxMad || 0, Number(cfg.max));
      if(cfg.min != null) minMad = minMad == null ? Number(cfg.min) : Math.min(minMad, Number(cfg.min));
      if(x.r && x.r.respondidos) nMad = Math.max(nMad, x.r.respondidos);
    }
    const tit = (x && x.p && x.p.titulo) || AMBITOS_RAD[i] || ("Ámbito " + (i+1));
    return {n: i+1, presente: !!x, titulo: tit,
            nombre: tit.replace(/^\s*(ámbito\s*)?\d+\s*[·.–-]\s*/i, "").trim() || tit,
            mad: media(medias(x && x.r && x.r.datos)),
            imp: null, dif: null};
  });
  if(!hay) return null;

  const xi = por[RAD_IMP];
  const maxImp = Number(cfgDe(xi).max) || null;
  let nImp = 0, choque = false;
  if(xi && xi.r && Array.isArray(xi.r.datos) && xi.r.datos.length){
    nImp = xi.r.respondidos || 0;
    if(maxImp && maxMad && maxImp !== maxMad) choque = true;
    else xi.r.datos.forEach((d, k) => {
      /* Los ítems de la R21 van numerados —«1 · Dirección…»— justo para
         poder casarlos con su ámbito sin depender del texto, que el
         facilitador puede haber retocado. Si alguien quita el número, se
         cae al orden de la lista, que es lo que había antes. */
      const m = String(d.clave || "").match(/^\s*(\d+)/);
      const i = m ? Number(m[1]) - 1 : k;
      if(ejes[i] && isFinite(Number(d.media))) ejes[i].imp = Number(d.media);
    });
  }
  ejes.forEach(e => { if(e.imp != null && e.mad != null)
    e.dif = Math.round((e.imp - e.mad) * 100) / 100; });

  return {ejes, min: minMad == null ? 1 : minMad, max: maxMad || maxImp || 5,
          nMad, nImp, choque, maxMad, maxImp,
          conMad: ejes.filter(e => e.mad != null).length,
          conImp: ejes.filter(e => e.imp != null).length};
}

/* Radar de N ejes, genérico. Devuelve el SVG ya escrito: viewBox fijo y
   width:100%, así que no hay que medir el contenedor ni repintarlo
   después de insertarlo, que es lo que obliga a hacer el radar de
   cultura y lo que lo hace inservible en el informe impreso. */
function radarNSVG(ejes, series, o){
  o = o || {};
  const min = o.min != null ? o.min : 1;
  const max = o.max != null ? o.max : 5;
  const N = (ejes || []).length;
  if(!N || !(max > min)) return "";
  const W = o.W || 660, H = o.H || 520;
  const cx = W/2, cy = H/2 + 4;
  const R = Math.min(W, H)/2 - (o.margen || 62);
  const gr = !!o.grande;
  const ang = i => -Math.PI/2 + i * 2*Math.PI/N;
  const en = (i, t) => [cx + Math.cos(ang(i))*R*t, cy + Math.sin(ang(i))*R*t];
  const aro = t => ejes.map((_, i) => en(i, t).map(v=>v.toFixed(1)).join(",")).join(" ");
  const norm = v => Math.max(0, Math.min(1, (v - min) / (max - min)));
  const pasos = Math.min(6, Math.max(2, Math.round(max - min)));
  let s = "";

  for(let k = 1; k <= pasos; k++)
    s += '<polygon points="' + aro(k/pasos) + '" fill="none" stroke="var(--grid)" stroke-width="1"/>';
  ejes.forEach((_, i) => { const p = en(i, 1);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1)
       + '" stroke="var(--grid)" stroke-width="1"/>'; });
  /* Los aros van rotulados. Un radar sin números en los anillos deja a
     quien lo mira contando vértices para adivinar si un 3,4 está cerca
     del techo o de la mitad. */
  for(let k = 1; k <= pasos; k++){
    const val = min + (max - min) * k / pasos;
    const p = en(0, k/pasos);
    s += '<text x="' + (p[0]+8).toFixed(1) + '" y="' + (p[1]+4).toFixed(1)
       + '" fill="var(--text-muted)" font-size="' + (gr?15:11)
       + '" style="font-variant-numeric:tabular-nums">'
       + (Math.abs(val - Math.round(val)) < 0.01 ? val.toFixed(0) : val.toFixed(1)) + '</text>';
  }

  (series || []).forEach(se => {
    /* Un ámbito sin dato no se inventa: se salta. El polígono se cierra
       entre los que sí lo tienen, y por eso el pie dice cuántos son. */
    const pts = ejes.map((_, i) => {
      const v = (se.valores || [])[i];
      return v == null || !isFinite(v) ? null : en(i, norm(v));
    });
    const cad = pts.filter(Boolean).map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    if(!cad) return;
    s += '<polygon points="' + cad + '" fill="' + se.color + '" fill-opacity="'
       + (se.relleno ? 0.2 : 0) + '" stroke="' + se.color + '" stroke-width="' + (gr?3:2)
       + '" stroke-linejoin="round"'
       + (se.discontinua ? ' stroke-dasharray="' + (gr?"10 7":"6 4") + '"' : '') + '/>';
    pts.forEach(p => { if(!p) return;
      s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (gr?6:4.5)
         + '" fill="' + se.color + '" stroke="var(--surface-1)" stroke-width="2"/>'; });
  });

  /* El eje se rotula con su número dentro de un círculo, no con el
     nombre del ámbito. Ocho nombres de cinco palabras alrededor de una
     circunferencia no se leen ni en el papel ni en la pared: o se
     solapan, o hay que encogerlos hasta que dejan de ser texto. El
     número casa con la tabla y con el orden en que se preguntó. */
  ejes.forEach((e, i) => {
    const d = R + (gr ? 32 : 26);
    const lx = cx + Math.cos(ang(i))*d, ly = cy + Math.sin(ang(i))*d;
    s += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="' + (gr?18:13.5)
       + '" fill="var(--plane)" stroke="var(--axis)" stroke-width="1"/>';
    s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + (gr?6.5:4.8)).toFixed(1)
       + '" text-anchor="middle" fill="var(--text-secondary)" font-size="' + (gr?18:13)
       + '" font-weight="600">' + esc(String(e.n)) + '</text>';
  });

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" style="width:100%;height:auto;display:block"'
       + ' aria-label="' + esc(o.alt || "Radar de madurez por ámbito") + '">' + s + '</svg>';
}

/* La leyenda y la tabla se usan en el informe y en la pared, así que
   viven fuera de los dos. */
function leyendaRadar(d){
  return '<div class="legend" style="margin-top:14px">'
    + '<span><i class="swatch" style="background:var(--tono-1)"></i>Desarrollo</span>'
    + (d.conImp ? '<span><i class="swatch linea" style="background:var(--tono-2)"></i>Importancia</span>' : '')
    + '</div>';
}

/* El bloque completo para el informe. Mismo patrón que «Dónde está la
   brecha» de la evaluación: primero lo que se ve, después lo que se
   hace con ello, y un aviso en rojo cuando el cálculo no se puede
   hacer en vez de un número inventado con aspecto de dato. */
function lecturaRadar(pares){
  const d = datosRadar(pares);
  if(!d || (!d.conMad && !d.conImp)) return "";
  const cab = '<span class="num">RADAR</span><h2>Madurez e importancia, ámbito por ámbito</h2>';

  if(d.choque) return '<div class="card informe-bloque">' + cab
    + '<div class="aviso rojo" style="margin-top:12px">No se puede cruzar: el desarrollo está en '
    + 'una escala de 1 a ' + esc(String(d.maxMad)) + ' y la importancia (R21), en una de 1 a '
    + esc(String(d.maxImp)) + '. Restar una de otra no significa nada. Iguala las dos escalas '
    + 'en el contenido de las preguntas y vuelve aquí.</div></div>';

  const mads = d.ejes.filter(e => e.mad != null);
  const conDif = d.ejes.filter(e => e.dif != null).slice().sort((a,b) => b.dif - a.dif);
  const alto = mads.length ? mads.reduce((a,b) => a.mad >= b.mad ? a : b) : null;
  const bajo = mads.length ? mads.reduce((a,b) => a.mad <= b.mad ? a : b) : null;
  const tope = Math.max(0.1, ...conDif.map(e => Math.abs(e.dif)));
  const uno = v => v == null ? "—" : num(v, 1);

  const series = [{nombre:"Desarrollo", color:"var(--tono-1)", relleno:true,
                   valores: d.ejes.map(e => e.mad)}];
  if(d.conImp) series.push({nombre:"Importancia", color:"var(--tono-2)",
                            relleno:false, discontinua:true, valores: d.ejes.map(e => e.imp)});

  return '<div class="card informe-bloque">' + cab
    + '<div class="small" style="margin-top:8px">calculado · desarrollo: media de las cuatro '
    + 'afirmaciones de cada ámbito (R11–R18) · importancia: R21 · escala '
    + esc(String(d.min)) + '–' + esc(String(d.max)) + '</div>'

    + '<div class="kpirow" style="margin-top:18px">'
    + (bajo ? '<div class="tile"><div class="lab">Ámbito menos desarrollado</div>'
            + '<div class="val word">' + esc(bajo.nombre) + '</div>'
            + '<div class="sub">' + uno(bajo.mad) + ' sobre ' + esc(String(d.max)) + '</div></div>' : '')
    + (alto ? '<div class="tile"><div class="lab">Ámbito más desarrollado</div>'
            + '<div class="val word">' + esc(alto.nombre) + '</div>'
            + '<div class="sub">' + uno(alto.mad) + ' sobre ' + esc(String(d.max)) + '</div></div>' : '')
    + (conDif.length ? '<div class="tile"><div class="lab">Mayor distancia</div>'
            + '<div class="val word">' + esc(conDif[0].nombre) + '</div>'
            + '<div class="sub">importa ' + num(conDif[0].dif, 1) + ' más de lo que hay</div></div>' : '')
    + '</div>'

    + leyendaRadar(d)
    + '<div style="max-width:620px;margin:6px auto 0">'
    + radarNSVG(d.ejes, series, {min:d.min, max:d.max,
        alt:"Radar de los ocho ámbitos: desarrollo e importancia"}) + '</div>'

    /* thead y tbody de verdad, no una fila de th sueltos: en papel la
       tabla se parte y la segunda página salía con cuatro columnas de
       cifras sin decir de qué eran. Con thead, el navegador repite la
       cabecera en cada página. */
    + '<table class="matriz" style="margin-top:20px">'
    + '<thead><tr><th class="et"></th><th>Desarrollo</th>'
    + (d.conImp ? '<th>Importancia</th><th>Distancia</th><th></th>' : '') + '</tr></thead><tbody>'
    + (conDif.length ? conDif : d.ejes).map(e => '<tr>'
        + '<td class="et">' + esc(e.n + " · " + e.nombre) + '</td>'
        + '<td>' + uno(e.mad) + '</td>'
        + (d.conImp ? '<td>' + uno(e.imp) + '</td>'
            + '<td><b>' + (e.dif == null ? "—" : (e.dif > 0 ? "+" : "") + num(e.dif, 1)) + '</b></td>'
            + '<td style="width:34%"><div class="barmini" style="position:relative"><i style="width:'
            + (e.dif == null ? 0 : Math.round(Math.abs(e.dif)/tope*100)) + '%;background:'
            /* Naranja y azul, no rojo y verde: el par rojo-verde es justo el
               que no distingue un daltónico, y aquí el color codifica el
               signo. El signo va además escrito al lado. */
            + (e.dif != null && e.dif >= 0 ? "var(--tono-2)" : "var(--tono-1)")
            + '"></i></div></td>' : '')
        + '</tr>').join("")
    + '</tbody></table>'

    + '<p class="small" style="margin-top:16px">' + d.conMad + ' de 8 ámbitos con desarrollo'
    + (d.conImp ? ' · ' + d.conImp + ' con importancia' : ' · sin la pregunta de importancia (R21), '
        + 'el radar dice dónde estás flojo y no dice qué de lo flojo importa')
    + ' · ' + d.nMad + (d.nMad === 1 ? ' respuesta' : ' respuestas') + '</p>'

    + '<p class="small" style="margin-top:12px"><b>Cómo se lee.</b> Arriba de la tabla, lo que '
    + 'más importa y menos hay: por ahí se empieza. Abajo, lo que ya está resuelto o lo que pesa '
    + 'menos en la estrategia de lo que pensaba quien montó el plan — y esa segunda lectura es la '
    + 'que nadie mira. La figura del radar sirve para que la sala vea de un golpe la forma del '
    + 'conjunto; para decidir, mira los números. El área de un polígono crece con el cuadrado de '
    + 'la nota, así que exagera, y el orden de los ejes es una convención: aquí es siempre el '
    + 'mismo, el de los ámbitos, para que dos sesiones se puedan comparar.</p>'
    + '</div>';
}

/* ¿Venimos de pulsar el enlace del correo? Supabase devuelve la sesión en el
   fragmento (#access_token=...) o, en flujo PKCE, en la query (?code=...).
   Sin esto, el enlace del correo te dejaba en la portada pública y parecía
   que no habías entrado. */
function vueltaDeCorreo(){
  return /access_token=|refresh_token=|[#&]type=(magiclink|recovery|invite|signup)|error_code=/.test(location.hash)
      || /[?&]code=/.test(location.search);
}
function ruta(){
  const p = params();
  if(p.get("proy")) return {vista:"proyeccion", codigo:p.get("proy")};
  if(p.get("s"))    return {vista:"participante", codigo:p.get("s")};
  if(location.hash.startsWith("#/interno")) return {vista:"interno"};
  if(location.hash.startsWith("#/admin")) return {vista:"admin"};
  if(vueltaDeCorreo())                    return {vista:"admin"};
  return {vista:"portada"};
}
async function render(){
  const r = ruta();
  window._repinta = null;
  try{
    if(r.vista === "participante")   await vistaParticipante(r.codigo);
    else if(r.vista === "proyeccion") await vistaProyeccion(r.codigo);
    else if(r.vista === "interno")    vistaInterno();
    else if(r.vista === "admin")      await vistaAdmin();
    else vistaPortada();
    // La marca de «ya he reintentado» se limpia AQUÍ, cuando algo ha salido
    // bien. Limpiarla al empezar dejaba el reintento en bucle infinito: cada
    // vuelta se creía la primera.
    window.__reintentoReloj = false;
  }catch(e){
    const msg = String((e && e.message) || e);

    // «JWT issued at future» es un desajuste de relojes DENTRO de Supabase:
    // el servidor que firma la credencial va unos segundos por delante del
    // que la valida. No es culpa tuya ni de tu ordenador, y se pasa solo en
    // menos de un minuto. Lo importante es que no salga en inglés y en
    // crudo delante de un cliente: se reintenta solo y se explica.
    if(/issued at future|JWSInvalidSignature|clock/i.test(msg)){
      if(!window.__reintentoReloj){
        window.__reintentoReloj = true;
        app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
          <h2>Un momento</h2><p class="lead">El servidor está ajustando su reloj.
          Reintentando solo…</p></div></div>`;
        return setTimeout(render, 6000);
      }
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h2>El servidor tiene el reloj desajustado</h2>
        <p class="lead">Supabase ha firmado tu credencial con una hora ligeramente
          adelantada respecto a la que usa para comprobarla, y por eso la rechaza.</p>
        <p>No es tu ordenador ni tu conexión, y suele durar menos de un minuto.
          Espera y vuelve a entrar. Si persiste más de cinco minutos, sal y entra de nuevo
          para que te firme una credencial nueva.</p>
        <div class="btnrow"><button class="btn" onclick="location.reload()">Reintentar</button>
          <button class="btn ghost" onclick="cerrarSesionAdmin()">Salir y volver a entrar</button></div>
        <details><summary class="small">Detalle técnico</summary>
          <p class="small"><code>${esc(msg)}</code></p></details>
      </div></div>`;
      return;
    }

    app().innerHTML = `<div class="wrap">${cabecera()}
      <div class="card"><h2>Algo ha fallado</h2><p>${esc(msg)}</p>
      <div class="btnrow"><button class="btn ghost" onclick="location.reload()">Reintentar</button></div></div></div>`;
  }
}
window.addEventListener("hashchange", render);

    }
    app().innerHTML = `<div class="proy">${cuerpo}</div>`;
    if(vista === "espera") pintarQR("qr", url, 8);
    if(window._d && (vista==="resultados")) pintarRadaresDe(window._d,"pr");
    if(window._d && (vista==="subcategorias")) pintarSub(window._d,"pr");
  };
  window._repinta = () => pinta();
  await pinta();

  /* Mando por teclado desde la propia proyección.
     Deliberadamente sin botones en pantalla: si pintara flechas, la sala
     vería tus controles, que es justo lo que evitamos al separar consola y
     proyección. Las teclas no se ven.
       →  o  Espacio   abrir la siguiente pantalla
       ←               cerrar una
       Inicio / Fin    volver a la espera / ir al perfil general
     Solo funciona si estás identificado: para cualquier otro, la base de
     datos rechaza el cambio por RLS. La sala no puede tocar nada. */
  const mandar = async cambios => {
    try{
      const ses = await API.sesiones();
      const s2 = ses.find(x => x.codigo.toUpperCase() === codigo.toUpperCase());
      if(!s2) return;
      await API.actualizarSesion(s2.id, typeof cambios === "function" ? cambios(s2) : cambios);
      pinta();
    }catch(e){ /* sin sesión iniciada no se puede: es lo correcto */ }
  };
  window.addEventListener("keydown", ev => {
    if(ev.key === "ArrowRight" || ev.key === " "){ ev.preventDefault();
      mandar(s2 => { const n = Math.min(12, (s2.pantalla_max ?? 0) + 1);
                     return {pantalla_max:n, vista_activa:"p"+n}; }); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault();
      mandar(s2 => { const n = Math.max(0, (s2.pantalla_max ?? 1) - 1);
                     return {pantalla_max:n, vista_activa: n ? "p"+n : "espera"}; }); }
    else if(ev.key === "Home"){ mandar({vista_activa:"espera"}); }
    else if(ev.key === "End"){  mandar({vista_activa:"resultados"}); }
  });

  // Tiempo real para el cambio de vista; sondeo para contadores y resultados.
  // Si el tiempo real se cae, el sondeo sigue: la sesión no se detiene.
  const s = await API.sesionPublica(codigo);
  timer = setInterval(pinta, 3000);
  window.addEventListener("beforeunload", ()=>{ clearInterval(timer); if(sub) sub.unsubscribe(); });
}

/* ═══════════════════════════════════════════════════════════════════
   6 ter · PROYECCIÓN DEL MOTOR

   Mientras la pregunta está abierta se proyecta el enunciado y cuánta
   gente la ha contestado. El reparto solo aparece cuando la pregunta
   está terminada: enseñar la media a quien todavía no ha respondido lo
   arrima al grupo. Es la misma regla que en cultura.
   ═══════════════════════════════════════════════════════════════════ */
async function proyeccionMotor(codigo, s){
  let timer = null;
  const url = location.origin + location.pathname + "?s=" + encodeURIComponent(codigo);

  const barras = (datos, etiqueta, valor) => {
    const max = Math.max(...datos.map(valor), 1);
    return `<div style="margin-top:22px">${datos.map(d=>`
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
          <span class="enun" style="margin:0;border:0;padding:0">${esc(etiqueta(d))}</span>
          <b style="font-size:30px;white-space:nowrap">${valor(d)}</b></div>
        <div class="barra" style="height:14px"><i style="width:${valor(d)/max*100}%"></i></div>
      </div>`).join("")}</div>`;
  };

  const pinta = async () => {
    const n = await API.sesionPublica(codigo).catch(()=>null);
    if(!n){ app().innerHTML = `<div class="proy"><h1>Sesión no encontrada</h1></div>`; return; }
    const va = n.vista_activa || "espera";
    let cuerpo = "";

    if(!va.startsWith("q:")){
      const prog = await API.progreso(codigo).catch(()=>null);
      cuerpo = `<h1>Entra desde tu móvil</h1>
        <div style="display:flex;gap:40px;flex-wrap:wrap;align-items:center">
          <div><div class="small">Código</div><div class="codigo">${esc(codigo.toUpperCase())}</div>
            <p style="margin-top:14px;font-size:18px">${esc(location.host + location.pathname)}</p></div>
          <div class="qr" id="qr"></div></div>
        ${prog ? `<div class="contador" style="margin-top:26px"><b>${prog.completos}</b>
          <span style="font-size:20px">han terminado</span></div>` : ""}
        <p class="small" style="margin-top:20px">Tus respuestas son anónimas. No se registra tu nombre
          ni tu correo.</p>`;
    } else {
      const id = va.slice(2);
      const r = await API.resultadosPregunta(codigo, id).catch(()=>null);
      const ps = await API.preguntasPublicas(codigo).catch(()=>[]);
      const p = (ps || []).find(x => x.id === id);
      if(!p || !r || r.existe === false){
        cuerpo = `<h1>Preparando…</h1>`;
      } else {
        const cfg = p.config || {};
        const cab = `<div class="small">${esc(p.codigo||"")}</div><h1>${esc(p.titulo)}</h1>`;
        if(r.datos){
          if(p.tipo === "unica" || p.tipo === "multiple")
            cuerpo = cab + barras(r.datos, d=>d.clave, d=>d.n)
              + `<p class="small" style="margin-top:18px">Número de respuestas por opción · ${r.respondidos} personas</p>`;
          else if(p.tipo === "escala")
            cuerpo = cab + `<div class="contador" style="margin-top:30px"><b>${r.datos.media}</b>
              <span style="font-size:20px">de media · mediana ${r.datos.mediana}</span></div>
              <div style="display:flex;justify-content:space-between;gap:10px;margin-top:16px">
                <span class="small">${esc(cfg.ancla_min||"")}</span>
                <span class="small" style="text-align:right">${esc(cfg.ancla_max||"")}</span></div>
              <p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
          else if(p.tipo === "matriz_escala" || p.tipo === "puntos100")
            cuerpo = cab + barras(r.datos, d=>d.clave, d=>d.media)
              + `<p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
          else
            cuerpo = cab + `<div style="margin-top:22px">${(r.datos||[]).slice(0,12).map(v=>
              `<div class="enun">${esc(v.texto || Object.values(v.campos||{}).join(" · "))}</div>`).join("")}</div>
              <p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
        } else {
          // Abierta: enunciado, opciones si las tiene, y cuánta gente lleva.
          const ops = cfg.opciones || (Array.isArray(cfg.items) ? cfg.items : null);
          cuerpo = cab
            + (ops ? `<div style="margin-top:20px">${ops.map(o=>
                `<div class="enun">${esc(o)}</div>`).join("")}</div>` : "")
            + `<div class="contador" style="margin-top:24px"><b>${r.respondidos}</b>
                <span style="font-size:20px">${r.respondidos===1 ? "persona ha respondido"
                                                                 : "personas han respondido"}</span></div>`
            + (r.estado === "terminada" && r.respondidos < r.minimo
                ? `<p class="small" style="margin-top:14px">Con menos de ${r.minimo} respuestas no se
                     muestra el resultado: sería la respuesta de una persona concreta.</p>` : "");
        }
      }
    }
    app().innerHTML = `<div class="proy">${cuerpo}</div>`;
    if(!va.startsWith("q:")) pintarQR("qr", url, 8);
  };

  await pinta();
  // Mismo mando invisible que en cultura: la sala no ve tus controles.
  //   →  terminar la abierta y abrir la siguiente     ←  volver a la anterior
  //   Inicio  proyectar el código y el QR
  const mandar = async fn => {
    try{
      const ses = await API.sesiones();
      const s2 = ses.find(x => x.codigo.toUpperCase() === codigo.toUpperCase());
      if(!s2) return;
      const ps = await API.preguntas(s2.id);
      await fn(s2, ps);
      pinta();
    }catch(e){ /* sin sesión iniciada no se puede: es lo correcto */ }
  };
  window.addEventListener("keydown", ev => {
    if(ev.key === "ArrowRight" || ev.key === " "){ ev.preventDefault(); mandar(async (s2, ps) => {
      const ab = ps.find(p=>p.estado === "abierta");
      if(ab) await API.actualizarPregunta(ab.id, {estado:"terminada"});
      const i = ab ? ps.findIndex(p=>p.id===ab.id) : -1;
      const sig = ps.slice(i+1).find(p=>p.estado === "cerrada");
      if(sig) await API.actualizarPregunta(sig.id, {estado:"abierta"});
      const foco = sig || ab;
      if(foco) await API.actualizarSesion(s2.id, {vista_activa:"q:"+foco.id});
    }); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault(); mandar(async (s2, ps) => {
      const act = (s2.vista_activa||"").startsWith("q:") ? s2.vista_activa.slice(2) : null;
      const i = ps.findIndex(p=>p.id===act);
      const ant = i > 0 ? ps[i-1] : null;
      if(ant) await API.actualizarSesion(s2.id, {vista_activa:"q:"+ant.id});
    }); }
    else if(ev.key === "Home"){ mandar(async s2 =>
      await API.actualizarSesion(s2.id, {vista_activa:"espera"})); }
  });

  timer = setInterval(pinta, 3000);
  window.addEventListener("beforeunload", ()=>clearInterval(timer));
}

/* ═══════════════════════════════════════════════════════════════════
   6 bis · CONSTRUCTOR DE SESIÓN (motor de preguntas)

   Aquí compones la sesión: resuelves las variables del banco y eliges
   qué preguntas entran. El banco tiene 60; de momento solo 38 se pueden
   añadir. Las otras 22 aparecen igualmente, en gris y con el tipo que
   les falta, porque es peor descubrir el hueco preparando una sesión
   que verlo desde el principio.
   ═══════════════════════════════════════════════════════════════════ */
/* Agregación en modo demostración. En modo real la hace `resultados_pregunta`
   dentro de la base de datos, que es donde debe estar. Esto solo existe para
   poder recorrer el circuito entero sin conexión. */
function agregarDemo(p, items){
  const cuenta = arr => { const m = {}; arr.forEach(k=>m[k]=(m[k]||0)+1);
    return Object.keys(m).map(k=>({clave:k, n:m[k]})).sort((a,b)=>b.n-a.n); };
  const medias = clave => { const acc = {};
    items.forEach(i => Object.entries(i.valor[clave]||{}).forEach(([k,v])=>{
      (acc[k] = acc[k] || []).push(Number(v)); }));
    return Object.keys(acc).map(k=>({clave:k,
      media: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*10)/10})); };
  if(p.tipo === "unica")    return cuenta(items.map(i=>i.valor.opcion));
  if(p.tipo === "multiple") return cuenta(items.flatMap(i=>i.valor.opciones||[]));
  if(p.tipo === "escala"){
    const ns = items.map(i=>Number(i.valor.n)).sort((a,b)=>a-b);
    return {media: Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*100)/100,
            mediana: ns[Math.floor(ns.length/2)],
            reparto: cuenta(ns.map(String)).reduce((o,x)=>(o[x.clave]=x.n,o),{})};
  }
  if(p.tipo === "matriz_escala") return medias("items").sort((a,b)=>a.clave.localeCompare(b.clave));
  if(p.tipo === "puntos100")     return medias("reparto").sort((a,b)=>b.media-a.media);
  return items.map(i=>i.valor);
}

            return `<div class="it" style="${listo?"":"opacity:.55"}">
              <div><b>${esc(p.c)}.</b> ${esc(resolverTexto(p.q, vars))}
                <div class="small">${esc(TIPOS_NOMBRE[p.t])} ·
                  <span title="${esc(NAT_ETIQ[p.nat].d)}">${esc(NAT_ETIQ[p.nat].t)}</span>
                  ${p.nuc ? " · núcleo" : ""}${p.bench ? " · comparable" : ""}
                  ${listo ? "" : " · <b>tipo no construido</b>"}</div></div>
              <div>${puesta ? `<span class="estado">añadida</span>`
                : listo ? `<button class="btn ghost sm" data-add="${p.c}">Añadir</button>`
                : `<span class="estado">fase siguiente</span>`}</div>
            </div>`;}).join("")}</div>
        </div>`;}).join("")}
      </div>`;

    if(preguntas.length) pintarQR("qr", urlPart, 5);
    const bt = id => document.getElementById(id);
    const cambiarSesion = async c => { Object.assign(s, await API.actualizarSesion(s.id, c)); pinta(); };
    if(bt("abrirSesion"))  bt("abrirSesion").onclick  = () =>
      cambiarSesion({estado:"abierta", abierta_en:new Date().toISOString()});
    if(bt("cerrarSesion")) bt("cerrarSesion").onclick = () =>
      cambiarSesion({estado:"cerrada", cerrada_en:new Date().toISOString()});
    if(bt("espera")) bt("espera").onclick = () => cambiarSesion({vista_activa:"espera"});

    const tocar = async (id, cambios, proyectar) => {
      await API.actualizarPregunta(id, cambios);
      if(proyectar) Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+id}));
      preguntas = await API.preguntas(s.id); pinta();
    };
    app().querySelectorAll("[data-abrir]").forEach(b => b.onclick = () =>
      tocar(b.dataset.abrir, {estado:"abierta"}, true));
    app().querySelectorAll("[data-fin]").forEach(b => b.onclick = () =>
      tocar(b.dataset.fin, {estado:"terminada"}, true));
    app().querySelectorAll("[data-reabrir]").forEach(b => b.onclick = () =>
      tocar(b.dataset.reabrir, {estado:"abierta"}, true));
    app().querySelectorAll("[data-proy]").forEach(b => b.onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+b.dataset.proy})); pinta(); });

    // El gesto de conducir: cierro la que está abierta y abro la siguiente.
    if(bt("avanzar")) bt("avanzar").onclick = async () => {
      const abierta = preguntas.find(p=>p.estado === "abierta");
      if(abierta) await API.actualizarPregunta(abierta.id, {estado:"terminada"});
      const i = abierta ? preguntas.findIndex(p=>p.id===abierta.id) : -1;
      const sig = preguntas.slice(i+1).find(p=>p.estado === "cerrada");
      if(sig) await API.actualizarPregunta(sig.id, {estado:"abierta"});
      const foco = sig || abierta;
      if(foco) Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+foco.id}));
      preguntas = await API.preguntas(s.id); pinta();
    };

    $("#gv").onclick = async () => {
      const nv = {}; VARIABLES_ESC.forEach(v=>{
        const el = $("#" + idVar(v.clave)); const x = el ? el.value.trim() : "";
        if(x) nv[v.clave] = x; });
      Object.assign(s, await API.actualizarSesion(s.id, {variables:nv}));
      Object.keys(vars).forEach(k=>delete vars[k]); Object.assign(vars, nv);
      pinta();
    };
    $("#nucleo").onclick = () => añadir(BANCO_ESC.filter(p=>p.nuc && TIPOS_LISTOS.includes(p.t)));
    $("#bench").onclick  = () => añadir(BANCO_ESC.filter(p=>p.bench));
    app().querySelectorAll("[data-add]").forEach(b => b.onclick = () =>
      añadir([BANCO_ESC.find(p=>p.c===b.dataset.add)]));
    app().querySelectorAll("[data-quita]").forEach(b => b.onclick = async () => {
      await API.borrarPregunta(b.dataset.quita);
      preguntas = await API.preguntas(s.id); pinta(); });
    const mover = async (id, delta) => {
      const i = preguntas.findIndex(p=>p.id===id), j = i + delta;
      if(j < 0 || j >= preguntas.length) return;
      // Los dos valores se capturan ANTES de tocar nada. Leerlos del array
      // entre las dos escrituras deja las dos filas con el mismo orden si el
      // backend devuelve el mismo objeto que ya tenías.
      const [idA, ordA] = [preguntas[i].id, preguntas[i].orden];
      const [idB, ordB] = [preguntas[j].id, preguntas[j].orden];
      await API.actualizarPregunta(idA, {orden: ordB});
      await API.actualizarPregunta(idB, {orden: ordA});
      preguntas = await API.preguntas(s.id); pinta();
    };
    app().querySelectorAll("[data-sube]").forEach(b => b.onclick = () => mover(b.dataset.sube, -1));
    app().querySelectorAll("[data-baja]").forEach(b => b.onclick = () => mover(b.dataset.baja, +1));
  };

  // Resuelve las variables también dentro de la configuración: los ítems de
  // una matriz de escalas llevan [ORGANIZACION] igual que el enunciado.
  const resolverCfg = cfg => JSON.parse(resolverTexto(JSON.stringify(cfg||{}), vars));

  const añadir = async lista => {
    const ya = new Set(preguntas.map(p=>p.codigo));
    const nuevas = lista.filter(p => p && !ya.has(p.c) && TIPOS_LISTOS.includes(p.t));
    if(!nuevas.length) return;
    let orden = preguntas.length ? Math.max(...preguntas.map(p=>p.orden)) : 0;
    await API.crearPreguntas(nuevas.map(p => ({
      sesion_id: s.id, orden: ++orden, codigo: p.c, tipo: p.t,
      titulo: resolverTexto(p.q, vars),
      ayuda: p.ayuda ? resolverTexto(p.ayuda, vars) : null,
      config: resolverCfg(p.cfg), estado: "cerrada"
    })));
    preguntas = await API.preguntas(s.id);
    pinta();
  };

  await pinta();
}

/* ═══════════════════════════════════════════════════════════════════
   7 · ADMINISTRADOR
   ═══════════════════════════════════════════════════════════════════ */
async function vistaAdmin(){
  // Si venimos del enlace del correo, Supabase tarda unas décimas en canjear el
  // token de la URL. Sin esta espera, la primera comprobación decía «no hay
  // usuario» y te devolvía a la pantalla de acceso justo después de haber entrado.
  if(vueltaDeCorreo() && !API.demo()){
    const fallo = (location.hash.match(/error_description=([^&]*)/) || [])[1];
    if(fallo){
      history.replaceState(null, "", location.pathname + "#/admin");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>Ese enlace ya no vale</h1>
        <p>${esc(decodeURIComponent(fallo.replace(/\+/g," ")))}</p>
        <p class="small">Los enlaces caducan y son de un solo uso. Pide otro, o entra con tu contraseña.</p>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h1>Entrando…</h1><p>Un momento, estamos canjeando el enlace.</p></div></div>`;
    const urlOriginal = location.hash + location.search;
    let dentro = null;
    for(let i = 0; i < 30 && !dentro; i++){
      dentro = await API.usuario();
      if(!dentro) await new Promise(r => setTimeout(r, 200));
    }
    history.replaceState(null, "", location.pathname + "#/admin");
    if(!dentro){
      // No callarse. Si el canje falla, decir por qué en vez de devolver al
      // formulario como si el usuario hubiera hecho algo mal.
      let detalle = "";
      try{
        const { data, error } = await sb.auth.getSession();
        detalle = error ? error.message : (data && data.session ? "hay sesión pero sin usuario" : "el navegador no ha guardado ninguna sesión");
      }catch(e){ detalle = String(e && e.message || e); }
      const traza = urlOriginal.replace(/(access_token|refresh_token|code)=[^&]*/g, "$1=…");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>El enlace no ha llegado a abrir sesión</h1>
        <p>El enlace era válido, pero el navegador no ha conseguido canjearlo.</p>
        <div class="aviso rojo"><b>Motivo:</b> ${esc(detalle)}</div>
        <p class="small">Causas habituales: has abierto el enlace en un navegador
          <b>distinto</b> del que lo pidió, o en una ventana de incógnito, o el
          filtro antivirus de tu correo abrió el enlace antes que tú y lo gastó
          (son de un solo uso).</p>
        <p class="small">Ábrelo en el mismo navegador donde lo pediste. Si se repite,
          usa la contraseña.</p>
        <details><summary class="small">Detalle técnico</summary>
          <p class="small"><code>${esc(traza.slice(0,300))}</code></p></details>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
  }
  const u = await API.usuario();
  if(!u) return vistaLogin();
  const m = location.hash.match(/^#\/admin\/sesion\/(.+)$/);
  if(m) return consolaSesion(m[1]);
  if(location.hash.startsWith("#/admin/sesiones"))  return panelAdmin(u);
  if(location.hash.startsWith("#/admin/proyectos")) return panelProyectos(u);
  return hubPrivado(u);
}

/* Traduce los errores de Supabase, que vienen en inglés y en jerga.
   Delante de un cliente, «Invalid login credentials» no ayuda a nadie. */
function mensajeAuth(e){
  const t = String((e && (e.message || e.error_description)) || e || "");
  if(/invalid login credentials/i.test(t))
    return "Correo o contraseña incorrectos.";
  if(/email.*rate limit|over_email_send_rate_limit|too many requests/i.test(t))
    return "Has agotado los envíos de correo de esta hora. Entra con la contraseña; "
         + "si aún no la has fijado, tendrás que esperar.";
  if(/signups not allowed|signup.*disabled|user not found/i.test(t))
    return "Ese correo no tiene cuenta aquí. El registro está cerrado a propósito.";
  if(/password should be at least|weak.?password/i.test(t))
    return "Contraseña demasiado corta o demasiado débil.";
  if(/same.*password|different from the old/i.test(t))
    return "Esa es la contraseña que ya tenías.";
  if(/email not confirmed/i.test(t))
    return "Ese correo aún no está confirmado.";
  return t || "No se ha podido completar la operación.";
}

function generarCodigo(titulo){
  const base = (titulo||"CULT").normalize("NFD").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,4) || "CULT";
  return base.padEnd(4,"X") + "-" + String(Math.floor(1000+Math.random()*9000));
}

  const s = todas.find(x=>x.id === id);
  if(!s){ location.hash = "#/admin/sesiones"; return; }
  // Cultura tiene su consola de siempre. Los instrumentos del motor tienen
  // la suya, porque lo que hay que conducir es distinto: allí son doce
  // pantallas fijas, aquí una lista de preguntas que tú compones.
  if(String(s.instrumento||"").split("-")[0] !== "cultura") return consolaMotor(s);
  const urlPart = location.origin + location.pathname + "?s=" + encodeURIComponent(s.codigo);
  const urlProy = location.origin + location.pathname + "?proy=" + encodeURIComponent(s.codigo);
  let prog = await API.progreso(s.codigo) || {completos:0, en_curso:0};
  let datos = null;

  const pinta = async () => {
    const umbral = s.n_convocados ? Math.ceil(s.n_convocados*0.85) : null;
    app().innerHTML = `<div class="wrap ancho">${cabecera(
      `<a class="iconbtn" href="#/admin/sesiones">Sesiones</a>`)}
      <div class="card">
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between">
          <div><span class="phasetag">${esc((s.organizacion||{}).nombre||"")}${s.colectivo?" · "+esc(s.colectivo):""}</span>
            <h1 style="margin:6px 0 0">${esc(s.titulo)}</h1></div>
          <span class="estado ${s.estado==="abierta"?"viva":""}">${esc(s.estado)} · ${esc(s.modo)}</span>
        </div>
        <div style="display:flex;gap:30px;flex-wrap:wrap;margin-top:20px;align-items:flex-start">
          <div><div class="small">Código</div><div class="codigo">${esc(s.codigo)}</div>
            <p class="small" style="margin-top:10px">Enlace para participar:<br>
              <code style="word-break:break-all">${esc(urlPart)}</code></p>
            <div class="btnrow" style="margin-top:8px">
              <button class="btn ghost sm" onclick="copiar('${esc(urlPart)}')">Copiar enlace</button>
              <a class="btn ghost sm" href="?proy=${encodeURIComponent(s.codigo)}" target="_blank">Abrir proyección</a>
            </div></div>
          <div class="qr" id="qr"></div>
        </div>
      </div>

      <div class="card">
        <h2>Progreso</h2>
        <div class="contador"><b id="cn">${prog.completos}</b>
          <span>${s.n_convocados ? "de "+s.n_convocados+" convocados han terminado"
                                 : "personas han terminado"}</span></div>
        <div class="barra"><i id="cb" style="width:${prog.pct||0}%"></i></div>
        <p class="small" style="margin-top:8px" id="cen">${prog.en_curso} en curso</p>
        ${umbral ? `<div class="aviso" id="cav">${prog.completos>=umbral
          ? `<b>Ya puedes cerrar.</b> ${prog.completos} envíos superan el umbral operativo del 85 % (${umbral}).`
          : `<b>No esperes al 100 %.</b> Con ${s.n_convocados} personas siempre hay quien se queda a medias.
             El umbral operativo son ${umbral} envíos.`}</div>` : ""}
        <div class="aviso">Puedes ver cuántos faltan, nunca quiénes. El contador cuenta envíos anónimos,
          no personas: si un cliente te pide la lista de quien no ha respondido, el sistema no puede saberlo.</div>
        <div class="btnrow">
          ${s.estado!=="abierta" ? `<button class="btn" id="abrir">Abrir sesión</button>` : ""}
          ${s.estado==="abierta" ? `<button class="btn ghost" id="cerrar">Cerrar sesión</button>` : ""}
          <button class="btn ghost" id="pub">${s.resultados_publicos?"Ocultar resultados":"Publicar resultados"}</button>
          ${API.demo() ? `<button class="btn ghost" id="ejemplo">Cargar 24 respuestas de ejemplo</button>
          <button class="btn ghost" onclick="borrarDemo()">Borrar datos de demostración</button>` : ""}
          ${(!API.demo() && s.estado==="abierta" && prog.completos===0 && !s.es_prueba)
            ? `<button class="btn ghost" id="ensayo">Cargar 24 respuestas de ensayo</button>` : ""}
        </div>
        ${s.es_prueba ? `<div class="aviso"><b>Sesión de ensayo.</b> Contiene respuestas simuladas.
          Queda fuera del benchmark de forma permanente y esa marca no se puede quitar desde aquí:
          si se pudiera, un descuido metería datos inventados en «la media del sector», que es
          justo el activo que este sistema existe para proteger. Bórrala cuando termines de probar.</div>` : ""}
      </div>

      ${s.modo==="directo" ? `<div class="card">
        <h2>Avance de la sala</h2>
        <p class="small">Ve abriendo pantallas conforme conduzcas. <b>Nadie puede pasar de la última
          abierta</b>, pero quien vaya más lento se queda donde estaba: el techo frena al rápido, no
          arrastra al lento. Al abrir una pantalla, la proyección la sigue.</p>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0">
          <button class="btn ghost" id="tmenos">◀ Cerrar una</button>
          <div style="min-width:190px">
            <div class="codigo" id="tnum" style="font-size:34px">${
              s.pantalla_max == null ? "libre" : (s.pantalla_max === 0 ? "0" : s.pantalla_max)}</div>
            <div class="small" id="ttxt">${etiquetaTecho(s.pantalla_max)}</div>
          </div>
          <button class="btn" id="tmas">Abrir siguiente ▶</button>
        </div>
        <div class="btnrow">
          <button class="btn ghost" id="tcero">Cerrar el paso</button>
          <button class="btn ghost" id="tsin">Quitar el techo</button>
        </div>
        <p class="note">«Quitar el techo» devuelve el comportamiento anterior: cada cual completa las
          doce pantallas a su ritmo. Útil si la sala se te descompensa y prefieres dejarles correr.</p>
      </div>

      <div class="card">
        <h2>Qué se proyecta</h2>
        <p class="small">Lo que marques aquí aparece en la pantalla de proyección. Normalmente no
          hace falta tocarlo: al abrir una pantalla arriba, la proyección la sigue sola.</p>
        <div class="vistas" id="vistas">${VISTAS_PROY.map(v=>
          `<button data-k="${v.k}" class="${s.vista_activa===v.k?"on":""}">${esc(v.t)}</button>`).join("")}</div>
      </div>` : ""}

      <div class="card">
        <h2>Resultados</h2>
        <div id="res"><p class="small">Cargando…</p></div>
        <div class="btnrow"><button class="btn ghost" id="recargar">Actualizar</button>
          <button class="btn ghost" id="csv">Descargar CSV</button></div>
      </div></div>`;

    pintarQR("qr", urlPart, 5);
    const btn = id => document.getElementById(id);
    if(btn("abrir")) btn("abrir").onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {estado:"abierta", abierta_en:new Date().toISOString()}));
      pinta();
    };
    if(btn("cerrar")) btn("cerrar").onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {estado:"cerrada", cerrada_en:new Date().toISOString()}));
      pinta();
    };
    btn("pub").onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {resultados_publicos:!s.resultados_publicos}));
      pinta();
    };
    const vs = document.getElementById("vistas");
    if(vs) vs.onclick = async ev => {
      const b = ev.target.closest("button[data-k]"); if(!b) return;
      Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:b.dataset.k}));
      [...vs.children].forEach(c=>c.classList.toggle("on", c===b));
    };
    if(btn("ejemplo")) btn("ejemplo").onclick = async () => {
      btn("ejemplo").disabled = true;
      await respuestasDeEjemplo(s.codigo, 24);
      prog = await API.progreso(s.codigo) || prog;
      pinta();
    };
    if(btn("ensayo")) btn("ensayo").onclick = async () => {
      if(!confirm("Se van a crear 24 respuestas simuladas en esta sesión.\n\n"
        + "La sesión quedará marcada como ENSAYO para siempre y no entrará nunca en el benchmark. "
        + "No uses esto en una sesión con un cliente delante.")) return;
      btn("ensayo").disabled = true; btn("ensayo").textContent = "Generando…";
      try{
        // Primero la marca, después los datos. Si se cayera la conexión a
        // medias, prefiero una sesión marcada de ensayo sin datos que una
        // sesión con datos falsos sin marcar.
        Object.assign(s, await API.actualizarSesion(s.id, {es_prueba:true}));
        await respuestasDeEjemplo(s.codigo, 24);
        prog = await API.progreso(s.codigo) || prog;
      }catch(e){ alert("No se han podido generar: " + (e.message||e)); }
      pinta();
    };
    const fijarTecho = async n => {
      const v = (n === null) ? null : Math.max(0, Math.min(12, n));
      const cambios = {pantalla_max: v};
      if(v) cambios.vista_activa = "p" + v;       // la proyección sigue al techo
      Object.assign(s, await API.actualizarSesion(s.id, cambios));
      pinta();
    };
    if(btn("tmas"))   btn("tmas").onclick   = () => fijarTecho((s.pantalla_max ?? 0) + 1);
    if(btn("tmenos")) btn("tmenos").onclick = () => fijarTecho((s.pantalla_max ?? 1) - 1);
    if(btn("tcero"))  btn("tcero").onclick  = () => fijarTecho(0);
    if(btn("tsin"))   btn("tsin").onclick   = () => fijarTecho(null);
    btn("recargar").onclick = () => cargarResultados();
    btn("csv").onclick = () => descargarCSV(s, datos);
    cargarResultados();
  };

  const cargarResultados = async () => {
    const res = await API.resultados(s.codigo);
    const cont = document.getElementById("res"); if(!cont) return;
    if(res.error){
      cont.innerHTML = `<p class="small">${res.error==="muestra_insuficiente"
        ? `Todavía no hay respuestas suficientes: ${res.n} de ${res.minimo} mínimas. Con una o dos,
           «la media del grupo» sería la respuesta de una persona concreta.`
        : "Sin datos todavía."}</p>`;
      datos = null; return;
    }
    datos = res;
    const d = calcular(datosAMapa(res.datos));
    cont.innerHTML = `<p class="small">${res.n} envíos completos</p>
      ${bloqueResultados(d,"ad")}<h3>Por subcategoría</h3>${bloqueSub(d,"ad")}`;
    pintarRadaresDe(d,"ad"); pintarSub(d,"ad");
    window._repinta = () => { pintarRadaresDe(d,"ad"); pintarSub(d,"ad"); };
  };

  await pinta();
  const timer = setInterval(async () => {
    if(!location.hash.includes(s.id)) { clearInterval(timer); return; }
    const p = await API.progreso(s.codigo); if(!p) return;
    prog = p;
    const n = document.getElementById("cn"); if(!n) return;
    n.textContent = p.completos;
    document.getElementById("cb").style.width = (p.pct||0)+"%";
    document.getElementById("cen").textContent = p.en_curso + " en curso";
  }, 3000);
}
window.copiar = t => { navigator.clipboard && navigator.clipboard.writeText(t); };

function filtradas(){
  const o=$("#f-org").value, se=$("#f-sec").value, e=$("#f-est").value, m=$("#f-modo").value;
  return INV.filter(x => (!o||x.organizacion===o) && (!se||x.sector===se)
                      && (!e||x.estado===e) && (!m||x.modo===m));
}

  const fs = filtradas();
  $("#tabla").innerHTML = fs.length ? `<table>
    <thead><tr><th style="width:34px"></th><th>Organización</th><th>Sesión</th>
      <th>Fecha</th><th>Modo</th><th>Estado</th><th>Envíos</th></tr></thead>
    <tbody>${fs.map(x=>`<tr>
      <td><input type="checkbox" data-id="${x.sesion_id}" ${SEL.has(x.sesion_id)?"checked":""}

        <div class="small">${esc(x.sector||"")}${x.consentimiento_agregado?"":" · sin cesión firmada"}</div></td>
      <td>${esc(x.sesion)}<div class="small"><code>${esc(x.codigo)}</code>${
        x.colectivo?" · "+esc(x.colectivo):""}</div></td>

function botones(){
  const n = SEL.size;
  ["comparar","csvDet","csvRes"].forEach(id=>{ const b=$("#"+id); if(b) b.disabled = n===0; });
  const c = $("#comparar"); if(c) c.textContent = n>1 ? `Comparar ${n} sesiones`
                                    : n===1 ? "Ver esta sesión" : "Comparar seleccionadas";
}

async function compararSeleccion(){
  const ids = [...SEL];
  $("#comp").innerHTML = `<div class="card"><p class="small">Calculando…</p></div>`;
  const filas = await API.resumenSesiones(ids);
  if(!filas.length){
    $("#comp").innerHTML = `<div class="card"><p class="small">Las sesiones seleccionadas
      todavía no tienen envíos completos.</p></div>`; return;
  }
  const porSesion = {};
  filas.forEach(f=>{
    const k = f.sesion_id;
    (porSesion[k] = porSesion[k] || {etiqueta:`${f.organizacion||""} · ${f.sesion||f.codigo}`,
      colectivo:f.colectivo, n:f.n_envios, vals:{}}).vals[f.vector] =
        {actual:Number(f.actual)||0, deseada:Number(f.deseada)||0,
         tension:Number(f.tension)||0};
  });
  const claves = Object.keys(porSesion);
  // escala común entre todas las sesiones: sin ella los radares engañan
  let max = 40;
  claves.forEach(k=>ORDEN.forEach(v=>{ const c=porSesion[k].vals[v]||{};
    max = Math.max(max, c.actual||0, c.deseada||0); }));
  max = Math.ceil(max/10)*10;

  $("#comp").innerHTML = `<div class="card">
    <h2>Comparación de ${claves.length} ${claves.length===1?"sesión":"sesiones"}</h2>
    <div class="legend">
      <span><i class="swatch" style="background:var(--actual)"></i>Cultura actual</span>
      <span><i class="swatch linea" style="background:var(--deseada)"></i>Cultura deseada</span></div>
    <p class="small">Los radares comparten escala 0–${max}, así que se pueden comparar entre sí.</p>
    <div class="multi">${claves.map((k,i)=>`
      <div class="mini"><h4>${esc(porSesion[k].etiqueta)}</h4>
        <div class="small">${porSesion[k].n} envíos${
          porSesion[k].colectivo?" · "+esc(porSesion[k].colectivo):""}</div>
        <div class="chartbox" id="cb-${i}"><svg id="cs-${i}" role="img"
          aria-label="Radar de ${esc(porSesion[k].etiqueta)}"></svg></div></div>`).join("")}</div>
    <h3>Tabla comparada</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Sesión</th><th>Envíos</th>${ORDEN.map(v=>
        `<th>${VEC[v].corto}</th>`).join("")}</tr></thead>
      <tbody>${claves.map(k=>`<tr><td>${esc(porSesion[k].etiqueta)}</td>
        <td>${porSesion[k].n}</td>${ORDEN.map(v=>{const c=porSesion[k].vals[v]||{};
          return `<td>${(c.actual||0).toFixed(0)} → ${(c.deseada||0).toFixed(0)}</td>`;}).join("")}
        </tr>`).join("")}</tbody></table></div>
  </div>`;
  claves.forEach((k,i)=>{
    const vals = {}; ORDEN.forEach(v=> vals[v] = porSesion[k].vals[v] || {actual:0,deseada:0});
    radarSVG(document.getElementById("cs-"+i), document.getElementById("cb-"+i), vals, max, true);
  });
  window._repinta = () => claves.forEach((k,i)=>{
    const vals = {}; ORDEN.forEach(v=> vals[v] = porSesion[k].vals[v] || {actual:0,deseada:0});
    radarSVG(document.getElementById("cs-"+i), document.getElementById("cb-"+i), vals, max, true);
  });
  document.getElementById("comp").scrollIntoView({behavior:"smooth", block:"start"});
}

async function descargarSeleccion(tipo){
  const ids = [...SEL];
  const filas = tipo === "detalle" ? await API.detalleSesiones(ids) : await API.resumenSesiones(ids);
  if(!filas.length){ alert("Las sesiones seleccionadas no tienen datos todavía."); return; }
  const cols = Object.keys(filas[0]).filter(c=>c!=="sesion_id" && c!=="organizacion_id");
  const csv = [cols.join(","), ...filas.map(r=>cols.map(c=>{
    const v = r[c]==null ? "" : String(r[c]);
    return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = `cultura-${tipo}-${ids.length}sesiones.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* Solo en modo demostración: rellena la sesión con un perfil sintético de
   organización pública consolidada —mucha Jerárquica, poca Innovadora— para
   poder ver funcionando la consola, la proyección y los radares. */
async function respuestasDeEjemplo(codigo, n){
  const base = {CD:{FAM:28,INN:12,RES:20,JER:40}, LO:{FAM:24,INN:10,RES:22,JER:44},
                GP:{FAM:30,INN:14,RES:18,JER:38}, CO:{FAM:32,INN:12,RES:18,JER:38},
                EE:{FAM:22,INN:14,RES:22,JER:42}, CE:{FAM:26,INN:12,RES:24,JER:38}};
  const obj  = {CD:{FAM:26,INN:32,RES:24,JER:18}, LO:{FAM:30,INN:28,RES:22,JER:20},
                GP:{FAM:32,INN:28,RES:22,JER:18}, CO:{FAM:30,INN:28,RES:22,JER:20},
                EE:{FAM:22,INN:34,RES:26,JER:18}, CE:{FAM:28,INN:28,RES:24,JER:20}};
  let s = 20260815;
  const rnd = () => (s = (s*1664525 + 1013904223) % 4294967296) / 4294967296;
  for(let i=0;i<n;i++){
    const envio = await API.abrirEnvio(codigo, {});
    for(const p of PANTALLAS){
      const ref = (p.pasada===0?base:obj)[p.sub];
      const bruto = ORDEN.map(v=>Math.max(0, ref[v] + (rnd()+rnd()-1)*16));
      const t = bruto.reduce((a,b)=>a+b,0);
      let c = bruto.map(x=>Math.round(x/t*10));
      let dif = 10 - c.reduce((a,b)=>a+b,0);
      while(dif !== 0){ const k = Math.floor(rnd()*4);
        if(dif>0){ c[k]++; dif--; } else if(c[k]>0){ c[k]--; dif++; } }
      const puntos = {}; ORDEN.forEach((v,k)=>puntos[v]=c[k]*10);
      await API.guardar(envio, p.orden.map((v,k)=>({pantalla:p.n, sub:p.sub, vector:v,
        pasada:p.pasada, posicion:k+1, puntos:puntos[v]})));
    }
    await API.cerrarEnvio(envio);
  }
}

function descargarCSV(s, res){
  if(!res || !res.datos){ alert("No hay resultados que descargar todavía."); return; }
  const cols = ["organizacion","sesion","codigo","modo","instrumento_version","n_envios",
                "pantalla","subcategoria","vector","pasada","media_puntos"];
  const filas = res.datos.map(r=>[ (s.organizacion||{}).nombre||"", s.titulo, s.codigo, s.modo,
    VERSION, res.n, r.pantalla, SUBS[r.sub], VEC[r.vector].nombre,
    r.pasada===0?"actual":"deseada", Number(r.media).toFixed(2) ]);
  const csv = [cols.join(","), ...filas.map(f=>f.map(v=>{
    const x = String(v==null?"":v); return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x;
  }).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "cultura-" + s.codigo + ".csv"; a.click(); URL.revokeObjectURL(a.href);
}

// El título de la pestaña también: con diez pestañas abiertas, «Consola de
// proyectos» se encuentra; «Diagnóstico de cultura organizativa» no distingue
// tu consola de la pantalla que está mirando la sala.
// El título de la pestaña arranca neutro; en cuanto se conoce la sesión,
// `recordarInstrumento` lo sustituye por el nombre real del instrumento.
document.title = enLaSala() ? "Diagnóstico" : "Consola de proyectos · joaquinromero.com";

let redib;
window.addEventListener("resize", ()=>{ clearTimeout(redib);
  redib = setTimeout(()=>{ if(window._repinta) window._repinta(); }, 150); });

render();
</script>

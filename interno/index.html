async function consolaMotor(s){
  const vars = s.variables || {};
  const BAN = bancoDe(s.instrumento);
  const BLOQUES = BAN.bloques, BANCO = BAN.banco, VARIABLES = BAN.variables;
  let preguntas = await API.preguntas(s.id);
  const urlPart = location.origin + location.pathname + "?s=" + encodeURIComponent(s.codigo);

  /* La sesión de origen. Solo la evaluación la tiene, y se lee una vez al
     entrar: es texto que tú escribiste en el taller y no cambia mientras
     conduces la encuesta. Si el taller se borró, `origen_id` quedó a null
     por el `on delete set null` de la v10 y esto simplemente no encuentra
     nada, que es exactamente lo que hay que enseñar. */
  let origen = null;
  if(s.origen_id){
    try{ origen = (await API.sesiones()).find(x => x.id === s.origen_id) || null; }
    catch(e){ origen = null; }
  }
  // De dónde salen las funciones que se vuelcan: del taller si está
  // enlazado, de la propia sesión si la escribiste a mano aquí.
  const funcionesVigentes = () =>
    ((origen && origen.funciones) || s.funciones || []).filter(f => f && f.nombre);

  /* DÓNDE CAE CADA PREGUNTA
     Pone el `orden` a las filas que todavía no existen y corrige el de las
     que ya están, si hace falta. Se llama SIEMPRE antes de crearlas.

     Dos reglas, en este orden:
       1. una pregunta del banco cae donde le toca por su código, no al
          final. Añadir la E04 cuando ya están la E03 y la E05 la mete
          entre las dos, que es donde se lee;
       2. y después las EX —las pantallas por función clave— se meten en
          su banda: detrás de la última E08-o-anterior que haya, y delante
          de la primera E10-o-posterior.

     Lo que NO hace: reordenar lo que ya está. Si moviste algo a mano con
     las flechas, se queda donde lo pusiste; solo se coloca lo nuevo, y
     relativo a lo que hay. Con la lista vacía, esto solo corrige la banda
     de las EX. Devuelve cuántas preguntas ha tenido que mover; es
     idempotente y no escribe nada si ya está todo en su sitio. */
  let avisoEva = "", avisoEsc = "", avisoCarga = "";
  /* `bt` y los dos `decir…` viven aquí, en la consola, y no dentro de
     `pinta()`: el taller de escenarios es ahora una pantalla aparte que
     también los necesita, y desde allí `pinta()` no está en el alcance. */
  const bt = id => document.getElementById(id);
  /* El aviso se guarda además en una variable de la consola. `pinta()`
     redibuja la pantalla entera y sin esto el recado se borraba con el
     resto: ya ha pasado tres veces. */
  const decirEva = (t, mal) => { avisoEva = `<div class="aviso${mal?" rojo":""}">${t}</div>`;
    const c = bt("avisoEva"); if(c) c.innerHTML = avisoEva; };
  const decirEsc = (t, mal) => { avisoEsc = `<div class="aviso${mal?" rojo":""}">${t}</div>`;
    const c = bt("avisoEsc"); if(c) c.innerHTML = avisoEsc; };
  const recolocar = async (nuevas) => {
    const antes = new Map(preguntas.filter(p=>p.id).map(p => [p.id, p.orden]));
    const indice = {}; BANCO.forEach((p,i) => { indice[p.c] = i; });
    let lista = insertarPorBanco(preguntas, nuevas || [], indice);
    lista.forEach((p,i) => { p.orden = i + 1; });   // provisional, para que `colocarEx` ordene
    lista = colocarEx(lista, []);
    let movidas = 0;
    for(let i = 0; i < lista.length; i++){
      const p = lista[i];
      if(p.id && antes.get(p.id) !== i + 1){
        await API.actualizarPregunta(p.id, {orden: i + 1}); movidas++;
      }
      p.orden = i + 1;
    }
    return movidas;
  };

  /* Cómo se dibuja un taller dentro de la lista de preguntas. No lleva
     estado, ni recuento, ni «abrir»: no es una pregunta. Lleva lo que ya se
     haya acordado en él, para que se vea de un vistazo si está hecho. */
  const filaTaller = (t, huerfano) => {
    if(t.k === "cierre"){
      const m = s.modelo || {};
      const ac = (m.acciones || []).filter(x => (x.accion||"").trim());
      const vg = (m.vigilancia || []).filter(x => (x.indicador||"").trim());
      const sinDueno = ac.filter(x => !(x.responsable||"").trim()).length
                     + vg.filter(x => !(x.responsable||"").trim()).length;
      const hecho = [ ac.length && (ac.length + (ac.length===1?" acción":" acciones")),
                      vg.length && (vg.length + (vg.length===1?" indicador":" indicadores"))
                    ].filter(Boolean);
      return `<div class="it taller-fila">
        <div><span class="phasetag">plenario</span>
          <b style="display:block;margin-top:4px">${esc(t.nombre)}</b>
          <div class="small">${esc(t.desc)}</div>
          <div class="small" style="margin-top:4px">${hecho.length
            ? "Acordado: " + hecho.join(" · ")
            : "<b>Sin empezar.</b> Se escribe en la sala, delante de todos, cuando la "
              + "P48 y la P50 ya estén votadas."}</div>
          ${/* Un acuerdo sin nombre propio al lado no es un acuerdo. Es la
                única alarma de esta fila porque es el único fallo del cierre
                que no se ve al leerlo: la lista parece completa. */
            sinDueno ? `<div class="small" style="color:#d03b3b;margin-top:4px">
            <b>${sinDueno} sin responsable.</b> Lo que no tiene nombre no se hace.</div>` : ""}
          ${huerfano ? `<div class="small" style="color:#d03b3b">Va antes de
            <b>${esc(t.ancla)}</b>, que no está en esta sesión: por eso sale al final.</div>` : ""}</div>
        <div class="btnrow" style="margin:0">
          <button class="btn ${hecho.length ? "ghost " : ""}sm" data-taller="${esc(t.k)}">${
            hecho.length ? "Abrir el cierre" : "Preparar el cierre"}</button></div>
      </div>`;
    }
    if(t.k === "escenarios"){
      const m = s.modelo || {}, ej = m.ejes || {};
      const es = (m.escenarios || []).filter(e => (e.nombre||"").trim());
      const pant = preguntas.filter(p => esCopiaEsc(p.codigo)).length;
      const hecho = [ (ej.y && ej.x) && "los dos ejes",
                      es.length === 4 && "los cuatro escenarios",
                      pant && (pant + " pantallas de grupo") ].filter(Boolean);
      return `<div class="it taller-fila">
        <div><span class="phasetag">taller</span>
          <b style="display:block;margin-top:4px">${esc(t.nombre)}</b>
          <div class="small">${esc(t.desc)}</div>
          <div class="small" style="margin-top:4px">${hecho.length
            ? "En marcha: " + hecho.join(" · ")
            : "<b>Sin empezar.</b> Se prepara antes de la sala, con lo votado en la "
              + "P19, la P20, la P26 y la P29."}</div>
          ${huerfano ? `<div class="small" style="color:#d03b3b">Va antes de
            <b>${esc(t.ancla)}</b>, que no está en esta sesión: por eso sale al final.
            Añade el recorrido completo y volverá a su sitio.</div>` : ""}</div>
        <div class="btnrow" style="margin:0">
          <button class="btn ${pant ? "ghost " : ""}sm" data-taller="${esc(t.k)}">${
            pant ? "Abrir el taller" : "Preparar el taller"}</button></div>
      </div>`;
    }
    const g = s.modelo || {}, nf = (s.funciones||[]).filter(f=>f.nombre).length;
    const ngr = (g.grupos||[]).filter(x=>x.grupo||x.nivel).length;
    const hecho = [g.definicion && "definición", ngr && (ngr + " pares de alcance"),
                   nf && (nf + " funciones")].filter(Boolean);
    return `<div class="it taller-fila">
      <div><span class="phasetag">taller</span>
        <b style="display:block;margin-top:4px">${esc(t.nombre)}</b>
        <div class="small">${esc(t.desc)}</div>
        <div class="small" style="margin-top:4px">${
          g.cerrado_en ? `<b>Modelo cerrado</b> el ` + new Date(g.cerrado_en)

                     enseñando las tarjetas sueltas. Abre la mesa de agrupación y junta las

            <div class="btnrow" style="margin:0">
              ${LISTAS_TIPO[p.tipo] ? `<button class="btn ${faltaContenido(p)?"":"ghost"} sm"
                data-listas="${p.id}">Contenido…</button>` : ""}
              ${p.tipo==="tarjetas" && p.estado!=="cerrada" ? FASES_TARJ
                  .filter(f => !((p.config||{}).sin_agrupar && f.k === "agrupando"))

                `<button class="btn ${p.fase===f.k?"":"ghost"} sm" data-fase="${p.id}"
                   data-k="${f.k}">${esc(f.t)}</button>`).join("")
                + ((p.config||{}).sin_agrupar ? "" :
                   `<button class="btn ${(gruposDe[p.id]===0
                    && ["votacion","resultados"].includes(p.fase||"")) ? "" : "ghost "}sm"
                     data-mesa="${p.id}">Mesa de agrupación…</button>`) : ""}
              ${p.estado==="cerrada"   ? `<button class="btn sm" data-abrir="${p.id}">Abrir</button>` : ""}
              ${p.estado==="abierta"   ? `<button class="btn ghost sm" data-fin="${p.id}">Terminar</button>` : ""}
              ${p.estado==="terminada" ? `<button class="btn ghost sm" data-reabrir="${p.id}">Reabrir</button>` : ""}
              <button class="btn ghost sm" data-proy="${p.id}">Proyectar</button>
              <button class="btn ghost sm" data-sube="${p.id}" ${i===0?"disabled":""}>↑</button>
              <button class="btn ghost sm" data-baja="${p.id}" ${i===preguntas.length-1?"disabled":""}>↓</button>
              <button class="btn ghost sm" data-quita="${p.id}">Quitar</button>
            </div>
          </div>`).join("")}${sitio.huerfanos.map(t=>filaTaller(t, true)).join("")}</div>
          ${(() => {
            // Un resumen arriba de las que saldrían en blanco. La línea roja
            // de cada fila está bien cuando hay seis preguntas; con veinte no
            // se ve, y la que se queda vacía suele ser la primera.
            const sinC = preguntas.filter(p => faltaContenido(p));
            return sinC.length ? `<div class="aviso rojo"><b>${sinC.length}
              ${sinC.length===1?"pregunta sale":"preguntas salen"} en blanco</b>:
              ${esc(sinC.map(p=>p.codigo||p.titulo.slice(0,24)).join(", "))}. Su contenido
              viene del modelo y todavía no se ha volcado. No se pueden abrir así.</div>` : "";
          })()}
          ${s.modo === "survey" ? `<div class="aviso"><b>Esto es un survey.</b> No hay nadie
            conduciendo: quien entre verá, de una vez, todas las preguntas que estén
            <b>abiertas</b>, y terminará cuando las responda. Las que dejes cerradas no
            existen para él. Ábrelas antes de repartir el enlace.</div>
            <div class="btnrow">
              <button class="btn" id="abrirTodas">Abrir todas las preguntas</button>
              <button class="btn ghost" id="terminarTodas">Dar por terminadas todas</button>
              <button class="btn ghost" id="informeS">Ver todos los resultados</button>
            </div>` : ""}
          <div class="btnrow"${s.modo === "survey" ? ` style="display:none"` : ""}>
            <button class="btn" id="avanzar">Terminar esta y abrir la siguiente ▶</button>
            <button class="btn ghost" id="abrirTodasD">Abrir todas · para ensayar</button>
            <button class="btn ghost" id="terminarTodasD">Terminar todas</button>
            <button class="btn ghost" type="button"
              onclick="abrirProyeccion('${esc(s.codigo)}')">Abrir proyección</button>
            <button class="btn ghost" id="espera">Proyectar la espera</button>
            <button class="btn ghost" id="informe">Ver todos los resultados</button>
          </div>`
          : `<p class="small">Todavía no has añadido ninguna. Empieza por el itinerario núcleo.</p>`}
        <div class="btnrow">
          <button class="btn ghost" id="nucleo">Añadir ${esc(BAN.nucleo)}</button>
          <button class="btn ghost" id="bench">Añadir solo las comparables</button>
        </div>
        <p class="note">${esc(BAN.nucleo[0].toUpperCase()+BAN.nucleo.slice(1))} son ${
          BANCO.filter(p=>p.nuc).length} preguntas:
          el recorrido completo del método. Las comparables son las ${
          BANCO.filter(p=>p.bench).length} que acumulan conocimiento entre clientes, y
          conviene que estén en todas tus sesiones con el mismo texto. Añadir el banco entero
          —las 60— es un catálogo, no una sesión.</p>
      </div>

      ${BLOQUES.map((nb, bi) => {
        const ps = BANCO.filter(p=>p.b===bi);
        return `<div class="card">
          <h3 style="margin-top:0">Bloque ${bi} · ${esc(nb)}</h3>
          <div class="lista">${ps.map(p=>{
            const listo = TIPOS_LISTOS.includes(p.t);
            const puesta = usados.has(p.c);
            return `<div class="it" style="${listo?"":"opacity:.55"}">
              <div><b>${esc(p.c)}.</b> ${esc(resolverTexto(p.q, vars))}
                <div class="small">${esc(nombreTipo(p))} ·
                  <span title="${esc(NAT_ETIQ[p.nat].d)}">${esc(NAT_ETIQ[p.nat].t)}</span>
                  ${p.nuc ? " · núcleo" : ""}${p.bench ? " · comparable" : ""}
                  ${listo ? "" : " · <b>tipo no construido</b>"}</div></div>
              <div>${puesta ? `<span class="estado">añadida</span>`
                : listo ? `<button class="btn ghost sm" data-add="${p.c}">Añadir</button>`
                : `<span class="estado">fase siguiente</span>`}</div>
            </div>`;}).join("")}</div>
        </div>`;}).join("")}
      </div>`;

    if(preguntas.length) pintarQR("qr", urlPart, 5);
    atarTitulo(s, () => pinta());
    const cambiarSesion = async c => { Object.assign(s, await API.actualizarSesion(s.id, c)); pinta(); };
    if(bt("abrirSesion"))  bt("abrirSesion").onclick  = () =>
      cambiarSesion({estado:"abierta", abierta_en:new Date().toISOString()});
    /* Al cerrar la sesión se ocultan los resultados. La URL de proyección
       es pública a propósito —hay que poder abrirla en el portátil de la
       sala sin identificarse—, así que una sesión terminada y publicada
       sigue enseñando el agregado a cualquiera que se guardara ese
       enlace. El estado por defecto de lo terminado pasa a ser «no
       visible», y volver a enseñarlo es un gesto explícito.

       La excepción: si el radar está justo en la pared, no se toca.
       Quitárselo a la sala en mitad de la conversación no protege nada y
       deja al facilitador delante de una pantalla vacía. */
    if(bt("cerrarSesion")) bt("cerrarSesion").onclick = () => {
      const cambios = {estado:"cerrada", cerrada_en:new Date().toISOString()};
      if(s.vista_activa !== "radar") cambios.resultados_publicos = false;
      return cambiarSesion(cambios);
    };
    if(bt("espera")) bt("espera").onclick = () => cambiarSesion({vista_activa:"espera"});
    if(bt("pubM")) bt("pubM").onclick = () =>
      cambiarSesion({resultados_publicos: !s.resultados_publicos});
    /* Publica y proyecta en el mismo gesto: si fueran dos botones, el
       facilitador pulsaria el segundo y la pared le diria que no. */
    if(bt("proyRadar")) bt("proyRadar").onclick = () =>
      cambiarSesion({resultados_publicos: true, vista_activa: "radar"});
    const verInforme = () =>
      informeSesion(s, preguntas, async () => { preguntas = await API.preguntas(s.id); pinta(); });
    if(bt("informe"))  bt("informe").onclick  = verInforme;
    if(bt("informeS")) bt("informeS").onclick = verInforme;
    app().querySelectorAll("[data-taller]").forEach(b => b.onclick = () => {
      const volver = async () => { preguntas = await API.preguntas(s.id); pinta(); };
      if(b.dataset.taller === "cierre") cierrePlenario();
      else if(b.dataset.taller === "escenarios") tallerEscenarios();
      else tallerFunciones(s, preguntas, volver);
    });

    /* «Cada aportación, un tema». Para las preguntas de tarjetas en las
       que agrupar no aporta nada —L17: matices sobre una redacción— se
       crea un grupo por cada aportación suelta, con el propio texto como
       etiqueta. A partir de ahí todo lo demás funciona igual: se vota,
       se cuenta, se proyecta y se respeta el suelo de tres votantes.

       No hay tabla nueva ni función nueva en la base de datos. Un voto
       sigue apuntando a un grupo; lo que cambia es que el grupo tiene una
       sola aportación dentro. Cambiar el esquema para poder votar
       tarjetas habría sido la otra opción, y habría duplicado el recuento,
       la agregación y la pantalla de resultados para ganar exactamente
       nada. */
    const unoPorAportacion = async (pid) => {
      const tj = await API.tarjetasAdmin(pid);
      const sueltas = (tj||[]).filter(t => !t.grupo_id && !t.oculta);
      if(!sueltas.length) return 0;
      let orden = 0;
      for(const t of sueltas){
        const g = await API.crearGrupo(pid, (t.texto||"").slice(0,120), ++orden);
        await API.tocarTarjeta(t.id, {grupo_id: g.id});
      }
      return sueltas.length;
    };

    if(bt("volcarEva")) bt("volcarEva").onclick = async () => {
      const fs = funcionesVigentes();
      const nombres = fs.map(f=>f.nombre);
      const defs = fs.reduce((o,f)=>(f.definicion ? (o[f.nombre]=f.definicion) : 0, o), {});
      // Cada destino recibe la lista en la clave que su tipo sabe leer.
      const destinos = [{c:"E06", k:"items", d:true}, {c:"E07", k:"opciones", d:true}];
      const hechas = [], faltan = [];
      for(const d of destinos){
        const p = preguntas.find(x => x.codigo === d.c);
        if(!p){ faltan.push(d.c); continue; }
        const cfg = {...(p.config||{}), [d.k]: nombres};
        if(d.d) cfg.definiciones = defs; else delete cfg.definiciones;
        await API.actualizarPregunta(p.id, {config: cfg});
        hechas.push(d.c);
      }
      /* E01 —«¿a qué colectivo perteneces?»— sale de la PRIMERA COLUMNA de
         la tabla del alcance. Es el mismo vocabulario con el que el comité
         definió a quién llama líder, así que al cruzar los resultados por
         colectivo las categorías coinciden con las del modelo en vez de
         ser una lista paralela inventada aquí. Se añade «Otra» al final:
         siempre hay alguien que no se reconoce en ninguna. */
      const cols = ((origen && origen.modelo) || s.modelo || {}).grupos || [];
      const cats = cols.map(g => (g.grupo||"").trim()).filter(Boolean);
      const p01 = preguntas.find(x => x.codigo === "E01");
      if(p01 && cats.length){
        await API.actualizarPregunta(p01.id,
          {config: {...(p01.config||{}), opciones: cats.concat(["Otra"])}});
        hechas.push("E01");
      } else if(p01 && !cats.length){ faltan.push("E01 (la tabla del alcance está vacía)"); }
      /* Y AQUÍ SE CREAN LAS PANTALLAS POR FUNCIÓN.

         Antes esto vivía detrás de un botón aparte, opcional, en una
         tarjeta de más abajo. El resultado previsible —y ocurrió— es que
         se monta la encuesta entera, se reparte, se responde, y no hay ni
         un comentario sobre ninguna función clave: las dos matrices
         puntúan, pero nadie ha escrito nada.

         Un cuestionario que dice evaluar las funciones clave y no recoge
         una sola frase sobre ellas no es una opción de configuración: es
         un cuestionario roto. Así que se crean al volcar, que es el
         momento en el que las funciones existen. Si alguna sobra, se
         quita a mano, que es la operación rara. */
      const px = await pantallasPorFuncion();
      preguntas = await API.preguntas(s.id);
      // `await`: `pinta()` redibuja la pantalla entera. Si el aviso se
      // escribe antes de que termine, se borra con el resto y nadie llega
      // a leerlo. Es el mismo tropiezo que costó el «recado» del taller.
      await pinta();
      decirEva(`Volcadas ${nombres.length} funciones en ${hechas.join(", ") || "ninguna pregunta"}.`
        + (px.creadas ? ` Y creadas <b>${px.creadas} pantallas de texto</b>, una por función:
            así cada persona se pronuncia sobre todas.` : "")
        + (px.refrescadas ? ` Actualizado el enunciado de <b>${px.refrescadas}</b>
            ${px.refrescadas===1?"pantalla":"pantallas"} por función, porque el nombre o la
            descripción cambiaron en el taller.` : "")
        + (px.congeladas.length ? ` <b>No</b> se ha tocado ${px.congeladas.join(", ")}: ${
            px.congeladas.length===1 ? "ya tiene respuestas" : "ya tienen respuestas"}, y
            cambiarle el enunciado dejaría sin saber a qué contestó la gente. Si aun así
            quieres el nombre nuevo, ${px.congeladas.length===1 ? "bórrala" : "bórralas"}
            y vuelve a volcar.` : "")
        + (faltan.length ? ` No están en esta sesión: <b>${faltan.join(", ")}</b>.` : ""),
        !hechas.length);
    };

    /* COBERTURA COMPLETA
       Todo el mundo se pronuncia sobre TODAS las funciones clave. Las dos
       matrices ya lo hacían —el móvil no deja enviar con una fila sin
       valorar—; esto lo extiende a la parte escrita.

       Tres formas de hacerlo, de menos a más carga:
         "campos"  una pantalla por función con los tres campos dentro
         "accion"  una pantalla por función, solo la propuesta de acción
         "tres"    tres pantallas por función, como el formulario original

       La primera es la buena y es la que va marcada como recomendada. Con
       ocho funciones son ocho pantallas en vez de veinticuatro, y en cada
       una los tres campos se ven juntos: quien responde ve de un vistazo
       que ya ha dicho lo que iba a decir y no repite. La tercera existe
       porque a veces el cliente exige literalmente ese formato. */
    const generarAbiertas = async (modo, callado) => {
      const fs = funcionesVigentes();
      const ya = new Set(preguntas.map(p=>p.codigo).filter(Boolean));
      const filas = [];
      fs.forEach((f, i) => {
        const n = String(i+1).padStart(2,"0");
        if(modo === "campos"){
          const cod = "EX" + n + "C";
          if(ya.has(cod)) return;
          filas.push({sesion_id: s.id, codigo: cod, tipo: "abierta_campos",
            titulo: resolverTexto(f.nombre + ": ¿cómo la ejerce hoy [ORGANIZACION]?", vars),
            ayuda: f.definicion || null,
            config: {funcion: f.nombre, campos: camposPorFuncion(vars, resolverTexto)},
            estado: "cerrada"});
          return;
        }
        const lista = modo === "accion" ? [ABIERTAS_POR_FUNCION[2]] : ABIERTAS_POR_FUNCION;
        lista.forEach(pl => {
          const cod = "EX" + n + pl.suf;
          if(ya.has(cod)) return;
          filas.push({sesion_id: s.id, codigo: cod, tipo: "abierta",
            titulo: resolverTexto(pl.q.replace(/\[FUNCION\]/g, f.nombre), vars),
            ayuda: f.definicion || null,
            config: {maximo_caracteres: 300}, estado: "cerrada"});
        });
      });
      await recolocar(filas);
      if(!filas.length){ if(!callado) decirEva("Ya estaban creadas: no se ha añadido ninguna. "
        + "Si quieres cambiar de formato, quita primero las que hay.", true); return 0; }
      await API.crearPreguntas(filas);
      if(callado) return filas.length;   // el que llama repinta y avisa
      preguntas = await API.preguntas(s.id);
      await pinta();
      decirEva(`Añadidas ${filas.length} preguntas, ${
        modo === "tres" ? "tres por cada función clave"
        : "una por cada función clave"}. Todas las funciones quedan cubiertas y todo el
        mundo se pronuncia sobre todas. Quedan <b>cerradas</b>: ábrelas con «Abrir todas»
        cuando el cuestionario esté como lo quieres.`);
      return filas.length;
    };
    if(bt("abiertasCampos")) bt("abiertasCampos").onclick = () => generarAbiertas("campos");
    if(bt("abiertasAccion")) bt("abiertasAccion").onclick = () => generarAbiertas("accion");
    if(bt("abiertasTres")) bt("abiertasTres").onclick = () => {
      const n = funcionesVigentes().length;
      if(!confirm("Se van a añadir " + (n*3) + " pantallas de texto libre: tres por cada una "
        + "de las " + n + " funciones clave.\n\n"
        + "Es exactamente el formato del formulario de la UIB. En aquel, esa batería hizo "
        + "caer la participación de 65 respuestas en la primera pregunta a 28 en la última, "
        + "y llenó las finales de «ídem a las anteriores» y de párrafos copiados de la "
        + "pantalla anterior.\n\n"
        + "«Una pantalla por función» cubre exactamente lo mismo en " + n + " pantallas.\n\n"
        + "¿Aun así, las tres por función?")) return;
      generarAbiertas("tres");
    };

    /* El mismo trabajo para los dos botones: el de survey, donde abrir todo
       es lo normal, y el de directo, donde es la excepcion y por eso avisa
       antes. Uno solo de los dos existe en cada pantalla. */
    const abrirTodasLasPreguntas = async () => {
      /* Último filtro antes de repartir el enlace. En una evaluación sin
         una sola pantalla por función, el cuestionario se responde entero
         y no recoge un comentario: se descubre al leer los resultados, que
         es tres semanas tarde. */
      if(String(s.instrumento||"").split("-")[0] === "evaluacion"){
        const nf = funcionesVigentes().length;
        const cub = new Set(preguntas.map(p => p.codigo || "")
          .filter(c => /^EX\d\d/.test(c)).map(c => c.slice(0,4))).size;
        if(nf && cub < nf && !confirm(
          "ATENCIÓN: " + (nf - cub) + " de las " + nf + " funciones clave no tienen "
          + "pantalla propia.\n\nSi abres la encuesta así, esas funciones no se valoran ni "
          + "se comenta nada sobre ellas: no habrá media, y sin media no salen en la tabla "
          + "de la brecha.\n\nSe crean con «Volcar en las preguntas», arriba.\n\n"
          + "¿Abrir de todas formas?")) return;
      }
      const abribles = preguntas.filter(p => p.estado === "cerrada" && !faltaContenido(p));
      const rotas = preguntas.filter(p => p.estado === "cerrada" && faltaContenido(p));
      for(const p of abribles) await API.actualizarPregunta(p.id, {estado:"abierta"});
      preguntas = await API.preguntas(s.id);
      pinta();
      if(rotas.length) alert("Se han abierto " + abribles.length + " preguntas.\n\n"
        + "NO se han abierto estas, porque les falta contenido y en el móvil saldrían "
        + "vacías:\n\n" + rotas.map(p=>(p.codigo||"") + " " + p.titulo).join("\n"));
    };
    if(bt("abrirTodas")) bt("abrirTodas").onclick = abrirTodasLasPreguntas;
    if(bt("abrirTodasD")) bt("abrirTodasD").onclick = async () => {
      const cerradas = preguntas.filter(p => p.estado === "cerrada").length;
      if(!cerradas) return alert("No queda ninguna pregunta cerrada.");
      if(!confirm("Se van a abrir " + cerradas + " preguntas de golpe.\n\n"
        + "En directo lo normal es abrirlas de una en una: quien está en la sala ve la "
        + "que tú abres y ninguna más. Si las abres todas, cada persona podrá ir por su "
        + "cuenta y se pierde el ritmo de la sesión.\n\n"
        + "Es lo que quieres si estás ensayando tú solo. ¿Sigo?")) return;
      await abrirTodasLasPreguntas();
    };

    const terminarTodas = async () => {
      const abiertas = preguntas.filter(p => p.estado === "abierta");
      if(!abiertas.length){ alert("No hay ninguna pregunta abierta."); return; }
      // Las de tarjetas en recogida se avisan aparte: terminarlas deja las
      // aportaciones dentro pero sin agrupar ni votar, y eso no se puede
      // deshacer solo reabriendo —la gente ya se ha ido de esa pantalla—.
      const tj = abiertas.filter(p => p.tipo === "tarjetas"
        && ["recogida","agrupando"].includes(p.fase || "recogida"));
      if(!confirm("Se van a dar por terminadas " + abiertas.length
        + " pregunta(s) abiertas. Dejarán de admitir respuestas."
        + (tj.length ? "\n\nOJO: " + tj.length + " de ellas es de tarjetas y todavía no ha "
            + "pasado por la votación:\n" + tj.map(p=>"· " + (p.codigo||"") + " "
            + p.titulo.slice(0,60)).join("\n")
            + "\n\nSus aportaciones se quedan recogidas, pero sin votar." : "")
        + "\n\n¿Sigo?")) return;
      for(const p of abiertas) await API.actualizarPregunta(p.id, {estado:"terminada"});
      preguntas = await API.preguntas(s.id);
      pinta();
    };
    if(bt("terminarTodas"))  bt("terminarTodas").onclick  = terminarTodas;
    if(bt("terminarTodasD")) bt("terminarTodasD").onclick = terminarTodas;

    if(bt("vivo")) bt("vivo").onclick = () =>
      cambiarSesion({resultados_en_vivo: !s.resultados_en_vivo});
    if(bt("minMuestra")) bt("minMuestra").onclick = () => {
      const act = Number(s.min_muestra) || 3;
      const v = prompt("¿Cuántas respuestas hacen falta para proyectar un resultado "
        + "y para poder volcarlo en otra pregunta?\n\n"
        + "3 es el valor de siempre y el que protege el anonimato.\n"
        + "1 se proyecta en cuanto responda alguien: úsalo para ensayar, o con grupos "
        + "tan pequeños que el anonimato ya no dependa de este número.\n\n"
        + "Las sesiones marcadas como ensayo nacen ya en 1.", String(act));
      if(v === null) return;
      const n = parseInt(v, 10);
      if(!Number.isFinite(n) || n < 1 || n > 20)
        return alert("Tiene que ser un número entre 1 y 20.");
      if(n === act) return;
      if(n === 1 && !s.es_prueba && !confirm(
        "Esta sesión NO está marcada como ensayo.\n\n"
        + "Con el mínimo en 1, la primera respuesta que entre se proyecta sola. En una "
        + "pregunta de texto libre, eso enseña en la pared lo que ha escrito una persona "
        + "concreta, y en una sala se sabe quién ha contestado ya.\n\n"
        + "¿Aun así lo bajas a 1?")) return;
      cambiarSesion({min_muestra: n});
    };

    if(bt("ensayoMotor")) bt("ensayoMotor").onclick = async () => {
      const reales = prog ? prog.completos : 0;
      if(!confirm("Se van a crear 12 respuestas simuladas y todas las preguntas con contenido "
        + "quedarán TERMINADAS.\n\nLa sesión quedará marcada como ENSAYO para siempre y no "
        + "entrará nunca en el benchmark. No uses esto en una sesión con un cliente delante."
        + (reales > 0 && !s.es_prueba
            ? "\n\nADEMÁS: esta sesión ya tiene " + reales + " respuesta(s) de verdad. "
              + "Las simuladas se mezclarán con ellas y no se podrán separar."
            : ""))) return;
      const b = bt("ensayoMotor"); b.disabled = true;
      const avisar = t => { b.textContent = t;
        const c = document.getElementById("avisoEnsayo");
        if(c) c.innerHTML = `<div class="aviso">${esc(t)}</div>`; };
      try{
        // La marca antes que los datos: si se cae la conexión a medias,
        // prefiero una sesión marcada de ensayo sin datos que una sesión
        // con datos falsos sin marcar.
        Object.assign(s, await API.actualizarSesion(s.id, {es_prueba:true}));
        const r = await respuestasEnsayoMotor(s, preguntas, 12, avisar);
        preguntas = await API.preguntas(s.id);
        alert(`Listo: ${r.hechas} preguntas rellenadas.` + (r.saltadas.length
          ? `\n\nSe han saltado ${r.saltadas.length} por no tener contenido todavía:\n`
            + r.saltadas.join(", ")
          : ""));
      }catch(e){ alert("No se han podido generar: " + (e.message||e)); }
      pinta();
    };

    const tocar = async (id, cambios, proyectar) => {
      await API.actualizarPregunta(id, cambios);
      if(proyectar) Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+id}));
      preguntas = await API.preguntas(s.id); pinta();
    };
    /* Abrir una pregunta sin contenido es repartir una pantalla en blanco.
       Pasa de verdad desde que la E01 —el colectivo— sale de la tabla del
       alcance: nace vacía y solo se llena al volcar, así que la primera
       pregunta de la encuesta es justo la que puede estar en blanco. */
    app().querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => {
      const p = preguntas.find(x => x.id === b.dataset.abrir);
      const falta = p && faltaContenido(p);
      if(falta){ alert("Esta pregunta no se puede abrir: le falta rellenar " + falta
        + ".\n\nEn el móvil saldría vacía." + ((p.config||{}).opciones && !((p.config||{})
        .opciones.length) && String(s.instrumento||"").startsWith("evaluacion")
        ? "\n\nSi es una de las que salen del modelo, se llena con «Volcar en las "
          + "preguntas»." : "")); return; }
      tocar(b.dataset.abrir, {estado:"abierta"}, true);
    });
    app().querySelectorAll("[data-fin]").forEach(b => b.onclick = () =>
      tocar(b.dataset.fin, {estado:"terminada"}, true));
    app().querySelectorAll("[data-reabrir]").forEach(b => b.onclick = () =>
      tocar(b.dataset.reabrir, {estado:"abierta"}, true));
    app().querySelectorAll("[data-fase]").forEach(b => b.onclick = async () => {
      const p = preguntas.find(x => x.id === b.dataset.fase);
      // En las que no se agrupan, pasar a «Votar» crea los temas solo.
      // Si no se hiciera aquí, habría que acordarse de pulsar otro botón
      // antes, y olvidarlo deja al móvil una lista vacía.
      if(b.dataset.k === "votacion" && p && (p.config||{}).sin_agrupar){
        try{ await unoPorAportacion(p.id); }catch(e){}
      }
      tocar(b.dataset.fase, {fase: b.dataset.k, estado:"abierta"}, true);
    });
    app().querySelectorAll("[data-listas]").forEach(b => b.onclick = () =>
      editorListas(s, preguntas.find(x=>x.id === b.dataset.listas), preguntas,
        async () => { preguntas = await API.preguntas(s.id); pinta(); }));
    app().querySelectorAll("[data-mesa]").forEach(b => b.onclick = async () => {
      const p = preguntas.find(x=>x.id === b.dataset.mesa);
      // Al entrar a agrupar se cierra la recogida: si sigue abierta, el
      // recuento te cambia debajo mientras estás fusionando.
      if((p.fase||"recogida") === "recogida"){
        await API.actualizarPregunta(p.id, {fase:"agrupando"});
        preguntas = await API.preguntas(s.id);
      }
      mesaAgrupacion(s, preguntas.find(x=>x.id===b.dataset.mesa),
        async () => { preguntas = await API.preguntas(s.id); pinta(); });
    });
    app().querySelectorAll("[data-proy]").forEach(b => b.onclick = async () => {
      Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+b.dataset.proy})); pinta(); });

    // El gesto de conducir: cierro la que está abierta y abro la siguiente.
    if(bt("avanzar")) bt("avanzar").onclick = async () => {
      const abierta = preguntas.find(p=>p.estado === "abierta");
      if(abierta) await API.actualizarPregunta(abierta.id, {estado:"terminada"});
      const i = abierta ? preguntas.findIndex(p=>p.id===abierta.id) : -1;
      const sig = preguntas.slice(i+1).find(p=>p.estado === "cerrada");
      if(sig) await API.actualizarPregunta(sig.id, {estado:"abierta"});
      const foco = sig || abierta;
      if(foco) Object.assign(s, await API.actualizarSesion(s.id, {vista_activa:"q:"+foco.id}));
      preguntas = await API.preguntas(s.id); pinta();
    };

    $("#gv").onclick = async () => {
      const nv = {}; VARIABLES.forEach(v=>{
        const el = $("#" + idVar(v.clave)); const x = el ? el.value.trim() : "";
        if(x) nv[v.clave] = x; });
      Object.assign(s, await API.actualizarSesion(s.id, {variables:nv}));
      Object.keys(vars).forEach(k=>delete vars[k]); Object.assign(vars, nv);
      pinta();
    };
    if(bt("tapar")) bt("tapar").onclick = async () => {
      const conResp = conHueco.filter(x => cuentas[x.p.id] > 0);
      if(!confirm("Se van a reescribir " + conHueco.length + " pregunta(s) sustituyendo los "
        + "huecos por el valor de las variables de hoy."
        + (conResp.length ? "\n\nOJO: " + conResp.length + " de ellas YA TIENE respuestas. "
            + "Quien respondió leyó el texto con el hueco; a partir de ahora el enunciado "
            + "guardado será otro. Las respuestas no se tocan, pero el informe no dirá que "
            + "la pregunta cambió de texto." : "")
        + "\n\n¿Sigo?")) return;
      const b = bt("tapar"); b.disabled = true; b.textContent = "Rellenando…";
      let n = 0;
      for(const x of conHueco){
        const cambios = {titulo: resolverTexto(x.p.titulo, vars)};
        if(x.p.ayuda) cambios.ayuda = resolverTexto(x.p.ayuda, vars);
        // La configuración también lleva huecos: los ítems de una matriz de
        // escalas se escriben con [ORGANIZACION] igual que el enunciado.
        cambios.config = JSON.parse(resolverTexto(JSON.stringify(x.p.config||{}), vars));
        try{ await API.actualizarPregunta(x.p.id, cambios); n++; }catch(e){}
      }
      preguntas = await API.preguntas(s.id);
      await pinta();
      const c = bt("avisoHueco");
      if(c) c.outerHTML = `<div class="aviso">Rellenadas ${n} preguntas.</div>`;
    };
    $("#nucleo").onclick = () => añadir(BANCO.filter(p=>p.nuc && TIPOS_LISTOS.includes(p.t)));
    $("#bench").onclick  = () => añadir(BANCO.filter(p=>p.bench));
    app().querySelectorAll("[data-add]").forEach(b => b.onclick = () =>
      añadir([BANCO.find(p=>p.c===b.dataset.add)]));
    app().querySelectorAll("[data-quita]").forEach(b => b.onclick = async () => {
      await API.borrarPregunta(b.dataset.quita);
      preguntas = await API.preguntas(s.id); pinta(); });
    const mover = async (id, delta) => {
      const i = preguntas.findIndex(p=>p.id===id), j = i + delta;
      if(j < 0 || j >= preguntas.length) return;
      // Los dos valores se capturan ANTES de tocar nada. Leerlos del array
      // entre las dos escrituras deja las dos filas con el mismo orden si el
      // backend devuelve el mismo objeto que ya tenías.
      const [idA, ordA] = [preguntas[i].id, preguntas[i].orden];
      const [idB, ordB] = [preguntas[j].id, preguntas[j].orden];
      await API.actualizarPregunta(idA, {orden: ordB});
      await API.actualizarPregunta(idB, {orden: ordA});
      preguntas = await API.preguntas(s.id); pinta();
    };
    app().querySelectorAll("[data-sube]").forEach(b => b.onclick = () => mover(b.dataset.sube, -1));
    app().querySelectorAll("[data-baja]").forEach(b => b.onclick = () => mover(b.dataset.baja, +1));
  };

  // Resuelve las variables también dentro de la configuración: los ítems de
  // una matriz de escalas llevan [ORGANIZACION] igual que el enunciado.
  const resolverCfg = cfg => JSON.parse(resolverTexto(JSON.stringify(cfg||{}), vars));

  const añadir = async lista => {
    const ya = new Set(preguntas.map(p=>p.codigo));
    const nuevas = lista.filter(p => p && !ya.has(p.c) && TIPOS_LISTOS.includes(p.t));
    if(!nuevas.length) return;
    const filas = nuevas.map(p => ({
      sesion_id: s.id, codigo: p.c, tipo: p.t,
      titulo: resolverTexto(p.q, vars),
      ayuda: p.ayuda ? resolverTexto(p.ayuda, vars) : null,
      config: resolverCfg(p.cfg), estado: "cerrada"
    }));
    // El `orden` no es «al final»: cada una cae en el sitio que le da su
    // código dentro del banco. `recolocar` se lo pone antes de crearlas.
    await recolocar(filas);
    await API.crearPreguntas(filas);
    preguntas = await API.preguntas(s.id);

    /* Y, en una evaluación enlazada a un taller, las pantallas por función.

       Estaban detrás de un botón. Después las puse detrás de «Volcar».
       Las dos veces pasó lo mismo: se monta la encuesta, se reparte, se
       responde entera, y no hay ni una frase sobre ninguna función clave.
       La lección es que un cuestionario que dice evaluar N funciones y no
       pregunta por ellas no puede depender de que alguien se acuerde de
       nada. Se crean aquí, en el primer momento en que la sesión tiene a
       la vez su banco y sus funciones. Si alguna sobra, se quita a mano:
       esa es la operación rara, no la contraria. */
    if(String(s.instrumento||"").split("-")[0] === "evaluacion"){
      const px = await pantallasPorFuncion();
      if(px.creadas || px.refrescadas) preguntas = await API.preguntas(s.id);
    }
    pinta();
  };

  /* Una pantalla de texto por función clave, con los tres campos dentro.
     Vive fuera de los manejadores porque la llaman dos caminos: añadir el
     cuestionario base y volcar las funciones.

     QUÉ RELACIÓN TIENEN ESTAS PREGUNTAS CON EL TALLER
     El enunciado y la descripción se COPIAN aquí, no se leen del taller
     cada vez. Es a propósito: una pregunta ya respondida no puede cambiar
     de enunciado por detrás, porque entonces no se sabe a qué contestó la
     gente. El precio es que, si en el taller se rebautiza una función, la
     copia se queda con el nombre viejo. Por eso «Volcar» refresca las
     copias que todavía no tienen ni una respuesta, y deja intactas —
     avisando— las que ya la tienen.

     Devuelve {creadas, refrescadas, congeladas}. */
  const pantallasPorFuncion = async () => {
    const fs = ((origen && origen.funciones) || s.funciones || []).filter(f => f && f.nombre);
    if(!fs.length) return {creadas:0, refrescadas:0, congeladas:[]};
    const filas = [];
    let refrescadas = 0; const congeladas = [];
    // La firma de los campos: qué se pregunta y con qué escala. Sirve para
    // saber si una pantalla vieja se quedó sin la valoración 1–7.
    const firma = cfg => ((cfg && cfg.campos) || [])
      .map(c => c.clave + ":" + (c.tipo || "texto") + ":" + (c.max || "")
              + ":" + (c.etiqueta || "") + ":" + (c.corto || "")).join("|");
    for(let i = 0; i < fs.length; i++){
      const f = fs[i];
      const cod = "EX" + String(i+1).padStart(2,"0") + "C";
      const titulo = resolverTexto(f.nombre + ": ¿cómo la ejerce hoy [ORGANIZACION]?", vars);
      const ayuda = f.definicion || null;
      const config = {funcion: f.nombre, campos: camposPorFuncion(vars, resolverTexto)};
      const hay = preguntas.find(p => p.codigo === cod);
      if(!hay){
        filas.push({sesion_id: s.id, codigo: cod, tipo: "abierta_campos",
          titulo, ayuda, config, estado: "cerrada"});
        continue;
      }
      const igual = hay.titulo === titulo && (hay.ayuda || null) === ayuda
        && (hay.config||{}).funcion === f.nombre
        && firma(hay.config) === firma(config);
      if(igual) continue;
      // Cambió el nombre, la descripción o la forma de la pantalla. Solo se
      // reescribe si nadie ha contestado todavía a esa pantalla.
      let respuestas = 1;   // ante la duda, no se toca
      try{ const r = await API.resultadosPregunta(s.codigo, hay.id);
           respuestas = (r && r.respondidos) || 0; }catch(e){ respuestas = 1; }
      if(respuestas){ congeladas.push(cod); continue; }
      await API.actualizarPregunta(hay.id, {titulo, ayuda, config});
      hay.titulo = titulo; hay.ayuda = ayuda; hay.config = config; refrescadas++;
    }
    // Siempre, aunque no haya nada nuevo que crear: así una sesión montada
    // antes de esta regla se recoloca sola.
    await recolocar(filas);
    if(filas.length) await API.crearPreguntas(filas);
    return {creadas: filas.length, refrescadas, congeladas};
  };

  /* LA PANTALLA DEL TALLER DE ESCENARIOS
     Era una tarjeta suelta en lo alto de la consola, por encima incluso de
     la lista de preguntas. Al conducir una sesión vas bajando por las
     preguntas, y el taller se quedaba media pantalla más arriba sin
     ninguna señal de cuándo tocaba hacerlo. Ahora es una pantalla propia
     a la que se entra desde su fila del recorrido, igual que el taller del
     modelo de liderazgo. */
  /* EL MAPA DE ESCENARIOS
     Dos ejes y cuatro nombres. Vive en `sesion.modelo`, el mismo cajón
     jsonb donde el instrumento de liderazgo guarda su modelo: son
     sesiones distintas de instrumentos distintos, no se pisan, y así
     esto no ha necesitado una columna nueva.

     Los tres botones repintan `tallerEscenarios()`, no `pinta()`: quien
     está guardando el mapa está en la pantalla del taller y quiere
     seguir en ella. Antes esto vivía dentro de `pinta()` y repintar la
     consola era lo correcto; ahora te echaría de la pantalla en la que
     estás trabajando. */
  const atarEscenarios = () => {
    const leerMapa = () => ({
      ejes: {y: (bt("ejeY")||{}).value || "", x: (bt("ejeX")||{}).value || ""},
      escenarios: ESC_VACIOS.map((e,i) => ({...e,
        nombre: ((bt("esc"+i)||{}).value || "").trim()}))
    });
    if(bt("verMapa")) bt("verMapa").onclick = () =>
      mapaEscenarios(s, preguntas, () => tallerEscenarios());
    if(bt("guardarEsc")) bt("guardarEsc").onclick = async () => {
      bt("guardarEsc").disabled = true;
      const nuevo = {...(s.modelo||{}), ...leerMapa()};
      try{ await API.actualizarSesion(s.id, {modelo: nuevo}); s.modelo = nuevo; }
      catch(e){ decirEsc(esc(e.message||e), true); return; }
      tallerEscenarios();
      decirEsc("Mapa guardado.");
    };
    if(bt("generarEsc")) bt("generarEsc").onclick = async () => {
      /* El botón se apaga mientras trabaja. Generar tarda varios segundos
         —consulta una por una si las preguntas del taller tienen respuestas—
         y sin apagarlo se puede pulsar dos veces. La segunda pulsación
         arranca con la lista de preguntas vieja, no ve las copias que la
         primera está creando, y las crea otra vez: el recorrido acaba con
         cada pregunta del taller repetida. */
      const bg = bt("generarEsc");
      bg.disabled = true; bg.textContent = "Generando…";
      const nuevo = {...(s.modelo||{}), ...leerMapa()};
      try{ await API.actualizarSesion(s.id, {modelo: nuevo}); s.modelo = nuevo; }
      catch(e){ bg.disabled = false; bg.textContent = "Generar las pantallas del taller";
        decirEsc(esc(e.message||e), true); return; }
      const r = await pantallasPorEscenario();
      preguntas = await API.preguntas(s.id);
      tallerEscenarios();
      if(r.fallo){ decirEsc(r.fallo, true); return; }
      decirEsc(`Creadas <b>${r.creadas}</b> pantallas por escenario`
        + (r.duplicadas ? ` · <b>Limpiadas ${r.duplicadas} pantallas repetidas</b> que
             habían quedado de una generación anterior interrumpida` : "")
        + (r.viejas ? ` · <b>Retiradas ${r.viejas} pantallas</b> de la versión anterior del
             taller, que ahora caben en las dos plantillas` : "")
        + (r.retiradas ? `, y retiradas ${r.retiradas} preguntas genéricas que ahora
             están cuatro veces, una por escenario` : "")
        + `. La <b>P63</b> ya ofrece los cuatro nombres.`
        + (r.bloqueadas.length ? ` <b>No</b> se han tocado ${r.bloqueadas.join(", ")}:
             ya tienen respuestas, y desdoblarlas ahora dejaría esas respuestas
             colgando de una pregunta que deja de existir.` : "")
        + ` Quedan <b>cerradas</b>: ábrelas cuando empiece el taller.`,
        !r.creadas);
    };
  };

  const tallerEscenarios = () => {
    const m = s.modelo || {}, ej = m.ejes || {}, es = m.escenarios || ESC_VACIOS;
    const hechos = es.filter(e => (e.nombre||"").trim()).length;
    const copias = preguntas.filter(p => esCopiaEsc(p.codigo)).length;
    const viejas = preguntas.filter(p => esLegadoEsc(p.codigo)).length;
    app().innerHTML = `<div class="wrap ancho">${cabecera(
      `<button class="iconbtn" id="atrasT">Volver al recorrido</button>`)}
      <div class="card">
        <span class="phasetag">${esc((s.organizacion||{}).nombre||"")} · taller</span>
        <h1 style="margin:6px 0 0">El taller de escenarios</h1>
        ${viejas ? `<div class="aviso rojo" style="margin-top:16px"><b>Hay ${viejas}
          pantallas sobrantes</b> de la versión anterior del taller, cuando cada pregunta
          era una pantalla y salían cincuenta y dos. Ahora caben en dos por escenario.
          Dale a <b>Generar las pantallas del taller</b> y se retiran: solo las que estén
          sin contestar.</div>` : ""}
        <p class="small" style="margin-top:14px">Los dos ejes no se votan: los eliges tú
          mirando lo más votado en <b>P19</b>, <b>P20</b> y <b>P26</b> contra el mapa de
          impacto de la <b>P29</b>. El criterio duro es que sean <b>independientes</b>
          entre sí: si al mover uno se mueve el otro, los cuatro cuadrantes son en
          realidad dos y el taller no da de sí.</p>
        <div class="field"><label for="ejeY">Eje vertical</label>
          <input id="ejeY" maxlength="90" value="${esc(ej.y||"")}"
            placeholder="p. ej. Financiación: escasa ↕ abundante"></div>
        <div class="field"><label for="ejeX">Eje horizontal</label>
          <input id="ejeX" maxlength="90" value="${esc(ej.x||"")}"
            placeholder="p. ej. Regulación: laxa ↔ estricta"></div>
        <h3>Los cuatro escenarios</h3>
        <p class="small">El nombre puede quedar vacío ahora y ponerse en la sala; sin los
          cuatro no se pueden generar las pantallas del taller.</p>
        ${es.map((e,i)=>`<div class="field">
          <label for="esc${i}">${esc(e.k)} · ${esc(e.pos)}</label>
          <input id="esc${i}" maxlength="70" value="${esc(e.nombre||"")}"
            placeholder="Nombre del escenario"></div>`).join("")}
        <div class="btnrow">
          <button class="btn ghost" id="guardarEsc">Guardar el mapa</button>
          <button class="btn" id="generarEsc">Generar las pantallas del taller</button>
          ${copias ? `<button class="btn ghost" id="verMapa">Ver el mapa de escenarios</button>`
                   : ""}</div>
        <p class="note">Generar crea <b>dos pantallas por escenario</b> —relato y
          estrategias— y rellena la <b>P63</b> con los cuatro nombres. Se marcan como
          <b>respuesta de grupo</b>: se enseñan con una sola respuesta, sea cual sea el
          mínimo de la sesión. Es la única excepción por pregunta, y solo se pone aquí.
          ${copias ? `Ahora mismo hay <b>${copias}</b> pantallas de grupo.`
                   : `Todavía no se ha generado ninguna.`}
          ${hechos < 4 ? ` Faltan <b>${4-hechos}</b> nombres.` : ""}</p>
        <div id="avisoEsc">${avisoEsc}</div>
      </div></div>`;
    if(bt("atrasT")) bt("atrasT").onclick = () => { avisoEsc = ""; pinta(); };
    atarEscenarios();
    window.scrollTo({top:0});
  };

  /* ═══════════════════════════════════════════════════════════════
     EL CIERRE EN PLENARIO

     Tres cosas que pasan en los últimos veinte minutos, cuando los
     cuatro grupos vuelven a ser una sola sala: se acuerdan las acciones
     comunes, se adopta el cuadro de vigilancia y se proyecta el mapa.

     Todo vive en `sesion.modelo`, el mismo cajón jsonb que ya guarda los
     ejes, los nombres y los relatos elaborados. No es una respuesta de
     nadie: son acuerdos de la sala, escritos por quien conduce y a la
     vista de todos. Por eso no pasan por `respuesta` ni por el suelo de
     tres: no hay nada que proteger, porque no hay nadie detrás.

     Lo que este código NO puede hacer, y conviene no confundirlo: esto
     no vigila nada. Es la foto del día del taller. Un indicador cambia
     de estado porque alguien entra aquí y lo cambia, y nadie entra en
     una sesión cerrada cinco meses después. Lo que sobrevive al taller
     son las dos columnas de la derecha —el responsable y la fecha de
     revisión—, y sobreviven en la agenda de esa persona, no aquí. */
  const SEM = [
    {k:"calma",    t:"En calma",  d:"El indicador no se mueve."},
    {k:"atencion", t:"Atención",  d:"Se mueve, pero no ha llegado al umbral."},
    {k:"activada", t:"Activada",  d:"Ha pasado el umbral: toca revisar la estrategia."}
  ];
  const semDe = k => SEM.find(x => x.k === k) || SEM[0];
  const sello = k => { const e = semDe(k);
    return `<span class="sem ${e.k}"><i></i>${esc(e.t)}</span>`; };

  /* Las respuestas de una pregunta de campos, en crudo. Devuelve una fila
     por persona, no una media: aquí no se agrega nada, se lee lo que ha
     escrito la sala para que quien conduce elija. */
  const camposDe = async cod => {
    const p = preguntas.find(x => x.codigo === cod);
    if(!p) return [];
    try{

      const guardaY = async (id, txt) => {

      // Se guarda antes: un acta impresa a partir de lo que hay en pantalla

  /* CUATRO COPIAS DE CADA PREGUNTA DEL TALLER, UNA POR ESCENARIO

     Es lo mismo que hacen las pantallas por función clave en la evaluación
     de liderazgo, y por la misma razón: si los cuatro grupos contestan LA
     MISMA pregunta, las cuatro respuestas llegan sin marca de a qué
     escenario pertenece cada una, y no hay forma de averiguarlo sin ligar
     respuestas a personas —cosa que esta aplicación no hace—. Con una
     pregunta por escenario, la atribución es estructural.

     La original se retira: tener a la vez la P37 genérica y sus cuatro
     copias es garantizar que alguien conteste la que no toca. Si ya tiene
     respuestas, no se toca y se avisa: perderlas para ganar orden sería un
     mal negocio. */
  const pantallasPorEscenario = async () => {
    const m = s.modelo || {};
    const ess = (m.escenarios || []).filter(e => e && (e.nombre||"").trim());
    if(ess.length !== 4) return {fallo:"Hacen falta los cuatro nombres de escenario "
      + "antes de generar nada. Escríbelos arriba y vuelve a darle.", creadas:0,
      retiradas:0, duplicadas:0, viejas:0, bloqueadas:[]};

    /* Se relee la lista antes de nada. Si la generación anterior se quedó a
       medias —o alguien pulsó dos veces— la copia local está vieja, y
       trabajar sobre ella es justo lo que multiplica las pantallas. */
    preguntas = await API.preguntas(s.id);

    /* Y se limpia lo que haya quedado repetido. Dos preguntas con el mismo
       código son dos pantallas idénticas seguidas en el móvil: se queda la
       primera y se van las demás, siempre que estén vacías. Si alguna tiene
       respuestas se queda donde está: mejor una pantalla repetida que una
       respuesta perdida. */
    let duplicadas = 0, viejas = 0;
    const vistos = new Map();
    for(const p of preguntas.slice().sort((a,b)=>(a.orden||0)-(b.orden||0))){
      const cod = p.codigo || "";
      if(!cod) continue;
      if(!vistos.has(cod)){ vistos.set(cod, p); continue; }
      let n = 1;
      try{ const r = await API.resultadosPregunta(s.codigo, p.id);
           n = (r && r.respondidos) || 0; }catch(e){ n = 1; }
      if(n) continue;
      try{ await API.borrarPregunta(p.id); duplicadas++; }catch(e){}
    }
    if(duplicadas) preguntas = await API.preguntas(s.id);

    const ya = new Map(preguntas.filter(p=>p.codigo).map(p=>[p.codigo, p]));
    const lista = preguntas.slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
    const nuevas = [], quitar = [], bloqueadas = [], final = [];
    // Las copias que ya existen se colocan por sí mismas. La primera vez no
    // hay ninguna; a la segunda, la original ya no está —se retiró— y si no
    // se recogieran aquí se quedarían fuera de la renumeración y acabarían
    // compartiendo `orden` con otras. Eso es exactamente lo que pasó.
    const puestas = new Set();

    for(const p of lista){
      const cod = p.codigo || "";
      /* Las de la versión anterior del taller: fuera, si están vacías. Son
         las cincuenta y dos pantallas que sustituyen las dos plantillas. */
      if(esLegadoEsc(cod)){
        let n = 1;
        try{ const r = await API.resultadosPregunta(s.codigo, p.id);
             n = (r && r.respondidos) || 0; }catch(e){ n = 1; }
        if(n){ bloqueadas.push(cod); final.push(p); continue; }
        try{ await API.borrarPregunta(p.id); viejas++; }catch(e){ final.push(p); }
        continue;
      }
      if(esCopiaEsc(cod)){
        if(!puestas.has(cod)){ puestas.add(cod); final.push(p); }
        continue;
      }
      /* La matriz de robustez recupera sus cuatro columnas: la robustez se
         lee en una sola rejilla o no se lee. */
      if(cod === "P48" && p.tipo === "matriz_valoracion"){
        const cols = ess.map(e => e.nombre);
        if(JSON.stringify((p.config||{}).columnas || []) !== JSON.stringify(cols)){
          const cfg = {...(p.config||{}), columnas: cols};
          try{ await API.actualizarPregunta(p.id, {config: cfg}); p.config = cfg; }catch(e){}
        }
        final.push(p); continue;
      }
      if(!ESC_TALLER.includes(cod)){ final.push(p); continue; }
      // Con respuestas dentro, ni se desdobla ni se retira.
      let n = 1;
      try{ const r = await API.resultadosPregunta(s.codigo, p.id);
           n = (r && r.respondidos) || 0; }catch(e){ n = 1; }
      if(n){ bloqueadas.push(cod); final.push(p); continue; }
      ess.forEach((e, i) => {
        const c2 = cod + "E" + (i+1);
        if(puestas.has(c2)) return;          // ya colocada más arriba
        puestas.add(c2);
        const hay = ya.get(c2);
        if(hay){ final.push(hay); return; }
        const cfg = {...(p.config || {}), escenario: e.nombre, grupal: true,
          solo_si: [{codigo:"P64", valor:"Relator/a"},
                    {codigo:"P63", valor: e.nombre}]};
        // La matriz de robustez, en su copia, valora un solo escenario.
        if(p.tipo === "matriz_valoracion") cfg.columnas = [e.nombre];
        const fila = {sesion_id: s.id, codigo: c2, tipo: p.tipo,
          titulo: e.nombre + " · " + p.titulo, ayuda: p.ayuda || null,
          config: cfg, estado: "cerrada"};
        nuevas.push(fila); final.push(fila);
      });
      quitar.push(p);
    }

    /* Y las dos pantallas del taller, que no salen de ninguna pregunta del
       banco sino de la plantilla: van justo detrás de la P64, que es donde
       cada persona acaba de decir su escenario y su papel. */
    const iTras64 = final.findIndex(p => p.codigo === "P64");
    const bloque = [];
    TALLER_ESC.forEach(t => {
      ess.forEach((e, i) => {
        const c2 = t.k + "E" + (i+1);
        if(puestas.has(c2)) return;
        puestas.add(c2);
        const hay = ya.get(c2);
        if(hay){ bloque.push(hay); return; }
        const fila = {sesion_id: s.id, codigo: c2, tipo: "abierta_campos",
          titulo: resolverTexto(t.q.replace(/\[ESCENARIO\]/g, e.nombre), vars),
          ayuda: t.ayuda,
          config: {escenario: e.nombre, grupal: true, dos_columnas: true,
            campos: t.campos.map(c => ({...c,
              etiqueta: resolverTexto(c.etiqueta, vars),
              ayuda: c.ayuda ? resolverTexto(c.ayuda, vars) : undefined})),
            solo_si: [{codigo:"P64", valor:"Relator/a"},
                      {codigo:"P63", valor: e.nombre}]},
          estado: "cerrada"};
        nuevas.push(fila); bloque.push(fila);
      });
    });
    // Las que ya existían y ya se colocaron por su `orden` no se mueven; las
    // nuevas entran detrás de la P64.
    const soloNuevas = bloque.filter(x => !x.id);
    if(soloNuevas.length) final.splice(iTras64 >= 0 ? iTras64 + 1 : final.length,
      0, ...soloNuevas);

    // La P63 ofrece los cuatro nombres: es la respuesta de la que depende
    // qué pantallas ve cada persona, así que tiene que decir exactamente
    // lo mismo que dicen las copias.
    const p63 = ya.get("P63");
    if(p63) await API.actualizarPregunta(p63.id,
      {config: {...(p63.config||{}), opciones: ess.map(e=>e.nombre)}});

    // Renumerar entero: es más simple de razonar que abrir hueco, y aquí
    // además unas preguntas se van y otras llegan en su sitio. Antes de
    // numerar, el bloque del taller se lleva a su banda.
    const ordenado = colocarTaller(final);
    final.length = 0; final.push(...ordenado);
    const antes = new Map(preguntas.filter(p=>p.id).map(p=>[p.id, p.orden]));
    for(let i = 0; i < final.length; i++){
      const p = final[i];
      if(p.id && antes.get(p.id) !== i + 1)
        await API.actualizarPregunta(p.id, {orden: i + 1});
      p.orden = i + 1;
    }
    if(nuevas.length) await API.crearPreguntas(nuevas);
    for(const p of quitar) await API.borrarPregunta(p.id);
    return {creadas: nuevas.length, retiradas: quitar.length, duplicadas, viejas,
            bloqueadas};
  };

  /* Las sesiones que se montaron antes de la regla tienen sus EX al final,
     detrás de las preguntas de cierre. Se recolocan al entrar en la
     consola. Solo escribe si están mal, y lo dice. */
  if(String(s.instrumento||"").split("-")[0] === "evaluacion"){
    try{
      const movidas = await recolocar([]);
      if(movidas){
        preguntas = await API.preguntas(s.id);
        avisoEva = `<div class="aviso">Se ha recolocado el orden de ${movidas} preguntas:
          las pantallas por función clave van ahora antes de la <b>E10</b>.</div>`;
      }
    }catch(e){}
  }

  /* Y lo mismo con el taller de escenarios. La regla —entre la P31 y la
     P48— vivía solo dentro de «Generar», y generar es algo que se pulsa
     una vez, al montar la sesión. Quien ya la tenía montada no tenía
     ninguna razón para volver a pulsarlo, así que la regla no llegaba a
     aplicarse nunca. Se aplica al entrar. Solo escribe si hace falta. */
  if(String(s.instrumento||"").split("-")[0] === "escenarios"){
    try{
      /* Antes de recolocar nada, la limpieza. Estaba también solo dentro
         de «Generar», y con el mismo resultado: quien tenía la sesión
         montada seguía viendo las pantallas de la versión anterior del
         taller —P36E1, P37E2, P48E3…— sin razón alguna para volver a
         generar.

         Y con la P48 hay un paso más. La versión vieja la desdoblaba en
         cuatro y BORRABA la original, así que retirar las cuatro copias
         deja la sesión sin matriz de robustez. Se vuelve a crear desde el
         banco, con los cuatro escenarios de columnas: la robustez se lee
         en una sola rejilla o no se lee. */
      const vj = preguntas.filter(p => esLegadoEsc(p.codigo));
      let limpiadas = 0, repuesta = false;
      for(const p of vj){
        let n = 1;
        try{ const r = await API.resultadosPregunta(s.codigo, p.id);
             n = (r && r.respondidos) || 0; }catch(e){ n = 1; }
        if(n) continue;                       // con respuestas dentro, no se toca
        try{ await API.borrarPregunta(p.id); limpiadas++; }catch(e){}
      }
      if(limpiadas) preguntas = await API.preguntas(s.id);

      /* PREGUNTAS DEL BANCO QUE CAMBIARON DESPUÉS DE MONTARSE LA SESIÓN

         Corregir el banco NO corrige las sesiones que ya existen: el texto
         de cada pregunta se copió a la fila el día que se añadió y ahí se
         quedó. Lo descubrí mirando las cuatro sesiones de escenarios de
         Joaquín después de arreglar la P54: en el banco decía lo nuevo y
         en las cuatro seguía diciendo lo viejo. En la sala, la gente lee
         la fila, no el banco.

         Se refresca solo si se cumplen las TRES condiciones, porque cada
         una tapa una forma distinta de estropear el trabajo de alguien:
           · el texto guardado es EXACTAMENTE el viejo → nadie lo ha
             editado a mano desde «Contenido…», así que no piso nada suyo;
           · la pregunta no tiene respuestas → nadie contestó a la versión
             vieja, así que no dejo respuestas colgando de un enunciado
             que ya no existe;
           · hay una entrada en el banco con ese código.
         Si alguna falla, se queda como está y se dice en pantalla. */
      const REDACCIONES_VIEJAS = {
        P54: "¿Qué señal observable indicaría que nos estamos acercando a este escenario?"
      };
      const refrescadas = [], congeladas = [];
      for(const [cod, viejo] of Object.entries(REDACCIONES_VIEJAS)){
        const p = preguntas.find(x => x.codigo === cod);
        if(!p || (p.titulo || "").trim() !== viejo) continue;
        const base = BANCO.find(x => x.c === cod);
        if(!base) continue;
        let n = 1;
        try{ const r = await API.resultadosPregunta(s.codigo, p.id);
             n = (r && r.respondidos) || 0; }catch(e){ n = 1; }
        if(n){ congeladas.push(cod); continue; }
        try{
          const cambios = {titulo: resolverTexto(base.q, vars),
            ayuda: base.ayuda ? resolverTexto(base.ayuda, vars) : null,
            config: resolverCfg(base.cfg)};
          await API.actualizarPregunta(p.id, cambios);
          Object.assign(p, cambios); refrescadas.push(cod);
        }catch(e){ congeladas.push(cod); }
      }

      const ess = ((s.modelo||{}).escenarios || []).filter(e => e && (e.nombre||"").trim());
      /* Y se repone SIEMPRE que falte, no solo cuando se acaba de limpiar.
         La condición anterior era «si he borrado algo y no hay P48», y en
         una sesión donde la limpieza ya se hizo en una visita anterior
         nunca se cumplía: las cuatro copias ya no estaban, así que no se
         borraba nada, así que no se reponía nada. La sesión se quedaba sin
         matriz de robustez para siempre y en silencio.
         La condición correcta es la que describe el estado que hay que
         arreglar: hay taller y falta la P48. */
      const hayTaller = preguntas.some(p => /^PT[12]E[1-4]$/.test(p.codigo || ""));
      if(hayTaller && !preguntas.some(p => p.codigo === "P48")){
        const base = BANCO.find(x => x.c === "P48");
        if(base){
          const cfg = resolverCfg(base.cfg);
          if(ess.length === 4) cfg.columnas = ess.map(e => e.nombre);
          /* Se crea al final y se coloca después, en la renumeración. El
             primer intento le puso un `orden` fraccionario —el de la P49
             menos medio— para que cayera justo delante sin tocar a las
             demás. `pregunta.orden` es un entero: el INSERT falló, el
             `catch` se lo tragó entero, y la P48 no apareció sin que nada
             lo dijera. De ahí que el error de esta parte se enseñe ahora
             en pantalla en vez de callarse. */
          try{
            await API.crearPreguntas([{sesion_id: s.id,
              orden: (preguntas.length ? Math.max(...preguntas.map(p=>p.orden)) : 0) + 1,
              codigo: "P48", tipo: base.t, titulo: resolverTexto(base.q, vars),
              ayuda: base.ayuda ? resolverTexto(base.ayuda, vars) : null,
              config: cfg, estado: "cerrada"}]);
            preguntas = await API.preguntas(s.id); repuesta = true;
          }catch(e){
            avisoCarga = `<div class="aviso rojo">No se ha podido reponer la <b>P48</b>:
              ${esc(e.message || String(e))}. Añádela a mano desde el banco.</div>`;
          }
        }
      }

      const antes = new Map(preguntas.filter(p=>p.id).map(p=>[p.id, p.orden]));
      let lista = preguntas.slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
      // La P48 recién repuesta está al final: se lleva a su sitio, delante
      // de la primera pregunta con número mayor que 48.
      if(repuesta){
        const nueva = lista.find(p => p.codigo === "P48");
        if(nueva){
          lista = lista.filter(p => p !== nueva);
          const j = lista.findIndex(p => { const n = numeroP(p.codigo);
            return n !== null && n > 48; });
          lista.splice(j < 0 ? lista.length : j, 0, nueva);
        }
      }
      const final = colocarTaller(lista);
      let movidas = 0;
      for(let i = 0; i < final.length; i++){
        const p = final[i];
        if(p.id && antes.get(p.id) !== i + 1){
          await API.actualizarPregunta(p.id, {orden: i + 1}); movidas++;
        }
        p.orden = i + 1;
      }
      if(movidas) preguntas = await API.preguntas(s.id);
      if(limpiadas || repuesta || movidas || refrescadas.length || congeladas.length){
        avisoCarga = `<div class="aviso">`
          + (limpiadas ? `Retiradas <b>${limpiadas} pantallas</b> de la versión anterior
               del taller. ` : "")
          + (refrescadas.length ? `Puesta al día la redacción de
               <b>${refrescadas.join(", ")}</b>: esta sesión se montó con la versión
               anterior del banco y conservaba el texto viejo. ` : "")
          + (congeladas.length ? `<b>No</b> se ha podido actualizar
               ${congeladas.join(", ")}: ya tiene respuestas, y cambiarle el enunciado
               ahora dejaría esas respuestas contestando a otra pregunta. ` : "")
          + (repuesta ? `Repuesta la <b>P48</b> como una sola matriz de robustez${
               ess.length === 4 ? ", con los cuatro escenarios de columnas"
                                : " (le faltan las columnas: ponles nombre a los escenarios)"
             }: las cuatro copias valoraban un escenario cada una, y eso no es robustez.
               Ponle las filas desde «Contenido…» o vuélcalas desde el mapa. ` : "")
          + (movidas ? `Recolocado el orden de <b>${movidas} preguntas</b>: el taller va
               detrás de la <b>P31</b> y delante de la <b>P48</b>.` : "")
          + `</div>`;
      }
    }catch(e){}
  }

  await pinta();
}

/* ═══════════════════════════════════════════════════════════════════
   7 · ADMINISTRADOR
   ═══════════════════════════════════════════════════════════════════ */
async function vistaAdmin(){
  // Si venimos del enlace del correo, Supabase tarda unas décimas en canjear el
  // token de la URL. Sin esta espera, la primera comprobación decía «no hay
  // usuario» y te devolvía a la pantalla de acceso justo después de haber entrado.
  if(vueltaDeCorreo() && !API.demo()){
    const fallo = (location.hash.match(/error_description=([^&]*)/) || [])[1];
    if(fallo){
      history.replaceState(null, "", location.pathname + "#/admin");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>Ese enlace ya no vale</h1>
        <p>${esc(decodeURIComponent(fallo.replace(/\+/g," ")))}</p>
        <p class="small">Los enlaces caducan y son de un solo uso. Pide otro, o entra con tu contraseña.</p>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
    app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
      <h1>Entrando…</h1><p>Un momento, estamos canjeando el enlace.</p></div></div>`;
    const urlOriginal = location.hash + location.search;
    let dentro = null;
    for(let i = 0; i < 30 && !dentro; i++){
      dentro = await API.usuario();
      if(!dentro) await new Promise(r => setTimeout(r, 200));
    }
    history.replaceState(null, "", location.pathname + "#/admin");
    if(!dentro){
      // No callarse. Si el canje falla, decir por qué en vez de devolver al
      // formulario como si el usuario hubiera hecho algo mal.
      let detalle = "";
      try{
        const { data, error } = await sb.auth.getSession();
        detalle = error ? error.message : (data && data.session ? "hay sesión pero sin usuario" : "el navegador no ha guardado ninguna sesión");
      }catch(e){ detalle = String(e && e.message || e); }
      const traza = urlOriginal.replace(/(access_token|refresh_token|code)=[^&]*/g, "$1=…");
      app().innerHTML = `<div class="wrap">${cabecera()}<div class="card">
        <h1>El enlace no ha llegado a abrir sesión</h1>
        <p>El enlace era válido, pero el navegador no ha conseguido canjearlo.</p>
        <div class="aviso rojo"><b>Motivo:</b> ${esc(detalle)}</div>
        <p class="small">Causas habituales: has abierto el enlace en un navegador
          <b>distinto</b> del que lo pidió, o en una ventana de incógnito, o el
          filtro antivirus de tu correo abrió el enlace antes que tú y lo gastó
          (son de un solo uso).</p>
        <p class="small">Ábrelo en el mismo navegador donde lo pediste. Si se repite,
          usa la contraseña.</p>
        <details><summary class="small">Detalle técnico</summary>
          <p class="small"><code>${esc(traza.slice(0,300))}</code></p></details>
        <div class="btnrow"><a class="btn" href="#/admin">Volver al acceso</a></div>
      </div></div>`;
      return;
    }
  }
  const u = await API.usuario();
  if(!u) return vistaLogin();
  const m = location.hash.match(/^#\/admin\/sesion\/(.+)$/);
  if(m) return consolaSesion(m[1]);
  if(location.hash.startsWith("#/admin/sesiones"))  return panelAdmin(u);
  if(location.hash.startsWith("#/admin/proyectos")) return panelProyectos(u);
  return hubPrivado(u);
}

   BANCO DE PREGUNTAS · Escenarios futuros
   Prospectiva y planificación por escenarios, inspirado en Oxford
   Scenario Planning.

   Vive aquí y no en la base de datos a propósito: es contenido
   metodológico que evoluciona con la práctica, no dato de cliente. Lo
   que sí va a la base de datos es la pregunta concreta que entró en una
   sesión, con su texto ya resuelto.

   Claves: c=código · b=bloque · t=tipo · nuc=itinerario núcleo
           nat= fija (existe antes) | derivada (se construye en sesión)
                | escenario (plantilla ×4)
   ═══════════════════════════════════════════════════════════════════ */

const BLOQUES_ESC = [
  "Perfil y perspectiva",
  "Activación y orientación al futuro",
  "Pregunta focal, sistema y situación actual",
  "Entorno y fuerzas impulsoras",
  "Incertidumbres críticas",
  "Arquitectura de escenarios",
  "Implicaciones, opciones y robustez",
  "Señales tempranas, aprendizaje y cierre"
];

/* Los catorce tipos de pantalla, todos construidos. La lista se queda aquí
   porque el constructor la usa para decidir qué se puede añadir: si algún día
   se inventa un tipo nuevo, aparecerá en el banco en gris hasta que exista. */
const TIPOS_LISTOS = ["unica","multiple","escala","matriz_escala",
                      "abierta","abierta_campos","puntos100","tarjetas",
                      "nube","ranking","dos_ejes","clasificar","secuencia",
                      "matriz_valoracion"];

/* Qué listas necesita cada tipo para poder responderse. Las preguntas
   «derivadas» entran con estas listas vacías: se rellenan en la sesión, con
   lo que haya dicho el grupo. Sin este mapa, el constructor no sabría qué
   pedirte, y la pregunta llegaría al móvil sin nada que ordenar. */
const LISTAS_TIPO = {
  unica:            [{k:"opciones",   t:"Opciones"}],
  multiple:         [{k:"opciones",   t:"Opciones"}],
  puntos100:        [{k:"opciones",   t:"Opciones a repartir"}],
  ranking:          [{k:"opciones",   t:"Elementos a ordenar"}],
  secuencia:        [{k:"elementos",  t:"Acontecimientos a secuenciar"}],
  dos_ejes:         [{k:"elementos",  t:"Elementos a colocar"}],
  clasificar:       [{k:"elementos",  t:"Elementos a clasificar"},
                     {k:"categorias", t:"Categorías"}],
  matriz_valoracion:[{k:"filas",      t:"Opciones estratégicas (filas)"},
                     {k:"columnas",   t:"Escenarios (columnas)"}],
  matriz_escala:    [{k:"items",      t:"Ítems"}]
};
const EJES_TIPO = {dos_ejes: [{k:"eje_x", t:"Eje horizontal"}, {k:"eje_y", t:"Eje vertical"}]};

// Devuelve el nombre de lo que falta, o "" si la pregunta está lista. Se
// mira en la consola antes de abrir: una derivada sin rellenar llega al
// móvil como una pantalla en blanco con un botón de enviar.
function faltaContenido(p){
  const cfg = p.config || {};
  const vacias = (LISTAS_TIPO[p.tipo] || [])
    .filter(sl => !Array.isArray(cfg[sl.k]) || !cfg[sl.k].length)
    .map(sl => sl.t.toLowerCase());
  return vacias.join(" y ");
}

/* «Escala 1–7» estaba escrito fijo aquí, y se imprimía igual en una
   pregunta configurada de 1 a 5. El gráfico siempre usó el rango bueno
   —el de la configuración—, así que era solo el rótulo el que mentía,
   pero es el rótulo lo que lees tú al revisar una sesión seis meses
   después. `nombreTipo` lo lee de la propia pregunta. */
const TIPOS_NOMBRE = {
  unica:"Opción única", multiple:"Opción múltiple", escala:"Escala",
  matriz_escala:"Matriz de escalas", abierta:"Respuesta abierta",
  abierta_campos:"Abierta con campos", puntos100:"Reparto de 100 puntos",
  tarjetas:"Tarjetas + agrupación + votación", nube:"Nube de palabras",
  ranking:"Priorización", dos_ejes:"Posicionamiento en dos ejes",
  clasificar:"Clasificación por categorías", secuencia:"Secuenciación",
  matriz_valoracion:"Matriz de robustez"
};

const ESC_1a7 = {min:1, max:7};

/* El nombre del tipo tal y como debe leerse en la consola: para las
   escalas y las matrices, con el rango que esa pregunta lleva de
   verdad. Acepta tanto una pregunta de sesión (`tipo` + `config`) como
   una del banco (`t` + `cfg`). */
function nombreTipo(p){
  if(!p) return "";
  const t = p.tipo || p.t;
  const base = TIPOS_NOMBRE[t] || t;
  if(t !== "escala" && t !== "matriz_escala") return base;
  const cfg = p.config || p.cfg || {};
  const min = cfg.min ?? 1, max = cfg.max ?? 7;
  return base + " " + min + "\u2013" + max;
}

/* Y aquí estaba la P35, que pedía a cada participante situar los cuatro

   dos ejes los eliges tú en la preparación, y los cuatro cuadrantes salen
   de ahí por aritmética. Preguntar dónde va cada escenario cuando la
   respuesta la determinan los ejes es pedir opinión sobre una definición.

   ── EL TALLER DE ESCENARIOS EMPIEZA AQUÍ ──────────────────────────
   De la P63 a la P48, la sesión deja de ser individual. La gente se
   reparte en cuatro grupos, uno por escenario, y en cada grupo hay una
   persona relatora que escribe lo que el grupo acuerda.

   Estas preguntas NO se contestan tal como están en el banco: la consola
   genera cuatro copias de cada una, una por escenario, y retira la
   original. Esa es la única forma de saber a qué escenario pertenece cada
   relato sin ligar respuestas a personas, que es justo lo que esta
   aplicación no hace ni va a hacer.

   Las copias van marcadas como `grupal`: no las escribe una persona, las
   dicta un grupo en voz alta. Por eso se enseñan con una sola respuesta,
   sin el mínimo de respuestas que rige en el resto del instrumento. */

/* LA PANTALLA DE CADA FUNCIÓN CLAVE
   Una valoración y tres textos, en la misma pantalla y en este orden.

   La valoración va PRIMERA y a propósito. Es la misma pregunta que hacía
   la antigua matriz E05 —cómo está hoy esta función en la organización—,
   pero hecha aquí, con la definición de la función a la vista y justo
   antes de escribir sobre ella. Puntuar diez funciones seguidas en una
   rejilla y escribir sobre ellas veinte pantallas después era pedir dos
   juicios sobre lo mismo en dos contextos distintos.

   Es del estado de la función en la ORGANIZACIÓN, no de nadie en
   concreto: esto no es una evaluación de personas y el enunciado lo dice.

   Obligatoria: sin número no hay media, y sin media no hay brecha. Los
   tres textos siguen siendo opcionales.

   `[FUNCION]` se sustituye por el nombre de cada función clave. */
const ESCALA_POR_FUNCION = {
  campo: "estado", tipo: "escala", min: 1, max: 7, obligatorio: true,
  etiqueta: "¿Cómo está hoy esta función en [ORGANIZACION]?",
  ayuda: "El estado de la función en la organización, no el de ninguna persona.",
  ancla_min: "Muy poco desarrollada", ancla_max: "Muy desarrollada"
};
const ABIERTAS_POR_FUNCION = [
  {suf:"F", campo:"fuerte", corto:"Puntos fuertes",
   etiqueta:"¿Qué destacarías como puntos fuertes de su desarrollo hoy?",
   q:"[FUNCION]: ¿qué destacarías como puntos fuertes de su desarrollo hoy en [ORGANIZACION]?"},
  {suf:"M", campo:"mejora", corto:"Áreas de mejora",
   etiqueta:"Identifica áreas de mejora respecto al desarrollo de esta función hoy",
   q:"[FUNCION]: identifica áreas de mejora respecto al desarrollo de esta función hoy en [ORGANIZACION]"},
  {suf:"A", campo:"accion", corto:"Propuestas",
   etiqueta:"¿Qué acción concreta propones?",
   q:"[FUNCION]: ¿qué acciones concretas propones?"}
];
/* Los campos de una pantalla por función, ya resueltos. `funcion` viaja en
   la config para que los resultados puedan casar cada pantalla con su
   función clave sin tener que desmontar el título. */
function camposPorFuncion(vars, resolver){
  const e = ESCALA_POR_FUNCION;
  return [{clave:e.campo, tipo:"escala", min:e.min, max:e.max, obligatorio:true,
           etiqueta: resolver(e.etiqueta, vars), ayuda: resolver(e.ayuda, vars),
           ancla_min:e.ancla_min, ancla_max:e.ancla_max}]
    // `corto` es el rótulo con el que se agrupan las respuestas en el
    // informe: el enunciado completo es una pregunta, y una pregunta larga
    // no vale como encabezado de una lista de treinta frases.
    .concat(ABIERTAS_POR_FUNCION.map(pl =>
      ({clave: pl.campo, etiqueta: pl.etiqueta, corto: pl.corto})));
}

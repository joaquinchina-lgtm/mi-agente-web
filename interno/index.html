        : `<div class="aviso rojo">No se adoptó ningún indicador.</div>`}
    </div>

    <div class="card informe-bloque" id="cierre-esc">
      <span class="num">03</span><h2>Los escenarios sobre los que se decidió esto</h2>
      <p style="margin-top:14px">Van aquí porque dentro de un año nadie se acordará de por
        qué se acordó lo de arriba. Las dos incertidumbres que se eligieron son la mitad
        del argumento.</p>
      <dl class="meta" style="margin-top:16px">
        <div><dt>Eje vertical</dt><dd>${esc(ej.y || "—")}</dd></div>
        <div><dt>Eje horizontal</dt><dd>${esc(ej.x || "—")}</dd></div>
      </dl>
      ${es.length ? `<div class="mapa-esc"><div class="cuadros">${
        [0,1,3,2].map(i => { const e = es[i]; if(!e) return `<div class="cuad vacio"></div>`;
          const v = elab["e"+(i+1)] || {};
          return `<div class="cuad" style="break-inside:avoid">
            <span class="cuad-k">${esc(e.k)} · ${esc(e.pos)}</span>
            <h3>${esc(nombreDe(i) || "Sin nombre")}</h3>
            ${v.lema ? `<p class="lema">«${esc(v.lema)}»</p>` : ""}
            ${v.relato ? `<div class="tramo"><p>${esc(v.relato)}</p></div>` : ""}
          </div>`; }).join("")}</div></div>`
        : `<div class="aviso rojo">Los escenarios no llegaron a tener nombre.</div>`}
    </div>

    <div class="pie-doc"><span>${esc(org)} · Acta del cierre</span><span>${esc(hoy)}</span></div>
    <div class="card no-imprimir"><p class="small">Esto es el acuerdo, no los datos. Lo que
      votó cada quien está en «Ver todos los resultados», y ahí se queda: un acta que
      circula por correo no tiene por qué llevar dentro las respuestas de la sala.</p>
    </div></div>`;
  $("#atras").onclick = volver;
  $("#imprimir").onclick = () => window.print();
  const decirActa = (t, mal) => { const c = $("#avisoActaC");
    if(c) c.innerHTML = `<div class="aviso${mal?" rojo":""}">${t}</div>`; };
  const aLaPared = async (v, txt) => {
    try{ Object.assign(s, await API.actualizarSesion(s.id, {vista_activa: v}));
         decirActa(txt); }
    catch(e){ decirActa(esc(e.message||e), true); }
  };
  $("#paredAcc").onclick = () => aLaPared("acciones",
    "En la pared: las acciones, con su responsable y su plazo.");
  $("#paredVig").onclick = () => aLaPared("alerta", "En la pared: el cuadro de vigilancia.");
  $("#ventana").onclick = () => abrirProyeccion(s.codigo);
  window.scrollTo({top:0});
}

async function tallerFunciones(s, preguntas, volver){
  app().innerHTML = `<div class="wrap ancho">${cabecera(
    `<button class="iconbtn" id="atras">Volver</button>`)}
    <div class="card"><h1>Reuniendo lo votado…</h1></div></div>`;
  if($("#atras")) $("#atras").onclick = volver;

  /* De dónde sale la evidencia. Se busca por código del banco, no por
     posición: si reordenas las preguntas, esto sigue funcionando.

     `fase` dice a cuál de los tres bloques pertenece cada fuente. Una
     misma pregunta puede alimentar dos: L04 define, pero también da el
     lenguaje con el que después se nombran las funciones. */
  /* `apoyo:true` es evidencia que viaja en el texto para la IA pero no
     ocupa sitio en pantalla: son listas que ya se miran enteras en su
     propio paso y que aquí solo sirven de contexto. Se enseñan en una
     línea, para que sepas exactamente qué estás copiando —una caja negra
     que manda cosas a una IA sin decir cuáles no es aceptable. */
  const FUENTES = [
    // 1 · Definición. La tarjeta grande es L04; L11 y L13 entran en el
    // texto porque las frases 2 y 3 de la definición salen de ellas.
    {c:"L04", fase:"def", t:"Cómo ha completado el grupo «liderar aquí es…»", tarjetas:true},
    {c:"L11", fase:"def", t:"Responsabilidades más votadas", apoyo:true},
    {c:"L13", fase:"def", t:"Competencias más votadas", apoyo:true},
    {c:"L05", fase:"def", t:"La primera palabra que asocian con liderazgo", apoyo:true},
    {c:"L06", fase:"def", t:"¿Hay hoy una idea compartida de lo que es liderar?",
     escala:true, apoyo:true},
    // 2 · Alcance
    {c:"L08", fase:"alc", t:"A quién considera el grupo que hay que llamar «líder»", tarjetas:true},
    {c:"L09", fase:"alc", t:"Qué niveles de liderazgo reconocen", tarjetas:true},
    {c:"L10", fase:"alc", t:"¿Se reconoce hoy a quien ejerce liderazgo?",
     escala:true, apoyo:true},
    // 3 · Funciones clave
    {c:"L11", fase:"fun", t:"Responsabilidades más importantes"},
    {c:"L13", fase:"fun", t:"Competencias más importantes"},
    {c:"L12", fase:"fun", t:"Responsabilidades que hoy peor se ejercen"},
    {c:"L14", fase:"fun", t:"Competencias hoy menos desarrolladas"},
    {c:"L15", fase:"fun", t:"Competencias que echan en falta en la lista", textos:true}
  ];
  const bloques = [];
  // L11 y L13 alimentan dos pasos. Sin esta caché se consultarían dos
  // veces cada una, y son las dos consultas más caras de la pantalla.
  const cache = {};
  const traer = async (tipo, id) => {
    const k = tipo + ":" + id;
    if(!(k in cache)) cache[k] = await (tipo === "t"
      ? API.resultadosTarjetas(s.codigo, id) : API.resultadosPregunta(s.codigo, id)).catch(()=>null);
    return cache[k];
  };
  for(const f of FUENTES){
    const p = preguntas.find(x => x.codigo === f.c);
    if(!p) continue;
    if(f.tarjetas){
      const r = await traer("t", p.id);
      const g = (r && r.grupos) || [];
      if(g.length) bloques.push({...f, filas: g.map(x=>({texto:x.etiqueta, n:x.votos}))});
      else if(r && (r.tarjetas||[]).length)
        bloques.push({...f, filas: r.tarjetas.slice(0,12).map(x=>({texto:x.texto, n:null})),
                      nota:"sin agrupar todavía"});
    } else {
      const r = await traer("p", p.id);
      if(!r) continue;
      // Una escala devuelve un objeto, no una lista: se resume en una línea.
      if(f.escala && r.datos && r.datos.media != null)
        bloques.push({...f, filas: [{texto: "media " + num(r.datos.media, 2)
          + " sobre " + ((p.config||{}).max ?? 7)
          + ((p.config||{}).ancla_min ? "  (" + p.config.ancla_min + " → "
             + (p.config.ancla_max||"") + ")" : ""), n: null}]});
      // Una abierta devuelve textos sueltos.
      else if(f.textos && Array.isArray(r.datos) && r.datos.length)
        bloques.push({...f, filas: r.datos.slice(0,15)
          .map(x=>({texto: x.texto || String(x.clave||""), n:null}))});
      else if(Array.isArray(r.datos) && r.datos.length)
        bloques.push({...f, filas: r.datos.map(x=>({texto:x.clave, n:x.n}))});
    }
  }
  const deFase = f => bloques.filter(b => b.fase === f);
  const principales = f => deFase(f).filter(b => !b.apoyo);
  const apoyos      = f => deFase(f).filter(b =>  b.apoyo);

  // Copia de trabajo: se guarda cuando lo pides, no mientras escribes.
  let fs = JSON.parse(JSON.stringify(s.funciones || []));
  if(!fs.length) fs = [{nombre:"", definicion:""}];
  let modelo = JSON.parse(JSON.stringify(s.modelo || {}));
  // Los pares del alcance. Una fila vacía de arranque para que la tabla no
  // aparezca como un encabezado suelto sin sitio donde escribir.
  let gr = (modelo.grupos || []).map(g => ({grupo:g.grupo||"", nivel:g.nivel||""}));
  if(!gr.length) gr = [{grupo:"", nivel:""}];
  // Los avisos sobreviven al repintado: si se escriben en el DOM y después
  // se llama a pinta(), se borran sin que nadie los haya leído.
  let recado = "", recado1 = "";

  const org = () => (s.variables||{}).ORGANIZACION
    || (s.organizacion||{}).nombre || "la organización";

  // Cabecera común de los tres encargos: contexto, evidencia y la regla
  // que evita el problema de siempre —que la IA rellene con lo que ella
  // cree que dice un modelo de liderazgo y no con lo que ha dicho el grupo.
  const evidenciaDe = (fase, intro) => {
    const bs = deFase(fase);
    const t = ["Contexto: taller de modelo de liderazgo en " + org() + ".", "", intro, ""];
    bs.forEach(b => {
      t.push("## " + b.t + (b.nota ? " (" + b.nota + ")" : ""));
      b.filas.forEach(f => t.push("- " + f.texto + (f.n != null ? "  [" + f.n + " votos]" : "")));
      t.push("");
    });
    return t;
  };

  const PROMPT = {
    def: () => evidenciaDe("def",
        "Esto es lo que ha dicho y votado el grupo. La primera lista es la que manda: "
        + "es cómo han completado ellos mismos la frase «liderar aquí es…».")
      .concat([
        "Tarea: redacta la DEFINICIÓN DEL MODELO DE LIDERAZGO de " + org() + ".",
        "",
        "Exactamente CUATRO frases, en este orden y una por cada cosa:",
        "",
        "1. QUÉ SE ENTIENDE POR LIDERAZGO aquí.",
        "   Fuente: «Cómo ha completado el grupo “liderar aquí es…”».",
        "2. QUÉ SE ESPERA DE LAS PERSONAS QUE LIDERAN.",
        "   Fuente: esa misma lista más «Responsabilidades más votadas».",
        "3. CÓMO OPERAN: la manera de hacer, no la tarea.",
        "   Fuente: «Competencias más votadas».",
        "4. QUÉ RESULTADOS SE PRETENDE QUE OBTENGAN.",
        "   Esta es la única que no sale de una votación: dedúcela del propósito",
        "   que asoma en las tres anteriores y márcala como propuesta, para que",
        "   el grupo la discuta. Si no hay base para deducirla, dilo en vez de",
        "   rellenarla con lugares comunes.",
        "",
        "Reglas:",
        "- Presente y tercera persona. Frases de una sola idea, sin subordinadas",
        "  encadenadas: esto se va a proyectar en una pared y a leer en un móvil.",
        "- Usa las palabras del grupo, no el vocabulario de los manuales de",
        "  liderazgo. Tiene que reconocerse en ella quien escribió lo de arriba.",
        "- Di qué hace quien lidera, no qué cualidades tiene.",
        "- No inventes contenido que no esté en las listas. Debajo de la",
        "  definición, indica de qué aportaciones concretas sale cada frase.",
        "- Dame después dos variantes completas del párrafo, una más corta y una",
        "  más exigente, para que el grupo pueda elegir."]).join("\n"),

    alc: () => evidenciaDe("alc",
        "Esto es lo que ha dicho y votado el grupo sobre a quién considerar líder y con qué niveles:")
      .concat([
        "Tarea: propón el ALCANCE del modelo de liderazgo de " + org() + ".",
        "Son dos piezas y las quiero las dos, en este orden:",
        "",
        "PIEZA 1 · UN PÁRRAFO de tres o cuatro frases que empiece por «A efectos",
        "de este modelo, en " + org() + " se consideran líderes…». No enumeres ahí",
        "los colectivos uno a uno —para eso está la tabla—: lo que tiene que",
        "decir el párrafo es el CRITERIO, por qué esos y no otros.",
        "",
        "PIEZA 2 · UNA TABLA DE PARES.",
        "Dos columnas, entre dos y cinco filas:",
        "",
        "  TIPO DE RESPONSABLE  |  NIVEL DE RESPONSABILIDAD",
        "",
        "- Columna 1: el nombre del colectivo, corto, como lo llaman ellos.",
        "  Debajo del nombre no pongas nada más: si necesitas aclarar qué",
        "  puestos entran, dilo fuera de la tabla.",
        "- Columna 2: el nivel, descrito en UNA línea de doce a veinte palabras,",
        "  con nombre propio y no un número. Tiene que decir sobre qué decide,",
        "  con qué horizonte, y si tiene personas a cargo. «Nivel 2» no dice",
        "  nada; «Decide sobre su unidad, horizonte anual, con equipo a cargo»",
        "  se entiende desde el fondo de la sala.",
        "- Ordena las filas de más alcance a menos.",
        "",
        "Después de la tabla, y solo después:",
        "- qué puestos concretos entran en cada fila, de los que aparecen arriba,",
        "",
        "- Los niveles salen de «Qué niveles de liderazgo reconocen»: usa los",
        "  criterios que ha dado el grupo, no una escala tuya.",
        "- Trabaja solo con los puestos que aparecen arriba. Si detectas un",
        "  colectivo que el grupo no ha nombrado y que probablemente falte, dilo",
        "  aparte y marcado como duda, no lo metas en la tabla.",
        "- Señala explícitamente los casos frontera: quién queda justo fuera de",
        "  cada grupo y por qué. Esa es la conversación que hay que tener en la",
        "  sala, y es la que decide si el modelo se aplica a 30 personas o a 300."]).join("\n"),

    fun: () => evidenciaDe("fun",
        "Esto es lo que ha votado el grupo sobre responsabilidades y competencias:")
      .concat([
        (modelo.definicion || modelo.alcance)
          ? "## El modelo ya acordado en esta misma sesión\n"
            + (modelo.definicion ? "Definición: " + modelo.definicion + "\n" : "")
            + (modelo.alcance ? "Alcance: " + modelo.alcance + "\n" : "")
          : "",
        "Tarea: propón entre 5 y 10 FUNCIONES CLAVE DEL LIDERAZGO para esta",
        "organización. Cada función debe mezclar responsabilidades de gestión y",
        "competencias cuyo contenido esté relacionado, y debe llevar un nombre corto",
        "(3-5 palabras) y una definición de dos o tres frases en el lenguaje del",
        "cliente. No inventes contenido que no esté en las listas de arriba, y di",
        "explícitamente qué elementos de cada lista has metido en cada función."]).join("\n")
  };

  const pinta = () => {
    app().innerHTML = `<div class="wrap ancho">${cabecera(
      `<button class="iconbtn" id="atras">Volver</button>`)}
      <div class="card">
        <span class="phasetag">${esc(s.titulo)} · taller</span>
        <h1 style="margin:6px 0 0">Taller de modelo de liderazgo</h1>
        <p class="lead" style="margin-top:8px">Definición, alcance y funciones clave.</p>
        <p class="small">Los tres pasos que no puede dar la aplicación. En cada uno tienes la
          evidencia que ha producido el grupo, un texto listo para pegar en tu IA, y el sitio
          donde dejar la redacción final. El orden importa: el alcance se decide sobre una
          definición ya escrita, y las funciones sobre las dos anteriores.</p>
        ${bloques.length ? "" : `<div class="aviso rojo">Todavía no hay evidencia de ninguna
          fase. Las preguntas tienen que estar <b>terminadas</b> y con al menos tres
          respuestas para que sus resultados salgan aquí. Las de tarjetas —L04, L08, L09—
          además tienen que haber pasado por la mesa de agrupación.</div>`}
      </div>

      ${[{f:"def", n:"1", h:"La definición del modelo",
          d:`Cuatro frases, y cada una responde a una cosa: <b>qué se entiende por
             liderazgo</b> aquí · <b>qué se espera</b> de quien lidera · <b>cómo operan</b> ·
             <b>qué resultados</b> se pretende que obtengan. Es lo primero que leerá quien
             responda la encuesta de evaluación, meses después y sin haber estado en la sala.`,
          vacio:`Sin evidencia todavía. Necesitas <b>L04</b> («liderar aquí es…») terminada y
             agrupada en la mesa de tarjetas.`},
         {f:"alc", n:"2", h:"El alcance: grupos de líderes y niveles",
          d:`Pares <b>grupo → nivel de responsabilidad</b>. La evidencia son las aportaciones
             de L08 —qué puestos— y L09 —con qué criterios se distinguen los niveles—, ya
             agrupadas y votadas.`,
          vacio:`Sin evidencia todavía. Necesitas <b>L08</b> y <b>L09</b> terminadas y
             agrupadas en la mesa de tarjetas.`},
         {f:"fun", n:"3", h:"Las funciones clave",
          d:`El cruce entre responsabilidades de gestión y competencias. Cinco a diez bloques
             que mezclan lo más votado de ambas listas.`,
          vacio:`Sin evidencia todavía. Necesitas <b>L11</b> y <b>L13</b> terminadas y con
             respuestas suficientes para el mínimo de esta sesión.`}].map(fase => {
        const bs = principales(fase.f), ap = apoyos(fase.f);
        return `<div class="card">
        <span class="phasetag">paso ${fase.n} de 3</span>
        <h2 style="margin:6px 0 0">${fase.h}</h2>
        <p class="small" style="margin-top:8px">${fase.d}</p>
        ${bs.length ? `<div class="grid2" style="margin-top:16px">${bs.map(b=>`
          <div><h3 style="margin-top:0">${esc(b.t)}${b.nota ? " · " + esc(b.nota) : ""}</h3>
            <div class="lista">${b.filas.slice(0,15).map(f=>`
              <div class="it"><div>${esc(f.texto)}</div>${
                f.n != null ? `<b>${f.n}</b>` : ""}</div>`).join("")}</div></div>`).join("")}</div>
          ${ap.length ? `<p class="small" style="margin-top:14px">El texto para la IA lleva
            además, como contexto: ${ap.map(b=>"<b>" + esc(b.c) + "</b> " + esc(b.t.toLowerCase())
            ).join(" · ")}.</p>` : ""}
          <div class="btnrow">
            <button class="btn ghost" data-copia="${fase.f}">Copiar esto para tu IA</button>
            <span class="small" id="copiado-${fase.f}"></span></div>
          ${fase.f === "def" ? `<p class="note">Los tres pasos tienen su propio texto para la
            IA: copian la evidencia de ese paso con sus votos y un encargo distinto. Léelos
            antes de pegarlos —los tres le piden expresamente que no invente nada que no esté
            votado y que diga de qué aportación sale cada cosa—. Después revisas tú, que es
            donde está tu trabajo.</p>` : ""}`
        : `<div class="aviso">${fase.vacio}</div>`}
        ${fase.f === "def" ? `
          <div class="field" style="margin-top:18px"><label for="mdef">Definición de liderazgo
            · redacción final</label>
            <textarea id="mdef" rows="4"
              placeholder="La persona que lidera en esta organización…">${esc(modelo.definicion||"")}</textarea></div>`
        : fase.f === "alc" ? `
          <div class="field" style="margin-top:22px"><label for="malc">Alcance · el párrafo</label>
            <textarea id="malc" rows="4"
              placeholder="A efectos de este modelo, se consideran líderes…">${esc(modelo.alcance||"")}</textarea></div>
          <p class="note">El párrafo dice el criterio —por qué esos y no otros— y la tabla dice
            quién es quién. Las dos cosas van juntas en el acta, en la pared y en la encuesta:
            el párrafo solo obliga a leer seis colectivos en una frase, y la tabla sola deja
            sin explicar de dónde sale el corte.</p>

          <h3 style="margin-top:22px">Alcance · la tabla de pares</h3>
          <p class="small">Una fila por tipo de responsable, con el nivel que le corresponde.
            Es lo que se proyecta y lo que se lee de un vistazo.</p>
          <table class="pares" id="tgr">
            <tr><th>Tipo de responsable</th><th>Nivel de responsabilidad</th><th></th></tr>
            ${gr.map((g,i)=>`<tr>
              <td><input id="gg${i}" value="${esc(g.grupo||"")}" maxlength="80"
                    placeholder="Jefaturas de servicio" autocomplete="off"></td>
              <td><input id="gn${i}" value="${esc(g.nivel||"")}" maxlength="80"
                    placeholder="Decide sobre su unidad, horizonte anual" autocomplete="off"></td>
              <td class="mueve">
                <button type="button" data-gsb="${i}" ${i===0?"disabled":""}>▲</button>
                <button type="button" data-gbj="${i}" ${i===gr.length-1?"disabled":""}>▼</button>
                <button type="button" data-gqt="${i}">×</button></td></tr>`).join("")}
          </table>
          <div class="btnrow"><button class="btn ghost" id="masgr">Añadir fila</button></div>
`
        : ""}
      </div>`;}).join("")}


      <div class="card">
        <h2>Redacción final de las funciones
          <span class="estado">${fs.filter(f=>f.nombre.trim()).length}</span></h2>
        <p class="small">Nombre corto arriba, definición debajo. El nombre es lo que verá la
          sala en los gráficos, así que que quepa en una línea. La definición es lo que leerá,
          desplegándola, quien responda la encuesta de evaluación: si la dejas vacía, esa
          persona puntúa un título de tres palabras.</p>
        <div id="fs">${fs.map((f,i)=>`
          <div class="cel-fila">
            <div style="display:flex;gap:10px;align-items:flex-start">
              <div class="pos" style="margin-top:9px">${i+1}</div>
              <div style="flex:1">
                <div class="field" style="margin-bottom:8px">
                  <input id="fn${i}" value="${esc(f.nombre)}" placeholder="Nombre de la función"
                    maxlength="60" autocomplete="off"></div>
                <div class="field" style="margin-bottom:0">
                  <textarea id="fd${i}" rows="3"
                    placeholder="Qué significa, en el lenguaje del cliente">${esc(f.definicion)}</textarea></div>
              </div>
              <div class="mueve" style="margin-top:6px">
                <button type="button" data-sb="${i}" ${i===0?"disabled":""}>▲</button>
                <button type="button" data-bj="${i}" ${i===fs.length-1?"disabled":""}>▼</button>
                <button type="button" data-qt="${i}">×</button></div>
            </div></div>`).join("")}</div>
        <div class="btnrow">
          <button class="btn ghost" id="mas">Añadir otra</button>
          <button class="btn" id="guardar">Guardar modelo</button></div>
        <div id="aviso">${recado1}</div>
        <h3>Proyectar</h3>
        <p class="small">Lo que ve la sala mientras trabajáis. Se actualiza sola cada tres
          segundos, así que puedes escribir aquí y ver el cambio allí.</p>
        <div class="btnrow" style="margin-top:0">
          <button class="btn ghost" id="proyVotado">Proyectar lo votado</button>
          <button class="btn ghost" id="proyFunciones">Proyectar las funciones</button>
          <button class="btn ghost" type="button"
             onclick="abrirProyeccion('${esc(s.codigo)}')">Abrir proyección</button></div>
        <div id="aviso3"></div>
      </div>

      <div class="card">
        <h2>Volcar en las preguntas</h2>
        <p class="small">Escribe los nombres de las funciones en las preguntas que las
          necesitan, para que no tengas que teclearlas tres veces con la sala esperando.</p>
        <div class="lista">${["L16","L17","L18"].map(c=>{
          const p = preguntas.find(x=>x.codigo===c);
          const nom = {L16:"Validación 1-4 de cada función", L17:"Qué cambiarías (abierta)",
                       L18:"Ranking de prioridad"}[c];
          return `<div class="it"><div><b>${c}</b> · ${nom}
            <div class="small">${p ? (c === "L17" ? "no necesita lista"
                : "hoy: " + (((p.config||{}).items || (p.config||{}).opciones || []).length) + " elementos")
              : "<b>no está en esta sesión</b>"}</div></div></div>`;}).join("")}</div>
        <div class="btnrow"><button class="btn" id="volcar">Volcar en L16 y L18</button></div>
        <div id="aviso2">${recado}</div>
        <p class="note">Sustituye la lista entera de esas dos preguntas. Hazlo <b>antes</b> de
          abrirlas: si ya tienen respuestas, cambiar los elementos deja los resultados
          anteriores colgando de nombres que ya no existen.</p>
      </div>

      ${(() => {
        // Qué falta para poder cerrar. Se comprueba sobre lo GUARDADO, no
        // sobre lo que hay escrito en pantalla: cerrar un modelo que no
        // está guardado dejaría un acta que no coincide con la sesión.
        const g = s.modelo || {}, gf = (s.funciones||[]).filter(f=>f.nombre);
        const ngr = (g.grupos||[]).filter(x => x.grupo || x.nivel).length;
        const pend = [!g.definicion && "la definición",
                      !g.alcance && "el párrafo del alcance",
                      !ngr && "al menos un par en la tabla del alcance",
                      !gf.length && "al menos una función clave"].filter(Boolean);
        const cerrado = g.cerrado_en;
        return `<div class="card">
        <h2>Cerrar el modelo</h2>
        ${cerrado ? `<div class="aviso"><b>Modelo cerrado</b> el ${
            new Date(cerrado).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})
          }. Puedes seguir editando y volver a cerrarlo: la fecha se actualiza.</div>`
        : pend.length ? `<div class="aviso rojo">Todavía no se puede cerrar: falta
            <b>${pend.join("</b>, <b>")}</b>. Y recuerda guardar, porque esto mira lo que hay
            en la sesión, no lo que tienes escrito en pantalla sin guardar.</div>`
        : `<p class="small">Ya está todo. Cerrar el modelo le pone fecha y lo deja disponible
            como resultado definitivo: para proyectarlo en la sala y para el acta en PDF.</p>`}
        <div class="btnrow">
          <button class="btn" id="cerrarModelo" ${pend.length ? "disabled" : ""}>${
            cerrado ? "Volver a cerrar con la versión de hoy" : "Cerrar el modelo"}</button>
          <button class="btn ghost" id="acta" ${pend.length ? "disabled" : ""}>Ver el modelo</button></div>
        <div id="aviso4"></div>
        <p class="note">«Ver el modelo» abre el entregable: las tres partes tal como quedan,
          con botón para guardarlo en PDF y para mandarlo a la pared de la sala.</p>
        <p class="note">Cerrar no bloquea nada ni borra nada: no hay ninguna puerta que se
          cierre de forma irreversible en este sistema, y esta tampoco. Lo que hace es poner
          fecha a la versión acordada y dejar de tratar el modelo como un borrador. La
          encuesta de evaluación hereda igualmente la última versión guardada, esté cerrada
          o no; la fecha sirve para que dentro de un año sepas cuál era el texto que se
          aprobó y cuándo.</p>
      </div>`;})()}
      </div>`;

    $("#atras").onclick = volver;

    const leer = () => {
      // Todo lo escrito se recoge junto, incluidos los dos textos del
      // modelo: cualquier repintado —añadir una fila, subirla, borrarla—
      // vuelve a dibujar la pantalla entera, y lo que no se haya leído
      // antes se pierde sin que nadie lo note hasta el día siguiente.
      // Se conserva lo que ya hubiera en `modelo` —hoy, la fecha de
      // cierre—. Sobrescribir el objeto entero borraba esa fecha en el
      // primer guardado posterior al cierre, y encima en silencio.
      gr = gr.map((_,i) => ({grupo: ($("#gg"+i)||{}).value ? $("#gg"+i).value.trim() : "",
                             nivel: ($("#gn"+i)||{}).value ? $("#gn"+i).value.trim() : ""}));
      modelo = {...modelo, definicion: $("#mdef").value.trim(),
                           alcance: ($("#malc") ? $("#malc").value.trim() : ""),
                           grupos: gr.filter(g => g.grupo || g.nivel)};
      return fs.map((_,i) => ({nombre: $("#fn"+i).value.trim(),
                               definicion: $("#fd"+i).value.trim()}));
    };
    // El prompt de las funciones incluye la definición y el alcance ya
    // escritos, así que se lee lo tecleado antes de copiar: si no, se
    // copiaría la versión guardada y no la que se está redactando ahora.
    app().querySelectorAll("[data-copia]").forEach(bn => bn.onclick = () => {
      const f = bn.dataset.copia;
      if(f === "fun") leer();
      copiar(PROMPT[f]());
      const c = $("#copiado-" + f);
      if(c) c.textContent = "Copiado. Pégalo en tu conversación con la IA.";
    });

    if($("#masgr")) $("#masgr").onclick = () => {
      fs = leer(); gr.push({grupo:"", nivel:""}); pinta(); };
    app().querySelectorAll("[data-gqt]").forEach(b => b.onclick = () => {
      fs = leer(); gr.splice(+b.dataset.gqt, 1);
      if(!gr.length) gr = [{grupo:"", nivel:""}]; pinta(); });
    app().querySelectorAll("[data-gsb]").forEach(b => b.onclick = () => {
      const i = +b.dataset.gsb; fs = leer(); [gr[i-1], gr[i]] = [gr[i], gr[i-1]]; pinta(); });
    app().querySelectorAll("[data-gbj]").forEach(b => b.onclick = () => {
      const i = +b.dataset.gbj; fs = leer(); [gr[i+1], gr[i]] = [gr[i], gr[i+1]]; pinta(); });

    $("#mas").onclick = () => { fs = leer(); fs.push({nombre:"", definicion:""}); pinta(); };
    app().querySelectorAll("[data-qt]").forEach(b => b.onclick = () => {
      fs = leer(); fs.splice(+b.dataset.qt, 1);
      if(!fs.length) fs = [{nombre:"", definicion:""}]; pinta(); });
    app().querySelectorAll("[data-sb]").forEach(b => b.onclick = () => {
      const i = +b.dataset.sb; fs = leer(); [fs[i-1], fs[i]] = [fs[i], fs[i-1]]; pinta(); });
    app().querySelectorAll("[data-bj]").forEach(b => b.onclick = () => {
      const i = +b.dataset.bj; fs = leer(); [fs[i+1], fs[i]] = [fs[i], fs[i+1]]; pinta(); });

    const guardar = async () => {
      fs = leer().filter(f => f.nombre || f.definicion);
      if(!fs.length) fs = [{nombre:"", definicion:""}];
      const buenas = fs.filter(f => f.nombre);
      // El texto del modelo se guarda con las funciones y no en un botón
      // aparte: son la misma cosa, y dos botones de guardar en una pantalla
      // garantizan que alguna vez se pulse solo uno.
      Object.assign(s, await API.actualizarSesion(s.id,
        {funciones: buenas, modelo: modelo}));
      return buenas;
    };

    const proyectar = async (vista, txt) => {
      try{ Object.assign(s, await API.actualizarSesion(s.id, {vista_activa: vista}));
        $("#aviso3").innerHTML = `<div class="aviso">${txt}</div>`;
      }catch(e){ $("#aviso3").innerHTML = `<div class="aviso rojo">${esc(e.message||e)}</div>`; }
    };
    $("#proyVotado").onclick = () => proyectar("taller",
      "En la sala: las responsabilidades y competencias más votadas.");
    // Se guarda antes de proyectar: si no, la sala vería la versión anterior
    // mientras tú miras la nueva en tu pantalla, y eso desconcierta a todos.
    $("#proyFunciones").onclick = async () => {
      await guardar().catch(()=>null);
      await proyectar("funciones", "En la sala: las funciones tal como están ahora mismo.");
    };

    const decir4 = (t, mal) => { const c = $("#aviso4");
      if(c) c.innerHTML = `<div class="aviso${mal?" rojo":""}">${t}</div>`; };

    if($("#cerrarModelo")) $("#cerrarModelo").onclick = async () => {
      const b = $("#cerrarModelo");
      b.disabled = true; b.textContent = "Cerrando…";
      try{
        await guardar();
        // La fecha la pone el navegador y no la base de datos porque es
        // un dato de trabajo —«esta es la versión que aprobamos aquel
        // día»—, no un sello de auditoría. Si algún día hace falta que
        // sea infalsificable, se sube a un `default now()` en columna.
        modelo = {...modelo, cerrado_en: new Date().toISOString()};
        Object.assign(s, await API.actualizarSesion(s.id, {modelo}));
        pinta();
        decir4("Modelo cerrado. Ya puedes proyectarlo y sacar el acta.");
      }catch(e){ b.disabled = false; decir4(esc(e.message||e), true); }
    };

    if($("#acta")) $("#acta").onclick = async () => {
      await guardar().catch(()=>null);
      actaModelo(s, () => tallerFunciones(s, preguntas, volver));
    };

    $("#guardar").onclick = async () => {
      $("#guardar").disabled = true; $("#guardar").textContent = "Guardando…";
      try{ const b = await guardar();
        const faltan = [!modelo.definicion && "la definición",
                        !modelo.alcance && "el párrafo del alcance",
                        !(modelo.grupos||[]).length && "la tabla del alcance"].filter(Boolean);
        recado1 = `<div class="aviso">Guardadas ${b.length} funciones y el texto del modelo.
          La encuesta de evaluación podrá heredarlo de aquí.${
          faltan.length ? ` <b>Falta ${faltan.join(" y ")}</b>: sin eso, quien responda
            la encuesta estará valorando funciones sueltas sin saber de dónde salen.` : ""}</div>`;
        // Se repinta porque «Cerrar el modelo» mira lo GUARDADO: sin esto,
        // acabas de guardarlo todo y el botón sigue diciendo que falta.
        pinta();
      }catch(e){
        recado1 = `<div class="aviso rojo">${esc(e.message||e)}</div>`;
        $("#guardar").disabled = false; $("#guardar").textContent = "Guardar modelo";
        if($("#aviso")) $("#aviso").innerHTML = recado1;
      }
    };

    $("#volcar").onclick = async () => {
      const b = await guardar().catch(()=>null);
      if(!b || !b.length){ $("#aviso").innerHTML =
        `<div class="aviso rojo">Escribe al menos una función con nombre.</div>`; return; }
      const nombres = b.map(f=>f.nombre);
      // Las definiciones viajan con los nombres a L16. Sin ellas, en el
      // móvil el comité valida títulos de cuatro palabras redactados hace
      // cinco minutos: la matriz sabe desplegar la definición de cada fila
      // y no había ninguna razón para no dársela.
      const defs = b.reduce((o,f)=>(f.definicion ? (o[f.nombre]=f.definicion) : 0, o), {});
      const destinos = [{c:"L16", k:"items", d:true}, {c:"L18", k:"opciones", d:true}];
      let hechas = 0;
      for(const dst of destinos){
        const p = preguntas.find(x=>x.codigo===dst.c); if(!p) continue;
        const cfg = Object.assign({}, p.config||{}); cfg[dst.k] = nombres;
        if(dst.d) cfg.definiciones = defs; else delete cfg.definiciones;
        try{ await API.actualizarPregunta(p.id, {config: cfg}); hechas++; }catch(e){}
      }
      preguntas = await API.preguntas(s.id);
      recado = hechas
        ? `<div class="aviso">Volcadas en ${hechas} ${hechas===1?"pregunta":"preguntas"}
             las ${nombres.length} funciones. Ya puedes abrirlas.</div>`
        : `<div class="aviso rojo">Ni L16 ni L18 están en esta sesión: añádelas desde el
             constructor antes de volcar.</div>`;
      pinta();
    };
  };
  pinta();
}

/* ═══════════════════════════════════════════════════════════════════
   INFORME DE LA SESIÓN

   Todas las preguntas, una detrás de otra, con el mismo gráfico que vio
   la sala. Sirve para tres cosas distintas: repasar antes de escribir el
   informe de verdad, proyectarlo entero al cerrar la sesión, y guardarlo
   en PDF desde el propio navegador.

   Lo que NO hace: interpretar. Esto son los datos ordenados; el informe
   del cliente lo escribes tú.
   ═══════════════════════════════════════════════════════════════════ */
async function informeSesion(s, preguntas, volver){
  app().innerHTML = `<div class="wrap ancho">${cabecera(
    `<button class="iconbtn" id="atras">Volver</button>`)}
    <div class="card"><h1>Reuniendo los resultados…</h1>
    <p class="small">Una consulta por pregunta: con muchas, tarda unos segundos.</p></div></div>`;
  if($("#atras")) $("#atras").onclick = volver;

  // Secuencial y no en paralelo: sesenta consultas a la vez contra el
  // mismo proyecto es la mejor forma de que te corten por exceso.
  const partes = [];
  for(const p of preguntas){
    if(p.tipo === "tarjetas"){
      const rt = await API.resultadosTarjetas(s.codigo, p.id).catch(()=>null);
      partes.push({p, rt});
    } else {
      const r = await API.resultadosPregunta(s.codigo, p.id).catch(()=>null);
      partes.push({p, r});
    }
  }

  const conDatos = partes.filter(x => (x.r && x.r.datos)
    || (x.rt && ((x.rt.grupos||[]).length || (x.rt.tarjetas||[]).length))).length;

  /* LA BRECHA
     En una evaluación del liderazgo, ni la nota más baja ni la importancia
     más alta dicen por dónde empezar. Lo dice la distancia entre las dos:
     una función que todo el mundo considera imprescindible y ve poco
     desarrollada es un problema; una que está floja y a nadie le importa
     es una función que sobra del modelo, y eso también hay que saberlo.

     Se calcula aquí, no en la base de datos, porque es aritmética sobre
     dos resultados que ya están agregados y ya han pasado el mínimo de
     tres respuestas. Nada de esto toca respuestas individuales. */
  const brecha = () => {
    const e06 = partes.find(x => x.p.codigo === "E06");
    const imp = e06 && e06.r;
    if(!imp || !Array.isArray(imp.datos)) return "";

    /* El desarrollo ya no sale de una matriz propia: sale de la valoración
       que abre la pantalla de cada función clave. Se casan por el nombre de
       la función, que viaja en `config.funcion` precisamente para esto y no
       hay que sacarlo del título a trozos. */
    const des = {}; let escDes = null;
    partes.forEach(({p, r}) => {
      if(!p || p.tipo !== "abierta_campos") return;
      const nota = mediaDeCampos(p, r && r.datos);
      if(!nota || !nota.funcion) return;
      des[nota.funcion] = nota.media;
      escDes = escDes || nota.escala;
    });
    if(!escDes) return "";

    /* Restar dos escalas distintas no significa nada. Si alguien ha tocado
       a mano el 1–7 de la E06, se dice y no se calcula: un número inventado
       con aspecto de dato es peor que ningún número. */
    const maxImp = (e06.p.config || {}).max ?? 7;
    if(maxImp !== escDes.max) return `<div class="card informe-bloque">
      <span class="num">LECTURA</span><h2>Dónde está la brecha</h2>
      <div class="aviso rojo" style="margin-top:12px">No se puede calcular: la importancia
        (E06) está en una escala de 1 a ${esc(String(maxImp))} y la valoración de cada
        función, en una de 1 a ${esc(String(escDes.max))}. Restar una de otra no significa
        nada. Iguala las dos escalas en el contenido de las preguntas y vuelve aquí.</div></div>`;

    const filas = imp.datos
      .filter(d => des[d.clave] != null)
      .map(d => ({clave: d.clave, imp: d.media, des: des[d.clave],
                  dif: Math.round((d.media - des[d.clave]) * 100) / 100}))
      .sort((a,b) => b.dif - a.dif);
    if(!filas.length) return "";
    const tope = Math.max(...filas.map(f => Math.abs(f.dif))) || 1;
    return `<div class="card informe-bloque">
      <span class="num">LECTURA</span><h2>Dónde está la brecha</h2>
      <div class="small" style="margin-top:8px">calculado · importancia (E06) menos la
        valoración de cada pantalla por función · escala 1–${esc(String(escDes.max))}</div>
      <p class="small" style="margin-top:8px">Importancia menos desarrollo, función por
        función. Arriba, lo que más importa y menos hay.</p>
      <table class="matriz" style="margin-top:16px">
        <thead><tr><th class="et"></th><th>Desarrollo</th><th>Importancia</th>
          <th>Brecha</th><th></th></tr></thead><tbody>
        ${filas.map(f=>`<tr>
          <td class="et">${esc(f.clave)}</td>
          <td>${f.des.toFixed(1)}</td>
          <td>${f.imp.toFixed(1)}</td>
          <td><b>${f.dif > 0 ? "+" : ""}${f.dif.toFixed(1)}</b></td>
          <td style="width:38%"><div class="barmini" style="position:relative">
            <i style="width:${Math.round(Math.abs(f.dif)/tope*100)}%;background:${
              // Naranja y azul, no rojo y verde: el par rojo-verde es
              // justo el que no distingue un daltónico, y aquí el color
              // codifica el signo. El signo va además escrito al lado
              // —«+2,2», «−0,2»—, así que el color es ayuda, no dato.
              f.dif >= 0 ? "var(--tono-2)" : "var(--tono-1)"}"></i></div></td></tr>`).join("")}
      </tbody></table>
      <p class="small" style="margin-top:16px">Brecha positiva: importa más de lo que hay
        —por ahí se empieza—. Brecha negativa o cerca de cero: o ya está resuelto, o esa
        función pesa menos en el modelo de lo que pensaba el comité que la redactó. Las dos
        lecturas son útiles y la segunda es la que nadie mira.</p>
    </div>`;
  };

  const bloque = ({p, r, rt}, n) => {
    // El número en la esquina, y debajo el enunciado tal cual lo leyó la
    // gente. La ficha técnica —código, tipo, estado— va de segunda: importa
    // cuando ya sabes qué estás mirando, no antes.
    const cab = `<span class="num">${esc(n || "")}</span>
      <h2>${esc(p.titulo)}</h2>
      <div class="small" style="margin-top:8px">${esc(p.codigo || "propia")} ·
      ${esc(nombreTipo(p))} · ${esc(p.estado)}</div>`;
    const pie = txt => `<p class="small" style="margin-top:16px">${esc(txt)}</p>`;

    if(p.tipo === "tarjetas"){
      if(!rt || rt.existe === false) return cab + pie("Sin datos.");
      if(rt.grupos && rt.grupos.length)
        return cab + barras(rt.grupos, d=>d.etiqueta + " (" + d.tarjetas + ")", d=>d.votos)
          + pie(`Votos de ${rt.n_votantes} personas · entre paréntesis, cuántas aportaciones agrupa cada tema`);
      if(rt.tarjetas && rt.tarjetas.length)
        return cab + `<div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px">${
          rt.tarjetas.map(t=>`<div class="enun" style="flex:1 1 280px;margin:0;font-size:17px">${
            esc(t.texto)}</div>`).join("")}</div>`
          + pie(`${rt.n_tarjetas} aportaciones, todavía sin agrupar`);
      return cab + pie(`${rt.n_tarjetas} aportaciones · sin agrupar ni votar`);
    }
    if(!r || r.existe === false) return cab + pie("Sin datos.");
    if(!r.datos)
      return cab + `<div class="aviso" style="margin-top:12px">${
        r.respondidos === 0 ? "Nadie la ha respondido."
        : r.respondidos < r.minimo
          ? `Solo ${r.respondidos} ${r.respondidos===1?"respuesta":"respuestas"}: por debajo de
             ${r.minimo} no se muestra el resultado, para no señalar a nadie.`
          : `La pregunta sigue ${esc(r.estado)}: los resultados aparecen al terminarla.`}</div>`;
    return cuerpoResultado(p, r, cab, pie);
  };

  /* La lectura propia del Radar de madurez: la figura y, debajo, la
     tabla de distancias, que es lo que ordena el plan. Se calcula una
     vez porque el indice del informe tambien pregunta si existe. */
  const bloqueRadar = String(s.instrumento||"").split("-")[0] === "radar"
    ? lecturaRadar(partes) : "";

  const org = (s.organizacion || {}).nombre || "";
  const hoy = new Date().toLocaleDateString("es-ES",
    {day:"numeric", month:"long", year:"numeric"});
  // Cuánta gente ha llegado a contestar algo: el máximo de respondidos de
  // todas las preguntas. Es un suelo, no un censo, y por eso se rotula
  // «respuestas» y no «participantes».
  const respMax = Math.max(0, ...partes.map(x =>
    (x.r && x.r.respondidos) || (x.rt && x.rt.n_tarjetas) || 0));
  const tituloDe = x => (x.p.titulo || "").replace(/\s+/g, " ").trim();

  app().innerHTML = `<div class="wrap ancho doc">${cabecera(
    `<button class="iconbtn" id="atras">Volver</button>`)}
    <div class="card informe-cab">
      <div class="filete"></div>
      <p class="org">${esc(org)}</p>
      <h1>${esc(s.titulo)}</h1>
      <p class="sub">Informe de resultados</p>
      ${s.es_prueba ? `<div class="aviso" style="margin-top:22px"><b>Ojo:</b> estos datos
        son simulados. No los uses en un informe de cliente.</div>` : ""}
      <dl class="meta">
        <div><dt>Fecha</dt><dd>${esc(hoy)}</dd></div>
        <div><dt>Sesión</dt><dd>${esc(s.codigo)}</dd></div>
        <div><dt>Preguntas</dt><dd>${preguntas.length}</dd></div>
        <div><dt>Con resultado</dt><dd>${conDatos}</dd></div>
        <div><dt>Respuestas</dt><dd>${respMax}</dd></div>
        <div><dt>Estado</dt><dd>${esc(s.estado)}</dd></div>
      </dl>
      <nav class="contenido">
        <h3>Contenido</h3>
        <ol>${bloqueRadar ? `<li><b>··</b><span>Madurez e importancia, ámbito por ámbito</span></li>` : ""}${
          brecha() ? `<li><b>··</b><span>Dónde está la brecha</span></li>` : ""}${
          partes.map((x,i)=>`<li><b>${String(i+1).padStart(2,"0")}</b>
            <span>${esc(tituloDe(x))}</span></li>`).join("")}</ol>
      </nav>
      <div class="btnrow no-imprimir">
        <button class="btn ghost" id="imprimir">Imprimir o guardar en PDF</button>
        <button class="btn ghost" id="recargar">Actualizar</button></div>
      <p class="note no-imprimir">«Guardar en PDF» abre el diálogo de impresión: elige
        «Guardar como PDF» en el destino. La portada ocupa su propia página y ninguna
        pregunta se parte entre dos. Si quieres numeración de páginas, marca en
        <b>Más opciones</b> la casilla «Encabezados y pies de página»; ten en cuenta que
        el navegador escribe ahí también la dirección web y la fecha del sistema.</p>
    </div>
    ${bloqueRadar}
    ${brecha()}
    ${partes.map((x,i) => `<div class="card informe-bloque">${bloque(x,
        String(i+1).padStart(2,"0"))}</div>`).join("")}
    <div class="card no-imprimir"><p class="small">Esto son los datos, no el informe.
      Lo que significan lo escribes tú.</p></div>
    <div class="pie-doc"><span>${esc(org)}${org && s.titulo ? " · " : ""}${
      esc(s.titulo)}</span><span>${esc(s.codigo)} · ${esc(hoy)}</span></div>
    </div>`;

  $("#atras").onclick = volver;
  /* El navegador nombra el PDF con el título del documento. Con el título
     de siempre, todos los informes se descargaban llamándose «Consola de
     proyectos · joaquinromero.com», y en la carpeta de un cliente con tres
     sesiones no hay forma de saber cuál es cuál sin abrirlos. Se cambia
     justo para imprimir y se devuelve después, tanto si el diálogo se
     acepta como si se cancela. */
  $("#imprimir").onclick = () => {
    const antes = document.title;
    const limpio = t => String(t || "").replace(/[\/\\:*?"<>|]+/g, " ")
                                       .replace(/\s+/g, " ").trim();
    const fecha = new Date().toISOString().slice(0, 10);
    document.title = limpio([org, s.titulo, s.codigo, fecha].filter(Boolean)
      .join(" - ")) || antes;
    const devolver = () => { document.title = antes; };
    window.addEventListener("afterprint", devolver, {once:true});
    window.print();
    setTimeout(devolver, 4000);
  };
  $("#recargar").onclick = () => informeSesion(s, preguntas, volver);
  window.scrollTo({top:0});
}

/* Qué hoja del modelo cerrado está en la pared, cuándo giró por última vez
   y si ya se ató el teclado. Fuera de `proyeccionMotor` porque su `pinta`
   se rehace cada tres segundos y perdería el sitio en cada refresco. */
const HOJA = {i:0, giro:0};

/* Lo mismo para el radar en la pared: nueve consultas para dibujar una
   figura, y un repintado cada tres segundos. Se guarda lo pedido y solo
   se vuelve a pedir cada doce, que es mas rapido de lo que cambia una
   media de doce personas. */
const RADPARED = {datos:null, pedido:0};

async function proyeccionMotor(codigo, s){
  let timer = null;
  // Qué está en la pared ahora mismo. Lo necesita el mando de teclado: si
  // lo que se proyecta es el modelo cerrado, las flechas pasan sus hojas
  // en vez de abrir y cerrar preguntas.
  let vistaActual = "espera";
  const url = location.origin + location.pathname + "?s=" + encodeURIComponent(codigo);


  const pinta = async () => {
    const n = await API.sesionPublica(codigo).catch(()=>null);
    if(!n){ app().innerHTML = `<div class="proy"><h1>Sesión no encontrada</h1></div>`; return; }
    const va = n.vista_activa || "espera";
    vistaActual = va;
    let cuerpo = "";

    // El taller tiene dos pantallas: la evidencia que se mira mientras se
    // redacta, y las funciones ya escritas. Son la misma conversación en
    // dos momentos, y ninguna es una pregunta, así que no viajan por `q:`.
    /* El modelo cerrado son tres pantallas —definición, alcance,
       funciones— y no una sola: la definición son cuatro frases que hay
       que poder leer desde el fondo de la sala, y si comparten pantalla
       con diez funciones no se lee ninguna de las dos cosas.

       Pasan solas cada veinte segundos, y con las flechas del teclado
       cuando alguien quiere volver atrás para releer. El índice vive en
       una variable del módulo porque este `pinta` se llama cada tres
       segundos y perdería el sitio en cada refresco. */
    if(va === "modelo"){
      const m = n.modelo || {}, fs = n.funciones || [];
      const gr = (m.grupos || []).filter(x => x && (x.grupo || x.nivel));
      const hojas = [
        {t:"Qué entendemos por liderazgo", p:m.definicion},
        {t:"A quién consideramos líder",   p:m.alcance, gr:gr},
        {t:"Las funciones clave",          fs}
      ].filter(h => h.p || (h.fs && h.fs.length) || (h.gr && h.gr.length));
      if(!hojas.length){
        app().innerHTML = `<div class="proy"><h1>El modelo todavía no está escrito</h1></div>`;
        return;
      }
      /* El paso del tiempo se resuelve ANTES de elegir la hoja. Hacerlo
         después dejaba el índice una posición por delante de lo que se
         estaba viendo, así que la primera flecha saltaba dos.
         `giro` a cero es «acabo de llegar», no «hace 56 años». */
      if(!HOJA.giro) HOJA.giro = Date.now();
      if(Date.now() - HOJA.giro > 20000){ HOJA.giro = Date.now(); HOJA.i++; }
      // Índice normalizado en los dos sentidos: con el ajuste solo por
      // arriba, una flecha izquierda en la primera hoja dejaba el índice
      // en -1 y el siguiente refresco reventaba en la pared de la sala.
      HOJA.i = ((HOJA.i % hojas.length) + hojas.length) % hojas.length;
      const h = hojas[HOJA.i];
      // Las hojas de texto se centran en vertical: son cuatro frases en una
      // pantalla de dos metros, y pegadas al borde de arriba parecen el
      // encabezado de otra cosa que no llegó a cargar.
      app().innerHTML = `<div class="proy"${(h.fs || h.gr) ? "" :
          ` style="min-height:78vh;display:flex;flex-direction:column;justify-content:center"`}>
        <div class="small">${esc(n.titulo||"")}${m.cerrado_en
          ? " · acordado el " + new Date(m.cerrado_en).toLocaleDateString("es-ES",
              {day:"numeric", month:"long", year:"numeric"}) : ""}</div>
        <h1>${esc(h.t)}</h1>
        ${h.fs ? `<div class="funciones">${h.fs.map((f,i)=>`
            <div class="fun"><b style="color:${tonoN(i)}">${i+1}</b>
              <div><h3>${esc(f.nombre)}</h3>${
                f.definicion ? `<p>${esc(f.definicion)}</p>` : ""}</div></div>`).join("")}</div>`
          : h.gr ? `${h.p ? `<p style="font-size:26px;line-height:1.4;max-width:34em;
               color:var(--text-secondary)">${esc(h.p)}</p>` : ""}
             ${tablaAlcance(h.gr, true)}`
          : `<p style="font-size:40px;line-height:1.4;max-width:20em">${esc(h.p)}</p>`}
        <p class="small" style="margin-top:28px">${HOJA.i + 1} de ${hojas.length}
          · las flechas ← → pasan de una a otra</p></div>`;
      // Las flechas las gobierna el mando de teclado de más abajo, que ya
      // existía para pasar de pregunta. Un segundo listener sobre las
      // mismas teclas no «añade» nada: los dos se disparan y gana el que
      // escribe último, que era el otro.
      return;
    }

    /* ── EL MAPA DE ESCENARIOS EN LA PARED ─────────────────────────
       Cuatro relatos de doscientas palabras no caben a la vez en una
       pared y leerse desde el fondo: o entran los cuatro y no se lee
       ninguno, o se lee uno cada vez. Así que son cinco hojas —el mapa
       entero y después uno por escenario— y pasan solas cada veinte
       segundos, con el mismo mecanismo que ya usa el modelo de
       liderazgo, incluidas las flechas para volver atrás.

       Todo sale de `sesion.modelo`, que la función pública ya devuelve:
       la pared no necesita estar identificada ni leer ninguna respuesta.
       Se prefiere el relato elaborado —el que se revisó después de la
       IA— y si no lo hay, salen los nombres que pusieron los grupos. */
    if(va === "mapa"){
      const m = n.modelo || {}, ej = m.ejes || {};
      const es = (m.escenarios || []).filter(e => e);
      const elab = m.elaborado || {};
      const dato = i => { const e = es[i] || {}, v = elab["e"+(i+1)] || {};
        return {k:e.k || ("E"+(i+1)), pos:e.pos || "",
                nombre: (v.nombre || e.nombre || "").trim(),
                lema: (v.lema || "").trim(), relato: (v.relato || "").trim()}; };
      const todos = es.map((_,i) => dato(i));
      if(!todos.some(d => d.nombre)){
        app().innerHTML = `<div class="proy"><h1>El mapa todavía no está escrito</h1>
          <p style="font-size:22px">Ponles nombre a los cuatro escenarios en el taller.</p>
          </div>`;
        return;
      }
      // El mapa entero primero, y después solo los que tengan relato: una
      // hoja en blanco con un título proyectada veinte segundos delante de
      // la sala es peor que no proyectar nada.
      const hojas = [{mapa:true}].concat(todos.map((d,i)=>({d,i}))
        .filter(x => x.d.relato));
      if(!HOJA.giro) HOJA.giro = Date.now();
      if(Date.now() - HOJA.giro > 20000){ HOJA.giro = Date.now(); HOJA.i++; }
      HOJA.i = ((HOJA.i % hojas.length) + hojas.length) % hojas.length;
      const h = hojas[HOJA.i];
      // El orden del DOM no es el de los cuadrantes: arriba-izquierda,
      // arriba-derecha, abajo-izquierda, abajo-derecha. Y E3 es abajo-derecha.
      const rejilla = [0,1,3,2];
      const cuerpoMapa = h.mapa
        ? `<h1>Los cuatro escenarios</h1>
           <div class="mapa-esc">
             <div class="eje eje-y"><b>↑</b> ${esc(ej.y || "eje vertical sin definir")}</div>
             <div class="cuadros">${rejilla.map(i => { const d = todos[i];
               if(!d) return `<div class="cuad vacio"></div>`;
               return `<div class="cuad">
                 <span class="cuad-k">${esc(d.k)} · ${esc(d.pos)}</span>
                 <h3>${esc(d.nombre || "Sin nombre todavía")}</h3>
                 ${d.lema ? `<p class="lema">«${esc(d.lema)}»</p>` : ""}</div>`; }).join("")}</div>
             <div class="eje eje-x"><b>←</b> ${esc(ej.x || "eje horizontal sin definir")}
               <b>→</b></div>
           </div>`
        : `<div class="small">${esc(h.d.k)} · ${esc(h.d.pos)}</div>
           <h1>${esc(h.d.nombre)}</h1>
           ${h.d.lema ? `<p style="font-size:30px;font-style:italic;
             color:var(--text-secondary);margin:0 0 20px;max-width:26em"
             >«${esc(h.d.lema)}»</p>` : ""}
           <p style="font-size:24px;line-height:1.5;max-width:34em">${esc(h.d.relato)}</p>`;
      app().innerHTML = `<div class="proy">
        <div class="small">${esc(n.titulo||"")}</div>
        ${cuerpoMapa}
        <p class="small" style="margin-top:28px">${HOJA.i + 1} de ${hojas.length}
          · las flechas ← → pasan de una a otra</p></div>`;
      return;
    }

    /* ── LAS ACCIONES COMUNES ──────────────────────────────────────
       Sin responsable no se proyecta como una acción a medias: se
       proyecta con el hueco a la vista y la palabra «SIN ASIGNAR» donde
       debería ir un nombre. Es incómodo delante de la sala, y esa
       incomodidad es exactamente la que hace que alguien lo asuma antes
       de que se levante nadie. */
    if(va === "acciones"){
      const ac = ((n.modelo||{}).acciones || []).filter(x => (x.accion||"").trim());
      app().innerHTML = `<div class="proy">
        <div class="small">${esc(n.titulo||"")}</div>
        <h1>Lo que hacemos a partir de mañana</h1>
        ${ac.length ? `<div class="acciones">${ac.map((x,i)=>`
          <div class="acc"><b class="n">${i+1}</b>
            <div><h3>${esc(x.accion)}</h3>
              <div class="pie">${x.responsable
                ? esc(x.responsable)
                : `<span style="color:var(--sem-activada);font-weight:600"
                    >SIN ASIGNAR</span>`}${
                x.plazo ? ` · ${esc(x.plazo)}` : ""}</div></div></div>`).join("")}</div>`
          : `<p style="font-size:22px">Todavía no hay acciones acordadas.</p>`}</div>`;
      return;
    }

    /* ── EL CUADRO DE VIGILANCIA ───────────────────────────────────
       El estado NUNCA va solo en el color: cada sello lleva su forma
       —círculo, rombo, cuadrado— y su palabra. En una sala hay gente
       que no distingue el verde del rojo, y el proyector del aula no es
       la pantalla en la que se eligieron los tonos. */
    if(va === "alerta"){
      const vg = ((n.modelo||{}).vigilancia || []).filter(x => (x.indicador||"").trim());
      const fmt = f => { if(!f) return ""; const d = new Date(f + "T00:00:00");
        return isNaN(d) ? f : d.toLocaleDateString("es-ES",
          {day:"numeric", month:"long", year:"numeric"}); };
      const ETQ = {calma:"En calma", atencion:"Atención", activada:"Activada"};
      app().innerHTML = `<div class="proy">
        <div class="small">${esc(n.titulo||"")}</div>
        <h1>Qué vamos a mirar</h1>
        ${vg.length ? `<div class="vigila">${vg.map(x=>{
          const k = ETQ[x.estado] ? x.estado : "calma";
          return `<div class="ind">
            <div><h3>${esc(x.indicador)}</h3>
              <div class="pie">${x.escenario ? esc(x.escenario) + " · " : ""}${
                x.umbral ? "salta si " + esc(x.umbral) : "sin umbral"}</div>
              <div class="pie">${x.responsable
                ? esc(x.responsable)
                : `<span style="color:var(--sem-activada);font-weight:600"
                    >SIN ASIGNAR</span>`}${
                x.revision ? ` · revisión el ${esc(fmt(x.revision))}` : ""}</div></div>
            <span class="sem ${k}"><i></i>${esc(ETQ[k])}</span></div>`; }).join("")}</div>`
          : `<p style="font-size:22px">Todavía no se ha adoptado ningún indicador.</p>`}</div>`;
      return;
    }

    if(va === "taller" || va === "funciones"){
      const fs = n.funciones || [];
      if(va === "funciones"){
        cuerpo = `<div class="small">${esc(n.titulo||"")}</div>
          <h1>Funciones clave del liderazgo</h1>
          ${fs.length ? `<div class="funciones">${fs.map((f,i)=>`
            <div class="fun"><b style="color:${tonoN(i)}">${i+1}</b>
              <div><h3>${esc(f.nombre)}</h3>${
                f.definicion ? `<p>${esc(f.definicion)}</p>` : ""}</div></div>`).join("")}</div>`
            : `<p style="font-size:22px">Todavía no hay funciones acordadas.</p>`}`;
      } else {
        // La evidencia se lee del mismo sitio que la consola: las preguntas
        // públicas y sus resultados. Si no están terminadas, no hay nada.
        const ps = await API.preguntasPublicas(codigo).catch(()=>[]);
        const cols = [];
        for(const cod of ["L11", "L13"]){
          const p2 = (ps||[]).find(x => x.codigo === cod);
          if(!p2) continue;
          const r = await API.resultadosPregunta(codigo, p2.id).catch(()=>null);
          if(r && Array.isArray(r.datos) && r.datos.length)
            cols.push({t: cod === "L11" ? "Responsabilidades" : "Valores y competencias",
                       filas: r.datos.slice(0, 8), n: r.respondidos});
        }
        cuerpo = `<div class="small">${esc(n.titulo||"")}</div>
          <h1>Lo que hemos votado</h1>
          ${cols.length ? `<div class="taller2">${cols.map(c=>`
            <div><h3>${esc(c.t)}</h3>${c.filas.map((f,i)=>`
              <div class="fila-taller"><i style="background:${tonoN(i)}"></i>
                <span>${esc(f.clave)}</span><b>${f.n}</b></div>`).join("")}
              <p class="small" style="margin-top:12px">${c.n} personas</p></div>`).join("")}</div>`
            : `<p style="font-size:22px">Las votaciones de responsabilidades y competencias
                 tienen que estar terminadas para que salgan aquí.</p>`}`;
      }
      app().innerHTML = `<div class="proy">${cuerpo}</div>`;
      return;
    }

    /* ── EL RADAR EN LA PARED ──────────────────────────────────────
       Se proyecta solo si los resultados estan publicados. No es una
       formalidad: la figura ensena la media de la sala, y ensenarla
       mientras la sala todavia responde arrima a quien queda por
       responder. El boton de la consola publica y proyecta a la vez,
       de modo que publicar es un acto explicito y no un descuido. */
    if(va === "radar"){
      if(!n.resultados_publicos){
        app().innerHTML = `<div class="proy"><h1>Radar de madurez</h1>
          <p style="font-size:24px">Los resultados todavía no están publicados.</p></div>`;
        return;
      }
      if(!RADPARED.datos || Date.now() - RADPARED.pedido > 12000){
        RADPARED.pedido = Date.now();
        const ps = await API.preguntasPublicas(codigo).catch(()=>[]);
        const pares = [];
        for(const cod of RAD_MAD.concat([RAD_IMP])){
          const p2 = (ps||[]).find(x => x.codigo === cod);
          if(!p2) continue;
          const r = await API.resultadosPregunta(codigo, p2.id).catch(()=>null);
          pares.push({p: p2, r});
        }
        RADPARED.datos = datosRadar(pares);
      }
      const d = RADPARED.datos;
      if(!d || (!d.conMad && !d.conImp)){
        app().innerHTML = `<div class="proy"><h1>Radar de madurez</h1>
          <p style="font-size:24px">Todavía no hay resultado de los ocho ámbitos. Termina las
            preguntas de cada ámbito y vuelve a proyectar.</p></div>`;
        return;
      }
      if(d.choque){
        app().innerHTML = `<div class="proy"><h1>Radar de madurez</h1>
          <p style="font-size:24px">El desarrollo y la importancia están en escalas distintas:
            no se pueden cruzar.</p></div>`;
        return;
      }
      const series = [{nombre:"Desarrollo", color:"var(--tono-1)", relleno:true,
                       valores: d.ejes.map(e => e.mad)}];
      if(d.conImp) series.push({nombre:"Importancia", color:"var(--tono-2)", relleno:false,
                                discontinua:true, valores: d.ejes.map(e => e.imp)});
      /* Ordenados por distancia, no por numero de ambito: la pared tiene
         que decir por donde se empieza, y el numero del circulo ya casa
         cada fila con su eje. */
      const filas = d.ejes.slice().sort((a,b) =>
        (b.dif == null ? -99 : b.dif) - (a.dif == null ? -99 : a.dif));
      const uno = v => v == null ? "—" : num(v, 1);
      app().innerHTML = `<div class="proy">
        <div class="small">${esc(n.titulo||"")}</div>
        <h1>Radar de madurez</h1>
        ${leyendaRadar(d)}
        <div class="radar-pared">
          <div>${radarNSVG(d.ejes, series,
            {min:d.min, max:d.max, W:700, H:620, grande:true,
             alt:"Radar de los ocho ámbitos: desarrollo e importancia"})}</div>
          <div>${filas.map(e => `<div class="fila-taller">
            <i style="background:${e.dif != null && e.dif > 0 ? "var(--tono-2)" : "var(--tono-1)"}"></i>
            <span>${esc(e.n + " · " + e.nombre)}</span>
            <b>${uno(e.mad)}${d.conImp ? " → " + uno(e.imp) : ""}</b></div>`).join("")}</div>
        </div>
        <p class="small" style="margin-top:22px">Escala ${esc(String(d.min))}–${esc(String(d.max))} ·
          ${d.nMad} ${d.nMad === 1 ? "respuesta" : "respuestas"} ·
          ${d.conImp ? "de izquierda a derecha, lo que hay y lo que importa; ordenados por la distancia entre las dos"
            : "sin la pregunta de importancia, solo se ve lo que hay"}</p></div>`;
      return;
    }

    if(!va.startsWith("q:")){
      const prog = await API.progreso(codigo).catch(()=>null);
      cuerpo = `<h1>Entra desde tu móvil</h1>
        <div style="display:flex;gap:40px;flex-wrap:wrap;align-items:center">
          <div><div class="small">Código</div><div class="codigo">${esc(codigo.toUpperCase())}</div>
            <p style="margin-top:14px;font-size:18px">${esc(location.host + location.pathname)}</p></div>
          <div class="qr" id="qr"></div></div>
        ${prog ? `<div class="contador" style="margin-top:26px"><b>${prog.completos}</b>
          <span style="font-size:20px">han terminado</span></div>` : ""}
        <p class="small" style="margin-top:20px">Tus respuestas son anónimas. No se registra tu nombre
          ni tu correo.</p>`;
    } else {
      const id = va.slice(2);
      const ps = await API.preguntasPublicas(codigo).catch(()=>[]);
      const p = (ps || []).find(x => x.id === id);
      if(p && p.tipo === "tarjetas"){
        const rt = await API.resultadosTarjetas(codigo, id).catch(()=>null);
        const cab = `<div class="small">${esc(p.codigo||"")}</div><h1>${esc(p.titulo)}</h1>`;
        if(!rt || rt.existe === false) cuerpo = `<h1>Preparando…</h1>`;
        // Mientras se vota, la pared enseña LA LISTA DE TEMAS: es lo que la
        // sala tiene delante en el móvil, y sin ella «Votar» no cambiaba
        // nada de lo que se veía antes. El marcador solo aparece si el
        // directo está encendido; si no, la lista va sin números.
        // `con_votos` lo trae la v13. Si la base de datos todavía es la v12,
        // el campo no existe: se deduce de si los grupos traen un número en
        // `votos`. Sin esto, subir el HTML antes que el SQL dejaba la fase
        // de RESULTADOS enseñando la lista en vez de las barras.
        else if(rt.grupos && rt.grupos.length
                && !(rt.con_votos ?? rt.grupos.some(g => typeof g.votos === "number")))
          cuerpo = cab + `<div class="taller2" style="margin-top:26px"><div>${
            rt.grupos.map((g,i)=>`<div class="fila-taller">
              <i style="background:${tonoDe(g.etiqueta)}"></i>
              <span>${esc(g.etiqueta)}</span>${(p.config||{}).sin_agrupar
                ? "" : `<b>${g.tarjetas}</b>`}</div>`).join("")}</div></div>
            <p class="small" style="margin-top:20px">Vota en tu móvil ·
              ${rt.n_votantes} ${rt.n_votantes===1?"persona ha votado":"personas han votado"}${
              (p.config||{}).sin_agrupar ? ""
                : " · el número de la derecha es cuántas aportaciones agrupa cada tema, "
                  + "no los votos"}</p>`;
        else if(rt.grupos && rt.grupos.length)
          cuerpo = cab + barras(rt.grupos, d=>d.etiqueta + " ("+d.tarjetas+")", d=>d.votos)
            + `<p class="small" style="margin-top:18px">Votos de ${rt.n_votantes} personas ·
                 entre paréntesis, cuántas aportaciones agrupa cada tema${
                 rt.fase === "votacion" ? " · <span class=\"envivo\"><b></b>en vivo, "
                   + "la votación sigue abierta</span>" : ""}</p>`;
        else if(rt.tarjetas && rt.tarjetas.length)
          // Las tarjetas sueltas sí se proyectan: son material de
          // conversación, no una media que ancle a nadie.
          cuerpo = cab + `<div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:10px">${
            rt.tarjetas.slice(0,40).map(t=>
              `<div class="enun" style="flex:1 1 300px;margin:0">${esc(t.texto)}</div>`).join("")}</div>
            <p class="small" style="margin-top:18px">${rt.n_tarjetas} aportaciones${
              rt.fase === "votacion"
                ? ` · <b>no hay temas que votar todavía</b>: agrúpalas primero desde la consola`
                : ""}</p>`;
        else
          cuerpo = cab + `<div class="contador" style="margin-top:30px"><b>${rt.n_tarjetas}</b>
            <span style="font-size:20px">${rt.n_tarjetas===1?"aportación recibida":"aportaciones recibidas"}</span></div>
            <p class="small" style="margin-top:18px">Escribe en tu móvil. Lo aportado se mostrará
              cuando cerremos la recogida.</p>`;
        app().innerHTML = `<div class="proy">${cuerpo}</div>`;
        return;
      }
      const r = await API.resultadosPregunta(codigo, id).catch(()=>null);
      if(!p || !r || r.existe === false){
        cuerpo = `<h1>Preparando…</h1>`;
      } else {
        const cab = `<div class="small">${esc(p.codigo||"")}</div><h1>${esc(p.titulo)}</h1>`;
        // El pie dice siempre de cuánta gente hablamos, y avisa cuando el
        // resultado se está moviendo mientras la sala responde.
        const pie = txt => `<p class="small" style="margin-top:18px">${txt}${
          r.en_vivo ? ` · <span class="envivo"><b></b>en vivo, sigue abierta</span>` : ""}</p>`;
        cuerpo = cuerpoResultado(p, r, cab, pie);
      }
    }
    app().innerHTML = `<div class="proy">${cuerpo}</div>`;
    if(!va.startsWith("q:")) pintarQR("qr", url, 8);
  };

  await pinta();

  /* El refresco. Si esta función vuelve a entrar —un cambio de hash, un
     reintento después de un corte de red—, el intervalo anterior seguiría
     vivo repintando con el estado viejo. Se guarda en `window` para poder
     apagarlo, que es lo único que sobrevive a la nueva llamada. */
  const arrancar = () => {
    clearInterval(window.__relojProy);
    window.__relojProy = timer = setInterval(pinta, 3000);
  };
  window.addEventListener("beforeunload", () => clearInterval(window.__relojProy));

  // Mismo mando invisible que en cultura: la sala no ve tus controles.
  //   →  terminar la abierta y abrir la siguiente     ←  volver a la anterior
  //   Inicio  proyectar el código y el QR
  const mandar = async fn => {
    try{
      const ses = await API.sesiones();
      const s2 = ses.find(x => x.codigo.toUpperCase() === codigo.toUpperCase());
      if(!s2) return;
      const ps = await API.preguntas(s2.id);
      await fn(s2, ps);
      pinta();
    }catch(e){ /* sin sesión iniciada no se puede: es lo correcto */ }
  };
  // Un solo mando por pestaña. `vistaProyeccion` puede volver a entrar aquí
  // —un cambio de hash, un reintento tras un fallo de red— y cada entrada
  // ataba otro listener: a la tercera, una flecha saltaba tres pantallas.
  if(window.__mandoAtado) return arrancar();
  window.__mandoAtado = true;
  window.addEventListener("keydown", ev => {
    // Con el modelo cerrado o el mapa de escenarios en la pared, las flechas
    // pasan sus hojas. Sin esta salida, una flecha aquí cerraría una pregunta
    // de la sesión sin que nadie lo pidiera: el mando no distingue qué se
    // está viendo, y en mitad del cierre eso se lleva por delante una
    // pregunta que la sala todavía estaba contestando.
    if((vistaActual === "modelo" || vistaActual === "mapa")
       && (ev.key === "ArrowRight" || ev.key === "ArrowLeft" || ev.key === " ")){
      ev.preventDefault();
      HOJA.i += ev.key === "ArrowLeft" ? -1 : 1;
      HOJA.giro = Date.now();
      pinta();
      return;
    }
    if(ev.key === "ArrowRight" || ev.key === " "){ ev.preventDefault(); mandar(async (s2, ps) => {
      const ab = ps.find(p=>p.estado === "abierta");
      if(ab) await API.actualizarPregunta(ab.id, {estado:"terminada"});
      const i = ab ? ps.findIndex(p=>p.id===ab.id) : -1;
      const sig = ps.slice(i+1).find(p=>p.estado === "cerrada");
      if(sig) await API.actualizarPregunta(sig.id, {estado:"abierta"});
      const foco = sig || ab;
      if(foco) await API.actualizarSesion(s2.id, {vista_activa:"q:"+foco.id});
    }); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault(); mandar(async (s2, ps) => {
      const act = (s2.vista_activa||"").startsWith("q:") ? s2.vista_activa.slice(2) : null;
      const i = ps.findIndex(p=>p.id===act);
      const ant = i > 0 ? ps[i-1] : null;
      if(ant) await API.actualizarSesion(s2.id, {vista_activa:"q:"+ant.id});
    }); }
    else if(ev.key === "Home"){ mandar(async s2 =>
      await API.actualizarSesion(s2.id, {vista_activa:"espera"})); }
  });

  return arrancar();
}

/* ═══════════════════════════════════════════════════════════════════
   6 bis · CONSTRUCTOR DE SESIÓN (motor de preguntas)

   Aquí compones la sesión: resuelves las variables del banco y eliges
   qué preguntas entran. Las 60 del banco se pueden añadir. La mitad son
   «derivadas»: entran con las listas vacías y se rellenan en directo con
   lo que produzca el grupo, y hasta entonces la consola las marca en rojo.
   ═══════════════════════════════════════════════════════════════════ */
/* Agregación en modo demostración. En modo real la hace `resultados_pregunta`
   dentro de la base de datos, que es donde debe estar. Esto solo existe para
   poder recorrer el circuito entero sin conexión. */
function agregarDemo(p, items){
  const cuenta = arr => { const m = {}; arr.forEach(k=>m[k]=(m[k]||0)+1);
    return Object.keys(m).map(k=>({clave:k, n:m[k]})).sort((a,b)=>b.n-a.n); };
  const medias = clave => { const acc = {};
    items.forEach(i => Object.entries(i.valor[clave]||{}).forEach(([k,v])=>{
      (acc[k] = acc[k] || []).push(Number(v)); }));
    return Object.keys(acc).map(k=>({clave:k,
      media: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*10)/10})); };
  if(p.tipo === "unica")    return cuenta(items.map(i=>i.valor.opcion));
  if(p.tipo === "multiple") return cuenta(items.flatMap(i=>i.valor.opciones||[]));
  if(p.tipo === "escala"){
    const ns = items.map(i=>Number(i.valor.n)).sort((a,b)=>a-b);
    return {media: Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*100)/100,
            mediana: ns[Math.floor(ns.length/2)],
            reparto: cuenta(ns.map(String)).reduce((o,x)=>(o[x.clave]=x.n,o),{})};
  }
  if(p.tipo === "matriz_escala"){
    const rep = {};
    items.forEach(i => Object.entries(i.valor.items||{}).forEach(([k,v])=>{
      (rep[k] = rep[k] || {})[String(v)] = ((rep[k]||{})[String(v)] || 0) + 1; }));
    return medias("items").map(x => ({...x, reparto: rep[x.clave] || {},
      n: Object.values(rep[x.clave]||{}).reduce((a,b)=>a+b,0)}))
      .sort((a,b)=>a.clave.localeCompare(b.clave));
  }
  if(p.tipo === "puntos100")     return medias("reparto").sort((a,b)=>b.media-a.media);
  if(p.tipo === "nube")
    return cuenta(items.flatMap(i=>(i.valor.terminos||[]).map(t=>String(t).trim().toLowerCase())));
  if(p.tipo === "ranking" || p.tipo === "secuencia"){
    const acc = {};
    items.forEach(i => (i.valor.orden||[]).forEach((k,ix)=>{ (acc[k]=acc[k]||[]).push(ix+1); }));
    return Object.keys(acc).map(k=>({clave:k, n:acc[k].length,
      posicion: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*100)/100}))
      .sort((a,b)=>a.posicion-b.posicion);
  }
  if(p.tipo === "dos_ejes"){
    const acc = {};
    items.forEach(i => Object.entries(i.valor.pos||{}).forEach(([k,v])=>{
      (acc[k]=acc[k]||[]).push(v); }));
    const med = a => a.reduce((x,y)=>x+y,0)/a.length;
    const desv = a => a.length<2 ? 0 : Math.sqrt(a.reduce((s,v)=>s+(v-med(a))**2,0)/(a.length-1));
    return Object.keys(acc).sort().map(k=>{
      const xs = acc[k].map(v=>Number(v.x)), ys = acc[k].map(v=>Number(v.y));
      const r3 = v => Math.round(v*1000)/1000;
      return {clave:k, x:r3(med(xs)), y:r3(med(ys)), dx:r3(desv(xs)), dy:r3(desv(ys)), n:acc[k].length};
    });
  }
  if(p.tipo === "matriz_valoracion"){
    const acc = {};
    items.forEach(i => Object.entries(i.valor.celdas||{}).forEach(([f,cols])=>
      Object.entries(cols||{}).forEach(([c,v])=>{ (acc[f+"\u0000"+c]=acc[f+"\u0000"+c]||[]).push(Number(v)); })));
    return Object.keys(acc).sort().map(k=>{ const [f,c] = k.split("\u0000");
      return {fila:f, columna:c, n:acc[k].length,
        media: Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length*100)/100}; });
  }
  if(p.tipo === "clasificar"){
    const acc = {};
    items.forEach(i => Object.entries(i.valor.asignacion||{}).forEach(([k,c])=>{
      acc[k+"\u0000"+c] = (acc[k+"\u0000"+c]||0)+1; }));
    return Object.keys(acc).sort().map(k=>{ const [clave,categoria] = k.split("\u0000");
      return {clave, categoria, n:acc[k]}; });
  }
  return items.map(i=>i.valor);
}

/* El color de una categoría sale de SU NOMBRE, no de su posición en la
   lista. Es lo que impide que, al proyectar en vivo, «ODS 3» cambie de
   color cada vez que adelanta a otro en el recuento: el color acompaña a
   la cosa, no al puesto que ocupa.

   Ocho tonos, y se repiten a partir del noveno. Dos advertencias honestas:
   con ocho colores hay parejas que un daltónico no distingue, y a diez
   metros tampoco las distingue nadie. Por eso el nombre va SIEMPRE pegado
   al dato —debajo de cada grupo de puntos, dentro de cada palabra— y el
   color no es la única pista de qué es cada cosa: es decoración útil, no
   información. Si alguna vez hay que elegir, manda la etiqueta. */
const tonoN = i => "var(--tono-" + (((i % 8) + 8) % 8 + 1) + ")";

const tonoDe = clave => {
  const t = String(clave || "");
  let h = 0;
  for(let i=0;i<t.length;i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return tonoN(h);
};

// Cuando la pregunta trae su lista de opciones —que es casi siempre—, el
// tono sale de la POSICIÓN en esa lista y no del hash del nombre: la lista
// no cambia durante la sesión, así que el color sigue siendo estable, y
// además las ocho primeras opciones salen con ocho tonos distintos en vez
// de repetirse por casualidad.
const listaCfg = cfg => (cfg && (cfg.opciones || cfg.elementos
  || (Array.isArray(cfg.items) ? cfg.items : null) || cfg.filas || cfg.categorias)) || [];

const tonoCfg = (cfg, clave) => {
  const i = listaCfg(cfg).indexOf(clave);
  return i >= 0 ? tonoN(i) : tonoDe(clave);
};

// «TEMA FOCAL» lleva un espacio, y un id con espacio rompe querySelector.
// Costó un «Cannot read properties of null» en la primera prueba.
const idVar = clave => "v-" + String(clave).replace(/[^A-Za-z0-9]/g, "_");

/* La proyección se abre en VENTANA, no en pestaña. Con `window.open` y una
   lista de características, el navegador saca una ventana independiente en
   vez de una pestaña más: eso es lo que permite compartir solo la sala en
   una videollamada, o mandarla al segundo monitor, sin que el cliente vea
   tu consola al lado.

   `noopener` para que la ventana de la sala no pueda tocar esta, y un
   nombre fijo por sesión: si vuelves a pulsar el botón, se reutiliza la
   ventana que ya está en el proyector en vez de abrir una segunda. */
function abrirProyeccion(codigo){
  const url = location.origin + location.pathname + "?proy=" + encodeURIComponent(codigo);
  const w = Math.min(1440, Math.round((screen.availWidth || 1440) * 0.75));
  const h = Math.min(900,  Math.round((screen.availHeight || 900) * 0.85));
  const v = window.open(url, "proy-" + String(codigo).toUpperCase(),
    "popup=yes,noopener,width=" + w + ",height=" + h + ",left=40,top=40");
  // Si el navegador bloquea la ventana emergente, no se pierde el clic:
  // se abre como siempre y se dice por qué, que es mejor que no pasar nada.
  if(!v){
    window.open(url, "_blank");
    alert("Tu navegador ha bloqueado la ventana emergente, así que se ha abierto "
      + "en una pestaña.\n\nSi quieres la ventana aparte —para proyectar solo la "
      + "sala—, permite las ventanas emergentes de este sitio y vuelve a pulsar.");
  }
  return v;
}

// Fisher-Yates. Se usa para que cada móvil reciba las listas ordenables en
// un orden distinto.
function barajar(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// «Baja incertidumbre → alta incertidumbre» son dos anclas escritas en una
// sola línea. Se parten por la flecha, o por el guion, o no se parten.
function partirEje(txt){
  const t = String(txt || "").trim();
  if(!t) return ["", ""];
  const p = t.split(/\s*(?:→|->|–|—|\|)\s*/);
  return p.length >= 2 ? [p[0], p.slice(1).join(" ")] : ["", t];
}

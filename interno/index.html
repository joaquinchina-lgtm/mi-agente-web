/* ═══════════════════════════════════════════════════════════════════
   6 ter · PROYECCIÓN DEL MOTOR

   Mientras la pregunta está abierta se proyecta el enunciado y cuánta
   gente la ha contestado. El reparto solo aparece cuando la pregunta
   está terminada: enseñar la media a quien todavía no ha respondido lo
   arrima al grupo. Es la misma regla que en cultura.
   ═══════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   GRÁFICOS

   Viven aquí, fuera de la proyección, porque los usan dos pantallas:
   el proyector de la sala y el informe completo de la consola. Antes
   estaban dentro de `proyeccionMotor` y habría habido que duplicarlos.
   ═══════════════════════════════════════════════════════════════════ */
const barras = (datos, etiqueta, valor, cfgOp) => {
  const max = Math.max(...datos.map(valor), 1);
  const k = d => tonoCfg(cfgOp,
    d.clave != null ? d.clave : (d.etiqueta != null ? d.etiqueta : etiqueta(d)));
  return `<div style="margin-top:22px">${datos.map(d=>`
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
        <span class="enun" style="margin:0;border:0;padding:0">${esc(etiqueta(d))}</span>
        <b style="font-size:30px;white-space:nowrap">${valor(d)}</b></div>
      <div class="barra" style="height:14px"><i style="width:${valor(d)/max*100}%;
        background:${k(d)}"></i></div>
    </div>`).join("")}</div>`;
};

// Barra cuyo largo y cuyo número no son la misma cifra. En un ranking, el
// número honesto es la posición media (1,4) y la barra tiene que ser más
// larga cuanto MENOR es esa cifra; dibujar la posición tal cual daría la
// barra más larga a lo último de la lista.
const barrasV = (datos, etiqueta, largo, texto, cfgOp) => {
  const max = Math.max(...datos.map(largo), 0.0001);
  return `<div style="margin-top:22px">${datos.map(d=>`
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
        <span class="enun" style="margin:0;border:0;padding:0">${esc(etiqueta(d))}</span>
        <b style="font-size:30px;white-space:nowrap">${esc(texto(d))}</b></div>
      <div class="barra" style="height:14px"><i style="width:${largo(d)/max*100}%;
        background:${tonoCfg(cfgOp,
          d.clave != null ? d.clave : (d.etiqueta != null ? d.etiqueta : etiqueta(d)))}"></i></div>
    </div>`).join("")}</div>`;
};

// Decimales fijos y coma decimal. «4» junto a «4,6» en la misma matriz
// se lee como si fueran cifras de distinta precisión.
const num = (v, d = 1) => Number(v).toFixed(d).replace(".", ",");

// Mapa de dos ejes. Un solo tono para todos los puntos y el nombre pegado
// a cada uno: colorear por elemento gastaría ocho tonos categóricos en
// una identidad que la etiqueta ya da mejor.
const mapaEjes = (datos, cfg) => {
  const L = 130, R = 60, T = 34, B = 66, W = 1000, H = 520;
  const px = x => L + (x/100) * (W - L - R);
  const py = y => T + (1 - y/100) * (H - T - B);
  const [exMin, exMax] = partirEje(cfg.eje_x), [eyMin, eyMax] = partirEje(cfg.eje_y);
  // Las manchas van todas debajo de todos los puntos: si cada elemento
  // pinta su mancha justo antes de su punto, la mancha del siguiente
  // tapa el punto del anterior.
  const halos = datos.map(d => `<ellipse class="halo" cx="${px(d.x)}" cy="${py(d.y)}"
      rx="${Math.max((d.dx||0)/100*(W-L-R), 4)}"
      ry="${Math.max((d.dy||0)/100*(H-T-B), 4)}"
      style="fill:${tonoCfg(cfg, d.clave)};opacity:.2"></ellipse>`).join("");
  const pts = datos.map(d => {
    const x = px(d.x), y = py(d.y);
    // La etiqueta va a la derecha salvo en la banda derecha, donde se saldría.
    const der = d.x <= 72;
    return `<circle class="pt" cx="${x}" cy="${y}" r="10" style="fill:${tonoCfg(cfg, d.clave)}"></circle>
      <text class="rot" x="${x + (der?18:-18)}" y="${y+7}"
            text-anchor="${der?"start":"end"}">${esc(d.clave)}</text>`;
  }).join("");
  return `<svg class="mapa" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Mapa de posicionamiento en dos ejes">
    <defs><clipPath id="cp-mapa"><rect x="${L}" y="${T}"
      width="${W-L-R}" height="${H-T-B}"></rect></clipPath></defs>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" class="rejilla"></rect>
    <line class="eje" x1="${px(50)}" y1="${T}" x2="${px(50)}" y2="${H-B}"></line>
    <line class="eje" x1="${L}" y1="${py(50)}" x2="${W-R}" y2="${py(50)}"></line>
    <g clip-path="url(#cp-mapa)">${halos}</g>
    ${pts}
    <text class="ejetxt" x="${L}" y="${H-26}">← ${esc(exMin)}</text>
    <text class="ejetxt" x="${W-R}" y="${H-26}" text-anchor="end">${esc(exMax)} →</text>
    <text class="ejetxt" x="${L-14}" y="${T+14}" text-anchor="end"
          transform="rotate(-90 ${L-14} ${T+14})">${esc(eyMax)} ↑</text>
    <text class="ejetxt" x="${L-14}" y="${H-B}" text-anchor="start"
          transform="rotate(-90 ${L-14} ${H-B})">↓ ${esc(eyMin)}</text>
  </svg>`;
};

// Matriz de robustez. Escala divergente, no secuencial: 1 perjudica,
// 3 es neutro y 5 es valioso, así que hay dos polos y un cero, y el
// número va escrito en cada casilla para no depender del color.
const matrizRobustez = (datos, cfg) => {
  const min = cfg.min ?? 1, max = cfg.max ?? 5, medio = (min + max) / 2;
  const filas = cfg.filas && cfg.filas.length ? cfg.filas
    : [...new Set(datos.map(d=>d.fila))];
  const cols = cfg.columnas && cfg.columnas.length ? cfg.columnas
    : [...new Set(datos.map(d=>d.columna))];
  const mapa = {}; datos.forEach(d => mapa[d.fila + "\u0000" + d.columna] = d);
  const paso = v => { const d = (v - medio) / ((max - min) / 2 || 1);
    return d <= -0.6 ? "c-nn" : d <= -0.2 ? "c-n" : d < 0.2 ? "c-0" : d < 0.6 ? "c-p" : "c-pp"; };
  return `<table class="matriz"><thead><tr><th></th>${cols.map(c=>
      `<th style="text-align:center">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${filas.map(f=>`<tr><td class="et">${esc(f)}</td>${cols.map(c=>{
      const d = mapa[f + "\u0000" + c];
      return d ? `<td class="${paso(d.media)}">${esc(num(d.media))}</td>`
               : `<td class="c-0">·</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>
    <div class="leyenda"><span><i class="c-nn"></i>${min} perjudicial</span>
      <span><i class="c-0"></i>${Math.round(medio)} neutra</span>
      <span><i class="c-pp"></i>${max} muy valiosa</span></div>`;
};

// Nube: el tamaño lleva el recuento, pero el recuento va también escrito
// en pequeño. Una nube sin cifras es un adorno; con ellas se puede leer.
//
// El reparto no es aleatorio: se ordena de más a menos y después se
// intercalan a izquierda y derecha, de modo que lo más repetido queda en
// el centro y lo demás alrededor. Sin eso, con `flex-wrap`, la palabra
// más grande caería siempre arriba a la izquierda.
const nubePalabras = datos => {
  const top = datos.slice(0, 34);
  const max = Math.max(...top.map(d=>d.n), 1), min = Math.min(...top.map(d=>d.n));
  const izq = [], der = [];
  top.forEach((d,i) => (i % 2 ? izq : der).push(d));   // 0,2,4… a la derecha
  const puestos = izq.reverse().concat(der);
  return `<div class="nube">${puestos.map(d=>{
    const rel = max === min ? 1 : (d.n - min) / (max - min);
    const t = Math.round(22 + Math.pow(rel, 0.7) * 68);
    return `<span style="font-size:${t}px;font-weight:${rel > 0.5 ? 650 : 500};
      color:${tonoDe(d.clave)};opacity:${rel < 0.25 ? ".72" : "1"}">${
      esc(d.clave)}${d.n > 1 ? `<i>${d.n}</i>` : ""}</span>`;}).join("")}</div>`;
};

// Una persona, un punto. Es la forma honesta de enseñar un recuento
// pequeño: se ve el número sin tener que leerlo, y se distingue de un
// vistazo «tres personas» de «veintiséis».
//
// Un solo tono para todos los puntos: el color aquí no diría nada que la
// etiqueta no diga mejor, y con doce opciones no hay ocho tonos que
// repartir sin que dos se confundan.
const puntosPorOpcion = (datos, cfg, respondidos) => {
  const total = datos.reduce((a,d)=>a+d.n, 0);
  // Con mucha gente los puntos se vuelven confeti: a partir de ahí, barras.
  if(total > 150) return null;
  const tam = total > 90 ? 12 : total > 45 ? 16 : 20;
  // Las opciones que nadie ha elegido también salen, con un cero: saber
  // qué no ha votado nadie suele ser la mitad de la conversación.
  const mapa = {}; datos.forEach(d => mapa[d.clave] = d.n);
  const claves = (cfg.opciones && cfg.opciones.length)
    ? cfg.opciones.slice() : datos.map(d=>d.clave);
  datos.forEach(d => { if(!claves.includes(d.clave)) claves.push(d.clave); });
  return `<div class="rejilla-op">${claves.map((k, ix)=>{
    const n = mapa[k] || 0;
    return `<div class="op-celda">
      <div class="op-puntos">${Array.from({length:n}, () =>
        `<i style="width:${tam}px;height:${tam}px;background:${tonoN(ix)}"></i>`).join("")}</div>
      <div class="op-pie"><b>${n}</b><span>${esc(k)}</span></div></div>`;
  }).join("")}</div>`;
};

// Curva suave a partir de un histograma. No es una densidad estadística:
// es la silueta del reparto, redondeada para que se lea de lejos. El dato
// exacto lo lleva el número de la bola, no la curva.
const silueta = (cuentas, ancho, alto) => {
  const max = Math.max(...cuentas, 1), n = cuentas.length;
  const px = i => (n === 1 ? ancho/2 : (i/(n-1)) * ancho);
  const py = v => alto - (v/max) * (alto - 6) - 2;
  let d = `M 0 ${alto} L ${px(0)} ${py(cuentas[0])}`;
  for(let i=0;i<n-1;i++){
    const x1 = px(i), y1 = py(cuentas[i]), x2 = px(i+1), y2 = py(cuentas[i+1]);
    const cx = (x1 + x2) / 2;
    d += ` C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
  }
  return d + ` L ${ancho} ${alto} Z`;
};

// Una fila por cosa valorada: la silueta del reparto arriba, la vía con
// la media abajo, y una línea vertical con la media de todas las filas
// para que se vea de un golpe qué está por encima y qué por debajo.
const filasEscala = (filas, cfg) => {
  const min = cfg.min ?? 1, max = cfg.max ?? 7;
  const sitio = v => ((v - min) / (max - min || 1)) * 100;
  const global = filas.reduce((a,f)=>a+Number(f.media), 0) / (filas.length || 1);
  const W = 1000, H = 70;
  /* Cuántas filas caben en un proyector antes de que haya que hacer
     scroll delante de la sala. Con el alto de siempre, cuatro filas ya
     se salían de una pantalla de 735 px y ocho ocupaban 1.510: la
     matriz de importancia del radar, que existe justamente para ver
     todos los ámbitos a la vez, era la única en la que no se podían
     ver todos a la vez. Se aprieta por tramos y no de golpe, para que
     con dos o tres filas siga viéndose como hasta ahora. */
  const densidad = filas.length >= 7 ? " es-denso" : filas.length >= 4 ? " es-medio" : "";
  return `<div class="esc-bloque${densidad}" style="margin-top:26px">${filas.map(f=>{
    const rep = f.reparto || {};
    const cuentas = Array.from({length: max-min+1}, (_,k) => Number(rep[String(min+k)] || 0));
    const hay = cuentas.some(c=>c>0);
    return `<div class="esc-fila">
      <h4>${esc(f.etiqueta ?? f.clave)}</h4>
      <div class="esc-caja">
        ${hay ? `<svg class="esc-den" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
                   aria-hidden="true"><path d="${silueta(cuentas, W, H)}"></path></svg>`
              : `<div class="esc-hueco"></div>`}
        <div class="esc-via"><i style="width:${sitio(f.media)}%"></i>
          <div class="esc-bola" style="left:${sitio(f.media)}%">${
            esc(num(f.media))}</div></div>
        ${filas.length > 1 ? `<div class="esc-media" style="left:${sitio(global)}%"></div>` : ""}
      </div></div>`;
  }).join("")}
    <div class="esc-anclas">
      <span>${esc(cfg.ancla_min || min)}</span>
      <span style="text-align:right">${esc(cfg.ancla_max || max)}</span>
      ${filas.length > 1 ? `<span class="esc-chip" style="left:${sitio(global)}%">media ${
        esc(num(global))}</span>` : ""}</div></div>`;
};

// Clasificación: una barra por elemento, partida en las categorías, con
// 2px de hueco entre tramos para que se distingan sin depender del tono.
const barrasClasif = (datos, cfg) => {
  const cats = cfg.categorias && cfg.categorias.length ? cfg.categorias
    : [...new Set(datos.map(d=>d.categoria))];
  const tono = i => tonoN(i);
  const els = cfg.elementos && cfg.elementos.length ? cfg.elementos
    : [...new Set(datos.map(d=>d.clave))];
  const de = {}; datos.forEach(d => (de[d.clave] = de[d.clave] || {})[d.categoria] = d.n);
  return `<div style="margin-top:20px">${els.map(e=>{
    const fila = de[e] || {}, tot = Object.values(fila).reduce((a,b)=>a+b,0) || 1;
    return `<div style="margin-bottom:15px">
      <div class="enun" style="margin:0;border:0;padding:0 0 6px">${esc(e)}</div>
      <div style="display:flex;gap:2px;height:26px">${cats.map((c,i)=>{
        const n = fila[c] || 0; if(!n) return "";
        return `<div title="${esc(c)}" style="width:${n/tot*100}%;background:${tono(i)};
          border-radius:3px;color:#fff;font-size:14px;font-weight:600;
          display:flex;align-items:center;justify-content:center">${
            n/tot > .12 ? n : ""}</div>`;}).join("")}</div></div>`;}).join("")}
    <div class="leyenda">${cats.map((c,i)=>
      `<span><i style="background:${tono(i)}"></i>${esc(c)}</span>`).join("")}</div>`;
};

/* Dibuja el resultado de UNA pregunta. Lo comparten el proyector y el
   informe de la consola: si el gráfico de la sala cambia, cambia el del
   informe, y nunca se separan. `cab` es la cabecera —cada pantalla pone la
   suya— y `pie` el texto de debajo. */
/* La valoración que abre una pantalla por función, agregada: media,
   reparto y la escala en la que está. Devuelve null si esa pantalla no
   lleva escala o si nadie la ha puntuado. Lo usan los resultados de la
   pregunta y la tabla de la brecha, y conviene que sea el mismo cálculo
   en los dos sitios. */
function mediaDeCampos(p, datos){
  const cfg = p.config || {};
  const e = (cfg.campos || []).find(c => c.tipo === "escala");
  if(!e || !Array.isArray(datos)) return null;
  const ns = datos.map(v => Number((v.campos || {})[e.clave]))
                  .filter(n => Number.isFinite(n));
  if(!ns.length) return null;
  const reparto = {};
  ns.forEach(n => { reparto[String(n)] = (reparto[String(n)] || 0) + 1; });
  return {
    funcion: cfg.funcion || null, etiqueta: e.etiqueta || "Valoración", n: ns.length,
    media: Math.round(ns.reduce((a,b)=>a+b, 0) / ns.length * 100) / 100,
    reparto,
    escala: {min: e.min ?? 1, max: e.max ?? 7,
             ancla_min: e.ancla_min || "", ancla_max: e.ancla_max || ""}
  };
}

function cuerpoResultado(p, r, cab, pie){
  let cuerpo = "";
  const cfg = p.config || {};
  if(r.datos){
    if(p.tipo === "unica"){
      const puntos = puntosPorOpcion(r.datos, cfg, r.respondidos);
      cuerpo = cab + (puntos || barras(r.datos, d=>d.clave, d=>d.n))
        + pie(`${r.respondidos} ${r.respondidos===1?"persona ha respondido":"personas han respondido"}`);
    }
    else if(p.tipo === "multiple")
      cuerpo = cab + barras(r.datos, d=>d.clave, d=>d.n, cfg)
        + pie(`Número de respuestas por opción · ${r.respondidos} personas`);
    else if(p.tipo === "escala")
      cuerpo = cab + filasEscala([{clave: cfg.etiqueta || "Valoración del grupo",
    media: r.datos.media, reparto: r.datos.reparto}], cfg)
        + pie(`${r.respondidos} respuestas · mediana ${r.datos.mediana}`);
    else if(p.tipo === "matriz_escala")
      cuerpo = cab + (r.datos.some(d=>d.reparto)
    ? filasEscala(r.datos, cfg)
    : barras(r.datos, d=>d.clave, d=>d.media, cfg))
        + pie(`${r.respondidos} respuestas`);
    else if(p.tipo === "puntos100")
      cuerpo = cab + barras(r.datos, d=>d.clave, d=>d.media, cfg)
        + pie(`${r.respondidos} respuestas`);
    else if(p.tipo === "nube")
      cuerpo = cab + nubePalabras(r.datos)
        + pie(`${r.respondidos} personas · el número pequeño es cuántas lo han escrito`);
    else if(p.tipo === "ranking"){
      const n = r.datos.length;
      cuerpo = cab + barrasV(r.datos, d=>d.clave,
    d => n + 1 - d.posicion, d => num(d.posicion, 2), cfg)
        + pie(`Posición media de ${r.respondidos} ordenaciones · 1 es lo más `
        + `prioritario · la lista se presentó barajada a cada persona`);
    }
    else if(p.tipo === "secuencia")
      cuerpo = cab + `<div style="margin-top:22px">${r.datos.map((d,i)=>`
        <div class="enun" style="display:flex;gap:18px;align-items:baseline">
    <b style="font-size:30px;min-width:44px">${i+1}</b>
    <span style="flex:1">${esc(d.clave)}</span>
    <span class="small">posición media ${esc(num(d.posicion, 2))}</span></div>`).join("")}</div>
        ` + pie(`${r.respondidos} secuencias`);
    else if(p.tipo === "dos_ejes")
      cuerpo = cab + mapaEjes(r.datos, cfg)
        + pie(`${r.respondidos} personas · el punto es la posición media y la mancha, `
        + `lo que discrepan: cuanto más grande, menos acuerdo sobre dónde va`);
    else if(p.tipo === "matriz_valoracion")
      cuerpo = cab + matrizRobustez(r.datos, cfg)
        + pie(`Valoración media de ${r.respondidos} personas`);
    else if(p.tipo === "clasificar")
      cuerpo = cab + barrasClasif(r.datos, cfg)
        + pie(`${r.respondidos} respuestas`);
    /* Una pantalla por función clave: primero el número, después lo escrito.
       La media se calcula aquí y no en la base de datos porque la base
       devuelve estas respuestas en crudo —y solo a partir de tres, así que
       el suelo del anonimato ya está puesto antes de llegar hasta aquí. */
    else if(p.tipo === "abierta_campos"){
      const nota = mediaDeCampos(p, r.datos);
      const libres = (cfg.campos || []).filter(c => c.tipo !== "escala");
      /* POR CATEGORÍA Y NO POR PERSONA.
         Antes cada fila era una persona y sus tres respuestas juntas,
         separadas por puntos. Para leerlo había que ir línea a línea
         quedándote con el trozo que te interesaba, y a la tercera ya no
         te acuerdas de cuál de los tres era. Agrupado, los puntos fuertes
         se leen todos seguidos, y las propuestas se leen como lo que son:
         una lista de cosas que hacer.
         Se pierde saber qué mejora escribió quien escribió qué punto
         fuerte. No es pérdida: estas respuestas son anónimas y cruzarlas
         entre sí sería justamente lo que no se puede hacer. */
      const grupos = libres.map(c => ({
        titulo: c.corto || c.etiqueta || c.clave,
        textos: (r.datos || []).map(v => (v.campos || {})[c.clave])
          .filter(x => x != null && String(x).trim())
      })).filter(g => g.textos.length);
      cuerpo = cab
        /* La etiqueta va aparte de la clave: el nombre de la función ya
           está en el título de la pregunta y repetirlo debajo no informa,
           pero la clave tiene que seguir siendo la función para que el
           color de cada una sea el mismo en todos los gráficos. */
        + (nota ? filasEscala([{clave: cfg.funcion || nota.etiqueta,
             etiqueta: nota.etiqueta, media: nota.media, reparto: nota.reparto}],
             nota.escala) : "")
        + grupos.map(g => `<div class="grupo-txt">
            <h4>${esc(g.titulo)} <span>${g.textos.length}</span></h4>
            <ul>${g.textos.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")
        + pie(`${r.respondidos} respuestas${nota
            ? ` · valoración media ${num(nota.media)} de ${nota.escala.max}` : ""}`);
    }
    else
      cuerpo = cab + `<div style="margin-top:22px">${(r.datos||[]).slice(0,12).map(v=>
        `<div class="enun">${esc(v.texto || Object.values(v.campos||{}).join(" · "))}</div>`).join("")}</div>
        <p class="small" style="margin-top:18px">${r.respondidos} respuestas</p>`;
  } else {
    // Abierta: enunciado, opciones si las tiene, y cuánta gente lleva.
    const ops = cfg.opciones || cfg.elementos || cfg.filas
      || (Array.isArray(cfg.items) ? cfg.items : null);
    cuerpo = cab
      + (ops ? `<div style="margin-top:20px">${ops.map(o=>
    `<div class="enun">${esc(o)}</div>`).join("")}</div>` : "")
      + `<div class="contador" style="margin-top:24px"><b>${r.respondidos}</b>
    <span style="font-size:20px">${r.respondidos===1 ? "persona ha respondido"
                             : "personas han respondido"}</span></div>`
      + ((r.estado === "terminada" || r.en_vivo) && r.respondidos < r.minimo
    ? `<p class="small" style="margin-top:14px">Con menos de ${r.minimo} respuestas no se
         muestra el resultado: sería la respuesta de una persona concreta.${
         r.en_vivo ? " El directo está encendido, pero el mínimo no se salta." : ""}</p>`
    : "");
  }
  return cuerpo;
}

/* ═══════════════════════════════════════════════════════════════════
   TALLER DEL MODELO · definición, alcance y funciones clave

   Los tres pasos que la aplicación NO puede dar sola. Redactar la
   definición de liderazgo, decidir a quién se llama líder y con qué
   niveles, y cruzar responsabilidades con competencias para sacar cinco
   o diez funciones clave: eso lo hace una cabeza —la tuya, con o sin
   ayuda de una IA fuera de aquí—, porque dentro de esta aplicación no
   hay ni puede haber un modelo de lenguaje: sería poner una clave de API
   en el navegador de cada participante.

   Lo que sí hace esta pantalla es quitarte todo lo demás. Son tres
   bloques y cada uno tiene su propia evidencia y su propio texto para
   pegar en la IA, porque son tres encargos distintos: mezclarlos en un
   solo prompt daba tres respuestas mediocres en vez de una buena.

     1 · DEFINICIÓN   ← L04 («liderar aquí es…»), L05, L06
     2 · ALCANCE      ← L08 (a quién se llama líder), L09 (niveles), L10
     3 · FUNCIONES    ← L11/L12 responsabilidades, L13/L14 competencias

   Al final, todo se guarda junto en la sesión: `modelo` y `funciones`.
   De ahí lo hereda la encuesta de evaluación.
   ═══════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   EL ACTA DEL MODELO

   Una página y ya está: definición, alcance y funciones clave, con la
   fecha de cierre y la organización. Es lo que se manda por correo al
   día siguiente y lo que se pega en el informe.

   No lleva ni un solo dato de respuesta —ni recuentos, ni medias, ni
   votos—. Es la conclusión, no la evidencia; la evidencia está en «Ver
   todos los resultados» y no tiene por qué circular con esto.
   ═══════════════════════════════════════════════════════════════════ */
/* La tabla del alcance, ya sin editar. La usan el acta, la proyección de
   la sala y la portada de la encuesta de evaluación: tres sitios, un solo
   sitio donde arreglarla. `grande` sube el cuerpo para la pared. */
function tablaAlcance(grupos, grande){
  const g = (grupos || []).filter(x => x && (x.grupo || x.nivel));
  if(!g.length) return "";
  // `thead` de verdad y no una fila con `th` sueltos: es lo que permite
  // esconder la cabecera en el móvil, donde cada par se lee como un
  // bloque y unos encabezados de columna sobran.
  return `<table class="pares leida"${grande ? ` style="font-size:26px"` : ""}>
    <thead><tr><th>Tipo de responsable</th><th>Nivel de responsabilidad</th></tr></thead>
    <tbody>${g.map(x=>`<tr><td>${esc(x.grupo||"—")}</td>
      <td>${esc(x.nivel||"—")}</td></tr>`).join("")}</tbody>
  </table>`;
}

/* ═══════════════════════════════════════════════════════════════════
   EL MAPA DE ESCENARIOS

   Los dos ejes, los cuatro cuadrantes, y dentro de cada uno lo que su
   grupo escribió. Es el entregable del taller: se mira en la consola, se
   manda a la pared y se guarda en PDF con la misma maquetación que el
   acta del modelo y el informe de resultados.

   Lee de las respuestas, no de una copia: si un grupo corrige su relato a
   media sesión, aquí sale corregido al recargar.
   ═══════════════════════════════════════════════════════════════════ */
async function leerEscenarios(s, preguntas){
  const m = s.modelo || {};
  const ess = (m.escenarios || ESC_VACIOS).map(e => ({...e, relato:{}, estrategias:{}}));
  const campos = {};
  TALLER_ESC.forEach(t => { campos[t.k] = t.campos; });
  for(let i = 0; i < ess.length; i++){
    for(const t of TALLER_ESC){
      const p = preguntas.find(x => x.codigo === t.k + "E" + (i+1));
      if(!p) continue;
      let r = null;
      try{ r = await API.resultadosPregunta(s.codigo, p.id); }catch(e){}
      // Una sola respuesta: la del grupo. Si hubiera más de una —alguien
      // que contestó sin ser relator— se queda la última, que es la que
      // quedó en pie después de hablarlo.
      const filas = (r && Array.isArray(r.datos)) ? r.datos : [];
      const v = filas.length ? (filas[filas.length-1].campos || {}) : {};
      const destino = t.k === "PT1" ? "relato" : "estrategias";
      ess[i][destino] = v;
      ess[i][destino + "_campos"] = (p.config || {}).campos || campos[t.k] || [];
      ess[i][destino + "_n"] = (r && r.respondidos) || 0;
    }
  }
  return {ejes: m.ejes || {}, escenarios: ess};
}

/* Los encargos para la IA. Van con la misma disciplina que los del taller
   de liderazgo: se le da lo que hay escrito, se le prohíbe inventar, y se
   le exige decir de qué escenario sale cada cosa. Lo que devuelva lo
   revisas tú, que es donde está tu trabajo. */
/* Un encargo POR ESCENARIO, no uno para los cuatro. En la sala cada grupo
   está en su mesa con su propio escenario delante: darle un texto que
   incluye lo que han escrito los otros tres es darle ruido, y además le
   deja leer el trabajo ajeno antes de terminar el suyo. */
function encargoEscenarios(d, fase, i){
  const e = d.escenarios[i];
  if(!e) return "";
  const c = e[fase + "_campos"] || [], v = e[fase] || {};
  const dentro = c.map(x => {
    const t = (v[x.clave] || "").toString().trim();
    return t ? `${x.etiqueta}\n→ ${t}` : null;
  }).filter(Boolean);
  if(!dentro.length) return "";
  const eje = (d.ejes.y || d.ejes.x)
    ? `El escenario está en el cuadrante ${e.pos} de una matriz cuyos ejes son:\n`
      + `· Vertical: ${d.ejes.y || "(sin definir)"}\n`
      + `· Horizontal: ${d.ejes.x || "(sin definir)"}\n\n` : "";
  const encargo = fase === "relato"
    ? "Eres analista de prospectiva. Abajo tienes las notas que un grupo de trabajo ha "
      + "escrito sobre UN escenario de futuro.\n\n"
      + "Devuélveme exactamente tres cosas, cada una con su rótulo:\n"
      + "NOMBRE: dos o tres palabras. Si el grupo ya puso uno, respétalo salvo que sea "
      + "ilegible; si lo cambias, di por qué en una línea aparte.\n"
      + "LEMA: una sola línea, en forma de titular de prensa.\n"
      + "RELATO: entre 150 y 200 palabras, en presente, contado desde dentro de ese "
      + "futuro, como si ya hubiera llegado.\n\n"
      + "Reglas: no inventes ningún hecho que no esté en las notas. Si falta algo "
      + "importante, dilo al final en vez de rellenarlo tú. No suavices el escenario si "
      + "es incómodo: un escenario que no incomoda a nadie no sirve para decidir.\n\n"
    : "Eres analista de estrategia. Abajo tienes lo que un grupo de trabajo ha escrito "
      + "sobre las implicaciones de UN escenario de futuro.\n\n"
      + "Devuélveme:\n"
      + "1. Las estrategias, ordenadas de más a menos importante, sin repetir y sin "
      + "juntar en una lo que el grupo dijo por separado.\n"
      + "2. Las acciones concretas que se derivan de cada una, distinguiendo las que "
      + "sirven para EVITAR que el escenario ocurra de las que sirven para MITIGAR sus "
      + "efectos si ocurre.\n"
      + "3. Para cada acción, si está en manos de la organización o depende de "
      + "terceros. Si el grupo no lo dice, ponlo como pregunta abierta.\n\n"
      + "Reglas: no inventes ninguna acción que no esté escrita. No conviertas en "
      + "estrategia lo que es un deseo sin mecanismo detrás.\n\n";
  return encargo + eje
    + `ESCENARIO: ${e.nombre || "(sin nombre)"}\n\n` + dentro.join("\n\n");
}

async function mapaEscenarios(s, preguntas, volver){
  app().innerHTML = `<div class="wrap ancho">${cabecera(
    `<button class="iconbtn" id="atras">Volver</button>`)}
    <div class="card"><h1>Reuniendo lo que han escrito los grupos…</h1></div></div>`;
  if($("#atras")) $("#atras").onclick = volver;
  // Se relee la lista: esta pantalla se abre y se recarga a mitad de un
  // taller, y entre una cosa y otra puede haberse añadido o quitado alguna
  // pregunta desde la consola. Con la copia vieja, «volcar» decía que la
  // P50 no existe cuando existe.
  try{ preguntas = await API.preguntas(s.id); }catch(e){}
  const d = await leerEscenarios(s, preguntas);
  const org = (s.variables||{}).ORGANIZACION || (s.organizacion||{}).nombre || "";
  const hoy = new Date().toLocaleDateString("es-ES",
    {day:"numeric", month:"long", year:"numeric"});
  // El orden del DOM no es el de los cuadrantes: arriba-izquierda,
  // arriba-derecha, abajo-izquierda, abajo-derecha. Y E3 es abajo-derecha.
  const rejilla = [d.escenarios[0], d.escenarios[1], d.escenarios[3], d.escenarios[2]];
  const cuadro = (e, i) => {
    if(!e) return `<div class="cuad vacio"></div>`;
    const v = e.relato || {}, c = e.relato_campos || [];
    const largo = c.filter(x => x.tipo === "texto");
    return `<div class="cuad">
      <span class="cuad-k">${esc(e.k)} · ${esc(e.pos)}</span>
      <h3>${esc(v.nombre || e.nombre || "Sin nombre todavía")}</h3>
      ${v.lema ? `<p class="lema">«${esc(v.lema)}»</p>` : ""}
      ${largo.map(x => (v[x.clave]||"").trim() ? `<div class="tramo">
          <b>${esc(x.etiqueta)}</b><p>${esc(v[x.clave])}</p></div>` : "").join("")}
      ${!e.relato_n ? `<p class="small">Este grupo todavía no ha escrito nada.</p>` : ""}
    </div>`;
  };
  const encargos = {relato: d.escenarios.map((e,i)=>encargoEscenarios(d,"relato",i)),
                    estrategias: d.escenarios.map((e,i)=>encargoEscenarios(d,"estrategias",i))};
  const hay = f => encargos[f].some(Boolean);
  // Lo que la IA ha devuelto, ya pegado. Vive en `sesion.modelo`, junto a
  // los ejes y los nombres: es material del taller, no una respuesta.
  const elab = (s.modelo || {}).elaborado || {};
  const hayElab = d.escenarios.some((e,i) => (elab["e"+(i+1)]||{}).relato);
  const botones = f => d.escenarios.map((e,i)=>
    `<button class="btn ghost sm" data-enc="${f}:${i}" ${encargos[f][i] ? "" : "disabled"}
       >${esc(e.nombre || ("Escenario " + (i+1)))}</button>`).join("");

  app().innerHTML = `<div class="wrap ancho doc">${cabecera(
    `<button class="iconbtn" id="atras">Volver</button>`)}
    <div class="card informe-cab">
      <div class="filete"></div>
      <p class="org">${esc(org)}</p>
      <h1>Los cuatro escenarios</h1>
      <p class="sub">${esc(s.titulo)}</p>
      <dl class="meta">
        <div><dt>Fecha</dt><dd>${esc(hoy)}</dd></div>
        <div><dt>Sesión</dt><dd>${esc(s.codigo)}</dd></div>
        <div><dt>Eje vertical</dt><dd>${esc(d.ejes.y || "—")}</dd></div>
        <div><dt>Eje horizontal</dt><dd>${esc(d.ejes.x || "—")}</dd></div>
      </dl>

      + "» para la fase de " + f + ".");
  });
  if($("#guardaElab")) $("#guardaElab").onclick = async () => {
    const nuevo = {};

      $("#avisoElab").textContent = e.message || e; return; }
    mapaEscenarios(s, preguntas, volver);
  };

  /* Las cinco preguntas que trabajan sobre las opciones estratégicas. Cada
     tipo lee su lista en una clave distinta —una matriz las quiere como
     filas, un reparto de puntos como opciones, un mapa de dos ejes como
     elementos— y por eso hace falta la tabla, no basta con un bucle. */
  const DESTINOS_OPC = [{c:"P48", k:"filas"}, {c:"P49", k:"opciones"},
                        {c:"P50", k:"opciones"}, {c:"P51", k:"elementos"},
                        {c:"P52", k:"opciones"}];
  if($("#volcarOpc")) $("#volcarOpc").onclick = async () => {
    const lista = ($("#opcEstr").value || "").split("\n")
      .map(x => x.trim()).filter(Boolean);
    const av = $("#avisoOpc");
    if(!lista.length){ av.textContent = "Escribe al menos una opción."; return; }
    const b = $("#volcarOpc"); b.disabled = true; b.textContent = "Volcando…";
    const mod = {...(s.modelo||{}), opciones: lista};
    try{ await API.actualizarSesion(s.id, {modelo: mod}); s.modelo = mod; }
    catch(e){ b.disabled = false; b.textContent = "Volcar en P48, P49, P50, P51 y P52";
      av.textContent = e.message || e; return; }
    const hechas = [], faltan = [];
    for(const d of DESTINOS_OPC){
      const p = preguntas.find(x => x.codigo === d.c);
      if(!p){ faltan.push(d.c); continue; }
      try{ await API.actualizarPregunta(p.id, {config: {...(p.config||{}), [d.k]: lista}});
           p.config = {...(p.config||{}), [d.k]: lista}; hechas.push(d.c); }
      catch(e){ faltan.push(d.c); }
    }
    b.disabled = false; b.textContent = "Volcar en P48, P49, P50, P51 y P52";
    av.textContent = `${lista.length} opciones volcadas en ${hechas.join(", ") || "ninguna"}.`
      + (faltan.length ? ` No están en esta sesión: ${faltan.join(", ")}.` : "");
  };
  window.scrollTo({top:0});
}

/* EL ACTA DEL CIERRE
   Lo que de verdad sobrevive al taller. El cuadro de vigilancia dentro de
   la aplicación es una foto: nadie va a reabrir una sesión de taller cinco
   meses después para mover un indicador. Lo que sí puede sobrevivir es un
   documento con dos columnas que obligan —el nombre de quien mira y la
   fecha en la que se vuelve a hablar de esto— y que sale de la sala por
   correo, firmado, y entra en el orden del día de alguien.

   Por eso la primera fecha de revisión no es una celda más de la tabla:
   es lo primero que se lee después del título. Si el acta no lleva fecha,
   lo dice en rojo y no disimula. */
function actaCierre(s, volver){
  const m = s.modelo || {};
  const ac = (m.acciones || []).filter(x => (x.accion||"").trim());
  const vg = (m.vigilancia || []).filter(x => (x.indicador||"").trim());
  const es = (m.escenarios || []).filter(e => (e.nombre||"").trim());
  const elab = m.elaborado || {};
  const ej = m.ejes || {};
  const org = (s.variables||{}).ORGANIZACION || (s.organizacion||{}).nombre || "";
  const hoy = new Date().toLocaleDateString("es-ES",
    {day:"numeric", month:"long", year:"numeric"});
  const fmt = f => { if(!f) return ""; const d = new Date(f + "T00:00:00");
    return isNaN(d) ? f : d.toLocaleDateString("es-ES",
      {day:"numeric", month:"long", year:"numeric"}); };
  // La primera revisión que toca. Es el único dato de este documento con
  // el que alguien puede hacer algo mañana.
  const fechas = vg.map(x => x.revision).filter(Boolean).sort();
  const primera = fechas.length ? fechas[0] : null;
  const sinDueno = ac.filter(x => !(x.responsable||"").trim()).length
                 + vg.filter(x => !(x.responsable||"").trim()).length;
  const sinFecha = vg.filter(x => !(x.revision||"").trim()).length;
  const ETQ = {calma:"En calma", atencion:"Atención", activada:"Activada"};
  const pastilla = k => { const j = ETQ[k] ? k : "calma";
    return `<span class="sem ${j}"><i></i>${esc(ETQ[j])}</span>`; };
  const nombreDe = i => { const v = elab["e"+(i+1)] || {};
    return (v.nombre || (es[i]||{}).nombre || "").trim(); };

  app().innerHTML = `<div class="wrap ancho doc">${cabecera(
    `<button class="iconbtn" id="atras">Volver</button>`)}

      <div class="filete"></div>

      ${primera ? `<p class="lead" style="margin-top:22px;font-size:19px">

          Es la primera fecha de revisión de las que se acordaron abajo, y es lo único
          de este documento que hace algo por sí solo: ponla hoy en el orden del día
          de quien corresponda, antes de que se enfríe la sala.</p>`
        : `<div class="aviso rojo" style="margin-top:22px"><b>Este acta no tiene ninguna
          fecha de revisión.</b> Sin una fecha, lo de abajo es una lista de buenas
          intenciones con formato de documento. Vuelve al cierre y pon al menos una.</div>`}
      ${sinDueno ? `<div class="aviso rojo"><b>${sinDueno} ${sinDueno===1

      <div class="btnrow no-imprimir">

        <button class="btn ghost" id="ventana">Abrir la proyección</button></div>
      <div class="no-imprimir" id="avisoActaC"></div>
      <p class="note no-imprimir">«Guardar en PDF» abre el diálogo de impresión: elige

    <div class="card no-imprimir indice">
